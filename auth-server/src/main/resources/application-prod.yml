# Activated by SPRING_PROFILES_ACTIVE=prod on Ubuntu.
spring:
  datasource:
    url: ${AUTH_DB_URL}
    username: ${DB_PRIMARY_USERNAME}
    password: ${DB_PRIMARY_PASSWORD}

app:
  security:
    issuer: ${AUTH_ISSUER:http://187.127.142.16:9000}
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:/root/privateKey.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:/root/publicKey.pem}
      key-id: ${JWT_KEY_ID:898ea867dbac475f}
    cors:
      allowed-origins: ${FE_ORIGIN}
    client:
      redirect-uris: ${OAUTH_REDIRECT_URIS}
      post-logout-redirect-uri: ${OAUTH_POST_LOGOUT_REDIRECT_URI}
  frontend:
    base-url: ${FE_BASE_URL}
    forgot-password-url: ${FE_FORGOT_PASSWORD_URL}
    continue-with-email-url: ${FE_CONTINUE_WITH_EMAIL_URL}
