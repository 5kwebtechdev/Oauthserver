server:
  port: 9000
  forward-headers-strategy: framework

spring:
  application:
    name: auth-server
  datasource:
    # SuperMeBE's own schema: this server authenticates the real SuperMeApp accounts in
    # mindfullP1.User / mindfullP1.UserPassword rather than keeping a user table of its
    # own. No createDatabaseIfNotExist here on purpose - this database exists and is in
    # production use; a typo in the name should fail loudly, not quietly create an empty
    # schema and migrate into it. Override via env vars for anything beyond local dev,
    # and never commit real prod credentials here.
    url: ${DB_PRIMARY_URL:jdbc:mysql://187.127.142.16:3306/}mindfullP1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_PRIMARY_USERNAME:root}
    password: ${DB_PRIMARY_PASSWORD:Root@1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  admin:
    datasource:
      # Separate schema (same MySQL box, different database) for SuperMeBE's admin-panel
      # staff table - see AdminDataSourceConfig. Only read from here; never migrated.
      jdbc-url: ${DB_ADMIN_URL:jdbc:mysql://187.127.142.16:3306/mindfullAdmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
      username: ${DB_ADMIN_USERNAME:root}
      password: ${DB_ADMIN_PASSWORD:Root@1234}
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        # SuperMeBE's columns are camelCase (createdDateTime, dateOfBirth, lastLoginDate...),
        # so Spring Boot's default CamelCaseToUnderscoresNamingStrategy would send Hibernate
        # looking for created_date_time and fail validation at boot. The standard strategy
        # leaves implicit names alone and passes explicit @Column names through untouched,
        # which is what every entity in this app already relies on.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    # mindfullP1 has no flyway_schema_history: SuperMeBE manages it entirely with Hibernate
    # ddl-auto=update. Flyway must therefore baseline rather than refuse to run on a
    # non-empty schema, and V2 (the only migration left) creates just the tables this
    # server owns - see db/migration for why the old V1-V9 set is gone.
    baseline-on-migrate: true
    # Explicit connection instead of autowiring "the" DataSource bean: once a second
    # DataSource (adminDataSource, for mindfullAdmin) exists in the context, Flyway's
    # autoconfigured by-type injection is no longer guaranteed to resolve the @Primary one
    # first, and silently handing it the admin pool breaks mindfullP1's migrations (and vice
    # versa). Pointing Flyway at its own URL/credentials sidesteps bean resolution entirely -
    # same mindfullP1 connection as spring.datasource above, just independently configured.
    url: ${DB_PRIMARY_URL:jdbc:mysql://187.127.142.16:3306/}mindfullP1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    user: ${DB_PRIMARY_USERNAME:root}
    password: ${DB_PRIMARY_PASSWORD:Root@1234}
  mail:
    # Credentials come from .env (gitignored, loaded by spring-dotenv) - never hardcoded
    # here. No literal fallback on purpose: if MAIL_USERNAME/MAIL_PASSWORD aren't set,
    # mail.username/password resolve to "" and sending fails loudly at send-time with a
    # clear auth error, rather than this file silently holding a real credential.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  security:
#    issuer: ${AUTH_ISSUER:http://localhost:9000}
    issuer: ${AUTH_ISSUER:https://auth.supermeapp.com}
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:/home/mohit/TestPKCE/PKCE_BE_FE_B14/PKCE_BE_FE/BE/auth-server/keys/private_key_20261003153613.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:/home/mohit/TestPKCE/PKCE_BE_FE_B14/PKCE_BE_FE/BE/auth-server/keys/public_key_20261003153613.pem}
      key-id: ${JWT_KEY_ID:898ea867dbac475f}
    cors:
      allowed-origins: ${FE_ORIGIN:http://localhost:4200}
    client:
      id: ${OAUTH_CLIENT_ID:pkce-angular-client}
      redirect-uris: ${OAUTH_REDIRECT_URIS:http://localhost:4200/callback}
      post-logout-redirect-uri: ${OAUTH_POST_LOGOUT_REDIRECT_URI:http://localhost:4200/}
    additional-client:
      id: ${SUPERME_OAUTH_CLIENT_ID:}
      redirect-uris: ${SUPERME_OAUTH_REDIRECT_URIS:}
      post-logout-redirect-uri: ${SUPERME_OAUTH_POST_LOGOUT_REDIRECT_URI:}
    admin-client:
      # Optional third client for the SuperMeAdmin Angular panel. Blank by default -
      # ClientRegistrationSeeder only registers it once an id is actually configured,
      # so an unset env leaves the existing two clients exactly as they are.
      id: ${ADMIN_OAUTH_CLIENT_ID:}
      redirect-uris: ${ADMIN_OAUTH_REDIRECT_URIS:}
      post-logout-redirect-uri: ${ADMIN_OAUTH_POST_LOGOUT_REDIRECT_URI:}
    admin-dev-client:
      # Optional fourth client for a dev/staging admin FE domain (e.g. devadmin.supermeapp.com).
      # Separate client id from admin-client on purpose - registration is idempotent and never
      # widens an already-seeded client's redirect URIs after the fact, so prod and dev must be
      # two distinct clients, not two redirect URIs on one. Blank by default.
      id: ${ADMIN_DEV_OAUTH_CLIENT_ID:}
      redirect-uris: ${ADMIN_DEV_OAUTH_REDIRECT_URIS:}
      post-logout-redirect-uri: ${ADMIN_DEV_OAUTH_POST_LOGOUT_REDIRECT_URI:}
  frontend:
    # Picks the admin-branded /login page (LoginPageController.renderAdminLoginPage) instead
    # of the SuperMeApp one, when the pending authorization's client_id matches this. Blank by
    # default, so until ADMIN_OAUTH_CLIENT_ID is set the existing /login behavior is unchanged.
    admin-client-id: ${ADMIN_OAUTH_CLIENT_ID:}
    admin-dev-client-id: ${ADMIN_DEV_OAUTH_CLIENT_ID:}
    admin-forgot-password-url: ${ADMIN_FE_FORGOT_PASSWORD_URL:}
    additional-client-id: ${SUPERME_OAUTH_CLIENT_ID:}
    additional-base-url: ${SUPERME_FE_BASE_URL:}
    additional-signup-url: ${SUPERME_FE_SIGNUP_URL:}
    additional-forgot-password-url: ${SUPERME_FE_FORGOT_PASSWORD_URL:}
    additional-continue-with-email-url: ${SUPERME_FE_CONTINUE_WITH_EMAIL_URL:}
    base-url: ${FE_BASE_URL:http://localhost:4200/}
    forgot-password-url: ${FE_FORGOT_PASSWORD_URL:http://localhost:4200/forgot-password}
    continue-with-email-url: ${FE_CONTINUE_WITH_EMAIL_URL:http://localhost:4200/continue-with-email}
  google:
    # Client ID only - it's meant to be public (embedded in frontend code). The Client
    # Secret is never used anywhere in this codebase; it plays no role in verifying an
    # already-issued Google ID token, which is all this app does with Google.
    # Must match the SuperMeAppFE web OAuth client ID. Override with GOOGLE_CLIENT_ID in
    # deployment environments if the FE client is rotated; never use the old PKCE Demo ID.
    client-id: ${GOOGLE_CLIENT_ID:124581866222-gblqv0k2a75uo4183ahl0u8336nbcsku.apps.googleusercontent.com}
  superme:
    # Off by default: mindfullP1 is shared with a running production app, so a fresh
    # deployment reads and authenticates without modifying anyone's data. Turning this on
    # enables registration, onboarding writes, Google provider linking and password resets.
    # See SupermeProperties before enabling it on a live database.
    writes-enabled: ${SUPERME_WRITES_ENABLED:false}
  admin:
    # Off by default, same reasoning as superme.writes-enabled above but for mindfullAdmin:
    # this server authenticates every existing admin without this flag. Turn it on only to
    # let POST /api/admin/admins (AdminRegistrationService) create NEW admin accounts here.
    writes-enabled: ${ADMIN_WRITES_ENABLED:false}
  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    token:
      capacity: 30
      refill-tokens: 30
      refill-duration-seconds: 60
    otp-request:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 900
    verify:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 900
    google-login:
      capacity: 20
      refill-tokens: 20
      refill-duration-seconds: 60
    # Only set to true if this app is deployed behind a reverse proxy that itself sets/
    # overwrites X-Forwarded-For (never passes a client-supplied value through unchanged).
    # False (default) means rate limiting always uses the direct socket address - see
    # RateLimitFilter.clientIp().
    trust-forwarded-header: ${RATE_LIMIT_TRUST_FORWARDED_HEADER:false}
  account-lockout:
    max-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
    lockout-duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:15}
  turnstile:
    # Public - safe to embed in the FE, same as the Google Client ID. Empty by default;
    # TurnstileVerificationService treats an empty secret-key as "not configured" and
    # skips enforcement (logging a loud warning) rather than breaking the app - see its
    # Javadoc and ARCHITECTURE.md for how to get a free Cloudflare Turnstile key.
    site-key: ${TURNSTILE_SITE_KEY:}
    secret-key: ${TURNSTILE_SECRET_KEY:}

logging:
  level:
    org.springframework.security: INFO
