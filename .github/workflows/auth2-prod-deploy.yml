name: Auth2.0 PROD CI/CD

# Deploys ONLY to the isolated prod auth stack (authprod.supermeapp.com, port
# 9001, systemd service auth2-auth-prod, /root/Auth2.0-prod). Completely
# separate from auth2-deploy.yml, which still owns the dev stack (main/
# Auth2.0 branches, port 9000, auth2-auth, /root/Auth2.0) — pushing here never
# touches dev's services, and vice versa. Reuses the same repo secrets
# (SERVER_HOST/SERVER_USER/SERVER_SSH_KEY) since both stacks live on the same
# server. resource-server is not built or deployed by this workflow.
on:
  push:
    branches: [authprod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth2-prod-server-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/authprod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Locate backend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find . -type f -path '*/auth-server/pom.xml' -not -path '*/target/*')
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo 'Expected exactly one backend with auth-server/pom.xml'; exit 1
          fi
          backend=$(dirname "$(dirname "${candidates[0]}")")
          test -f "$backend/pom.xml"
          test -f "$backend/deploy/auth2-prod/deploy-prod.sh"
          echo "BACKEND_DIR=$backend" >> "$GITHUB_ENV"

      - name: Generate temporary test signing keys
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_keys="$BACKEND_DIR/auth-server/src/test/resources/test-keys"
          resource_keys="$BACKEND_DIR/resource-server/src/test/resources/test-keys"
          mkdir -p "$auth_keys" "$resource_keys"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$auth_keys/private_key.pem"
          openssl pkey -in "$auth_keys/private_key.pem" -pubout -out "$auth_keys/public_key.pem"
          cp "$auth_keys/public_key.pem" "$resource_keys/public_key.pem"

      - name: Build and test (whole multi-module project, same gate as dev)
        run: mvn -B -f "$BACKEND_DIR/pom.xml" clean verify

      - name: Verify executable jar and prepare deployment bundle (auth-server only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          backend = Path(os.environ['BACKEND_DIR'])
          with ZipFile(backend / 'auth-server' / 'target' / 'auth-server.jar') as jar:
              assert 'Main-Class: org.springframework.boot.loader.launch.JarLauncher' in jar.read('META-INF/MANIFEST.MF').decode()
              assert 'BOOT-INF/classes/application-prod.yml' in jar.namelist()
              assert not any(p.endswith('.pem') or p.endswith('/.env') for p in jar.namelist())
          PY
          mkdir bundle
          cp "$BACKEND_DIR/auth-server/target/auth-server.jar" bundle/
          cp "$BACKEND_DIR"/deploy/auth2-prod/* bundle/
          tar -czf auth2-prod-deploy.tar.gz -C bundle .

      - name: Deploy over SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Missing SERVER_HOST secret}"
          : "${SERVER_USER:?Missing SERVER_USER secret}"
          : "${SERVER_SSH_KEY:?Missing SERVER_SSH_KEY secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/auth2prod_key
          chmod 600 ~/.ssh/auth2prod_key
          trap 'rm -f ~/.ssh/auth2prod_key' EXIT
          ssh-keyscan -H "$SERVER_HOST" > ~/.ssh/auth2prod_known_hosts
          ssh_opts=(-i ~/.ssh/auth2prod_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/auth2prod_known_hosts -o ConnectTimeout=15)
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir=$(ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mktemp -d /tmp/auth2-prod-deploy.XXXXXXXX')
          scp "${ssh_opts[@]}" auth2-prod-deploy.tar.gz "$SERVER_USER@$SERVER_HOST:$remote_dir/bundle.tar.gz"
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "bash -s -- '$remote_dir' '$release'" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release=$2
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$stage/bundle.tar.gz" -C "$stage"
          if [ "$(id -u)" -eq 0 ]; then
            bash "$stage/deploy-prod.sh" "$stage" "$release"
          else
            sudo -n bash "$stage/deploy-prod.sh" "$stage" "$release"
          fi
          REMOTE

      - name: Deployment complete
        run: echo 'Auth2.0 PROD auth-server deployed to /root/Auth2.0-prod (authprod.supermeapp.com).'
