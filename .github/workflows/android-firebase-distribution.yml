name: Android Firebase Distribution

on:
  push:
    branches:
      - pahse-1-semi-final

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Use Temurin JDK 21 so Gradle/Android compile supports Java 21 features
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Set up Node.js 20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4️⃣ Optional: clear npm cache
      - name: Clear npm cache
        run: npm cache clean --force || true

      # 5️⃣ Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6️⃣ Build Angular app
      - name: Build Angular app
        run: npm run build

      # 7️⃣ Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 8️⃣ Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 9️⃣ Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

              # 🔍 Verify settings.gradle ordering (Gradle 8 requirement)
      - name: Verify settings.gradle ordering
        run: |
          echo "---- settings.gradle (first 40 lines) ----"
          sed -n '1,40p' android/settings.gradle


      # 🔟 Build Android release APK
      - name: Build Android release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 1️⃣1️⃣ Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Release build from GitHub Actions"
          # If you are not using service credentials file content, just omit the line entirely
          # serviceCredentialsFileContent: ""

      # 1️⃣2️⃣ Upload APK as artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
