name: Android Firebase Distribution

on:
  push:
    branches:
      - pahse-1-semi-final

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Use Temurin JDK 21 so Gradle/Android compile supports Java 21 features
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3️⃣ Set up Node.js 20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4️⃣ Optional: clear npm cache
      - name: Clear npm cache
        run: npm cache clean --force || true

      # 5️⃣ Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6️⃣ Build Angular app
      - name: Build Angular app
        run: npm run build

      # 7️⃣ Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 8️⃣ Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 9️⃣ Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      # 🔍 Verify settings.gradle ordering (Gradle 8 requirement)
      - name: Verify settings.gradle ordering
        run: |
          echo "---- settings.gradle (first 40 lines) ----"
          sed -n '1,40p' android/settings.gradle
      # 🔟 Build Android release APK
      - name: Build Android release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 🔎 Find the generated release artifact (APK or AAB) and expose path
      - name: Find release artifact
        run: |
          set -e
          echo "Searching for release APK/AAB under android/app/build/outputs..."
          ARTIFACT=$(find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print | sort | tail -n 1 || true)
          if [ -z "$ARTIFACT" ]; then
            echo "No APK/AAB found in android/app/build/outputs"
            ls -R android/app/build || true
            exit 1
          fi
          echo "Found artifact: $ARTIFACT"
          echo "ARTIFACT_PATH=$ARTIFACT" >> $GITHUB_ENV

      # 1️⃣1️⃣ Upload APK to Firebase App Distribution
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT_JSON secret configured; Firebase CLI/ADC auth must be available."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "FIREBASE_SERVICE_CREDENTIALS_FILE=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_RELEASE_NOTES: Release build from ${{ github.sha }}
        run: |
          cd android
          ./gradlew appDistributionUploadRelease

      # 1️⃣2️⃣ Upload APK as artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
