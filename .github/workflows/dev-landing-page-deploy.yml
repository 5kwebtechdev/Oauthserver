name: SuperMe Dev Landing Page and APK (4046)

on:
  push:
    branches: [dev_landing_page]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superme-apk-code-fe-dev-4046
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/dev_landing_page'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dev-landing-website/package-lock.json

      - run: npm ci

      - name: Check application TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test PKCE and social login flows
        run: >-
          npx ng test --ts-config tsconfig.auth-spec.json
          --include='src/app/core/services/pkce-auth.service.spec.ts'
          --include='src/app/core/interceptors/pkce.interceptor.spec.ts'
          --include='src/app/core/components/pkce-entry.component.spec.ts'
          --include='src/app/core/components/social-media/google-signup-flow.spec.ts'
          --watch=false --browsers=ChromeHeadless

      - name: Build dev APK app against Auth2 and dev SuperMeBE
        run: npx ng build --configuration auth2-dev --base-href /app/

      - name: Install and build isolated Abhishek landing page for dev
        working-directory: dev-landing-website
        run: |
          npm ci
          npx ng build --configuration development-apk

      - name: Prepare dev release bundle
        run: |
          mkdir -p bundle/www bundle/website
          cp -a www/. bundle/www/
          cp -a dev-landing-website/dist/superme-website/browser/. bundle/website/
          python3 deploy/apk-code-fe/prepare-dev-website.py bundle/website
          cp deploy/apk-code-fe/nginx.conf deploy/apk-code-fe/deploy.sh bundle/
          tar -czf superme-dev-landing-and-apk.tar.gz -C bundle .

      - name: Deploy dev landing page and APK app to port 4046
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Missing SERVER_HOST}"
          : "${SERVER_USER:?Missing SERVER_USER}"
          : "${SERVER_SSH_KEY:?Missing SERVER_SSH_KEY}"
          : "${SERVER_KNOWN_HOSTS:?Missing trusted SERVER_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/superme_dev_landing_key
          chmod 600 ~/.ssh/superme_dev_landing_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/superme_dev_landing_hosts
          trap 'rm -f ~/.ssh/superme_dev_landing_key' EXIT
          ssh_opts=(-i ~/.ssh/superme_dev_landing_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/superme_dev_landing_hosts -o ConnectTimeout=15)
          stage=$(ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mktemp -d /tmp/superme-dev-landing.XXXXXXXX')
          scp "${ssh_opts[@]}" superme-dev-landing-and-apk.tar.gz "$SERVER_USER@$SERVER_HOST:$stage/bundle.tar.gz"
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "bash -s -- '$stage' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release=$2
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$stage/bundle.tar.gz" -C "$stage"
          if [ "$(id -u)" -eq 0 ]; then
            bash "$stage/deploy.sh" "$stage" "$release"
          else
            sudo -n bash "$stage/deploy.sh" "$stage" "$release"
          fi
          REMOTE
