name: SuperMe APK Code FE DEV (4046)

on:
  push:
    branches: [apk_code_fe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superme-apk-code-fe-dev-4046
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/apk_code_fe'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check application TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test PKCE and social login flows
        run: >-
          npx ng test --ts-config tsconfig.auth-spec.json
          --include='src/app/core/services/pkce-auth.service.spec.ts'
          --include='src/app/core/interceptors/pkce.interceptor.spec.ts'
          --include='src/app/core/components/pkce-entry.component.spec.ts'
          --include='src/app/core/components/social-media/google-signup-flow.spec.ts'
          --watch=false --browsers=ChromeHeadless

      - name: Build dev web app against Auth2 and dev SuperMeBE
        run: npx ng build --configuration auth2-dev --base-href /app/

      - name: Prepare release bundle
        run: |
          mkdir bundle
          cp -a www bundle/www
          cp deploy/apk-code-fe/nginx.conf deploy/apk-code-fe/deploy.sh bundle/
          tar -czf superme-apk-code-fe-dev.tar.gz -C bundle .

      - name: Deploy to apk_code_fe dev web port 4046
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Missing SERVER_HOST}"
          : "${SERVER_USER:?Missing SERVER_USER}"
          : "${SERVER_SSH_KEY:?Missing SERVER_SSH_KEY}"
          : "${SERVER_KNOWN_HOSTS:?Missing trusted SERVER_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/superme_apk_code_fe_key
          chmod 600 ~/.ssh/superme_apk_code_fe_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/superme_apk_code_fe_hosts
          trap 'rm -f ~/.ssh/superme_apk_code_fe_key' EXIT
          ssh_opts=(-i ~/.ssh/superme_apk_code_fe_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/superme_apk_code_fe_hosts -o ConnectTimeout=15)
          stage=$(ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mktemp -d /tmp/superme-apk-code-fe.XXXXXXXX')
          scp "${ssh_opts[@]}" superme-apk-code-fe-dev.tar.gz "$SERVER_USER@$SERVER_HOST:$stage/bundle.tar.gz"
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "bash -s -- '$stage' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release=$2
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$stage/bundle.tar.gz" -C "$stage"
          if [ "$(id -u)" -eq 0 ]; then
            bash "$stage/deploy.sh" "$stage" "$release"
          else
            sudo -n bash "$stage/deploy.sh" "$stage" "$release"
          fi
          REMOTE
