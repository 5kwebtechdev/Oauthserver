name: Auth2.0 CI/CD

on:
  push:
    branches: [main, Auth2.0]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment while services are being switched.
concurrency:
  group: auth2-server-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Auth2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Locate backend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find . -type f -path '*/auth-server/pom.xml' -not -path '*/target/*')
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo 'Expected exactly one backend with auth-server/pom.xml'; exit 1
          fi
          backend=$(dirname "$(dirname "${candidates[0]}")")
          test -f "$backend/pom.xml"
          test -f "$backend/resource-server/pom.xml"
          test -f "$backend/deploy/auth2/deploy.sh"
          echo "BACKEND_DIR=$backend" >> "$GITHUB_ENV"

      - name: Build and test both applications
        run: mvn -B -f "$BACKEND_DIR/pom.xml" clean verify

      - name: Verify executable JARs and prepare deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          backend = Path(os.environ['BACKEND_DIR'])
          for app in ('auth-server', 'resource-server'):
              with ZipFile(backend / app / 'target' / f'{app}.jar') as jar:
                  assert 'Main-Class: org.springframework.boot.loader.launch.JarLauncher' in jar.read('META-INF/MANIFEST.MF').decode()
                  assert 'BOOT-INF/classes/application-prod.yml' in jar.namelist()
                  assert not any(p.endswith('.pem') or p.endswith('/.env') for p in jar.namelist())
          PY
          mkdir bundle
          cp "$BACKEND_DIR/auth-server/target/auth-server.jar" bundle/
          cp "$BACKEND_DIR/resource-server/target/resource-server.jar" bundle/
          cp "$BACKEND_DIR"/deploy/auth2/* bundle/
          tar -czf auth2-deploy.tar.gz -C bundle .

      - name: Deploy over SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Missing SERVER_HOST secret}"
          : "${SERVER_USER:?Missing SERVER_USER secret}"
          : "${SERVER_SSH_KEY:?Missing SERVER_SSH_KEY secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/auth2_key
          chmod 600 ~/.ssh/auth2_key
          trap 'rm -f ~/.ssh/auth2_key' EXIT
          ssh-keyscan -H "$SERVER_HOST" > ~/.ssh/auth2_known_hosts
          ssh_opts=(-i ~/.ssh/auth2_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/auth2_known_hosts -o ConnectTimeout=15)
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir=$(ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mktemp -d /tmp/auth2-deploy.XXXXXXXX')
          scp "${ssh_opts[@]}" auth2-deploy.tar.gz "$SERVER_USER@$SERVER_HOST:$remote_dir/bundle.tar.gz"
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "bash -s -- '$remote_dir' '$release'" <<'REMOTE'
          set -euo pipefail
          stage=$1
          release=$2
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$stage/bundle.tar.gz" -C "$stage"
          if [ "$(id -u)" -eq 0 ]; then
            bash "$stage/deploy.sh" "$stage" "$release"
          else
            sudo -n bash "$stage/deploy.sh" "$stage" "$release"
          fi
          REMOTE

      - name: Deployment complete
        run: echo 'Auth2.0 auth-server and resource-server deployed to /root/Auth2.0.'
