<div class="reel-homepage-container">
  <!-- Navbar -->
  <app-public-navbar></app-public-navbar>

  <!-- Header (title + subtitle + actions) -->
  <header class="reel-header">
    <div class="reel-header-left">
      <button class="back-btn" aria-label="Back" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true" focusable="false">
          <path d="M13.2929 27.2929C12.9024 27.6834 12.9024 28.3166 13.2929 28.7071L19.6569 35.0711C20.0474 35.4616 20.6805 35.4616 21.0711 35.0711C21.4616 34.6805 21.4616 34.0474 21.0711 33.6569L15.4142 28L21.0711 22.3431C21.4616 21.9526 21.4616 21.3195 21.0711 20.9289C20.6805 20.5384 20.0474 20.5384 19.6569 20.9289L13.2929 27.2929ZM42 29C42.5523 29 43 28.5523 43 28C43 27.4477 42.5523 27 42 27V28V29ZM14 28V29H42V28V27H14V28Z" fill="#282527"/>
        </svg>
      </button>
      <div class="reel-header-titles">
        <h1 class="reel-title">Made by Kids, for Kids!</h1>
        <p class="reel-sub muted">Watch reels · Create · Get Inspired</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-outline" (click)="openBookmarks()">Bookmarked Reels</button>
      <button class="btn-primary" (click)="openUpload()">Create Reel</button>
    </div>
  </header>

  <!-- My Reels section (empty-state per design) -->
  <section class="my-reels">
    <div class="my-reels-row">
      <h2 class="my-reels-title">My Reels</h2>
      <a class="my-reels-view" routerLink="/reels/all">View all</a>
    </div>

    <div *ngIf="userReels.length === 0" class="my-reels-empty">
      <img src="/assets/images/Digital-pet-panda.png" alt="panda" class="empty-panda" />
      <div class="empty-text">
        <div class="empty-heading">Create your first reel and share awesome things with everyone!</div>
      </div>
    </div>

    <div *ngIf="userReels.length > 0" class="reels-grid cards-row">
      <app-reels-card *ngFor="let r of userReels | slice:0:3" [reel]="r"></app-reels-card>
    </div>
  </section>

  <!-- Reels Category Sections -->
  <section class="reels-section" *ngFor="let cat of categories; let i = index">
    <div class="reels-section-header">
      <h2 class="section-title">{{ cat.title }}</h2>
      <div class="trending-pill">
        <svg class="pill-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 16 18" fill="none" aria-hidden="true" focusable="false" style="width:16px;height:18px;flex-shrink:0;aspect-ratio:8/9;">
          <path d="M0 11C0 9.25 0.416667 7.69167 1.25 6.325C2.08333 4.95833 3 3.80833 4 2.875C5 1.94167 5.91667 1.22917 6.75 0.7375L8 0V3.3C8 3.91667 8.20833 4.40417 8.625 4.7625C9.04167 5.12083 9.50833 5.3 10.025 5.3C10.3083 5.3 10.5792 5.24167 10.8375 5.125C11.0958 5.00833 11.3333 4.81667 11.55 4.55L12 4C13.2 4.7 14.1667 5.67083 14.9 6.9125C15.6333 8.15417 16 9.51667 16 11C16 12.4667 15.6417 13.8042 14.925 15.0125C14.2083 16.2208 13.2667 17.175 12.1 17.875C12.3833 17.475 12.6042 17.0375 12.7625 16.5625C12.9208 16.0875 13 15.5833 13 15.05C13 14.3833 12.875 13.7542 12.625 13.1625C12.375 12.5708 12.0167 12.0417 11.55 11.575L8 8.1L4.475 11.575C3.99167 12.0583 3.625 12.5917 3.375 13.175C3.125 13.7583 3 14.3833 3 15.05C3 15.5833 3.07917 16.0875 3.2375 16.5625C3.39583 17.0375 3.61667 17.475 3.9 17.875C2.73333 17.175 1.79167 16.2208 1.075 15.0125C0.358333 13.8042 0 12.4667 0 11ZM8 10.9L10.125 12.975C10.4083 13.2583 10.625 13.575 10.775 13.925C10.925 14.275 11 14.65 11 15.05C11 15.8667 10.7083 16.5625 10.125 17.1375C9.54167 17.7125 8.83333 18 8 18C7.16667 18 6.45833 17.7125 5.875 17.1375C5.29167 16.5625 5 15.8667 5 15.05C5 14.6667 5.075 14.2958 5.225 13.9375C5.375 13.5792 5.59167 13.2583 5.875 12.975L8 10.9Z" fill="#282527"/>
        </svg>
        Trending
      </div>
    </div>

    <div class="reels-grid cards-row" [attr.id]="i === 0 ? 'reels-grid' : null">
      <app-reels-card *ngFor="let r of cat.reels | slice:0:4" [reel]="r"></app-reels-card>
    </div>

    <div class="play-all-bar">
      <superme-button type="green" large text="▶ Play all"></superme-button>
    </div>
  </section>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
