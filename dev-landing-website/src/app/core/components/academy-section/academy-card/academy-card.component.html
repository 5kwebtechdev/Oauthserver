<article class="academy-card" role="button" tabindex="0" (click)="onCardClick()" (keydown.enter)="onCardClick()" (keydown.space)="onCardClick()">
  <div class="left-icon">
    <img [src]="image || '/assets/Images-Transparent/Academy-Course-Thubmnail1.png'" alt="{{title}}" />
  </div>

  <div class="card-content">
    <div class="card-top">
      <div class="title-and-meta">
        <div class="card-title">{{ title }}</div>
        <div class="card-meta">{{ lessons }} lessons · {{ duration }}</div>
      </div>

      <div class="level-pill">{{ level }}</div>
    </div>

    <div class="coin-row">
      <img src="/assets/Icons-Neutral/Icons-Coins.png" alt="coin" class="coin-icon" />
      <span class="coin-value">{{ coins }}</span>
    </div>

    <p class="card-desc">{{ description }}</p>

    <div class="card-actions">
      <superme-button
        class="start-btn"
        type="magenta"
        small=""
        [text]="buttonText + ' Course'"
        (clickEvent)="onStart($event)"
        [disabled]="disabled">
      </superme-button>
    </div>
  </div>
</article>
