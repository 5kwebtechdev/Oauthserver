<div class="blog-page-wrapper">
  <app-public-navbar></app-public-navbar>

  <div class="blogs-section">
    <div class="section-header">
      <h2>
         Insights & Resources
      </h2>
      <p class="section-subtitle">
        Explore our expert articles, tips, and guides on personal growth, habits, learning, and more.
      </p>
    </div>

    <div class="blogs-grid">
      <div class="blog-card" *ngFor="let post of blogPosts" (click)="onReadBlog(post)">
        <div class="blog-image">
          <img [src]="post.image" [alt]="post.title" />
        </div>
        <div class="blog-content">
          <div class="blog-label">{{ post.label }}</div>
          <h3 class="blog-title">{{ post.title }}</h3>
          <p class="blog-description">{{ post.description }}</p>
          <div class="blog-footer">
            <div class="read-time">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm1-8h4v2h-6V7h2v5z" fill="#282527" opacity="0.7"/>
              </svg>
              <span>{{ post.readTime }}</span>
            </div>
            <span class="read-more">Read more</span>
          </div>
        </div>
      </div>
    </div>


  
</div>
<app-footer></app-footer>
