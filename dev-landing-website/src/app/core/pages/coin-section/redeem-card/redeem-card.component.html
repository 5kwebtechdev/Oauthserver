<div class="redeem-card" role="button" tabindex="0" aria-label="Redeem {{ title }}" >
  <div class="redeem-card-image" [style.background-image]="'url(' + imageSrc + ')'" role="img" aria-label="{{ title }} image"></div>
  <div class="redeem-card-body">
    <h3 class="redeem-card-title">{{ title }}</h3>
    <div class="redeem-card-footer">
      <img class="coin-mini" src="/assets/Icons-Neutral/Icons-Coins.png" alt="coin" />
      <div class="cost">{{ cost }}</div>
    </div>
  </div>
</div>
