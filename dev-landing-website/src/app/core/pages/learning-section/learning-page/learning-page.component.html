<app-public-navbar></app-public-navbar>

<div class="learning-page">
  <section class="hero" role="region" aria-label="Learning challenge hero section">
    <div class="hero__background"></div>
    <div class="hero__content">
      <div class="hero__title-wrapper">
        <h1 class="hero__title">Challenge Your Mind: Play, Solve, Win!</h1>
      </div>
      
      <div class="hero__search-wrapper">
        <div class="search-card" role="search">
          <svg class="search-card__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z" fill="#6B656A"/>
          </svg>
          <input 
            class="search-card__input" 
            type="search" 
            placeholder="Looking for a quiz?" 
            [value]="searchQuery" 
            (input)="onSearchChange($event)"
            aria-label="Search for quizzes and learning content" />
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="19" viewBox="0 0 14 19" fill="none">
  <path d="M7 12C6.16667 12 5.45833 11.7083 4.875 11.125C4.29167 10.5417 4 9.83333 4 9V3C4 2.16667 4.29167 1.45833 4.875 0.875C5.45833 0.291667 6.16667 0 7 0C7.83333 0 8.54167 0.291667 9.125 0.875C9.70833 1.45833 10 2.16667 10 3V9C10 9.83333 9.70833 10.5417 9.125 11.125C8.54167 11.7083 7.83333 12 7 12ZM6 19V15.925C4.26667 15.6917 2.83333 14.9167 1.7 13.6C0.566667 12.2833 0 10.75 0 9H2C2 10.3833 2.4875 11.5625 3.4625 12.5375C4.4375 13.5125 5.61667 14 7 14C8.38333 14 9.5625 13.5125 10.5375 12.5375C11.5125 11.5625 12 10.3833 12 9H14C14 10.75 13.4333 12.2833 12.3 13.6C11.1667 14.9167 9.73333 15.6917 8 15.925V19H6ZM7 10C7.28333 10 7.52083 9.90417 7.7125 9.7125C7.90417 9.52083 8 9.28333 8 9V3C8 2.71667 7.90417 2.47917 7.7125 2.2875C7.52083 2.09583 7.28333 2 7 2C6.71667 2 6.47917 2.09583 6.2875 2.2875C6.09583 2.47917 6 2.71667 6 3V9C6 9.28333 6.09583 9.52083 6.2875 9.7125C6.47917 9.90417 6.71667 10 7 10Z" fill="#282527"/>
</svg>
        </div>
      </div>
      <div class="pet-bubble">
      <superme-pet-bubble
        class="hero-pet-bubble"
        [message]="'I\'m cheering for you! Let\'s get things done!'"
        [petType]="'panda'"
        [petMood]="'happy'"
        [petImageHeight]="96"
        [bubbleFirst]="true"
        aria-label="Cheerful panda mascot">
      </superme-pet-bubble>
      </div>
    </div>
  </section>

  <app-ad-slider [screen]="adScreen"></app-ad-slider>

  <nav class="categories">
    <!-- <button class="category" [class.selected]="selectedCategory === 'for-you'" (click)="selectCategory('for-you')">
      <img src="assets/Icons-Neutral/Icon-Content-ForYou.png" alt="" />
      <span>Master Class</span>
    </button> -->
    <!-- <div class="sep"></div> -->
    <button class="category" [class.selected]="selectedCategory === 'puzzles'" (click)="selectCategory('puzzles')">
      <img src="assets/Icons-Neutral/Icon-Content-Puzzle.png" alt="" />
      <span>Puzzles</span>
    </button>
    <div class="sep"></div>
    <button class="category" [class.selected]="selectedCategory === 'quizzes'" (click)="selectCategory('quizzes')">
      <img src="assets/Icons-Neutral/Icon-Content-Quiz.png" alt="" />
      <span>Quizzes</span>
    </button>
    <div class="sep"></div>
    <button class="category" [class.selected]="selectedCategory === 'articles'" (click)="selectCategory('articles')">
      <img src="assets/Icons-Neutral/Icon-Content-Articles.png" alt="" />
      <span>Articles</span>
    </button>
    <div class="sep"></div>
    <button class="category" [class.selected]="selectedCategory === 'for-you'" (click)="selectCategory('for-you')">
      <img src="assets/Icons-Neutral/Icon-Content-ForYou.png" alt="" />
      <span>Master Class</span>
    </button>
  </nav>

  <section class="content-section">
    <!-- Master Class categories -->
    <ng-container *ngIf="selectedCategory === 'for-you'">
      <app-masterclass-categories></app-masterclass-categories>
    </ng-container>

    <!-- Puzzles -->
    <ng-container *ngIf="selectedCategory === 'puzzles'">
      <div *ngIf="(puzzleCards$ | async) as cards; else puzzlesLoading" class="cards-grid">
        <learning-challenge-card *ngFor="let card of filterCards(cards); let i = index" [challenge]="mapToChallenge(card)" [index]="i" (cardClick)="onCardClick($event)"></learning-challenge-card>
        <div *ngIf="filterCards(cards).length === 0" class="empty">No results found</div>
      </div>
      <ng-template #puzzlesLoading>
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading content...</p>
        </div>
      </ng-template>
    </ng-container>

    <!-- Quizzes -->
    <ng-container *ngIf="selectedCategory === 'quizzes'">
      <div *ngIf="(quizCards$ | async) as cards; else quizzesLoading" class="cards-grid">
        <learning-challenge-card *ngFor="let card of filterCards(cards); let i = index" [challenge]="mapToChallenge(card)" [index]="i" (cardClick)="onCardClick($event)"></learning-challenge-card>
        <div *ngIf="filterCards(cards).length === 0" class="empty">No results found</div>
      </div>
      <ng-template #quizzesLoading>
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading content...</p>
        </div>
      </ng-template>
    </ng-container>

    <!-- Articles -->
    <ng-container *ngIf="selectedCategory === 'articles'">
      <div *ngIf="(articleCards$ | async) as cards; else articlesLoading" class="cards-grid">
        <learning-article-card *ngFor="let card of filterCards(cards); let i = index" [article]="mapToArticle(card)" [index]="i" (cardClick)="onCardClick($event)"></learning-article-card>
        <div *ngIf="filterCards(cards).length === 0" class="empty">No results found</div>
      </div>
      <ng-template #articlesLoading>
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading content...</p>
        </div>
      </ng-template>
    </ng-container>
  </section>
</div>

<app-footer></app-footer>
