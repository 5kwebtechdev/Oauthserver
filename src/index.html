<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>SuperMeApp</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="application-name" content="SuperMeApp" />
  <meta name="apple-mobile-web-app-title" content="SuperMeApp" />

  <!-- DEV ONLY: allow connect to local devtools probes (eg. Chrome DevTools app-specific probes). Remove or tighten before production. -->
  <!-- Added explicit localhost:4200 and websocket hosts so Chrome DevTools probes (/.well-known/...) are allowed while developing. -->

  <link rel="icon" type="image/webp" sizes="512x512" href="assets/icon/favicon.webp" />
  <link rel="apple-touch-icon" href="assets/icon/favicon.webp" />

  <script>
    // Mark the native shell before first paint. Its OS launch screen stays
    // static (as required by iOS/Android), then hands off to our animated brand
    // reveal as soon as the WebView is ready.
    try {
      var capacitor = window.Capacitor;
      var isNativeShell = window.location.protocol === 'capacitor:' ||
        !!(capacitor && typeof capacitor.isNativePlatform === 'function' && capacitor.isNativePlatform());
      if (isNativeShell) document.documentElement.classList.add('superme-native-shell');
    } catch (_) {}
  </script>

  <style>
    #superme-web-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 205, 221, .82), transparent 34%),
        radial-gradient(circle at 84% 24%, rgba(195, 224, 255, .82), transparent 36%),
        linear-gradient(145deg, #fff8f4 0%, #f1edff 52%, #fff1f6 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity .38s ease, visibility .38s ease;
      font-family: Fredoka, "Arial Rounded MT Bold", Arial, sans-serif;
    }

    #superme-web-loader.superme-web-loader--leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .superme-native-shell #superme-web-loader {
      display: grid;
      background: #ffffff;
      isolation: isolate;
    }

    .superme-native-shell .superme-loader-orb,
    .superme-native-shell .superme-loader-card,
    .superme-native-shell .superme-loader-star {
      display: none;
    }

    .superme-native-splash {
      display: none;
    }

    .superme-native-shell .superme-native-splash {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #ffffff;
    }

    .superme-native-splash__wash {
      position: absolute;
      inset: -12%;
      z-index: 0;
      background:
        radial-gradient(circle at 19% 18%, rgba(255, 198, 218, .96), transparent 34%),
        radial-gradient(circle at 84% 24%, rgba(190, 222, 255, .92), transparent 38%),
        linear-gradient(145deg, #fff8f3 0%, #eee9ff 53%, #fff0f7 100%);
      clip-path: circle(0% at 50% 50%);
      animation: superme-wash-reveal 2.35s cubic-bezier(.72, 0, .2, 1) forwards;
    }

    .superme-native-splash__spark {
      position: absolute;
      z-index: 3;
      width: 48px;
      aspect-ratio: 1;
      transform: rotate(45deg) scale(.1);
      border-radius: 7px 48% 7px 48%;
      background: linear-gradient(135deg, #f5aa31 4%, #e94775 48%, #6d48b6 96%);
      box-shadow: 0 0 0 0 rgba(229, 72, 117, .18);
      animation: superme-spark-bloom 1.35s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .superme-native-splash__spark::before,
    .superme-native-splash__spark::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: inherit;
    }

    .superme-native-splash__spark::before { transform: rotate(90deg); }
    .superme-native-splash__spark::after { transform: rotate(180deg); }

    .superme-native-splash__brand {
      position: relative;
      z-index: 4;
      display: flex;
      width: min(76vw, 330px);
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transform: translateY(8px) scale(.86);
      animation: superme-brand-arrive .72s 1.02s cubic-bezier(.2, .82, .2, 1.08) forwards;
    }

    .superme-native-splash__logo {
      width: min(76vw, 310px);
      height: auto;
      filter: drop-shadow(0 12px 20px rgba(67, 36, 119, .18));
    }

    .superme-native-splash__tagline {
      margin: 8px 0 0;
      color: #432477;
      font-size: clamp(15px, 4.2vw, 19px);
      font-weight: 650;
      letter-spacing: .01em;
    }

    .superme-native-splash__mini-spark {
      position: absolute;
      color: #f5aa31;
      opacity: 0;
      animation: superme-mini-spark .58s 1.58s ease-out forwards;
    }

    .superme-native-splash__mini-spark--left {
      top: 30%;
      left: 16%;
      font-size: 24px;
    }

    .superme-native-splash__mini-spark--right {
      right: 15%;
      bottom: 29%;
      color: #e94775;
      font-size: 18px;
      animation-delay: 1.74s;
    }

    @keyframes superme-spark-bloom {
      0% { transform: rotate(45deg) scale(.1); opacity: 0; }
      24% { transform: rotate(45deg) scale(.56); opacity: 1; }
      66% { transform: rotate(135deg) scale(1.12); box-shadow: 0 0 0 16px rgba(229, 72, 117, .09); }
      100% { transform: rotate(225deg) scale(0); opacity: 0; box-shadow: 0 0 0 52px rgba(229, 72, 117, 0); }
    }

    @keyframes superme-wash-reveal {
      0%, 28% { clip-path: circle(0% at 50% 50%); }
      72%, 100% { clip-path: circle(82% at 50% 50%); }
    }

    @keyframes superme-brand-arrive {
      0% { opacity: 0; transform: translateY(8px) scale(.86); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes superme-mini-spark {
      0% { opacity: 0; transform: scale(.2) rotate(-25deg); }
      70% { opacity: 1; transform: scale(1.18) rotate(8deg); }
      100% { opacity: .9; transform: scale(1) rotate(0); }
    }

    .superme-loader-orb {
      position: absolute;
      width: 19rem;
      height: 19rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, .58);
      box-shadow: 0 22px 70px rgba(82, 40, 137, .16);
      animation: superme-orb-pulse 2.1s ease-in-out infinite;
    }

    .superme-loader-card {
      position: relative;
      width: min(88vw, 390px);
      padding: 34px 28px 26px;
      text-align: center;
    }

    .superme-loader-logo {
      width: 156px;
      height: auto;
      filter: drop-shadow(0 9px 12px rgba(80, 44, 132, .15));
      animation: superme-logo-float 1.7s ease-in-out infinite;
    }

    .superme-loader-panda {
      position: absolute;
      right: -6px;
      top: 4px;
      width: 62px;
      height: auto;
      transform-origin: 50% 100%;
      animation: superme-panda-wave 1.25s ease-in-out infinite alternate;
    }

    .superme-loader-title {
      margin: 22px 0 6px;
      color: #33294a;
      font-size: clamp(21px, 5vw, 28px);
      font-weight: 650;
      line-height: 1.2;
    }

    .superme-loader-copy {
      margin: 0;
      color: #736b7c;
      font-size: 15px;
    }

    .superme-loader-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .superme-loader-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: superme-dot-bounce 1s ease-in-out infinite;
    }

    .superme-loader-dots span:nth-child(1) { background: #7b3fbb; }
    .superme-loader-dots span:nth-child(2) { background: #e93f76; animation-delay: .13s; }
    .superme-loader-dots span:nth-child(3) { background: #ff8b36; animation-delay: .26s; }

    .superme-loader-star {
      position: absolute;
      color: #f5b51b;
      font-size: 24px;
      animation: superme-star-twinkle 1.4s ease-in-out infinite alternate;
    }

    .superme-loader-star--one { left: 2%; top: 27%; }
    .superme-loader-star--two { right: 4%; bottom: 25%; animation-delay: .35s; }

    @keyframes superme-logo-float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-9px) rotate(1deg); }
    }
    @keyframes superme-panda-wave {
      from { transform: rotate(-5deg) translateY(2px); }
      to { transform: rotate(7deg) translateY(-3px); }
    }
    @keyframes superme-orb-pulse {
      0%, 100% { transform: scale(.96); opacity: .75; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes superme-dot-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    @keyframes superme-star-twinkle {
      from { transform: scale(.72) rotate(-8deg); opacity: .45; }
      to { transform: scale(1.15) rotate(8deg); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #superme-web-loader * { animation: none !important; }
      .superme-native-splash__wash { clip-path: none; }
      .superme-native-splash__brand { opacity: 1; transform: none; }
      .superme-native-splash__spark { display: none; }
    }
  </style>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- "default" = light status bar text on iOS; matches StatusBar.Style.Light set in app.component.ts -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  
  <!-- Google Maps API -->
  <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places"></script> -->
  <!-- NOTE: Replace YOUR_GOOGLE_MAPS_API_KEY with your actual Google Maps API key -->
</head>

<body>
  <div id="superme-web-loader" role="status" aria-live="polite" aria-label="SuperMeApp is loading">
    <div class="superme-native-splash" aria-hidden="true">
      <div class="superme-native-splash__wash"></div>
      <div class="superme-native-splash__spark"></div>
      <span class="superme-native-splash__mini-spark superme-native-splash__mini-spark--left">✦</span>
      <span class="superme-native-splash__mini-spark superme-native-splash__mini-spark--right">✦</span>
      <div class="superme-native-splash__brand">
        <img class="superme-native-splash__logo" src="assets/Images-Transparent/SuperMeLogoFinal3.webp" alt="" />
        <p class="superme-native-splash__tagline">Grow • Learn • Shine</p>
      </div>
    </div>
    <div class="superme-loader-orb" aria-hidden="true"></div>
    <span class="superme-loader-star superme-loader-star--one" aria-hidden="true">✦</span>
    <span class="superme-loader-star superme-loader-star--two" aria-hidden="true">✦</span>
    <div class="superme-loader-card">
      <img class="superme-loader-panda" src="assets/Images-Pet/Panda-Age1-Happy.webp" alt="" aria-hidden="true" />
      <img class="superme-loader-logo" src="assets/Images-Transparent/SuperMeLogoFinal3.webp" alt="SuperMeApp" />
      <p class="superme-loader-title">Getting your SuperMe space ready!</p>
      <p class="superme-loader-copy">A little magic is loading&hellip;</p>
      <div class="superme-loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <app-root></app-root>
</body>

  window.Swiper = Swiper;
</script>
