<ion-content>
  <div class="container w-full p-0" style="height: 100vh; overflow-y: scroll; padding-bottom: 50px">
    <img src="/assets/header.svg" style="margin-top: -20px; width: 100%" alt="">
    <div class="container w-full">
      <img src="/assets/section-2.svg" style="width: 100%; margin-top: 25px" alt="">
    </div>
    <div class="container w-full">
      <h2 class="glance-in-day">Your Day at a Glance</h2>
    </div>
    <mindful-datepicker formControlName="dob" [type]="'date'"></mindful-datepicker>
    <mindful-datepicker formControlName="eventRange" [type]="'range'"></mindful-datepicker>
    <mindful-timepicker></mindful-timepicker>
    <mindful-birthdaypicker></mindful-birthdaypicker>
    <mindful-dropdown width="full-width" [options]="[{key: '1', value: 'Value 1'}, {key: '2', value: 'Value 2'}]" label="Test Label"></mindful-dropdown>
    <mindful-selectors (selectedKeysChange)="console.log($event)" [options]="[{key: '1', value: 'Value 1', type: 'habit'}, {key: '2', value: 'Value 2', type: 'task'}]" label="Test Selectors"></mindful-selectors>
    <div class="container w-full">
      <div class="row toggler">
        <div class="col-4" (click)="currentActive = 'all'" [ngClass]="currentActive === 'all' ? 'active' : 'null'">All</div>
        <div class="col-4" (click)="currentActive = 'habits'" [ngClass]="currentActive === 'habits' ? 'active' : 'null'">Habits</div>
        <div class="col-4" (click)="currentActive = 'tasks'" [ngClass]="currentActive === 'tasks' ? 'active' : 'null'">Tasks</div>
      </div>
    </div>
    <div class="container w-full" style="margin-top: 20px">
      <habit-card [startTime]="1745484315000" [endTime]="1745489715000" inProgress></habit-card>
      <habit-card [startTime]="1745484315000" [endTime]="1745486115000"></habit-card>
      <habit-card [startTime]="1745484315000" [endTime]="1745486115000" inProgress></habit-card>
      <habit-card [startTime]="1745484315000" [endTime]="1745486115000"></habit-card>
    </div>
  </div>
</ion-content>
<footer></footer>
