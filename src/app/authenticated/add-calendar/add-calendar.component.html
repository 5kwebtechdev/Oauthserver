<ion-content style="height: 100vh; overflow-y: scroll">
  <div class="container w-full typical-header">
    <div class="row">
      <div class="col-1 p-r-0" [routerLink]="'/authed/timeline'">
        <i class="fa-solid fa-times back-button" style="font-size: 34px;padding-top: 10px;"></i>
      </div>
      <div class="col-7">
        <div class="container w-full p-0 flex-center" style="min-height: 55px">
          <div class="container w-full p-0">
            <h3>Create. Commit. Grow</h3>
          </div>
        </div>
      </div>
      <div class="col-3 p-l-0">
        <div class="container w-full p-0 flex-center" style="min-height: 45px">

        </div>
      </div>
    </div>
  </div>
  <div class="container w-full p-0 typical-body">
    <div class="container w-full">
      <div class="row toggler">
        <div class="col-4 habit" (click)="currentActive = 'habits'" [ngClass]="currentActive === 'habits' ? 'active' : 'null'">Habits</div>
        <div class="col-4 task" (click)="currentActive = 'tasks'" [ngClass]="currentActive === 'tasks' ? 'active' : 'null'">Tasks</div>
        <div class="col-4 timetable" (click)="currentActive = 'timetable'" [ngClass]="currentActive === 'timetable' ? 'active' : 'null'">Time Table</div>
      </div>
    </div>
  </div>
  <div class="container w-full">
    <input type="text" class="big-input" [placeholder]="getCurrentTitle() + ' Title'" />
    <mindful-selectors
      size="small"
    [options]="[
    { key: '1', value: 'Learning', type: 'habit-input' },
    { key: '2', value: 'Fitness', type: 'habit-input' },
    { key: '3', value: 'Skill', type: 'habit-input' },
    { key: '4', value: 'Personal', type: 'habit-input' },
    ]"
    >
    </mindful-selectors>
    <div [classList]="currentActive">
      <div class="container w-full p-0 typical-division"></div>
      <div class="container w-full p-0 routine-selector">
        <div class="row">
          <div class="col-3" style="width: max-content">
            <p>Routine</p>
          </div>
          <div class="col-9">
            <mindful-selectors
              [options]="[
        {key: 'morning', value: 'Morning', type: 'morning'},
        {key: 'evening', value: 'Evening', type: 'evening'},
        {key: 'night', value: 'Night', type: 'night'}]"
              size="small"
            >
            </mindful-selectors>
          </div>
        </div>
      </div>
      <div class="container w-full p-0 typical-division"></div>
      <div class="container w-full p-0">
        <mindful-selectors
          [circle]="true"
          [options]="[
            { key: 'sunday', value: 'S', type: 'pending' },
            { key: 'monday', value: 'M', type: 'pending' },
            { key: 'tuesday', value: 'T', type: 'pending' },
            { key: 'wednesday', value: 'W', type: 'pending' },
            { key: 'thursday', value: 'T', type: 'pending' },
            { key: 'friday', value: 'F', type: 'pending' },
            { key: 'saturday', value: 'Sa', type: 'pending' }
          ]"
        >

        </mindful-selectors>
      </div>
    </div>
  </div>
</ion-content>
