<!-- ══ Family connected acknowledgment popup ══ -->
<div class="family-ack-backdrop" *ngIf="showFamilyAck" (click)="dismissFamilyAck()">
  <div class="family-ack-popup" (click)="$event.stopPropagation()">
    <img class="family-ack-popup__img" src="assets/Images-Transparent/Image-Parents-Family.png" alt="" aria-hidden="true" />
    <h2 class="family-ack-popup__title">You're connected to your family</h2>
    <p class="family-ack-popup__desc">This account is now set to {{ familyAckRole }} and linked to your family.</p>
    <button class="family-ack-popup__btn" (click)="dismissFamilyAck()">Let's Begin</button>
  </div>
</div>

<!-- ══ Home-screen overlays (PRD: bonus coins, daily login, mood prompt, streak milestone) ══ -->
<div *ngIf="activeOverlay"
     class="home-overlay"
     role="dialog"
     aria-modal="true"
     (click)="onOverlayTap()">

  <div class="home-overlay__card" (click)="$event.stopPropagation()">

    <!-- Pet -->
    <div class="home-overlay__pet">
      <superme-pet pet="panda" [age]="1" [mood]="overlayPetMood"></superme-pet>
    </div>

    <!-- Message bubble -->
    <div class="home-overlay__bubble">
      <p class="home-overlay__msg" style="white-space: pre-line">{{ overlayMessage }}</p>
    </div>

    <!-- Mood picker — only for mood-prompt (blocking until mood selected) -->
    <div *ngIf="activeOverlay === 'mood-prompt'" class="home-overlay__mood-picker">
      <mood-selector [value]="selectedMood" (valueChange)="onOverlayMoodSelected($event)"></mood-selector>
    </div>

    <!-- Tap hint for non-blocking overlays -->
    <p *ngIf="activeOverlay !== 'mood-prompt'" class="home-overlay__hint" (click)="dismissCurrentOverlay()">
      Tap anywhere to continue
    </p>

  </div>
</div>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      pullingText="Pull to refresh"
      refreshingSpinner="circles"
      refreshingText="Refreshing...">
    </ion-refresher-content>
  </ion-refresher>
  <div class="container w-100 p-0">
    <section class="user-profile-section profile" aria-labelledby="profile-heading">
      <div class="dasboard-wrapper">
        <div class="profile-content">

          <header class="profile-header" role="banner">
            <div class="user-info" role="group" aria-label="User info">
              <div class="user-avatar" aria-hidden="false">
                <a [routerLink]="['/authed','user-profile']" aria-label="Open profile">
                  <app-img
                    [src]="userAvatarUrl"
                    [alt]="avatarImageName ? avatarImageName : (userName + ' avatar')"
                    [circle]="true"
                    objectFit="cover">
                  </app-img>
                </a>
              </div>
              <div class="user-name-wrap">
                <span class="user-name">{{ userName }}</span>
              </div>
            </div>

            <nav class="header-tools" role="navigation" aria-label="Profile tools">
              <a class="tool-item" aria-label="Notes" [routerLink]="['/authed/notes']">
                <img src="assets/Icons-Neutral/Icon-Notes-3D.png" alt="Notes" class="tool-icon"
                  onerror="this.onerror=null;this.src='assets/Icons-Neutral/Icon-Notes.png'">
              </a>
              <a class="tool-item" type="button" aria-label="Calendar" (click)="openCalendar()">
                <img src="assets/Icons-Neutral/Icon-Calendar-3D.png" alt="Calendar" class="tool-icon"
                  onerror="this.onerror=null;this.src='assets/Icons-Neutral/Icon-Calendar.png'">
              </a>
            </nav>
          </header>

          <superme-coins-stats [userCoins]="userCoins" [userStreaks]="userStreaks" [userDays]="userDays"
            [userBadges]="userBadges"></superme-coins-stats>
        </div>
        <div class="d-flex" style="padding-left: 16px; height: 10vh;">
          <app-speech-bubble [message]="greetingMessage" [petMessage]="currentPetMessage" type="talking"
            arrowSide="right" [arrowSize]="16" arrowOffset="30px" [arrowAngle]="10" color="#fff" textColor="#282527"
            style=" width: 100%;" aria-label="Greeting message" role="status" aria-live="polite">
          </app-speech-bubble>

          <div class="digital-pet" aria-hidden="false">
            <superme-pet pet="panda" [age]="1" [mood]="petMood">
            </superme-pet>
          </div>
        </div>
      </div>
    </section>

    <div class="dashboard-content">

      <!-- Streak Restore Banner -->
      <div class="streak-restore-banner" *ngIf="canRestoreStreak" (click)="openStreakRestoreModal()" role="button" tabindex="0" (keyup.enter)="openStreakRestoreModal()">
        <div class="streak-restore-banner__left">
          <span class="streak-restore-banner__fire">🔥</span>
          <div class="streak-restore-banner__text">
            <strong>Restore your streak!</strong>
            <span>Don't lose it — restore for {{ restoreCost }} coins</span>
          </div>
        </div>
        <div class="streak-restore-banner__pill" *ngIf="restoreToStreak">
          {{ restoreToStreak }} days
        </div>
      </div>

      <div class="mood-selector w-full">
        <mood-selector [value]="selectedMood" (valueChange)="onMoodChange($event)"></mood-selector>
      </div>

      <!-- activity Card -->
      <activity-card style="width: 100%;" mode="recent" [recentHabits]="recentHabits"
        [recentTasks]="recentTasks" [totalTasks]="totalTasks" [totalTasksCompleted]="totalTasksCompleted"
        [taskCompletionRate]="taskCompletionRate" [totalHabits]="totalHabits" [totalHabitsCompleted]="totalHabitsCompleted"
        [habitCompletionRate]="habitCompletionRate"></activity-card>

      <!-- Ad-banner -->
      <div class="w-full">
        <ad-banner screen="HOME"></ad-banner>
      </div>

      <!-- Content Card -->
      <div class="w-full" style="width: 100%;">
        <learning-section source="/authed/user-dashboard"></learning-section>
      </div>

      <!-- Reels- card -->
      <!-- <div class="w-full">
        <superme-card-header [title]="'Made by Kids, for Kids!'" [subtitleLeft]="'Watch reels'"
          [subtitleMiddle]="'Create'" [subtitleRight]="'Get Inspired'">
          <superme-view-all superme-header-actions [routerLink]="['/authed/reel-section']" class="see-all">
          </superme-view-all>
        </superme-card-header>
        <div style="margin-top: 10px;">
          <reels-card></reels-card>
        </div>
      </div> -->

      <!-- Tutor card-->
      <tutor-card style="width: 100%;"></tutor-card>

      <!-- Journals component-->
      <journals class="w-full" [showCreateButton]="true" [maxDisplayEntries]="3">
      </journals>

      <!--Academy section-->
      <academy-section class="w-full"></academy-section>


    </div>
  </div>
  <app-footer></app-footer>
</ion-content>
