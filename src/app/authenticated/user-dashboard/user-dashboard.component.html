<!-- ══ Family connected acknowledgment popup ══ -->
<div class="family-ack-backdrop" *ngIf="showFamilyAck" (click)="dismissFamilyAck()">
  <div class="family-ack-popup" (click)="$event.stopPropagation()">
    <img class="family-ack-popup__img" src="assets/Images-Transparent/Image-Parents-Family.webp" alt="" aria-hidden="true" />
    <h2 class="family-ack-popup__title">You're connected to your family</h2>
    <p class="family-ack-popup__desc">This account is now set to {{ familyAckRole }} and linked to your family.</p>
    <button class="family-ack-popup__btn" (click)="dismissFamilyAck()">Let's Begin</button>
  </div>
</div>

<!-- ══ Home-screen overlays (PRD: bonus coins, daily login, mood prompt, streak milestone) ══ -->
<div *ngIf="showBirthdayDialog && !showFamilyAck && !showDailyStreakPopup && !activeOverlay"
     class="birthday-dialog-backdrop" role="dialog" aria-modal="true" aria-label="Happy Birthday"
     (keydown.escape)="dismissBirthdayDialog()">
  <div class="birthday-dialog">
    <img src="assets/figma/home-birthday/dialog-art.png" alt="Happy Birthday! It's your special day! Here's to a year full of new adventures, amazing learning and all the exciting things that make you, you! A little birthday gift for you: 200 coins." />
    <button type="button" class="birthday-dialog__close" aria-label="Close birthday greeting" (click)="dismissBirthdayDialog()">
      <img src="assets/figma/home-birthday/close.svg" alt="" />
    </button>
  </div>
</div>
<div *ngIf="showDailyStreakPopup && streakStatusResolved && !showFamilyAck"
     class="streak-milestone-overlay" role="dialog" aria-modal="true" aria-label="Streak Day"
     (keydown.escape)="dismissDailyStreakPopup()">
  <app-streak-milestone [days]="loginStreakDays ?? userStreaks" [celebrateProgress]="!canRestoreStreak"
    [restoreMode]="canRestoreStreak" [restoreCost]="restoreCost" [restoreDisabled]="isStreakRestoring"
    [restoring]="isStreakRestoring" (restore)="restoreStreakFromPopup()"
    (continue)="dismissDailyStreakPopup()"></app-streak-milestone>
</div>
<div *ngIf="activeOverlay && activeOverlay !== 'daily-login' && activeOverlay !== 'streak-milestone'"
     class="home-overlay"
     role="dialog"
     aria-modal="true"
     (click)="onOverlayTap()">

  <div class="home-overlay__card" (click)="$event.stopPropagation()">

    <!-- Pet -->
    <div class="home-overlay__pet">
      <superme-pet [mood]="overlayPetMood"></superme-pet>
    </div>

    <!-- Message bubble -->
    <div class="home-overlay__bubble">
      <p class="home-overlay__msg" style="white-space: pre-line">{{ overlayMessage }}</p>
    </div>

    <!-- Mood picker — only for mood-prompt (blocking until mood selected) -->
    <div *ngIf="activeOverlay === 'mood-prompt'" class="home-overlay__mood-picker">
      <mood-selector [value]="selectedMood" (valueChange)="onOverlayMoodSelected($event)"></mood-selector>
    </div>

    <!-- Tap hint for non-blocking overlays -->
    <p *ngIf="activeOverlay !== 'mood-prompt'" class="home-overlay__hint" (click)="dismissCurrentOverlay()">
      Tap anywhere to continue
    </p>

  </div>
</div>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      pullingText="Pull to refresh"
      refreshingSpinner="circles"
      refreshingText="Refreshing...">
    </ion-refresher-content>
  </ion-refresher>
  <div class="container w-100 p-0">
    <section class="user-profile-section profile" aria-labelledby="profile-heading">
      <div class="dasboard-wrapper">
        <div class="profile-content mobile-chrome">

          <header class="profile-header home-referral-header" role="banner">
            <div class="user-info" role="group" aria-label="User info">
              <div class="user-avatar" aria-hidden="false">
                <a [routerLink]="['/app','user-profile']" aria-label="Open profile">
                  <app-img *ngIf="userAvatarUrl; else avatarInitial"
                    [src]="userAvatarUrl"
                    [alt]="avatarImageName ? avatarImageName : (headerName + ' avatar')"
                    [circle]="true"
                    objectFit="cover">
                  </app-img>
                  <ng-template #avatarInitial>
                    <span class="user-avatar-initial" aria-hidden="true">{{ userInitial }}</span>
                  </ng-template>
                </a>
              </div>
              <div class="user-name-wrap">
                <span class="user-name user-name--mobile">Hey {{ headerName }}!</span>
                <strong class="user-name user-name--web">{{ greetingPeriod }} {{ headerName }} !</strong>
                <span class="user-subtitle">Ready to grow today?</span>
              </div>
            </div>

            <nav class="header-tools home-referral-tools" role="navigation" aria-label="Profile tools">
              <button class="coin-pill" type="button" aria-label="Open coins" (click)="openCoinPage()">
                <img src="assets/icons/superme-coin.webp" alt="" class="coin-pill-icon" aria-hidden="true">
                <span>{{ userCoins.toLocaleString('en-IN') }}</span>
              </button>
              <a class="refer-tool" routerLink="/authed/refer-friend" aria-label="Refer a friend">
                <img src="assets/figma/streak-screen/gift.png" alt="" aria-hidden="true">
              </a>
              <button class="bell-tool" type="button"
                [attr.aria-label]="unreadNotificationCount ? 'Open notifications, ' + unreadNotificationCount + ' unread' : 'Open notifications'"
                (click)="openNotifications()">
                <img src="assets/icons/child-home-notification-figma.svg" alt="" class="notification-tool-icon" aria-hidden="true">
                <span class="notification-count" *ngIf="unreadNotificationCount > 0" aria-hidden="true">{{ unreadNotificationCount > 9 ? '9+' : unreadNotificationCount }}</span>
              </button>
            </nav>
          </header>
        </div>

        <div class="hero-mood-anchor">
          <app-home-mood-header [mood]="homeHeaderMood" [period]="homeTimePeriod" [birthday]="birthdayToday"
            [streaks]="userStreaks" [badges]="userBadges"
            [canEditMood]="!homeMoodSelector.dailyLimitReached"
            [moodPickerOpen]="homeMoodSelector.dialogOpen"
            (moodEdit)="editHeaderMood()"></app-home-mood-header>
          <mood-selector #homeMoodSelector class="hero-mood-picker" presentation="dropdown" [value]="selectedMood"
            (valueChange)="onMoodChange($event)" (confirmedMoodChange)="onConfirmedHomeMood($event)"></mood-selector>
        </div>
      </div>
    </section>

    <div class="dashboard-content">

      <!--
        Current Week's API-backed streak is temporarily hidden across roles.
        Keep the implementation in place so it can be re-enabled without
        rebuilding the streak data flow.
        <week-streak-section class="w-full" [days]="weekStreakDays"
          [currentStreak]="userStreaks" [nextMilestoneDay]="nextMilestoneDay"
          [daysToNextMilestone]="daysToNextMilestone" [nextMilestoneCoins]="nextMilestoneCoins"></week-streak-section>
      -->

      <!-- activity Card -->
      <activity-card class="home-glance-card" mode="recent" [recentHabits]="recentHabits" [glanceDailyData]="glanceDailyData" [glanceLoading]="glanceLoading" [glanceLoadError]="glanceLoadError"
        [recentTasks]="recentTasks" [recentTimetables]="recentTimetables" [totalTasks]="totalTasks" [totalTasksCompleted]="totalTasksCompleted"
        [taskCompletionRate]="taskCompletionRate" [totalHabits]="totalHabits" [totalHabitsCompleted]="totalHabitsCompleted"
        [habitCompletionRate]="habitCompletionRate" [totalTimetables]="totalTimetables"></activity-card>

      <!-- Ad-banner -->
      <div class="ad-full-bleed">
        <ad-banner screen="HOME"></ad-banner>
      </div>

      <!-- Content Card -->
      <section class="learning-quest-shell" aria-label="Learning and skills">
        <learning-section source="/home" [childSelfLearningViewAll]="true"></learning-section>
        <academy-section class="w-full"></academy-section>
      </section>

      <!-- Tutor card-->
      <tutor-card style="width: 100%;"></tutor-card>

      <!-- Quick Access (Write Now / Notes / Calendar) -->
      <quick-access-section class="w-full"></quick-access-section>

      <!-- Reels are available on web, Android and iOS. -->
      <reel-preview-section class="w-full"></reel-preview-section>

    </div>
  </div>
  <app-footer class="mobile-chrome"></app-footer>
  <dashboard-web-footer></dashboard-web-footer>
</ion-content>
