<ion-content>
  <div class="container w-full p-0" style="height: 100vh; overflow-y: scroll; padding-bottom: 50px">
    <!-- User Profile Section -->
    <section class="user-profile-section profile" aria-labelledby="profile-heading">
      <div class="profile-content">
        <h2 id="profile-heading" class="visually-hidden">Your profile</h2>

        <!-- Top Header with Avatar and Tools -->
      <header class="profile-header" role="banner">
        <div class="user-info" role="group" aria-label="User info">
          <div class="user-avatar" aria-hidden="false">
            <img src="/assets/app-assets/Default-avatar-home.svg" alt="{{ userName }} avatar">
          </div>
          <div class="user-name-wrap">
            <span class="user-name">{{ userName }}</span>
          </div>
        </div>

        <nav class="header-tools" role="navigation" aria-label="Profile tools">
          <button class="tool-item" type="button" aria-label="Notes" (click)="openNotes()">
            <img src="/assets/app-assets/Notes-Icon-Home-Top.svg" alt="Notes" class="tool-icon">
           <!-- <span class="tool-label">Notes</span> -->
          </button>
          <button class="tool-item" type="button" aria-label="Calendar">
            <img src="/assets/app-assets/Icon-calendar.svg" alt="Calendar" class="tool-icon">
            <!-- <span class="tool-label">Calendar</span> -->
          </button>
        </nav>
      </header>

      <!-- Centered Stats Row (icons above numbers, vertical dividers) -->
      <div class="stats-row" role="list" aria-label="User stats">
        <div class="stats-inner">
          <div class="stat-col" role="listitem" aria-label="Coins">
            <img src="/assets/app-assets/Coins-icon-common.svg" alt="Coins" class="stat-icon">
            <div class="stat-value">{{ userCoins | number }}</div>
            <span class="stat-label visually-hidden">Coins</span>
          </div>
          <span class="stat-divider-vertical" aria-hidden="true"></span>

          <div class="stat-col" role="listitem" aria-label="Streaks">
            <img src="/assets/app-assets/Trophies-icon-common.svg" alt="Streaks" class="stat-icon">
            <div class="stat-value">{{ userStreaks }}</div>
            <span class="stat-label visually-hidden">Streaks</span>
          </div>
          <span class="stat-divider-vertical" aria-hidden="true"></span>

          <div class="stat-col" role="listitem" aria-label="Days">
            <img src="/assets/app-assets/Steaks-icon-common.svg" alt="Days" class="stat-icon">
            <div class="stat-value">{{ userDays }}</div>
            <span class="stat-label visually-hidden">Days</span>
          </div>
          <span class="stat-divider-vertical" aria-hidden="true"></span>

          <div class="stat-col" role="listitem" aria-label="Badges">
            <img src="/assets/app-assets/Badge.svg" alt="Badges" class="stat-icon">
            <div class="stat-value">{{ userBadges }}</div>
            <span class="stat-label visually-hidden">Badges</span>
          </div>
        </div>
      </div>

      <!-- Speech bubble message card -->
      <aside class="message-card bubble" role="status" aria-live="polite" aria-label="Greeting message">
        <div class="bubble-inner">
          <p class="greeting-text">Hey, <strong>{{ userName }}</strong>!</p>
          <p class="message-text">I'll be right here helping you grow, learn, and celebrate every step!</p>
        </div>
      </aside>

      <div class="digital-pet" aria-hidden="false">
        <!-- Reusable mindful-pet component: default pet is panda and age is 1 -->
        <mindful-pet pet="panda" [age]="1"></mindful-pet>
      </div>
      </div>
    </section>

    
    <div class="mood-selector">
      <mood-selector [value]="selectedMood" (valueChange)="onMoodChange($event)"></mood-selector>
    </div>

    <!-- Habit Card -->
    <habit-card mode="list"></habit-card>

    <!-- Ad-banner (commented out because mindful-banner component is missing) -->
    <!--
    <div style="margin-top: 16px;">
      <mindful-banner></mindful-banner>
    </div>
    -->

    <!-- Ad-banner -->
    <div style="margin-top: 16px;">
      <ad-banner></ad-banner>
    </div>

    <!-- Content Card -->
    <div style="margin-top: 5vh; height: 450px;">
      <content-card></content-card>
    </div>

    <!-- Challenge Card -->
    <!-- <div style="margin-top: 5vh;">
      <challenge-card></challenge-card>
    </div> -->

    <!-- Reels- card -->
    <div style="margin-top: 5vh;">
      <reels-card></reels-card>
    </div>

    <!-- Tutor card-->
    <tutor-card></tutor-card>

    <!-- Journals component-->
    <journals 
      [showCreateButton]="true" 
      [maxDisplayEntries]="3">
    </journals>
    
  <!--Academy section-->
  <academy-section></academy-section>

    <!-- Development/Testing Components -->
    <!-- <mindful-datepicker formControlName="dob" [type]="'date'"></mindful-datepicker>
    <mindful-datepicker formControlName="eventRange" [type]="'range'"></mindful-datepicker>
    <mindful-timepicker></mindful-timepicker>
    <mindful-birthdaypicker></mindful-birthdaypicker>
    <mindful-dropdown width="full-width" [options]="[{key: '1', value: 'Value 1'}, {key: '2', value: 'Value 2'}]" label="Test Label"></mindful-dropdown>
    <mindful-selectors (selectedKeysChange)="console.log($event)" [options]="[{key: '1', value: 'Value 1', type: 'habit'}, {key: '2', value: 'Value 2', type: 'task'}]" label="Test Selectors"></mindful-selectors> -->
  <!-- mood-selector moved above to the profile area -->
  </div>
</ion-content>
