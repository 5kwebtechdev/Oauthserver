
  <ion-content style="height: 100vh; overflow-y: scroll">
  <div class="container w-full typical-header">
    <div class="row">
      <div class="col-2">
        <img src="/assets/app-assets/Back-common-icon.svg" class="back-button" alt="">
      </div>
      <div class="col-7">

      </div>
      <div class="col-3 p-l-0">
        <div class="container w-full p-0 flex-center" style="min-height: 45px">
          <img src="/assets/app-assets/Notes-Icon-Home-Top.svg" alt="">
          <img src="/assets/app-assets/Icon-calendar.svg" alt="">
        </div>
      </div>
    </div>
  </div>
  <mindful-week></mindful-week>
  <div class="card container w-full" style="width: calc(100vw - 16px) !important;border-radius: 32px;margin: 17px auto 30px auto;">
    <div class="row" style="padding: 15px 0px;">
      <div class="col-3 p-0">
        <mindful-completion
          [completionPercentage]="80"
          [borderColor]="'#4CAF50'"
          [innerText]="'80%'"
          [belowText]="'Completion Text'">
        </mindful-completion>
      </div>
      <div class="col-3 p-0">
        <mindful-completion
          [completionPercentage]="60"
          [borderColor]="'#F0AD4E'"
          [innerText]="'60'"
          [belowText]="'Consistency Score'">
        </mindful-completion>
      </div>
      <div class="col-3 p-0">
        <mindful-completion
          [completionPercentage]="42"
          [borderColor]="'#BB2124'"
          [innerText]="'42'"
          [belowText]="'Improvement Score'">
        </mindful-completion>
      </div>
      <div class="col-3 p-0">
        <mindful-completion
          [completionPercentage]="74"
          [borderColor]="'#F0AD4E'"
          [innerText]="'74'"
          [belowText]="'App Score'">
        </mindful-completion>
      </div>
    </div>
  </div>
  <div class="container p-0" style="width: fit-content;transform: scale(1.1); margin-bottom: 20px">
    <mindful-selectors
      [options]="[
    {key: 'all', value: 'All', type: 'magenta'},
    {key: 'habit', value: 'Habits', type: 'lavendar'},
    {key: 'task', value: 'Tasks', type: 'orange'},
    {key: 'timetable', value: 'Time Table', type: 'aqua'},
    ]"
      componentType="button"
      size="small"
      [singleSelection]="true"
      style="transform: scale(1.5)"
      (selectedKeysChange)="keysUpdated($event)"
    >
    </mindful-selectors>
  </div>
  <div class="container w-full p-0" style="overflow:hidden ">
    <mindful-timeline
      [events]="filteredEvents"
    ></mindful-timeline>
  </div>

</ion-content>
