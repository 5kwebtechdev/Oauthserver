<ng-container *ngIf="false">
  <div class="container w-full">
    <h1>Cards</h1>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000"></habit-card>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000"></habit-card>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000" inProgress></habit-card>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000"></habit-card>
  </div>
  <div class="container w-full">
    <div class="container w-full p-0">
      <h1>Badges</h1>
      <mindful-badge disabled type="habit" text="Morning"></mindful-badge>
      <mindful-badge disabled type="task" text="Morning"></mindful-badge>
      <mindful-badge disabled type="morning" text="Morning"></mindful-badge>
      <mindful-badge disabled type="morning" inactive text="Morning"></mindful-badge>
      <mindful-badge disabled type="evening" text="Evening"></mindful-badge>
      <mindful-badge disabled type="evening" inactive text="Evening"></mindful-badge>
      <mindful-badge disabled type="night" text="Night"></mindful-badge>
      <mindful-badge disabled type="night" inactive text="Night"></mindful-badge>
      <mindful-badge disabled type="habit-input" text="Learning"></mindful-badge>
      <mindful-badge disabled type="habit-input" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="task-input" text="Learning"></mindful-badge>
      <mindful-badge disabled type="task-input" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="school" text="Learning"></mindful-badge>
      <mindful-badge disabled type="school" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="red" text="Learning"></mindful-badge>
      <mindful-badge disabled type="red" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="yellow" text="Learning"></mindful-badge>
      <mindful-badge disabled type="yellow" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="green" text="Learning"></mindful-badge>
      <mindful-badge disabled type="green" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="pending" text="Learning"></mindful-badge>
      <mindful-badge disabled type="pending" inactive text="Learning"></mindful-badge>
      <mindful-badge disabled type="puzzle" text="Learning"></mindful-badge>
      <mindful-badge disabled type="puzzle" inactive text="Learning"></mindful-badge>
    </div>
  </div>
  <div class="container w-full">
    <h1>Buttons</h1>
    <div class="row w-full">
      <div class="container w-full">
        <h2>Small</h2>
        <mindful-button *ngFor="let type of buttonStylesArray" [type]="type" disabled text="Let's Go"></mindful-button>
      </div>
    </div>
    <div class="row w-full">
      <div class="container w-full">
        <h2>Medium</h2>
        <mindful-button *ngFor="let type of buttonStylesArray" [type]="type" text="Let's Go" medium></mindful-button>
      </div>
    </div>
    <div class="row w-full">
      <div class="container w-full">
        <h2>Large</h2>
        <mindful-button *ngFor="let type of buttonStylesArray" [type]="type" text="Let's Go" large></mindful-button>
      </div>
    </div>
  </div>
</ng-container>
<footer></footer>
<ion-content>
  <div class="container w-full p-0" style="overflow-y: scroll; height: calc(100vh - 75px); padding-bottom: 50px !important;">
    <div class="container w-full p-0">
      <img src="/assets/header.svg" style="margin-top: -20px; width: 100%" alt="">
      <div class="container w-full">
        <img src="/assets/section-2.svg" style="width: 100%; margin-top: 25px" alt="">
      </div>
      <div class="container w-full">
        <h2 class="glance-in-day">Your Day at a Glance</h2>
      </div>
      <div class="container w-full">
        <div class="row toggler">
          <div class="col-4" (click)="currentActive = 'all'" [ngClass]="currentActive === 'all' ? 'active' : 'null'">All</div>
          <div class="col-4" (click)="currentActive = 'habits'" [ngClass]="currentActive === 'habits' ? 'active' : 'null'">Habits</div>
          <div class="col-4" (click)="currentActive = 'tasks'" [ngClass]="currentActive === 'tasks' ? 'active' : 'null'">Tasks</div>
        </div>
      </div>
      <div class="container w-full" style="margin-top: 20px">
        <habit-card></habit-card>
        <habit-card></habit-card>
        <habit-card [endTime]="1744709636596" inProgress></habit-card>
        <habit-card [endTime]="1744709636596"></habit-card>
      </div>
      <div class="container w-full" style="margin-top: 20px">
        <challenge-card></challenge-card>
      </div>
    </div>
  </div>
  <div class="container" style="width: 100vw; height: 100vh; position: fixed; left: 0; top: 0; z-index: 9999; background: red">

  </div>
</ion-content>
