<!-- Backdrop overlay -->
<div 
  class="mindful-popup-backdrop" 
  *ngIf="isVisible && finalConfig.backdrop"
  (click)="onBackdropClick($event)">
  
  <!-- Main popup container -->
  <div class="mindful-popup-container" *ngIf="isVisible">
    
    <!-- Close button -->
    <button 
      class="mindful-popup-close" 
      *ngIf="finalConfig.showCloseButton"
      (click)="onCloseClick()"
      aria-label="Close popup">
      <ion-icon name="close"></ion-icon>
    </button>

    <!-- Content section -->
    <div class="mindful-popup-content" *ngIf="hasAnyContent">
      
      <!-- Image -->
      <img 
        *ngIf="hasImage"
        [src]="finalConfig.image" 
        [alt]="finalConfig.imageAlt"
        class="mindful-popup-image">
      
      <!-- Heading -->
      <h2 
        *ngIf="hasHeading"
        class="mindful-popup-heading">
        {{ finalConfig.heading }}
      </h2>
      
      <!-- Subtitle -->
      <p 
        *ngIf="hasSubtitle"
        class="mindful-popup-subtitle">
        {{ finalConfig.subtitle }}
      </p>
    </div>

    <!-- Action buttons section -->
    <div class="mindful-popup-actions" *ngIf="hasPrimaryCTA || hasSecondaryCTA || finalConfig.showShareButton">
      
      <!-- Single CTA - Full width -->
      <div class="mindful-popup-single-cta" *ngIf="hasOneCTA">
        <button 
          *ngIf="hasPrimaryCTA"
          class="mindful-button mindful-button-full"
          [disabled]="finalConfig.primaryCTA?.disabled"
          (click)="onPrimaryClick()">
          {{ finalConfig.primaryCTA?.text }}
        </button>
        
        <button 
          *ngIf="hasSecondaryCTA && !hasPrimaryCTA"
          class="mindful-button mindful-button-full mindful-button-secondary"
          [disabled]="finalConfig.secondaryCTA?.disabled"
          (click)="onSecondaryClick()">
          {{ finalConfig.secondaryCTA?.text }}
        </button>
      </div>

      <!-- Two CTAs - Side by side -->
      <div class="mindful-popup-dual-cta" *ngIf="hasTwoCTAs">
        <button 
          class="mindful-button mindful-button-secondary"
          [disabled]="finalConfig.secondaryCTA?.disabled"
          (click)="onSecondaryClick()">
          {{ finalConfig.secondaryCTA?.text }}
        </button>
        
        <button 
          class="mindful-button mindful-button-primary"
          [disabled]="finalConfig.primaryCTA?.disabled"
          (click)="onPrimaryClick()">
          {{ finalConfig.primaryCTA?.text }}
        </button>
      </div>

      <!-- Share button -->
      <button 
        *ngIf="finalConfig.showShareButton"
        class="mindful-popup-share"
        (click)="onShareClick()"
        aria-label="Share">
        <ion-icon name="share-outline"></ion-icon>
      </button>
    </div>

  </div>
</div>
