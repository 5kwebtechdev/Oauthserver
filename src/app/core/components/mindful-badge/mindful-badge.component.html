<div *ngIf="type" class="badge {{type}}" [ngClass]="{'medium': medium , 'large': large, 'disabled': disabled, 'inactive': inactive, 'circle': circle}">
  <p>{{text}}</p>
</div>
<ng-container *ngIf="!type">
  <p style="color: red; font-weight: bold; font-size:16px">
    Badge Style Not defined
  </p>
</ng-container>
