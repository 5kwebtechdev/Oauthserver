<ion-content>
  <superme-navigator heading="My Profile" backIcon="arrowSvg" (back)="onBack()"></superme-navigator>
  <div class="profile">

    <section class="user-profile-main">
      <div class="user-profile">
        <div class="avatar w-100 d-flex justify-content-center gap-2 flex-column align-items-center">
          <div class="avatar-wrapper">
            <app-img
              [src]="userAvatarUrl || user?.avatarUrl || 'assets/figma/avatars/18-plus-male-1.webp'"
              [alt]="avatarImageName ? avatarImageName : (user?.avatarName || user?.name || 'User') + ' avatar'"
              [circle]="true"
              objectFit="cover">
            </app-img>
          </div>
          <div class="user-info w-100 d-flex justify-content-center gap-2 flex-column align-items-center">
            <div class="user-name">{{ user?.avatarName || user?.name || 'You' }}</div>
            <div class="user-age" *ngIf="user?.age">{{ user.age }} yrs</div>
          </div>
        </div>
        <div class="user-stats">
          <superme-coins-stats [userCoins]="userCoins" [userStreaks]="userStreaks" [userDays]="userDays"
            [userBadges]="userBadges" coinsIcon="assets/icons/child-home-coin-figma.webp"
            streakIcon="assets/icons/child-home-streak-figma.webp"
            badgesIcon="assets/icons/child-home-badge-figma.webp">
          </superme-coins-stats>
        </div>
      </div>

    </section>

    <section class="profile-content">

      <!-- Group 1: Account -->
      <div class="menu-group">
        <p class="menu-group__label">Account</p>
        <div class="menu-group__card">
          <profile-content-card iconName="profile" title="Edit Profile Info" subtitle="Avatar name, age, email, number ...."
            (select)="onEdit()"></profile-content-card>
          <div class="menu-divider"></div>
          <profile-content-card iconName="key" title="Password & Security" subtitle="Change your password"
            (select)="onPassword()"></profile-content-card>
          <ng-container *ngIf="user?.relationship !== 'PARENT'">
            <div class="menu-divider"></div>
            <profile-content-card iconName="owl" title="Change your pet" subtitle="Switch your buddy anytime!"
              (select)="onChangePet()"></profile-content-card>
          </ng-container>
        </div>
      </div>

      <!-- Group 2: Preferences -->
      <div class="menu-group">
        <p class="menu-group__label">Preferences</p>
        <div class="menu-group__card">
          <!-- Hidden per Apple App Review (Guideline 3.1.1) until membership
               is either removed or properly implemented via In-App Purchase.
          <profile-content-card iconName="creditCard" title="Manage Membership"
            subtitle="Perks, upgrade, or cancel anytime" (select)="onManageMembership()"></profile-content-card>
          <div class="menu-divider"></div>
          -->
          <profile-content-card iconName="notification" title="Notifications" subtitle="Manage your notifications"
            (select)="onNotifications()"></profile-content-card>
        </div>
      </div>

      <!-- Group 3: Family & Social -->
      <div class="menu-group">
        <p class="menu-group__label">Family & Social</p>
        <div class="menu-group__card">
          <profile-content-card iconName="gift" title="Refer a Friend" subtitle="Refer friends for exciting rewards"
            (select)="onRefer()"></profile-content-card>
          <div class="menu-divider"></div>
          <profile-content-card iconName="link" title="My Family" subtitle="View your family details"
            (select)="onMyFamily()"></profile-content-card>
          <div class="menu-divider"></div>
          <profile-content-card iconName="lock" title="Parental Control" subtitle="View app restrictions & permissions"
            (select)="onParentalControl()"></profile-content-card>
        </div>
      </div>

      <!-- Group 4: Support -->
      <div class="menu-group">
        <p class="menu-group__label">Support</p>
        <div class="menu-group__card">
          <profile-content-card iconName="feedback" title="Feedback & Suggestions"
            subtitle="Share your thoughts with us!" (select)="onFeedback()"></profile-content-card>
          <div class="menu-divider"></div>
          <profile-content-card iconName="support" title="Help & Support" subtitle="FAQ's and chat support"
            (select)="onHelpSupport()"></profile-content-card>
          <div class="menu-divider"></div>
          <profile-content-card iconName="policies" title="Our Policies" subtitle="How we follow the guidelines"
            (select)="onOurPolicies()"></profile-content-card>
        </div>
      </div>

      <!-- Group 5: Danger zone -->
      <div class="menu-group">
        <div class="menu-group__card">
          <profile-content-card iconName="danger" title="Delete My Data"
            subtitle="Erase all your info safely and permanently" (select)="onDeleteMyData()"></profile-content-card>
        </div>
      </div>

      <!-- Logout -->
      <div class="logout-section" (click)="openLogoutPopup()">
        <div class="logout-section__icon">
          <ion-icon name="log-out-outline"></ion-icon>
        </div>
        <div class="log-out-outline-text">
          <span>Logout</span>
          <p>See you next time!</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="logout-section__chev"></ion-icon>
      </div>

    </section>

    <!--social media-->
    <social-media></social-media>

    <!--superme-popup-->
    <app-superme-popup [isVisible]="showLogoutPopup" [config]="{
      image: 'assets/Images-Transparent/Image-Log Out.webp',
      imageAlt: 'Logout image',
      heading: 'Leaving already?',
      subtitle: 'You can come back anytime to continue your adventure.',
      primaryCTA: { text: 'Logout', buttonStyle: 'bronze', buttonMedium: true },
      secondaryCTA: { text: 'Stay Here', callback: closeLogoutPopup.bind(this), buttonStyle: 'bronze-transparent', buttonMedium: true },
      backdrop: true,
      showCloseButton: true
    }" (primaryAction)="confirmLogout()" (secondaryAction)="closeLogoutPopup()" (backdropClick)="closeLogoutPopup()"
      (closeAction)="closeLogoutPopup()"></app-superme-popup>

  </div>
</ion-content>
