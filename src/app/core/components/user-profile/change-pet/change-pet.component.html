<ion-content fullscreen>
  <superme-navigator heading="Change your pet" backIcon="arrowSvg"></superme-navigator>

  <div class="change-pet-container">
    <swiper-container slides-per-view="1.2" centered-slides="true" space-between="10" grab-cursor="true"
      (slidechange)="onSlideChange()" (swiperstateupdate)="onSlideChange()" #swiperEl [style]="{padding: '0 0 24px 0', height: '67vh'}">
      <swiper-slide *ngFor="let pet of pets; let i = index">
        <div class="pet-card d-flex flex-column">
          <h4>{{pet.displayName}}</h4>
          <p>{{pet.text[0]}}</p>
          <p>{{pet.text[1]}}</p>
          <img [src]="pet.image" alt="" />
        </div>
      </swiper-slide>
    </swiper-container>

    <div class="change-pet-actions">
      <superme-button type="green" full text="Update your pet" (click)="confirmSelection()"></superme-button>
    </div>
  </div>

</ion-content>
