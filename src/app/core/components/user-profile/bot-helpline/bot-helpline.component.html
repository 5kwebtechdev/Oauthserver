<div class="bot-page-shell">
  <superme-navigator heading="Helpline" backIcon="arrowSvg"></superme-navigator>

  <ion-content class="page-content">
    <div class="chat-messages">
      <div *ngFor="let m of messages" class="chat-row" [class.chat-row--user]="m.from === 'user'">
        <div class="chat-avatar" *ngIf="m.from === 'bot'" aria-hidden="true">S</div>
        <div class="chat-bubble" [class.chat-bubble--user]="m.from === 'user'">
          <p class="chat-text">{{ m.text }}</p>
          <button *ngIf="m.cta" class="chat-cta" (click)="goTo(m.cta.route)">{{ m.cta.label }} &rarr;</button>
        </div>
      </div>
      <div #scrollAnchor></div>
    </div>

    <div class="chat-topics" [class.chat-topics--store]="isEcommerceHelp">
      <button class="chat-topic-chip" *ngFor="let t of topics" (click)="selectTopic(t)">{{ t.label }}</button>
    </div>

    <a class="chat-email-footer" href="mailto:{{email}}">
      <img src="assets/icons/email-bot.svg" alt="" class="email-icon" />
      <span class="email-text">{{email}}</span>
    </a>
  </ion-content>

  <div class="chat-input-bar">
    <input
      type="text"
      class="chat-input"
      placeholder="Type your question..."
      [(ngModel)]="draft"
      (keyup.enter)="send()" />
    <button class="chat-send" [disabled]="!draft.trim()" (click)="send()" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12L21 3L15 21L11 13L2 12Z" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
