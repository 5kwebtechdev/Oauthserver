<ion-content fullscreen>
  <mindful-navigator heading="Password and security" backIcon="arrowSvg"></mindful-navigator>

  <div class="reset-password-root">
    <profile-edit-input
      title="Current Password"
      description="To verify you"
      type="password"
      placeholder="Enter password"
    ></profile-edit-input>

     <profile-edit-input
      title="New Password"
      description="To change your password"
      type="password"
      placeholder="Enter password"
    ></profile-edit-input>

     <profile-edit-input
      title="Retype New Password"
      
      type="password"
      placeholder="Enter password"
    ></profile-edit-input>


  </div>
<div class="button-row">
  <mindful-button type="green" text="Change password" [large]="true" (click)="saveProfile()"></mindful-button>
</div>
</ion-content>
