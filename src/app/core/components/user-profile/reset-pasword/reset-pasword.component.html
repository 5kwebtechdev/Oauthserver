<ion-content fullscreen>
  <mindful-navigator heading="Password and security" backIcon="arrowSvg"></mindful-navigator>

  <div class="reset-password-root">
    <profile-edit-input title="Current Password" description="To verify you" type="password"
      placeholder="Enter password" [value]="currentPassword" (valueChange)="onCurrentPasswordChange($event)"
      [errorMessage]="currentPasswordError" [showError]="currentPasswordError !== ''"></profile-edit-input>

    <profile-edit-input title="New Password" description="To change your password" type="password"
      placeholder="Enter password" [value]="newPassword" (valueChange)="onNewPasswordChange($event)"
      [errorMessage]="newPasswordError" [showError]="newPasswordError !== ''"></profile-edit-input>

    <profile-edit-input title="Retype New Password" description="Confirm your new password" type="password"
      placeholder="Enter password" [value]="retypeNewPassword" (valueChange)="onRetypePasswordChange($event)"
      [errorMessage]="retypePasswordError" [showError]="retypePasswordError !== ''"></profile-edit-input>


  </div>
  <div class="button-row">
    <mindful-button type="green" [text]="loading ? 'Updating...' : 'Change password'" size="full"
      [disabled]="loading || form.invalid" (click)="saveProfile()"></mindful-button>
  </div>

  <!-- Inline custom toast -->
  <div class="mb-toast" *ngIf="toastVisible" [ngClass]="{'mb-toast--error': toastType === 'error', 'mb-toast--success': toastType === 'success'}">
    <div class="mb-toast__text">{{ toastMessage }}</div>
  </div>
</ion-content>
