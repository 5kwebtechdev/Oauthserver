<div class="member-detail">
  <div class="member-info">
    <div class="avtar-img">
      <img *ngIf="avatarUrl; else placeholder" [src]="avatarUrl" alt="{{name}} avatar" />
      <ng-template #placeholder>
        <div class="avatar-placeholder"></div>
      </ng-template>
    </div>
    <div class="name-age">
      <h1>{{ name }}</h1>
      <p>{{ age }} years old</p>
    </div>
  </div>

  <mindful-badge
    text="Active"
    type="green"
    [inactive]="!active"
    [active]="active"
    (click)="toggleActive()"
  ></mindful-badge>
</div>
