
  <div class="facts" [class.facts--warm]="variant === 'warm'" [class.facts--family]="variant === 'family'">
    <h3 class="facts-heading" *ngIf="heading">{{ heading }}</h3>

    <div class="fact-item-list">
      <details class="fact-item" *ngFor="let f of faqs; let i = index">
        <summary class="fact-main">
          <div class="fact-text">
            <div class="fact-question">{{ f.question }}</div>
            <div class="fact-desc" *ngIf="f.description && f.description.length">{{ f.description }}</div>
          </div>
          <div class="fact-icon" aria-hidden="true">
            <img *ngIf="variant === 'family'" class="family-chevron" src="assets/figma/my-family/faq-chevron.svg" alt="" width="16" height="16">
            <svg *ngIf="variant !== 'family'" class="chev" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </summary>

        <div class="fact-answer"><p>{{ f.answer || '' }}</p></div>
      </details>
    </div>
  </div>
