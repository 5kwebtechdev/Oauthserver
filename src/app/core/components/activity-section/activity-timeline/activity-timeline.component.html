<ion-content style="height: 100vh; overflow-y: scroll">
  <mindful-navigator *ngIf="!isParentUser()" heading="Timeline" [rightIcon]="'/assets/Icons-Neutral/Icon-Calendar.png'"
    [rightIcon2]="'/assets/Icons-Neutral/Icon-Notes.png'" (rightIconClick)="onCalendarClick()"
    (rightIcon2Click)="onNotesClick()"></mindful-navigator>
  <mindful-navigator *ngIf="isParentUser()" heading="Timeline" [rightIcon]="'/assets/Icons-Neutral/Icon-Calendar.png'"
    (rightIconClick)="onCalendarClick()"></mindful-navigator>

  <div class="timeline-page-container">
    <mindful-week (dateSelected)="onDateSelected($event)"></mindful-week>
    <div class="card timeline-score-card container w-full">
      <div class="row justify-content-between">
        <div class="col-3 p-0">
          <mindful-completion [completionPercentage]="totalHabits > 0 ? (totalHabitsCompleted / totalHabits * 100) : 0"
            [borderColor]="'#4CAF50'" [innerText]="totalHabitsCompleted + '/' + totalHabits"
            [belowText]="'Total habits completed'">
          </mindful-completion>
        </div>
        <div class="col-3 p-0">
          <mindful-completion [completionPercentage]="totalTasks > 0 ? (totalTasksCompleted / totalTasks * 100) : 0"
            [borderColor]="'#F0AD4E'" [innerText]="totalTasksCompleted + '/' + totalTasks"
            [belowText]="'Total tasks completed'">
          </mindful-completion>
        </div>
        <div class="col-3 p-0">
          <mindful-completion [completionPercentage]="habitCompletionRate" [borderColor]="'#BB2124'"
            [innerText]="habitCompletionRate + '%'" [belowText]="'Habit completion rate'">
          </mindful-completion>
        </div>
        <div class="col-3 p-0">
          <mindful-completion [completionPercentage]="taskCompletionRate" [borderColor]="'#F0AD4E'"
            [innerText]="taskCompletionRate + '%'" [belowText]="'Task completion rate'">
          </mindful-completion>
        </div>
      </div>
    </div>
    <div class="selectors-container">
      <mindful-selectors [options]="[
    {key: 'all', value: 'All', type: 'magenta'},
    {key: 'habit', value: 'Habits', type: 'lavendar'},
    {key: 'task', value: 'Tasks', type: 'orange'},
    {key: 'timetable', value: 'Time Table', type: 'aqua'},
    ]" componentType="button" size="small" [singleSelection]="true" [buttonVariant]="'flat'"
        [initialSelectedKeys]="initialSelectedKeys" (selectedKeysChange)="keysUpdated($event)">
      </mindful-selectors>
    </div>
    <div class="timeline-wrapper">
      <mindful-timeline [events]="filteredEvents" (eventLongPressed)="onTimetableLongPress($event)"></mindful-timeline>
    </div>

    <!-- Fixed Add Button -->
    <div class="add-button-fixed" (click)="onAddClick()">
      <mindful-button type="add"></mindful-button>
    </div>
  </div>
</ion-content>

<!-- Success Toast with Icon -->
<div class="mb-toast" *ngIf="(toast$ | async) as toast" [ngClass]="{'mb-toast--success': toast.type === 'success', 'mb-toast--error': toast.type === 'error'}" [style.display]="toast.visible ? 'flex' : 'none'" role="status" aria-live="polite">
  <div class="mb-toast__icon-wrapper" *ngIf="toast.iconPath">
    <svg class="mb-toast__icon" [style.fill]="toast.iconColor || '#2D6830'" viewBox="0 0 8 6" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.81319 5.70608C2.61793 5.90134 2.30134 5.90134 2.10608 5.70608L0.146523 3.74652C-0.0487396 3.55126 -0.0487401 3.23468 0.146522 3.03942L0.372748 2.81319C0.568011 2.61793 0.884593 2.61793 1.07986 2.81319L2.10608 3.83942C2.30134 4.03468 2.61793 4.03468 2.81319 3.83942L6.50608 0.146523C6.70134 -0.0487396 7.01793 -0.04874 7.21319 0.146522L7.43942 0.372748C7.63468 0.568011 7.63468 0.884593 7.43942 1.07986L2.81319 5.70608Z" fill="currentColor" />
    </svg>
  </div>
  <div class="mb-toast__text">{{ toast.message }}</div>
</div>
