<ion-content style="height: 100vh; overflow-y: scroll">
  <superme-navigator *ngIf="!isParentUser()" heading="Timeline" [rightIcon]="'assets/Icons-Neutral/Icon-Calendar-3D.webp'"
    [rightIcon2]="'assets/Icons-Neutral/Icon-Notes-3D.webp'" (rightIconClick)="onCalendarClick()"
    (rightIcon2Click)="onNotesClick()"></superme-navigator>
  <superme-navigator *ngIf="isParentUser()" heading="Timeline" [rightIcon]="'assets/Icons-Neutral/Icon-Calendar-3D.webp'"
    (rightIconClick)="onCalendarClick()"></superme-navigator>

  <div class="timeline-page-container">
    <superme-week (dateSelected)="onDateSelected($event)"></superme-week>
    <div class="card timeline-score-card container w-full">
      <div class="row justify-content-between">
        <div class="col-3 p-0">
          <superme-completion
            [completionPercentage]="totalHabits > 0 ? (totalHabitsCompleted / totalHabits * 100) : 0"
            [borderColor]="habitsColor"
            [innerText]="totalHabitsCompleted + '/' + totalHabits"
            [belowText]="'Total habits'">
          </superme-completion>
        </div>
        <div class="col-3 p-0">
          <superme-completion
            [completionPercentage]="totalTasks > 0 ? (totalTasksCompleted / totalTasks * 100) : 0"
            [borderColor]="tasksColor"
            [innerText]="totalTasksCompleted + '/' + totalTasks"
            [belowText]="'Total tasks'">
          </superme-completion>
        </div>
        <div class="col-3 p-0">
          <superme-completion
            [completionPercentage]="habitCompletionRate"
            [borderColor]="habitRateColor"
            [innerText]="habitCompletionRate + '%'"
            [belowText]="'Habit rate'">
          </superme-completion>
        </div>
        <div class="col-3 p-0">
          <superme-completion
            [completionPercentage]="taskCompletionRate"
            [borderColor]="taskRateColor"
            [innerText]="taskCompletionRate + '%'"
            [belowText]="'Task rate'">
          </superme-completion>
        </div>
      </div>
    </div>
    <div class="selectors-container">
      <superme-selectors [options]="[
    {key: 'all', value: 'All', type: 'magenta'},
    {key: 'habit', value: 'Habits', type: 'lavendar'},
    {key: 'task', value: 'Tasks', type: 'orange'},
    {key: 'timetable', value: 'Time Table', type: 'aqua'},
    ]" componentType="button" size="small" [singleSelection]="true" [buttonVariant]="'flat'"
        [initialSelectedKeys]="initialSelectedKeys" (selectedKeysChange)="keysUpdated($event)">
      </superme-selectors>
    </div>
    <div class="timeline-wrapper">
      <superme-timeline [events]="filteredEvents" [isCurrentDateView]="isCurrentDateView" [selectedDate]="selectedDate" (eventLongPressed)="onTimetableLongPress($event)"></superme-timeline>
    </div>
    <!-- Fixed Add Button -->
    <div class="add-button-fixed" *ngIf="!isParentUser()" (click)="onAddClick()">
      <superme-button type="add"></superme-button>
    </div>

  </div>
  <app-footer></app-footer>
</ion-content>
