<!-- List Mode -->
<!-- Shared header used by both list and recent modes -->
<ng-template #dayHeader>
  <div class="glance-heading-block">
    <superme-card-header title="Today at a Glance" [subtitleMiddle]="glanceSubtitle">
      <div class="glance-header-actions" superme-header-actions>
        <button type="button" class="glance-done-pill" (click)="openTimeline()"
          aria-label="Open today's progress timeline">
          {{ overallCompletionRate }}% done
        </button>
      </div>
    </superme-card-header>
    <div class="glance-progress-track" *ngIf="totalHabitsLoaded > 0 || totalTasksLoaded > 0">
      <div class="glance-progress-fill" [style.width.%]="overallCompletionRate"></div>
    </div>
  </div>
</ng-template>
<div *ngIf="mode === 'list'" class="d-flex flex-column gap-2 glance-card">
  <div class="day-at-glance-container">
    <ng-container *ngTemplateOutlet="dayHeader"></ng-container>

    <!-- Tab Navigation: show if there are items in any tab (even if current tab is done, user can see other tabs) -->
    <div class="container w-full" *ngIf="(totalTasksLoaded > 0 || totalHabitsLoaded > 0 || totalTimetablesLoaded > 0) && !((taskCompletionRate === 100 && habitCompletionRate === 100) || (totalTasksLoaded === 0 && habitCompletionRate === 100) || (totalHabitsLoaded === 0 && taskCompletionRate === 100))">
      <div class="glance-tabs" role="tablist" aria-label="Filter by type">
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'all'"
          [attr.aria-selected]="currentActive === 'all'" (click)="switchTab('all')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-all.png" alt="" aria-hidden="true">
          <span>All</span>
        </button>
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'habits'"
          [attr.aria-selected]="currentActive === 'habits'" (click)="switchTab('habits')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-habit.png" alt="" aria-hidden="true">
          <span>Habit</span>
        </button>
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'tasks'"
          [attr.aria-selected]="currentActive === 'tasks'" (click)="switchTab('tasks')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-task.png" alt="" aria-hidden="true">
          <span>Task</span>
        </button>
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'timetable'"
          [attr.aria-selected]="currentActive === 'timetable'" (click)="switchTab('timetable')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-timetable.png" alt="" aria-hidden="true">
          <span>Time Table</span>
        </button>
      </div>
    </div>

    <!-- Empty State (uses shared EmptyStateComponent) -->
    <!-- Task-specific: all tasks completed (taskCompletionRate === 100 AND totalHabits > 0) -->
    <empty-state *ngIf="currentActive === 'tasks' && taskCompletionRate === 100 && totalHabitsLoaded > 0"
      leadText="All tasks done!"
      subText="Your tasks can be reviewed in the main habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>

    <!-- Task-specific: no tasks at all (totalTasks === 0 AND habitCompletionRate < 100) -->
    <empty-state *ngIf="currentActive === 'tasks' && totalTasksLoaded === 0 && habitCompletionRate < 100"
      leadText="No tasks lined up for today"
      subText="No tasks are scheduled for today. Add one to start building your streak and earn coins."
      buttonText="">
    </empty-state>

    <!-- Task-specific: tasks existed but all cards hidden (end time passed, not all completed) -->
    <empty-state *ngIf="currentActive === 'tasks' && !hasTasks && totalTasksLoaded > 0 && taskCompletionRate < 100"
      leadText="Check pending items"
      subText="Some activities missed their schedule. You can find them in the Pending where you can mark them done."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: all habits completed (habitCompletionRate === 100 AND totalTasks > 0) -->
    <empty-state *ngIf="currentActive === 'habits' && habitCompletionRate === 100 && totalTasksLoaded > 0"
      leadText="All habits done!"
      subText="Your habits can be reviewed in the main habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: no habits at all (totalHabits === 0 AND taskCompletionRate < 100) -->
    <empty-state *ngIf="currentActive === 'habits' && totalHabitsLoaded === 0 && taskCompletionRate < 100"
      leadText="No habit lined up for today"
      subText="No habits are scheduled for today. Add one to start building your streak and earn coins."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: habits existed but all cards hidden (end time passed, not all completed) -->
    <empty-state *ngIf="currentActive === 'habits' && !hasHabits && totalHabitsLoaded > 0 && habitCompletionRate < 100"
      leadText="Check pending items"
      subText="Some activities missed their schedule. You can find them in the Pending where you can mark them done."
      buttonText="">
    </empty-state>

    <!-- Timetable-specific: no time table entries for today -->
    <empty-state *ngIf="currentActive === 'timetable' && !hasTimetables"
      leadText="No time table entries for today"
      subText="Nothing scheduled yet. Add a time block to plan out your day."
      buttonText="">
    </empty-state>

    <!-- Pending state for All tab: items existed but all cards hidden (end time passed, not all completed) -->
    <empty-state *ngIf="currentActive === 'all' && isEmpty && (totalHabitsLoaded > 0 || totalTasksLoaded > 0) && !(taskCompletionRate === 100 && habitCompletionRate === 100) && !(totalTasksLoaded === 0 && habitCompletionRate === 100) && !(totalHabitsLoaded === 0 && taskCompletionRate === 100) && !(totalHabitsLoaded === 0 && totalTasksLoaded === 0)"
      leadText="Check pending items"
      subText="Some activities missed their schedule. You can find them in the Pending where you can mark them done."
      buttonText="">
    </empty-state>

    <!-- Generic blank empty state when nothing exists at all (totalTasks === 0 AND totalHabits === 0) -->
    <empty-state *ngIf="isEmpty && totalHabitsLoaded === 0 && totalTasksLoaded === 0"
      imageSrc="/assets/Images-Transparent/Image-Home-Blank.png"
      imageAlt="Empty day illustration"
      leadText="Your day's a blank slate!"
      subText="Add habits and tasks to earn coins and level up your day. Don't miss out!"
      buttonText="">
    </empty-state>

    <!-- Completed State: show when both completion rates are 100% (taskCompletionRate === 100 AND habitCompletionRate === 100) -->
    <empty-state *ngIf="taskCompletionRate === 100 && habitCompletionRate === 100 && totalHabitsLoaded > 0 && totalTasksLoaded > 0"
      imageSrc="/assets/Images-Transparent/Image-Home-Completed.png"
      imageAlt="Completed illustration"
      leadText="Great progress today!"
      subText="Your tasks and habits can be reviewed in the main tasks and habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>

    <!-- Completed State: only tasks with 100% completion (totalTasks === 0 AND habitCompletionRate === 100) -->
    <empty-state *ngIf="totalTasksLoaded === 0 && habitCompletionRate === 100 && totalHabitsLoaded > 0"
      imageSrc="/assets/Images-Transparent/Image-Home-Completed.png"
      imageAlt="Completed illustration"
      leadText="Great progress today!"
      subText="Your tasks and habits can be reviewed in the main tasks and habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>

    <!-- Completed State: only habits with 100% completion (totalHabits === 0 AND taskCompletionRate === 100) -->
    <empty-state *ngIf="totalHabitsLoaded === 0 && taskCompletionRate === 100 && totalTasksLoaded > 0"
      imageSrc="/assets/Images-Transparent/Image-Home-Completed.png"
      imageAlt="Completed illustration"
      leadText="Great progress today!"
      subText="Your tasks and habits can be reviewed in the main tasks and habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>
  </div>

  <!-- Habit Items (when habits tab is active) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'habits' && hasHabits">
    <activity-card *ngFor="let habitItem of habits.slice(0, maxItemsToShow)" [habit]="habitItem"
      [startTime]="habitItem.startTimeStamp" [endTime]="habitItem.endTimeStamp"
      [inProgress]="isHabitInProgress(habitItem)" mode="single">
    </activity-card>
  </div>

  <!-- Task Items (when tasks tab is active) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'tasks' && hasTasks">
    <activity-card *ngFor="let taskItem of tasks.slice(0, maxItemsToShow)" [habit]="taskItem"
      [startTime]="taskItem.startTimeStamp || 0" [endTime]="taskItem.endTimeStamp || 0" [inProgress]="false"
      mode="single">
    </activity-card>
  </div>

  <!-- Timetable Items (when timetable tab is active) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'timetable' && hasTimetables">
    <activity-card *ngFor="let ttItem of timetables.slice(0, maxItemsToShow)" [habit]="ttItem"
      [startTime]="ttItem.startTimeStamp || 0" [endTime]="ttItem.endTimeStamp || 0" [inProgress]="false"
      mode="single">
    </activity-card>
  </div>

  <!-- Combined Items (when all tab is active - sorted by closest start time) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'all' && (hasHabits || hasTasks || hasTimetables)">
    <activity-card *ngFor="let item of combinedAndSortedItems.slice(0, maxItemsToShow)" [habit]="item"
      [startTime]="item.startTimeStamp || 0" [endTime]="item.endTimeStamp || 0"
      [inProgress]="item.type === 'tasks' ? false : isHabitInProgress(item)" mode="single">
    </activity-card>
  </div>

  <!-- CTA Buttons -->
  <div class="add-button-container empty-add-btn" [class.mt-4]="!isEmpty" *ngIf="isEmpty">
    <superme-button type="magenta" large style="display:block; width:100%" text="Add New"
      (click)="openHabitInput()"></superme-button>
  </div>
  <div class="add-button-container" [class.mt-4]="!isEmpty" *ngIf="!isEmpty">
    <button class="text-view-all" [routerLink]="['/authed/activity-page']" [queryParams]="{ tab: currentActive }">
      View all
    </button>
    <button class="add-new-pill" (click)="openHabitInput()">
      Add New
    </button>
  </div>
</div>

<!-- Recent Mode -->
<div *ngIf="mode === 'recent'" class="d-flex flex-column gap-2 glance-card">
  <div class="day-at-glance-container">
    <ng-container *ngTemplateOutlet="dayHeader"></ng-container>

    <!-- Tab Navigation: show if there are items in any tab (even if current tab is done, user can see other tabs) -->
    <div class="container w-full" *ngIf="(totalTasksLoaded > 0 || totalHabitsLoaded > 0 || totalTimetablesLoaded > 0) && !((taskCompletionRate === 100 && habitCompletionRate === 100) || (totalTasksLoaded === 0 && habitCompletionRate === 100) || (totalHabitsLoaded === 0 && taskCompletionRate === 100))">
      <div class="glance-tabs" role="tablist" aria-label="Filter by type">
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'all'"
          [attr.aria-selected]="currentActive === 'all'" (click)="switchTab('all')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-all.png" alt="" aria-hidden="true">
          <span>All</span>
        </button>
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'habits'"
          [attr.aria-selected]="currentActive === 'habits'" (click)="switchTab('habits')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-habit.png" alt="" aria-hidden="true">
          <span>Habit</span>
        </button>
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'tasks'"
          [attr.aria-selected]="currentActive === 'tasks'" (click)="switchTab('tasks')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-task.png" alt="" aria-hidden="true">
          <span>Task</span>
        </button>
        <button type="button" class="glance-tab" role="tab" [class.active]="currentActive === 'timetable'"
          [attr.aria-selected]="currentActive === 'timetable'" (click)="switchTab('timetable')">
          <img class="glance-tab-icon" src="assets/figma/child-home/glance-timetable.png" alt="" aria-hidden="true">
          <span>Time Table</span>
        </button>
      </div>
    </div>

    <!-- Empty State (uses shared EmptyStateComponent) -->
    <!-- Task-specific: all tasks completed/skipped (taskCompletionRate === 100 AND totalHabits > 0) -->
    <empty-state *ngIf="currentActive === 'tasks' && taskCompletionRate === 100 && totalHabitsLoaded > 0"
      leadText="All tasks done!"
      subText="Your tasks can be reviewed in the main habits screen."
      buttonText="">
    </empty-state>

    <!-- Task-specific: no tasks at all (totalTasks === 0 AND habitCompletionRate < 100) -->
    <empty-state *ngIf="currentActive === 'tasks' && totalTasksLoaded === 0 && habitCompletionRate < 100"
      leadText="No tasks lined up for today"
      subText="No tasks are scheduled for today. Add one to start building your streak and earn coins."
      buttonText="">
    </empty-state>

    <!-- Task-specific: tasks existed but all cards hidden (end time passed, not all completed) -->
    <empty-state *ngIf="currentActive === 'tasks' && !hasTasks && totalTasksLoaded > 0 && taskCompletionRate < 100"
      leadText="Check pending items"
      subText="Some activities missed their schedule. You can find them in the Pending where you can mark them done."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: all habits completed/skipped (habitCompletionRate === 100 AND totalTasks > 0) -->
    <empty-state *ngIf="currentActive === 'habits' && habitCompletionRate === 100 && totalTasksLoaded > 0"
      leadText="All habits done!"
      subText="Your habits can be reviewed in the main habits screen."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: no habits at all (totalHabits === 0 AND taskCompletionRate < 100) -->
    <empty-state *ngIf="currentActive === 'habits' && totalHabitsLoaded === 0 && taskCompletionRate < 100"
      leadText="No habit lined up for today"
      subText="No habits are scheduled for today. Add one to start building your streak and earn coins."
      buttonText="">
    </empty-state>
    <!-- Habit-specific: habits existed but all cards hidden (end time passed, not all completed) -->
    <empty-state *ngIf="currentActive === 'habits' && !hasHabits && totalHabitsLoaded > 0 && habitCompletionRate < 100"
      leadText="Check pending items"
      subText="Some activities missed their schedule. You can find them in the Pending where you can mark them done."
      buttonText="">
    </empty-state>

    <!-- Timetable-specific: no time table entries for today -->
    <empty-state *ngIf="currentActive === 'timetable' && !hasTimetables"
      leadText="No time table entries for today"
      subText="Nothing scheduled yet. Add a time block to plan out your day."
      buttonText="">
    </empty-state>

    <!-- Pending state for All tab: items existed but all cards hidden (end time passed, not all completed) -->
    <empty-state *ngIf="currentActive === 'all' && isEmpty && (totalHabitsLoaded > 0 || totalTasksLoaded > 0) && !(taskCompletionRate === 100 && habitCompletionRate === 100) && !(totalTasksLoaded === 0 && habitCompletionRate === 100) && !(totalHabitsLoaded === 0 && taskCompletionRate === 100) && !(totalHabitsLoaded === 0 && totalTasksLoaded === 0)"
      leadText="Check pending items"
      subText="Some activities missed their schedule. You can find them in the Pending where you can mark them done."
      buttonText="">
    </empty-state>
    <!-- Generic blank empty state when nothing exists at all (totalTasks === 0 AND totalHabits === 0) -->
    <empty-state *ngIf="isEmpty && totalHabitsLoaded === 0 && totalTasksLoaded === 0"
      imageSrc="/assets/Images-Transparent/Image-Home-Blank.png"
      imageAlt="Empty day illustration"
      leadText="Your day’s a blank slate!"
      subText="Add habits and tasks to earn coins and level up your day. Don’t miss out!"
      buttonText="">
    </empty-state>

    <!-- Completed State: show when both completion rates are 100% OR when only one category exists with 100% -->
    <empty-state *ngIf="(taskCompletionRate === 100 && habitCompletionRate === 100 && totalHabitsLoaded > 0 && totalTasksLoaded > 0) || (totalTasksLoaded === 0 && habitCompletionRate === 100 && totalHabitsLoaded > 0) || (totalHabitsLoaded === 0 && taskCompletionRate === 100 && totalTasksLoaded > 0)"
      imageSrc="/assets/Images-Transparent/Image-Home-Completed.png"
      imageAlt="Completed illustration"
      leadText="Great progress today!"
      subText="Your tasks and habits can be reviewed in the main tasks and habits screen."
      buttonText="">
    </empty-state>
  </div>

  <!-- Recent Habit Items (when habits tab is active) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'habits' && hasHabits">
    <activity-card *ngFor="let habitItem of filteredRecentHabits" [habit]="habitItem"
      [startTime]="habitItem.startTimeStamp" [endTime]="habitItem.endTimeStamp"
      [inProgress]="isHabitInProgress(habitItem)" mode="single">
    </activity-card>
  </div>

  <!-- Recent Task Items (when tasks tab is active) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'tasks' && hasTasks">
    <activity-card *ngFor="let taskItem of filteredRecentTasks" [habit]="taskItem"
      [startTime]="taskItem.startTimeStamp || 0" [endTime]="taskItem.endTimeStamp || 0" [inProgress]="false"
      mode="single">
    </activity-card>
  </div>

  <!-- Recent Timetable Items (when timetable tab is active) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'timetable' && hasTimetables">
    <activity-card *ngFor="let ttItem of filteredRecentTimetables" [habit]="ttItem"
      [startTime]="ttItem.startTimeStamp || 0" [endTime]="ttItem.endTimeStamp || 0" [inProgress]="false"
      mode="single">
    </activity-card>
  </div>

  <!-- Recent Combined Items (when all tab is active - sorted by closest start time) -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="currentActive === 'all' && (hasHabits || hasTasks || hasTimetables)">
    <activity-card *ngFor="let item of combinedAndSortedItems.slice(0, maxItemsToShow)" [habit]="item"
      [startTime]="item.startTimeStamp || 0" [endTime]="item.endTimeStamp || 0"
      [inProgress]="item.type === 'tasks' ? false : isHabitInProgress(item)" mode="single">
    </activity-card>
  </div>

  <!-- CTA Buttons -->
  <div class="add-button-container d-flex gap-2" [class.mt-4]="!isEmpty" *ngIf="isEmpty">
    <superme-button type="magenta-transparent" medium style="display:block; width:100%" text="View all"
      (click)="openHabitPage()"></superme-button>
    <superme-button type="magenta" medium style="display:block; width:100%" text="Add New"
      (click)="openHabitInput()"></superme-button>
  </div>
  <div class="add-button-container" [class.mt-4]="!isEmpty" *ngIf="!isEmpty">
    <button class="text-view-all" [routerLink]="['/authed/activity-page']" [queryParams]="{ tab: currentActive }">
      View all
    </button>
    <button class="add-new-pill" (click)="openHabitInput()">
      Add New
    </button>
  </div>
</div>

<!-- activity-task-card -->
<div *ngIf="mode === 'single'" class="container w-full h-full p-0">
  <!-- Swipe backdrop: tapping it closes the reveal -->
  <div *ngIf="isSwipedOpen" class="swipe-backdrop" (click)="closeSwipe()"></div>
  <div class="swipe-container"
    (touchstart)="onSwipeStart($event)"
    (touchmove)="onSwipeMove($event)"
    (touchend)="onSwipeEnd()">
    <!-- Delete action revealed on swipe-left -->
    <div class="swipe-delete-action" [style.width.px]="DELETE_REVEAL_WIDTH">
      <button class="swipe-delete-btn" (click)="openDeletePopup()">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
        <span>Delete</span>
      </button>
    </div>
  <div class="habit-wrapper"
    [style.transform]="'translateX(-' + swipeOffset + 'px)'"
    [style.transition]="swipeTracking ? 'none' : 'transform 0.25s ease'"
    [ngClass]="{'expanded': expanded, 'isRunningLate': isRunningLate,'missedTime': missedTime, 'task': habit?.type === 'tasks'}">
    <div class="habit-header-container clickable" (tap)="toggle()" long-press [delay]="1500" (press)="onLongPress()">
      <div class="container w-full p-0">
        <div class="d-flex justify-content-between">
          <h3 class="habit-title">{{habit?.title || 'Habit'}}</h3>
          <div class="d-flex gap-1 align-items-center">

            <img *ngIf="hasRoutine()" class="routine-icon" [src]="getRoutineIcon()" alt="" height="24" width="24">
            <div class="badge">
              {{getTagOrRoutine()}}
            </div>
            <!-- Indicator that this is expandable -->
            <!-- <div class="expand-indicator" [ngClass]="{'rotated': expanded}">
                <span>+</span>
              </div> -->
          </div>

        </div>
        <div class="habit-timing-container d-flex align-items-center">
          <h4 [ngClass]="(habit?.type === 'tasks' ? 'task-timing' : 'habit-timing') + ' ' + (habit?.status?.toLowerCase() || 'pending')"
              [style.color]="getTimeColor(habit)">
            {{ formatTimeString(habit?.startTime) || getFormattedTime(startTime) }} - {{
            formatTimeString(habit?.endTime) || getFormattedTime(endTime) }}
            <!-- Inline SVG so we can control the fill color based on type -->
            <span *ngIf="(habit?.status?.toLowerCase() === 'ongoing' || showLocalTimer) && !isParent" class="timer-icon" (click)="openTimer()" style="cursor:pointer;display:inline-flex;align-items:center;">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.879 103.461" width="20" height="20" [attr.fill]="(habit?.type === 'tasks') ? '#F6AC72' : '#8B8DCB'">
                <g>

              <div *ngIf="showStartBubble" class="bubble" [ngClass]="habit?.type === 'tasks' ? 'task-bubble' : ''" [ngStyle]="habit?.type === 'tasks' ? {'background-color':'#F6AC72', 'border-color':'#F6AC72'} : null">Start focus timer</div>
            </span>
          </h4>
        </div>
      </div>
    </div>
    <!-- Expandable content wrapper with animation (timetable entries have no streak/coin/complete actions) -->
    <div class="habit-expandable-content" [ngClass]="{'expanded': expanded}" *ngIf="habit?.type !== 'timetable'">
      <div class="habit-footer-progress-box" *ngIf="getStatus() === 'ongoing'">
        <div class="habit-footer-progress" #percentageWrapper [style.width.%]="percentageCompleted"></div>
      </div>
      <div class="habit-footer-container">
        <div class="container w-full justify-content-between d-flex p-0 align-items-center">
          <div class=" d-flex reward-section">
            <div class="single-point-container d-flex p-0 align-items-center">
              <img class="score p-r-0" src="assets/Icons-Neutral/Icon-Streak.png" alt="">
              <p class="score p-l-0">{{getStreak()}}</p>
            </div>
            <div class="single-point-container" *ngIf="getCoinReward() > 0">
              <img class="score" src="assets/Icons-Neutral/Icons-Coins.png" alt="" style="width:24px;height:auto;">
              <p class="score p-l-0">{{getCoinReward()}}</p>
            </div>
          </div>
          <div class="d-flex footer-cta" *ngIf="getStatus() !== 'completed' && !isParent">
            <!-- Let's Go Button: always rendered (visibility checks removed) -->
            <!-- Show "Let's Go" only when not ongoing; otherwise show Abort -->
            <ng-container *ngIf="getStatus() !== 'ongoing' && isCurrentDateView">
              <superme-button
                [type]="habit?.type === 'tasks' ? 'orange' : 'lavendar'" small text="Let`s Go" (click)="openStartPopup()"
                [disabled]="!isLetsGoEnabled()"></superme-button>
            </ng-container>
            <ng-container *ngIf="getStatus() === 'ongoing'">
              <superme-button *ngIf="!isParent && isCurrentDateView" [type]="habit?.type === 'tasks' ? 'orange-transparent' : 'lavendar-transparent'" small
                text="Abort" (click)="openAbortPopup()"></superme-button>
            </ng-container>
            
            <!-- Done Button: visible/disabled per new rules -->
            <!-- Also hidden when not viewing current date -->
            <superme-button *ngIf="isDoneVisible() && !isParent && isCurrentDateView" type="green" small text="Done?"
              (click)="openCompletePopup()" [disabled]="!isDoneEnabled()"></superme-button>
            
            <!-- Completion Message: Show when status is COMPLETED -->
            <!-- <div class="d-flex gap-2" *ngIf="getStatus() === 'completed'">
              <div class="bubble">You did it</div>
              <superme-pet mood="tired" [size]="44"></superme-pet>
            </div> -->

          </div>
        </div>
      </div>
    </div>
  </div>
  </div><!-- end swipe-container -->
</div>

  [showLetButton]="true" cancelButtonText="Discard" confirmButtonText="Start Now" (confirm)="onStartHabit()">
</app-superme-popup-alert> -->

<app-superme-popup [config]="startPopupConfig" [isVisible]="showStartPopup"
  (primaryAction)="handlePopupPrimary()" (secondaryAction)="handlePopupSecondary()"
  (closeAction)="closeStartPopup()" (backdropClick)="closeStartPopup()"></app-superme-popup>

<app-superme-popup [config]="completePopupConfig" [isVisible]="showCompletePopup"
  (primaryAction)="handleCompletePrimary()" (secondaryAction)="handleCompleteSecondary()"
  (closeAction)="closeCompletePopup()" (backdropClick)="closeCompletePopup()"></app-superme-popup>

<app-superme-popup [config]="abortPopupConfig" [isVisible]="showAbortPopup"
  (primaryAction)="handleAbortPrimary()" (secondaryAction)="handleAbortSecondary()"
  (closeAction)="closeAbortPopup()" (backdropClick)="closeAbortPopup()"></app-superme-popup>

<app-superme-popup [config]="coinCapPopupConfig" [isVisible]="showCoinCapPopup"
  (primaryAction)="handleCoinCapConfirmPrimary()" (secondaryAction)="handleCoinCapConfirmSecondary()"
  (closeAction)="closeCoinCapPopup()" (backdropClick)="closeCoinCapPopup()"></app-superme-popup>

<app-superme-popup [config]="deletePopupConfig" [isVisible]="showDeletePopup"
  (primaryAction)="handleDeleteCancel()" (secondaryAction)="handleDeleteConfirm()"
  (closeAction)="closeDeletePopup()" (backdropClick)="closeDeletePopup()"></app-superme-popup>
