<ion-content class="event-detail-page" fullscreen>
  <main class="event-detail-shell">
    <section class="event-detail-hero">
      <header class="event-detail-toolbar">
        <button type="button" class="event-detail-back" aria-label="Go back" (click)="back()">←</button>
        <div class="event-detail-actions" *ngIf="event">
          <button type="button" aria-label="Delete event" [disabled]="deleting" (click)="confirmDelete()">
            <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
          </button>
          <button type="button" aria-label="Edit event" (click)="edit()">
            <ion-icon name="create-outline" aria-hidden="true"></ion-icon>
          </button>
        </div>
      </header>

      <p *ngIf="loading && !event" role="status">Loading event…</p>
      <p *ngIf="error" class="event-detail-error" role="alert">{{ error }}</p>
      <ng-container *ngIf="event as item">
        <div class="event-detail-content">
          <div class="event-detail-heading">
            <img [src]="eventTypeIcon" alt="" aria-hidden="true">
            <div>
              <h1>{{ eventName }}</h1>
              <p>{{ item.eventType || 'Event' }}</p>
            </div>
          </div>
          <div class="event-detail-info">
            <div><span>Date</span><strong>{{ eventDate | date:'MMM d, y' }}</strong></div>
            <div><span>Time</span><strong>{{ timeLabel }}</strong></div>
            <div><span>Repeat</span><strong>{{ recurrenceLabel }}</strong></div>
            <div *ngIf="eventNote"><span>Notes</span><strong>{{ eventNote }}</strong></div>
          </div>
        </div>
      </ng-container>
    </section>
  </main>
</ion-content>
