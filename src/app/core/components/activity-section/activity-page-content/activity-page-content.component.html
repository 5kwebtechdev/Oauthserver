<div class="activity-page-content">
    <div class="habit-week">
        <superme-week (dateSelected)="onDateSelected($event)"></superme-week>
    </div>


    <div *ngIf="showSingleMode && singleModeHabit" class="single-mode-container" (click)="closeSingleMode()">
        <activity-card mode="single" [habit]="singleModeHabit" (click)="$event.stopPropagation()"></activity-card>
    </div>

    <div class="habit-task-switch w-full" *ngIf="showContent">
        <div class="row toggler"
            [ngClass]="{ 'habits-active': currentMainTab === 'habits', 'tasks-active': currentMainTab === 'tasks' }">
            <div class="col-6" (click)="selectMainTab('habits')"
                [ngClass]="currentMainTab === 'habits' ? 'active' : 'null'">Habits</div>
            <div class="col-6" (click)="selectMainTab('tasks')"
                [ngClass]="currentMainTab === 'tasks' ? 'active' : 'null'">Tasks</div>
        </div>
    </div>

    <div class="habit-filters-container" *ngIf="currentMainTab === 'habits'">
        <ng-template #emptyStateTpl>
            <div class="empty-state">No habits found.</div>
        </ng-template>
        <!-- Group: Journey, Priority, Routine selectors -->
        <div class="habit-journey-container">
            <div class="habit-journey">
                <h2>Your Habit Journey</h2>
                <div class="habit-journey-week d-flex justify-content-between">
                    <superme-badge [text]="`Pending (${habitJourneySummary.pending})`" type="pending"
                        [disabled]="journeySubFilter !== 'pending'" [active]="journeySubFilter === 'pending'"
                        (click)="selectJourneySubFilter('pending')"></superme-badge>
                    <superme-badge [text]="`Ongoing (${habitJourneySummary.ongoing})`" type="ongoing"
                        [disabled]="journeySubFilter !== 'ongoing'" [active]="journeySubFilter === 'ongoing'"
                        (click)="selectJourneySubFilter('ongoing')"></superme-badge>
                    <superme-badge [text]="`Completed (${habitJourneySummary.completed})`" type="completed"
                        [disabled]="journeySubFilter !== 'completed'" [active]="journeySubFilter === 'completed'"
                        (click)="selectJourneySubFilter('completed')"></superme-badge>
                </div>
            </div>
            <div class="habit-list-content"
                *ngIf="filteredHabitsByJourney && filteredHabitsByJourney.length > 0; else noHabitsTemplate">
                <div *ngFor="let habit of filteredHabitsByJourney">
                    <activity-card [habit]="habit" [startTime]="habit.startTimeStamp" [endTime]="habit.endTimeStamp"
                        [inProgress]="habit.startTimeStamp <= currentTimestamp && habit.endTimeStamp >= currentTimestamp"
                        [isCurrentDateView]="isSelectedDateToday()" [selectedDate]="getSelectedDateString()"
                        (cardTap)="onCardTap($event)" (cardLongPress)="onCardLongPress($event)">
                    </activity-card>
                </div>
            </div>
            <ng-template #noHabitsTemplate>
                <empty-state
                        [imageSrc]="showPet ? currentPetBaseImage : ''"
                        [imageAlt]="currentPetImageAlt"
                        [leadText]="journeySubFilter === 'pending' ? 'No pending habits yet' : (journeySubFilter === 'ongoing' ? 'No ongoing habits yet' : 'No completed habits yet')"
                        [subText]="'Add habits to your journey to view them here'"
                        [buttonText]="''">
                    </empty-state>
            </ng-template>
        </div>

        <div class="priority-container">
            <div class="priority-header">
                <h3>Navigate Your Priorities</h3>
                <div class="priority-selectors d-flex justify-content-between">
                    <superme-badge [text]="`High (${habitPrioritySummary.high})`" type="red"
                        [disabled]="prioritySubFilter !== 'high'" [active]="prioritySubFilter === 'high'"
                        (click)="selectPrioritySubFilter('high')"></superme-badge>
                    <superme-badge [text]="`Medium (${habitPrioritySummary.medium})`" type="yellow"
                        [disabled]="prioritySubFilter !== 'medium'" [active]="prioritySubFilter === 'medium'"
                        (click)="selectPrioritySubFilter('medium')"></superme-badge>
                    <superme-badge [text]="`Low (${habitPrioritySummary.low})`" type="green"
                        [disabled]="prioritySubFilter !== 'low'" [active]="prioritySubFilter === 'low'"
                        (click)="selectPrioritySubFilter('low')"></superme-badge>
                </div>
            </div>
            <div class="habit-list-container" *ngIf="currentMainTab === 'habits'">
                <div *ngIf="filteredHabitsByPriority && filteredHabitsByPriority.length > 0; else noPriorityHabitsTemplate"
                    class="habit-list-content">
                    <div *ngFor="let habit of filteredHabitsByPriority">
                        <activity-card [habit]="habit" [startTime]="habit.startTimeStamp" [endTime]="habit.endTimeStamp"
                            [inProgress]="habit.startTimeStamp <= currentTimestamp && habit.endTimeStamp >= currentTimestamp"
                            [isCurrentDateView]="isSelectedDateToday()" [selectedDate]="getSelectedDateString()"
                            (cardTap)="onCardTap($event)" (cardLongPress)="onCardLongPress($event)">
                        </activity-card>
                    </div>
                </div>
                <ng-template #noPriorityHabitsTemplate>
                    <empty-state
                        [imageSrc]="showPet ? currentPetBaseImage : ''"
                        [imageAlt]="currentPetImageAlt"
                        [leadText]="prioritySubFilter === 'high' ? 'No high priority habits yet' : (prioritySubFilter === 'medium' ? 'No medium priority habits yet' : 'No low priority habits yet')"
                        [subText]="'Add habits with this priority to view them here'"
                        [buttonText]="''">
                    </empty-state>
                </ng-template>
            </div>
        </div>

        <!-- Ad banner between Priority and Routine — habits tab -->
        <div class="activity-ad-wrap">
            <ad-banner [screen]="adScreen"></ad-banner>
        </div>

    </div>

    <!-- Tasks layout mirrors Habits: Journey, Priority, Routine selectors and lists -->
    <div class="task-filters-container" *ngIf="currentMainTab === 'tasks'">
        <ng-template #noTasksJourneyTemplate>
            <empty-state
                [imageSrc]="showPet ? currentPetBaseImage : ''"
                [imageAlt]="currentPetImageAlt"
                [leadText]="journeySubFilter === 'pending' ? 'No pending tasks yet' : (journeySubFilter === 'ongoing' ? 'No ongoing tasks yet' : 'No completed tasks yet')"
                [subText]="'Add tasks to your journey to view them here'"
                [buttonText]="''">
            </empty-state>
        </ng-template>

        <ng-template #noTasksPriorityTemplate>
            <empty-state
                [imageSrc]="showPet ? currentPetBaseImage : ''"
                [imageAlt]="currentPetImageAlt"
                [leadText]="prioritySubFilter === 'high' ? 'No high priority tasks yet' : (prioritySubFilter === 'medium' ? 'No medium priority tasks yet' : 'No low priority tasks yet')"
                [subText]="'Add tasks with this priority to view them here'"
                [buttonText]="''">
            </empty-state>
        </ng-template>

        <div class="habit-journey-container">
            <div class="habit-journey">
                <h2>Your Task Journey</h2>
                <div class="habit-journey-week d-flex justify-content-between">
                    <superme-badge [text]="`Pending (${taskJourneySummary.pending})`" type="pending"
                        [disabled]="journeySubFilter !== 'pending'" [active]="journeySubFilter === 'pending'"
                        (click)="selectJourneySubFilter('pending')"></superme-badge>
                    <superme-badge [text]="`Ongoing (${taskJourneySummary.ongoing})`" type="ongoing"
                        [disabled]="journeySubFilter !== 'ongoing'" [active]="journeySubFilter === 'ongoing'"
                        (click)="selectJourneySubFilter('ongoing')"></superme-badge>
                    <superme-badge [text]="`Completed (${taskJourneySummary.completed})`" type="completed"
                        [disabled]="journeySubFilter !== 'completed'" [active]="journeySubFilter === 'completed'"
                        (click)="selectJourneySubFilter('completed')"></superme-badge>
                </div>
            </div>

            <div class="habit-list-content"
                *ngIf="filteredTasksByJourney && filteredTasksByJourney.length > 0; else noTasksJourneyTemplate">
                <div *ngFor="let task of filteredTasksByJourney">
                    <activity-card [habit]="task" [startTime]="task.startTimeStamp" [endTime]="task.endTimeStamp"
                        [inProgress]="(task.startTimeStamp || 0) <= currentTimestamp && (task.endTimeStamp || MAX_SAFE_INTEGER) >= currentTimestamp"
                        [isCurrentDateView]="isSelectedDateToday()" [selectedDate]="getSelectedDateString()"
                        (cardTap)="onCardTap($event)" (cardLongPress)="onCardLongPress($event)">
                    </activity-card>
                </div>
            </div>
        </div>

        <div class="priority-container">
            <div class="priority-header">
                <h3>Navigate Your Priorities</h3>
                <div class="priority-selectors d-flex justify-content-between">
                    <superme-badge [text]="`High (${taskPrioritySummary.high})`" type="red"
                        [disabled]="prioritySubFilter !== 'high'" [active]="prioritySubFilter === 'high'"
                        (click)="selectPrioritySubFilter('high')"></superme-badge>
                    <superme-badge [text]="`Medium (${taskPrioritySummary.medium})`" type="yellow"
                        [disabled]="prioritySubFilter !== 'medium'" [active]="prioritySubFilter === 'medium'"
                        (click)="selectPrioritySubFilter('medium')"></superme-badge>
                    <superme-badge [text]="`Low (${taskPrioritySummary.low})`" type="green"
                        [disabled]="prioritySubFilter !== 'low'" [active]="prioritySubFilter === 'low'"
                        (click)="selectPrioritySubFilter('low')"></superme-badge>
                </div>
            </div>
            <div class="habit-list-container">
                <div *ngIf="filteredTasksByPriority && filteredTasksByPriority.length > 0; else noTasksPriorityTemplate"
                    class="habit-list-content">
                    <div *ngFor="let task of filteredTasksByPriority">
                        <activity-card [habit]="task.task ? task.task : task" [startTime]="task.startTimeStamp"
                            [endTime]="task.endTimeStamp"
                            [inProgress]="(task.startTimeStamp || 0) <= currentTimestamp && (task.endTimeStamp || MAX_SAFE_INTEGER) >= currentTimestamp"
                            [isCurrentDateView]="isSelectedDateToday()" [selectedDate]="getSelectedDateString()"
                            (cardTap)="onCardTap($event)" (cardLongPress)="onCardLongPress($event)">
                        </activity-card>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ad banner between Priority and Routine — tasks tab -->
        <div class="activity-ad-wrap">
            <ad-banner [screen]="adScreen"></ad-banner>
        </div>

    </div>


</div>
