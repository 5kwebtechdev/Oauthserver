<ion-content style="height: 100vh; overflow-y: scroll">
  <div class="container w-full typical-header">
    <div class="row">
      <div class="col-2">
        <img src="/assets/app-assets/Back-common-icon.svg" class="back-button" alt="">
      </div>
      <div class="col-8">
        <div class="container w-full p-0 flex-center" style="min-height: 45px">
          <div class="container w-full p-0">
            <h3>{{title}}</h3>
            <p>{{description}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container w-full typical-body">
    <ng-content></ng-content>
    <div class="container w-full" style="height: 60px">

    </div>
  </div>
</ion-content>
