<ng-container *ngIf="isVisible && ads.length > 0">
  <div class="adb"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
    role="region"
    aria-label="Featured offers">

    <div class="adb__scroll-track">
      <div class="adb__card" *ngFor="let ad of ads; let i = index"
           [class.adb__card--active]="i === currentIndex">
        <img
          class="adb__img"
          [src]="ad.image"
          [alt]="ad.title"
          loading="lazy"
          (error)="onAdImageError(i)" />
      </div>
    </div>

    <!-- Dot indicators -->
    <div class="adb__dots" *ngIf="ads.length > 1" role="tablist">
      <button *ngFor="let ad of ads; let i = index"
        class="adb__dot"
        [class.adb__dot--active]="i === currentIndex"
        (click)="goTo(i)"
        role="tab"
        [attr.aria-selected]="i === currentIndex"
        [attr.aria-label]="'Slide ' + (i + 1)">
      </button>
    </div>

  </div>
</ng-container>
