<ng-container *ngIf="isVisible && ads.length > 0">
  <div class="adb" [class.adb--article-details]="variant === 'article-details'"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
    role="region"
    aria-label="Featured offers">

    <div class="adb__track-clip">
    <div class="adb__scroll-track" #scrollTrack>
      <div class="adb__card" *ngFor="let ad of ads; let i = index"
           [class.adb__card--active]="i === currentIndex"
           [class.adb__card--clickable]="ad.clickActionType === 'IN_APP_SCREEN' || ad.clickActionType === 'EXTERNAL_URL'"
           (click)="onAdClick(ad)"
           role="button"
           [attr.aria-label]="ad.title">

        <img
          class="adb__img"
          [src]="ad.image"
          [alt]="ad.title"
          loading="lazy"
          (error)="onAdImageError(i)" />

      </div>
    </div>
    </div>

    <div class="adb__dots" *ngIf="ads.length > 1" role="group" aria-label="Carousel position">
      <span class="adb__counter" aria-live="polite">
        {{ currentIndex + 1 }}/{{ ads.length }}
      </span>
      <ng-container *ngFor="let ad of ads; let i = index">
        <button *ngIf="i !== currentIndex"
          class="adb__dot"
          type="button"
          (click)="goTo(i)"
          [attr.aria-label]="'Show slide ' + (i + 1)">
        </button>
      </ng-container>
    </div>

  </div>
</ng-container>
