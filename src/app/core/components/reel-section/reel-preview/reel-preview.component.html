<section class="reel-preview-section" *ngIf="isLoading || items.length" aria-labelledby="reel-preview-heading">
  <div class="reel-preview-header">
    <div class="reel-preview-heading">
      <h3 class="reel-preview-title" id="reel-preview-heading">{{ title }}</h3>
      <p class="reel-preview-subtitle">{{ subtitle }}</p>
    </div>
    <a class="reel-preview-viewall" [routerLink]="['/authed/reel-section']">View all</a>
  </div>

  <div class="reel-preview-grid" *ngIf="!isLoading; else loadingCards">
    <button type="button" class="reel-preview-card"
      *ngFor="let item of items; trackBy: trackByReel"
      (click)="openReel(item, $event)"
      [attr.aria-label]="item.title || 'Open reel'">

      <img *ngIf="item.thumbnailUrl"
        class="reel-preview-image"
        [src]="item.thumbnailUrl"
        [alt]="item.title || 'Reel thumbnail'"
        loading="lazy"
        decoding="async"
        (error)="onThumbnailError(item)">

      <span class="reel-preview-tag" *ngIf="item.category">{{ item.category }}</span>
      <span class="reel-preview-play" aria-hidden="true">
        <img class="reel-preview-play-bg" src="assets/figma/child-home/reel-play-circle.svg" alt="">
        <img class="reel-preview-play-icon" src="assets/figma/child-home/reel-play.svg" alt="">
      </span>

      <div class="reel-preview-overlay" *ngIf="item.author || item.title || item.likeCount !== undefined">
        <div class="reel-preview-meta" *ngIf="item.author || item.authorAvatarUrl">
          <img *ngIf="item.authorAvatarUrl" class="reel-preview-avatar" [src]="item.authorAvatarUrl" alt="">
          <span class="reel-preview-avatar reel-preview-avatar--empty" *ngIf="!item.authorAvatarUrl"></span>
          <span class="reel-preview-author" *ngIf="item.author">{{ item.author }}</span>
        </div>
        <p class="reel-preview-card-title" *ngIf="item.title">{{ item.title }}</p>
        <p class="reel-preview-counts" *ngIf="!item.title && item.likeCount !== undefined">
          {{ item.likeCount }} likes
        </p>
      </div>
    </button>
  </div>

  <ng-template #loadingCards>
    <div class="reel-preview-grid" aria-label="Loading reels">
      <span class="reel-preview-card reel-preview-card--loading"></span>
      <span class="reel-preview-card reel-preview-card--loading"></span>
    </div>
  </ng-template>
</section>
