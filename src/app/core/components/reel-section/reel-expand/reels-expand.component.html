<div class="reels-expand" [class.expanded]="expanded">
  <section class="expanded-player" *ngIf="expanded && current" aria-label="Reel player">
    <div class="media-wrap" (click)="togglePlayPause($event)">
      <video
        *ngIf="current.video"
        #playerVideo
        class="reel-video"
        [poster]="current.image"
        playsinline
        (ended)="onVideoEnded()">
        <source [src]="current.video" type="video/mp4">
      </video>
      <img *ngIf="!current.video" [src]="current.image" [alt]="current.title">

      <div class="play-pause-overlay" [class.show]="showPlayPauseIndicator" aria-hidden="true">
        <span class="play-pause-icon">
          <svg *ngIf="isPlaying" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
          </svg>
          <svg *ngIf="!isPlaying" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </span>
      </div>
    </div>

    <button type="button" class="viewer-back" aria-label="Close reel" (click)="close()">
      <img src="assets/figma/reels/back-full.svg" alt="">
    </button>

    <aside class="viewer-actions" aria-label="Reel actions">
      <div class="viewer-action">
        <button
          type="button"
          class="viewer-action-button"
          [class.viewer-action-button--active]="current.liked"
          [attr.aria-pressed]="current.liked"
          aria-label="Like reel"
          (click)="toggleLike()">
          <img src="assets/figma/reels/heart-full.svg" alt="">
        </button>
        <span>{{ current.likes }}</span>
      </div>

      <div class="viewer-action">
        <button
          type="button"
          class="viewer-action-button"
          [class.viewer-action-button--active]="current.saved"
          [attr.aria-pressed]="current.saved"
          aria-label="Save reel"
          (click)="toggleSave()">
          <img src="assets/figma/reels/bookmark-full.svg" alt="">
        </button>
        <span>Save</span>
      </div>

      <div class="viewer-action">
        <button type="button" class="viewer-action-button" aria-label="Share reel" (click)="openShare($event)">
          <img src="assets/figma/reels/share-full.svg" alt="">
        </button>
        <span>Share</span>
      </div>
    </aside>

    <div class="viewer-copy">
      <div class="viewer-author">
        <img [src]="current.avatar || 'assets/figma/reels/avatar-full.png'" alt="">
        <span>{{ current.author }}</span>
      </div>
      <h2>{{ current.title }}</h2>
      <p>{{ current.tags }}</p>
      <img
        *ngIf="current.aiGenerated"
        class="viewer-ai-badge"
        src="assets/figma/reels/ai-badge-full.png"
        alt="Made with AI">
    </div>

    <div class="video-progress-bottom" *ngIf="current.video" aria-hidden="true">
      <div class="progress-bar" [style.width.%]="videoProgress"></div>
    </div>

    <div class="share-popup-backdrop" *ngIf="shareVisible" (click)="closeShare()"></div>
    <div class="share-popup" *ngIf="shareVisible" role="dialog" aria-modal="true" aria-label="Share reel">
      <div class="share-header">
        <div>
          <h3>Know someone who'll love this reel?</h3>
          <p>Share it so they can watch.</p>
        </div>
        <button type="button" aria-label="Close share options" (click)="closeShare()">×</button>
      </div>
      <div class="share-actions">
        <button type="button" (click)="copyLink()">Copy Link</button>
        <button type="button" (click)="shareWhatsapp()">Share through WhatsApp</button>
      </div>
    </div>
  </section>
</div>
