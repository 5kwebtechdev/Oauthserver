<div class="reels-expand" [class.expanded]="expanded">
  <!-- Expanded fullscreen player when active -->
  <div class="expanded-player" *ngIf="expanded && current">
    <div class="player-backdrop" (click)="close()"></div>

    <div class="player-content">
      <button class="player-close" aria-label="Close" (click)="close()">×</button>

      <div class="media-wrap">
        <video #playerVideo class="reel-video" controls (ended)="onVideoEnded()" (click)="$event.stopPropagation()">
          <source [src]="current.video || current.image" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <img *ngIf="!current?.video" [src]="current?.image" alt="{{ current?.title }}" />
      </div>

      <div class="player-meta">
        <div class="meta-row">
          <div class="author">{{ current?.author }}</div>
          <div class="controls">
            <button class="control prev" (click)="prev()" [disabled]="currentIndex === 0">‹</button>
            <button class="control next" (click)="next()" [disabled]="currentIndex >= (playlist.length - 1)">›</button>
          </div>
        </div>

        <h3 class="title">{{ current?.title }}</h3>
        <div class="tags">{{ current?.tags }}</div>

        <div class="player-actions">
          <button class="share-btn" (click)="openShare($event)">Share</button>
        </div>

        <!-- Share popup -->
        <div class="share-popup-backdrop" *ngIf="shareVisible" (click)="closeShare()"></div>
        <div class="share-popup" *ngIf="shareVisible" role="dialog" aria-modal="true" aria-label="Share reel">
          <button class="share-close" aria-label="Close share" (click)="closeShare()">×</button>
          <h4 class="share-heading">Know someone who'll love this reel?</h4>
          <p class="share-sub">Share it so they can watch.</p>

          <div class="share-actions">
            <button class="share-action copy" (click)="copyLink()">
              <i class="icon-clip"></i>
              Copy Link
            </button>
            <button class="share-action whatsapp" (click)="shareWhatsapp()">
              <i class="icon-whatsapp"></i>
              Share through Whatsapp
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
