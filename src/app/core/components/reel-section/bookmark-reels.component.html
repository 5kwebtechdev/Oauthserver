<div class="bookmark-reels">
  <ng-container *ngIf="items && items.length; else empty">
    <div class="bookmark-item" *ngFor="let it of items">
      <img [src]="it.image" alt="" />
      <div class="title">{{ it.title }}</div>
    </div>
  </ng-container>
  <ng-template #empty>
    <div class="empty">No saved reels yet</div>
  </ng-template>
</div>
