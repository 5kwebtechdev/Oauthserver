<section class="reels-card">
  <div #reelsSwiper class="reels-swiper swiper-container">
    <div class="swiper-wrapper">
      <div class="swiper-slide" *ngFor="let s of slides">
        <reel-frame [s]="s" [hideCategory]="hideCategory" (play)="playReel($event)"
          (toggleSave)="toggleSave($event)"></reel-frame>
      </div>
    </div>
  </div>
</section>
