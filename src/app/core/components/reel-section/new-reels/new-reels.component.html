<div class="new-reels">
  <div *ngIf="items && items.length; else none">
    <div class="item" *ngFor="let it of items">
      <img [src]="it.image" alt="" />
      <div class="meta">{{ it.title }}</div>
    </div>
  </div>
  <ng-template #none>
    <div class="none">No reels</div>
  </ng-template>
</div>
