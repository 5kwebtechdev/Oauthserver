<section class="reel-section">
  <header class="header">
  <button class="back-button" (click)="goBack()" aria-label="Back">
      <!-- back arrow SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 24V25H36V24V23H12V24Z" fill="#282527"/>
      </svg>
    </button>

    <div class="titles">
      <h3 class="heading">Made by Kids, for Kids!</h3>
      <div class="tagline">
        <span class="tag">Watch reels</span>
        <span class="dot">•</span>
        <span class="tag">Create</span>
        <span class="dot">•</span>
        <span class="tag">Get Inspired</span>
      </div>
    </div>

    <button class="bookmark-button" aria-label="Bookmarks">
      <!-- bookmark svg -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <mask id="mask0" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
          <rect width="24" height="24" fill="#D9D9D9"/>
        </mask>
        <g mask="url(#mask0)">
          <path d="M5 21V5C5 4.45 5.19583 3.97917 5.5875 3.5875C5.97917 3.19583 6.45 3 7 3H17C17.55 3 18.0208 3.19583 18.4125 3.5875C18.8042 3.97917 19 4.45 19 5V21L12 18L5 21ZM7 17.95L12 15.8L17 17.95V5H7V17.95Z" fill="#282527"/>
        </g>
      </svg>
    </button>
  </header>
<!-- Main content area -->
  <main class="content">

    <div *ngFor="let cat of categories" class="category-block">
      <div class="category-header">
            <div class="title-group">
              <h2>{{ cat }}</h2>
              <div class="trending-tag">Trending</div>
            </div>
      </div>

      <div #categorySwiper class="category-swiper swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide" *ngFor="let s of slidesByCategory[cat]">
            <article class="reel" (click)="openReel(s, $event)">
              <div class="card-media" [style.backgroundImage]="'url(' + s.image + ')'">
                <div class="category">{{ s.category }}</div>

                <button class="bookmark" [class.saved]="s.saved" (click)="toggleSave(s, $event); $event.stopPropagation()" aria-label="Save" [attr.aria-pressed]="s.saved">
                  <img src="/assets/app-assets/FaBookmark.svg" alt="" class="bookmark-icon" aria-hidden="true" />
                </button>

                <button class="play" type="button" (click)="playReel(s, $event); $event.stopPropagation()" aria-label="Play">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7L8 5z" fill="#282527"/></svg>
                </button>

                <video *ngIf="s.isPlaying" class="reel-video" controls autoplay (click)="$event.stopPropagation()">
                  <source [src]="s.video || s.image" type="video/mp4" />
                  Your browser does not support the video tag.
                </video>

                <button *ngIf="s.isPlaying" class="video-close" type="button" (click)="stopReel(s, $event); $event.stopPropagation()" aria-label="Close video">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>

              <div class="reel-body">
                <div class="meta-row">
                  <div class="avatar"></div>
                  <div class="author">{{ s.author }}</div>
                </div>
                <h4 class="title">{{ s.title }}</h4>
                <div class="bottom-row">
                  <div class="tags">{{ s.tags }}</div>
                  <div class="stats">
                    <span class="duration">{{ s.duration }}</span>
                    <span class="likes">{{ s.likes }}</span>
                  </div>
                </div>
              </div>
            </article>
          </div>
        </div>
      </div>

      <div class="play-row">
        <button class="play-all" (click)="playAll(cat)">
          <span class="play-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="14" viewBox="0 0 13 14" fill="none">
              <path d="M12.5 7L0.5 13.9282L0.5 0.0717969L12.5 7Z" fill="white"/>
            </svg>
          </span>
          Play all
        </button>
      </div>
    </div>

    <!-- Bookmarked reels preview -->
    <section class="bookmarks">
      <h4>Saved reels</h4>
  <bookmark-reels [items]="savedSlides"></bookmark-reels>
    </section>

    <!-- Guidelines and new reels -->
    <section class="extras">
      <reel-guidelines></reel-guidelines>
  <new-reels [items]="slides"></new-reels>
  <!-- Share reel component (uses a PNG preview and mindful button) -->
  <share-reel [reel]="slides[0]"></share-reel>
    </section>
  </main>
</section>
