<div class="share-reel">
  <div class="preview">
    <img [src]="imageSrc" alt="reel preview" />
  </div>

  <div class="meta">
    <h4>{{ reel?.title || 'Untitled Reel' }}</h4>
    <div class="tags">{{ reel?.tags || '#mindful' }}</div>
    <div class="category">{{ reel?.category || 'General' }}</div>
  </div>

  <div class="actions">
    <button class="mindful-btn mindful-btn--primary share" (click)="onShare()">
      <img src="assets/app-assets/share-icon.png" alt="share" />
      <span>Share</span>
    </button>
  </div>
</div>
