<ion-content [fullscreen]="true" class="reels-page">
  <div class="reels-shell">
    <header class="reels-header">
      <button type="button" class="back-button" aria-label="Go back" (click)="goBack()">
        <img src="assets/figma/reels/back.svg" alt="">
      </button>

      <div class="reels-heading">
        <h1>Made by Kids</h1>
        <div class="reels-tagline" aria-label="Watch, Create, Inspire">
          <span>Watch</span><i></i><span>Create</span><i></i><span>Inspire</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="header-action" aria-label="Open saved reels" (click)="openBookmarks()">
          <span class="header-action-icon header-action-icon--saved">
            <img src="assets/figma/reels/saved.svg" alt="">
          </span>
          <span>Saved</span>
        </button>
        <button type="button" class="header-action" aria-label="Open my reels" (click)="goToMyReels()">
          <span class="header-action-icon header-action-icon--mine">
            <img src="assets/figma/reels/my-reels.svg" alt="">
          </span>
          <span>My Reels</span>
        </button>
      </div>
    </header>

    <label class="reel-search" aria-label="Search reels and creators">
      <img class="reel-search-icon" src="assets/figma/reels/search.svg" alt="">
      <input
        type="search"
        [value]="searchTerm"
        (input)="onSearch($event)"
        placeholder="Search reels, creators..."
        autocomplete="off">
      <img class="reel-search-mic" src="assets/figma/reels/search-mic.svg" alt="">
    </label>

    <nav class="category-scroller" aria-label="Reel categories">
      <button
        type="button"
        class="category-chip category-chip--all"
        [class.category-chip--active]="selectedCategory === 'All'"
        (click)="selectCategory('All')">
        All
      </button>
      <button
        *ngFor="let category of categories; trackBy: trackCategory"
        type="button"
        class="category-chip"
        [class.category-chip--active]="selectedCategory === category.label"
        (click)="selectCategory(category.label)">
        <img [src]="category.icon" alt="">
        <span>{{ category.label }}</span>
      </button>
    </nav>

    <main class="reels-grid" *ngIf="filteredSlides.length; else emptyReels">
      <article
        *ngFor="let reel of filteredSlides; trackBy: trackReel"
        class="reel-card"
        role="button"
        tabindex="0"
        [attr.aria-label]="'Play ' + reel.title"
        (click)="openReel(reel, $event)"
        (keydown)="onCardKeydown($event, reel)">
        <img class="reel-card-image" [src]="reel.image" [alt]="reel.title" loading="lazy" decoding="async">
        <div class="reel-card-overlay"></div>

        <img
          *ngIf="reel.aiGenerated"
          class="ai-badge"
          src="assets/figma/reels/ai-badge.png"
          alt="Made with AI">

        <button
          type="button"
          class="card-bookmark"
          [class.card-bookmark--saved]="reel.saved"
          [attr.aria-label]="reel.saved ? 'Remove from saved reels' : 'Save reel'"
          [attr.aria-pressed]="reel.saved"
          (click)="toggleSave(reel, $event)">
          <img src="assets/figma/reels/bookmark-card.svg" alt="">
        </button>

        <span class="card-play" aria-hidden="true">
          <img src="assets/figma/reels/play.svg" alt="">
        </span>

        <div class="reel-card-copy">
          <div class="reel-author">
            <img [src]="reel.avatar" alt="">
            <span>{{ reel.author }}</span>
          </div>
          <h2>{{ reel.title }}</h2>
          <div class="reel-card-footer">
            <span class="reel-likes">
              <img src="assets/figma/reels/heart.svg" alt="">
              {{ reel.likes }}
            </span>
            <span class="reel-duration">{{ reel.duration }}</span>
          </div>
        </div>
      </article>
    </main>

    <ng-template #emptyReels>
      <div class="empty-reels" role="status">
        <p>No reels match your search.</p>
        <button type="button" (click)="selectCategory('All'); searchTerm = ''">Show all reels</button>
      </div>
    </ng-template>

    <button
      *ngIf="hasWatchedAllReels"
      type="button"
      class="add-reel"
      aria-label="Upload a reel"
      (click)="openUpload()">
      <img src="assets/figma/reels/add.svg" alt="">
    </button>
  </div>

  <reels-expand></reels-expand>
</ion-content>
