<app-streak-milestone
  [restoreMode]="true"
  [restoreCost]="restoreCost"
  [restoreDisabled]="isLoading || !canRestore"
  [restoring]="isRestoring"
  [notice]="isLoading ? 'Checking your login streak…' : (notEligible ? notEligibleMessage : (errorMessage || (notEnoughCoins ? 'You do not have enough coins to restore your streak.' : '')))"
  (restore)="restore()"
  (continue)="dismiss(notEligible ? { notEligible: true } : null)">
</app-streak-milestone>
