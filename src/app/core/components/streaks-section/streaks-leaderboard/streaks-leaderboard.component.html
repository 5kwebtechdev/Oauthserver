<div class="leaderboard-card">
    <!-- Header Section: inline back arrow SVG + title text -->
    <div class="streaks-leaderboard-header">
      <button class="back-arrow" aria-label="Back">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" focusable="false" aria-hidden="true">
          <path d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 24V25H36V24V23H12V24Z" fill="#282527"/>
        </svg>
      </button>

      <div class="streaks-leaderboard-title" role="heading" aria-level="1">Your Streak Journey</div>
    </div>

    <div class="streaks-status">
      <div class="streaks-status-item">
        <span class="status-label">Current Streak</span>
        <img src="assets/app-assets/best-streak.png" alt="fire icon" class="icon" />
        <span class="status-value">45 days</span>
      </div>
      <div class="streaks-status-item">
        <span class="status-label">Best Streak</span>
        <img src="assets/app-assets/Streak-best-streak-icon.svg" alt="trophy icon" class="icon" />
        <span class="status-value">56 days</span>
      </div>
      <div class="streaks-status-item">
        <span class="status-label">Total days Active</span>
        <img src="assets/app-assets/Streak-total-active-days-icon.svg" alt="total active days icon" class="icon" />
        <span class="status-value">115 days</span>
      </div>
    </div>

  <div class="streak-container">
    
    <!-- Heading -->
    <div class="top-strickers-header">
    <h2 class="title">Top Streakers</h2>
    </div>
    <!-- Speech + Panda -->
    <div class="streak-box">
      <p class="speech-bubble">
        You’re ranked #8,<br>
        Keep going champ!
      </p>
      <img src="assets/app-assets/Panda Sitting Tired.png" alt="Panda" class="panda">
    </div>

  </div>

  <!-- reuse the existing streaks list component -->
  <app-streaks-list [streaks]="streaks"></app-streaks-list>
</div>
