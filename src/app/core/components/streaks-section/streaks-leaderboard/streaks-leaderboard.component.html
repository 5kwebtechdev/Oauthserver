<ion-content class="streaks-leaderboard-page" fullscreen>
  <mindful-navigator heading="Your Streak Journey" backIcon="arrowSvg"></mindful-navigator>
  <div class="leaderboard-card">

    <div class="streaks-status">
      <div class="streaks-status-item">
        <span class="status-label">Current Streak</span>
        <img src="assets/app-assets/best-streak.png" alt="fire icon" class="icon" />
        <span class="status-value">45 days</span>
      </div>
      <div class="streaks-status-item">
        <span class="status-label">Best Streak</span>
        <img src="assets/app-assets/Streak-best-streak-icon.svg" alt="trophy icon" class="icon" />
        <span class="status-value">56 days</span>
      </div>
      <div class="streaks-status-item">
        <span class="status-label">Total days Active</span>
        <img src="assets/app-assets/Streak-total-active-days-icon.svg" alt="total active days icon" class="icon" />
        <span class="status-value">115 days</span>
      </div>
    </div>
    <div class="streak-container">
    </div>

    <!-- Heading -->
    <div class="top-strickers-header d-flex align-items-center justify-content-between">
      <h2 class="title mb-0">Top Streakers</h2>
      <!-- Speech + Panda -->
      <div class="d-flex align-items-center gap-2">
        <app-speech-bubble
          [message]="'You\u2019re ranked #8,\\nKeep going champ!'"
          type="talking"
          arrowSide="right"
          color="#F0AD4E">
        </app-speech-bubble>
        <mindful-pet pet="panda" mood="tired" [size]="44"></mindful-pet>
      </div>
    </div>

    <!-- reuse the existing streaks list component -->
    <app-streaks-list [streaks]="streaks"></app-streaks-list>
  </div>
</ion-content>
