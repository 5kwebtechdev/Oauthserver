<div class="streaks-card">
  <ul class="streaks-list">
    <li *ngFor="let item of items" class="streak-item">
      <div class="left">
        <div class="rank">{{item.rank}}</div>
        <div class="trend" *ngIf="item.change">
          <span class="triangle" [ngClass]="{'up': item.change === 'up', 'down': item.change === 'down'}"></span>
        </div>
        <div class="avatar-wrap">
          <img class="avatar" [src]="item.avatar || 'assets/avatars/default.png'" alt="{{item.name}} avatar">
        </div>
        <div class="name">{{item.name}}</div>
      </div>

      <div class="right">
        <div class="days">{{ formatDays(item.days) }}</div>
      </div>
    </li>
  </ul>
</div>
