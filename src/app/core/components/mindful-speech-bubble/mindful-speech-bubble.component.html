<div
  class="speech-bubble"
  [ngClass]="type"
  [attr.data-side]="type === 'talking' ? arrowSide : null"
  [style.background]="color"
  [style.--bubble-bg]="color"
  [style.color]="textColor"
  [style.--bubble-text]="textColor"
  [style.fontFamily]="'Nunito'"
  [style.fontSize]="'13px'"
  [style.fontWeight]="600"
  [style.lineHeight]="'150%'"
  [style.--arrow-size]="type === 'talking' ? (arrowSize + 'px') : null"
  [style.--arrow-offset]="type === 'talking' ? arrowOffset : null"
  [style.--arrow-angle]="type === 'talking' ? (arrowAngle + 'deg') : null"
>
  <svg *ngIf="type === 'talking'" class="bubble-arrow" viewBox="0 0 20 10" aria-hidden="true" focusable="false">
    <path d="M0 0 L20 5 L0 10 Z" />
  </svg>
  <span class="bubble-message">{{ message }}</span>
  <ng-container *ngIf="type === 'thinking'">
    <span class="thinking-dot dot1"></span>
    <span class="thinking-dot dot2"></span>
    <span class="thinking-dot dot3"></span>
  </ng-container>
</div>
