<!-- Speech Bubble Component Template -->
<div class="speech-bubble-container" [class.animate-in]="true" [attr.data-arrow-direction]="arrowSide" [ngClass]="type">

  <!-- Speech Bubble -->
  <div class="speech-bubble" #speechBubble [attr.data-side]="type === 'talking' ? arrowSide : null">

    <!-- Message Content -->
    <div class="bubble-content">
      <p class="message-text">{{ displayMessage }}</p>
    </div>

    <!-- Arrow pointing to character -->
    <div *ngIf="type === 'talking'" class="bubble-arrow" [class.arrow-left]="arrowSide === 'left'"
      [class.arrow-right]="arrowSide === 'right'" [class.arrow-top]="arrowSide === 'top'"
      [class.arrow-bottom]="arrowSide === 'bottom'">
    </div>

    <!-- Thinking bubbles -->
    <ng-container *ngIf="type === 'thinking'">
      <span class="thinking-dot dot1"></span>
      <span class="thinking-dot dot2"></span>
      <span class="thinking-dot dot3"></span>
    </ng-container>
  </div>
</div>
