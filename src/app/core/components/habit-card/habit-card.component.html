<div class="container w-full p-0">
  <div class="habit-wrapper"
       (tap)="toggle()" long-press
       (press)="console.log('Long pressed')"
       [ngClass]="{'expanded': expanded, 'isRunningLate': isRunningLate,'missedTime': missedTime}">
    <div class="habit-tease">
      <div class="container w-full p-0">
        <div class="row">
          <div class="col-8">
            <h3>Reading</h3>
            <h4>{{getFormattedTime(startTime)}} - {{getFormattedTime(endTime)}}</h4>
          </div>
          <div class="col-4" style="position: relative">
            <div class="badge">
              Morning
            </div>
          </div>
        </div>
      </div>
    </div>
    <div #percentageWrapper class="habit-footer-progress"></div>
    <div class="habit-footer">
      <div class="container w-full p-0" style="background: white; height: 45px; border-radius: 0 0 20px 20px">
        <div class="single-point-container">
          <img class="score p-r-0" src="assets/icons/fire-slash-ball.svg" alt="">
          <p class="score p-l-0">200</p>
        </div>
        <div class="single-point-container">
          <img class="score" src="assets/icons/coin.svg" alt="">
          <p class="score p-l-0">12</p>
        </div>
      </div>
    </div>
  </div>
</div>
