<!-- List Mode -->
<div *ngIf="mode === 'list'">
  <div class="day-at-glance-container">
    <div class="glance-header">
      <h2 class="glance-in-day">Your Day at a Glance</h2>
    </div>
    
    <div class="glance-subtitle">
      <p>Check tasks • Finish habits • Crush it</p>
    </div>
    
    <div class="empty-state" *ngIf="isEmpty && !showContent">
      <div class="empty-state-content">
        <div class="empty-state-image">
          <img src="assets/app-assets/yourGlance.svg" alt="Empty day illustration">
        </div>
        <h3 class="empty-state-title">Your day's a blank slate!</h3>
        <p class="empty-state-description">Add tasks, habits, and your timetable to earn coins and level up your day. Don't miss out!</p>
      </div>
    </div>
    
    <div class="add-button-container" *ngIf="isEmpty">
     <mindful-button type="plum" text="Full width" large style="display:block; width:100%" (click)="null"></mindful-button>
    </div>
  </div>

  <div class="container w-full" *ngIf="showContent">
    <div class="row toggler">
      <div class="col-4" (click)="currentActive = 'all'" [ngClass]="currentActive === 'all' ? 'active' : 'null'">All</div>
      <div class="col-4" (click)="currentActive = 'habits'" [ngClass]="currentActive === 'habits' ? 'active' : 'null'">Habits</div>
      <div class="col-4" (click)="currentActive = 'tasks'" [ngClass]="currentActive === 'tasks' ? 'active' : 'null'">Tasks</div>
    </div>
  </div>

  <div class="container w-full" style="margin-top: 20px" *ngIf="showContent">
    <habit-card [startTime]="1745484315000" [endTime]="1745489715000" inProgress mode="single"></habit-card>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000" mode="single"></habit-card>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000" inProgress mode="single"></habit-card>
    <habit-card [startTime]="1745484315000" [endTime]="1745486115000" mode="single"></habit-card>
  </div>
</div>

<!--  Card Mode -->
<div *ngIf="mode === 'single'" class="container w-full p-0">
  <div class="habit-wrapper"
       (tap)="toggle()" long-press
       (press)="console.log('Long pressed')"
       [ngClass]="{'expanded': expanded, 'isRunningLate': isRunningLate,'missedTime': missedTime}">
    <div class="habit-tease">
      <div class="container w-full p-0">
        <div class="row">
          <div class="col-8">
            <h3>Reading</h3>
            <h4>{{getFormattedTime(startTime)}} - {{getFormattedTime(endTime)}}</h4>
          </div>
          <div class="col-4" style="position: relative">
            <div class="badge">
              Morning
            </div>
          </div>
        </div>
      </div>
    </div>
    <div #percentageWrapper class="habit-footer-progress"></div>
    <div class="habit-footer">
      <div class="container w-full p-0" style="background: white; height: 45px; border-radius: 0 0 20px 20px">
        <div class="single-point-container">
          <img class="score p-r-0" src="assets/icons/fire-slash-ball.svg" alt="">
          <p class="score p-l-0">200</p>
        </div>
        <div class="single-point-container">
          <img class="score" src="assets/icons/coin.svg" alt="">
          <p class="score p-l-0">12</p>
        </div>
      </div>
    </div>
  </div>
</div>
