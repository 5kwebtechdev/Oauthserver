<ion-content>
    <mindful-card-header [title]="'Your Badge Quest'" [subtitleLeft]="'Earn badges'" [subtitleMiddle]="'Level up'"
        [subtitleRight]="'Show the world'" [showBackArrow]="true" (backClick)="onBackClick()"></mindful-card-header>
    <!-- Recent Achievement Card -->
    <div class="recent-achievement-card" *ngIf="recentAchievement">
        <div class="achievement-content">
            <div class="achievement-icon-wrapper">
                <div class="icon-background"></div>
                <img [src]="recentAchievement.iconUrl" [alt]="recentAchievement.badgeName" class="achievement-icon" />
            </div>
            <div class="achievement-details">
                <div class="achievement-text">
                    <p class="achievement-title">Shine Bright!</p>
                    <p class="achievement-message">{{ recentAchievement.message }}</p>
                </div>
                <ion-button class="share-button" size="small" (click)="onShareClick()">
                    Share now
                </ion-button>
                <ion-button class="test-button" size="small" (click)="onTestClick()">
                    test now
                </ion-button>
            </div>
        </div>
    </div>

    <!-- Badge Grid -->
    <div class="badge-grid">
        <div *ngFor="let badge of badges; let i = index" class="badge-card" [class.locked]="badge.isLocked">
            <div class="badge-content">
                <div class="badge-info">
                    <p class="progress-text" [class.hidden]="badge.isLocked">
                        {{ badge.currentProgress }}/{{ badge.targetProgress }}
                    </p>
                    <div class="badge-visual">
                        <div class="badge-icon-container">
                            <img [src]="badge.iconUrl" [alt]="badge.name" class="badge-icon"
                                [class.blurred]="badge.isLocked" />
                        </div>
                        <mindful-completion [completionPercentage]="getCompletionPercentage(badge)"
                            [borderColor]="badge.progressColor || '#4CAF50'" [innerText]="''"
                            [belowText]="''"></mindful-completion>
                        <ion-icon *ngIf="badge.isLocked" name="lock-closed-outline" class="lock-icon"></ion-icon>
                    </div>
                </div>
                <p class="badge-name">{{ badge.name }}</p>
                <p class="badge-description">{{ badge.description }}</p>
            </div>
        </div>
    </div>

    <!-- Bottom Safe Area -->
    <div class="safe-area-bottom">
        <div class="home-indicator"></div>
    </div>
</ion-content>

<!-- Share Popup -->
<app-mindful-popup [isVisible]="sharePopupVisible" [config]="sharePopupConfig" (closeAction)="sharePopupVisible=false"
    (backdropClick)="sharePopupVisible=false">
</app-mindful-popup>

<!--complete badge popup full screen-->
<div *ngIf="congratsVisible" class="d-flex flex-column justify-content-center gap-4 congrats-popup">
    <button class="congrats-close" aria-label="Close" (click)="closeCongrats()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
            aria-hidden="true">
            <path
                d="M1.89652 16.9355C1.70126 17.1308 1.38468 17.1308 1.18942 16.9355L0.146522 15.8926C-0.0487404 15.6974 -0.04874 15.3808 0.146522 15.1855L6.43942 8.89262C6.63468 8.69735 6.63468 8.38077 6.43942 8.18551L0.146522 1.89262C-0.0487406 1.69735 -0.04874 1.38077 0.146522 1.18551L1.18942 0.142616C1.38468 -0.0526466 1.70126 -0.0526462 1.89652 0.142616L8.18942 6.43551C8.38468 6.63077 8.70126 6.63077 8.89652 6.43551L15.1894 0.142615C15.3847 -0.0526468 15.7013 -0.0526462 15.8965 0.142616L16.9394 1.18551C17.1347 1.38077 17.1347 1.69735 16.9394 1.89262L10.6465 8.18551C10.4513 8.38077 10.4513 8.69735 10.6465 8.89262L16.9394 15.1855C17.1347 15.3808 17.1347 15.6974 16.9394 15.8926L15.8965 16.9355C15.7013 17.1308 15.3847 17.1308 15.1894 16.9355L8.89652 10.6426C8.70126 10.4474 8.38468 10.4474 8.18941 10.6426L1.89652 16.9355Z"
                fill="#282527" />
        </svg>
    </button>
    <div class="congrats-img">
        <img class="confetti left" src="assets/Images-Transparent/congrats.png" alt="confetti left" />
        <div class="ring">
            <div class="badge-wrap">
                <img class="badge-icon" [src]="selectedBadge?.iconUrl || 'assets/Images-Transparent/congrats.png'"
                    alt="badge" />
            </div>
        </div>
        <img class="confetti right" src="assets/Images-Transparent/congrats.png" alt="confetti right" />
    </div>
    <div class="congrats-text">
        <h1>Badge Unclocked!</h1>
        <h2>Coin Collecter</h2>
        <p>You collected 500 coins!</p>
    </div>
    <div class="awesome-cta">
        <mindful-button type="magenta-transparent" text="View all Badges" large
            (click)="onViewAllBadges()"></mindful-button>
        <mindful-button type="magenta" text="Awesome" large (click)="onAwesomeClick()"></mindful-button>
    </div>

</div>
