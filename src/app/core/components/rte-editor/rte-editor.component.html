<div class="rte-host">
  <div #toolbar class="rte-toolbar" *ngIf="!simple" (mousedown)="$event.preventDefault()" [class.hidden]="!toolbarVisible">
    <button class="tool" title="Text color" (mousedown)="$event.preventDefault(); exec('foreColor', '#6B656A')">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="21" viewBox="0 0 20 21" fill="none">
        <path d="M0 21V17H20V21H0ZM3.5 14L8.75 0H11.25L16.5 14H14.1L12.85 10.4H7.2L5.9 14H3.5ZM7.9 8.4H12.1L10.05 2.6H9.95L7.9 8.4Z" fill="#6B656A"/>
      </svg>
    </button>

    <button class="tool" title="H1" (mousedown)="$event.preventDefault(); exec('formatBlock','H1')">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="10" viewBox="0 0 14 10" fill="none">
        <path d="M0 10V0H2V4H6V0H8V10H6V6H2V10H0ZM12 10V2H10V0H14V10H12Z" fill="#6B656A"/>
      </svg>
    </button>

    <button class="tool" title="Italic" (mousedown)="$event.preventDefault(); exec('italic')">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="14" viewBox="0 0 13 14" fill="none">
        <path d="M0 14V11.5H4L7 2.5H3V0H13V2.5H9.5L6.5 11.5H10V14H0Z" fill="#6B656A"/>
      </svg>
    </button>

    <button class="tool" title="List (tap to cycle: bullet → number → none)" (mousedown)="$event.preventDefault(); toggleListCycle()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="16" viewBox="0 0 18 16" fill="none">
        <path d="M6 15V13H18V15H6ZM6 9V7H18V9H6ZM6 3V1H18V3H6ZM2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14C0 13.45 0.195833 12.9792 0.5875 12.5875C0.979167 12.1958 1.45 12 2 12C2.55 12 3.02083 12.1958 3.4125 12.5875C3.80417 12.9792 4 13.45 4 14C4 14.55 3.80417 15.0208 3.4125 15.4125C3.02083 15.8042 2.55 16 2 16ZM2 10C1.45 10 0.979167 9.80417 0.5875 9.4125C0.195833 9.02083 0 8.55 0 8C0 7.45 0.195833 6.97917 0.5875 6.5875C0.979167 6.19583 1.45 6 2 6C2.55 6 3.02083 6.19583 3.4125 6.5875C3.80417 6.97917 4 7.45 4 8C4 8.55 3.80417 9.02083 3.4125 9.4125C3.02083 9.80417 2.55 10 2 10ZM2 4C1.45 4 0.979167 3.80417 0.5875 3.4125C0.195833 3.02083 0 2.55 0 2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0C2.55 0 3.02083 0.195833 3.4125 0.5875C3.80417 0.979167 4 1.45 4 2C4 2.55 3.80417 3.02083 3.4125 3.4125C3.02083 3.80417 2.55 4 2 4Z" fill="#6B656A"/>
      </svg>
    </button>

    <button class="tool" title="Bold" (mousedown)="$event.preventDefault(); exec('bold')">
      <svg xmlns="http://www.w3.org/2000/svg" width="11" height="14" viewBox="0 0 11 14" fill="none">
        <path d="M0 14V0H5.525C6.60833 0 7.60833 0.333333 8.525 1C9.44167 1.66667 9.9 2.59167 9.9 3.775C9.9 4.625 9.70833 5.27917 9.325 5.7375C8.94167 6.19583 8.58333 6.525 8.25 6.725C8.66667 6.90833 9.12917 7.25 9.6375 7.75C10.1458 8.25 10.4 9 10.4 10C10.4 11.4833 9.85833 12.5208 8.775 13.1125C7.69167 13.7042 6.675 14 5.725 14H0ZM3.025 11.2H5.625C6.425 11.2 6.9125 10.9958 7.0875 10.5875C7.2625 10.1792 7.35 9.88333 7.35 9.7C7.35 9.51667 7.2625 9.22083 7.0875 8.8125C6.9125 8.40417 6.4 8.2 5.55 8.2H3.025V11.2ZM3.025 5.5H5.35C5.9 5.5 6.3 5.35833 6.55 5.075C6.8 4.79167 6.925 4.475 6.925 4.125C6.925 3.725 6.78333 3.4 6.5 3.15C6.21667 2.9 5.85 2.775 5.4 2.775H3.025V5.5Z" fill="#6B656A"/>
      </svg>
    </button>

    <!-- attachment removed as requested -->
  </div>

  <textarea *ngIf="simple" #plain class="rte-plain" 
    [attr.placeholder]="placeholder"
    spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"
    (input)="onPlainInput()"></textarea>

  <div *ngIf="!simple" class="rte-editor" contenteditable="true" #editor
    dir="ltr"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"
    autocomplete="off"
    inputmode="text"
    (input)="onInput()"
    (focus)="onFocus()"
    (blur)="onBlur()"
    [attr.data-placeholder]="placeholder"
    role="textbox"
    aria-multiline="true"></div>
</div>
