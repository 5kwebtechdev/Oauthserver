<div class="week-streak-card" role="group" aria-label="Current week's streak">
  <span class="week-streak-title">{{ title }}</span>

  <div class="week-streak-row">
    <div class="week-streak-day" *ngFor="let day of days">
      <span class="week-streak-day-label">{{ day.label }}</span>
      <span class="week-streak-marker" [ngClass]="day.status" [attr.aria-label]="day.label + ' ' + day.status">
        <svg *ngIf="day.status === 'completed'" width="12" height="10" viewBox="0 0 12 10" fill="none" aria-hidden="true">
          <path d="M1 5.2L4.2 8.4L11 1.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="day.status === 'missed'" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
          <path d="M1 1L9 9M9 1L1 9" stroke="#fff" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
    </div>
  </div>
</div>
