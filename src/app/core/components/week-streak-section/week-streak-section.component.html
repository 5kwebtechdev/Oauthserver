<div class="week-streak-card" role="group" aria-label="Current week's streak">
  <span class="week-streak-title">{{ title }}</span>

  <div class="week-streak-row">
    <div class="week-streak-day" *ngFor="let day of days">
      <span class="week-streak-day-label">{{ day.label }}</span>
      <span class="week-streak-marker" [ngClass]="day.status" [attr.aria-label]="day.label + ' ' + day.status">
        <span *ngIf="day.status === 'completed'" class="week-streak-fire-crop" aria-hidden="true">
          <img
            class="week-streak-fire"
            src="assets/figma/child-home/week-streak-fire.webp"
            alt="">
        </span>
        <span *ngIf="day.status === 'missed'" class="week-streak-rest" aria-hidden="true">😴</span>
        <img *ngIf="day.status === 'pending'"
          class="week-streak-check"
          src="assets/figma/child-home/week-streak-check.svg"
          alt=""
          aria-hidden="true">
      </span>
    </div>
  </div>
</div>
