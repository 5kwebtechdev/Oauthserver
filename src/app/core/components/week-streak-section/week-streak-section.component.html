<div class="week-streak-card" role="group" aria-label="Last 7-day streak">
  <span class="week-streak-title">{{ title }}</span>

  <div class="week-streak-row">
    <div class="week-streak-day" *ngFor="let day of days">
      <span class="week-streak-day-label">{{ day.label }}</span>
      <span class="week-streak-marker" [ngClass]="day.status" [attr.aria-label]="day.label + ' ' + day.status">
        <span *ngIf="day.status === 'completed' || day.status === 'missed'" class="week-streak-fire-crop" aria-hidden="true">
          <img
            class="week-streak-fire"
            [class.week-streak-fire--missed]="day.status === 'missed'"
            src="assets/figma/child-home/week-streak-fire.webp"
            alt="">
        </span>
      </span>
    </div>
  </div>

  <div class="week-streak-summary" aria-live="polite">
    <span class="week-streak-summary__completed">{{ milestoneCompletedLabel }}</span>
    <span class="week-streak-summary__reward">{{ milestoneRewardLabel }}</span>
  </div>
</div>
