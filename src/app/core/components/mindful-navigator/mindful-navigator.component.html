<div class="navigator-root">
  <div class="navigator-inner">
    <div class="left-group">
      <button class="back-button" (click)="goBack()" aria-label="Go back" [class.cancel]="backIcon === 'cancel'">
        <ng-container *ngIf="backIcon !== 'cancel'; else imgIcon">
          <!-- Use the inline SVG back arrow for all non-cancel backIcon values -->
          <svg xmlns="http://www.w3.org/2000/svg" class="back-svg" width="24" height="24" viewBox="0 0 48 48"
            fill="none" aria-hidden="true">
            <path
              d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 24V25H36V24V23H12V24Z"
              fill="#282527" />
          </svg>
        </ng-container>
        <ng-template #imgIcon>
          <img [src]="backIconSrc" [alt]="backIconAlt">
          <span class="visually-hidden">{{ backIconAlt }}</span>
        </ng-template>
      </button>
      <h1 class="navigator-heading">{{ heading }}</h1>
    </div>
    <div class="right-group">
      <div class="right-actions">
        <ng-container *ngIf="rightActions && rightActions.length; else fallbackActions">
          <ng-container *ngFor="let action of rightActions; let i = index">
            <div *ngIf="action.type === 'edit'" class="right-edit-layout" (click)="onActionClick(i, action)"
              role="button" aria-label="Edit">
              <div class="eclipse">
                <img [src]="action.src || '/assets/app-assets/edit-icon.svg'" [alt]="action.alt || 'Edit'" />
              </div>
            </div>
            <button *ngIf="action.type === 'icon'" class="right-button" (click)="onActionClick(i, action)"
              [attr.aria-label]="action.alt || 'Action'">
              <img [src]="action.src" [alt]="action.alt || 'Action'">
            </button>

            <!-- icon with count (e.g., heart/favorite) rendered inside eclipse with badge -->
            <div *ngIf="action.type === 'iconWithCount' || action.type === 'heart'"
              class="right-edit-layout icon-with-count" (click)="onActionClick(i, action)" role="button"
              [attr.aria-label]="action.alt || 'Action with count'">
              <div class="eclipse">
                <!-- allow either inline svg data URL or image src -->
                <ng-container *ngIf="action.src?.startsWith('data:image') || action.src?.endsWith('.svg'); else imgSrc">
                  <img [src]="action.src" [alt]="action.alt || 'Action'" />
                </ng-container>
                <ng-template #imgSrc>
                  <img [src]="action.src" [alt]="action.alt || 'Action'" />
                </ng-template>
              </div>
            </div>
          </ng-container>
        </ng-container>
        <ng-template #fallbackActions>
          <div *ngIf="rightType === 'edit'" class="right-edit-layout" (click)="onRightClick()" role="button"
            aria-label="Edit">
            <div class="eclipse">
              <img src="/assets/app-assets/edit-icon.svg" alt="Edit" />
            </div>
          </div>

          <button *ngIf="rightIcon2" class="right-button right-button-2" (click)="onRight2Click()"
            aria-label="Right action 2">
            <img [src]="rightIcon2" [alt]="rightIcon2Alt || 'Action 2'">
            <span class="visually-hidden">{{ rightIcon2Alt || 'Action 2' }}</span>
          </button>

          <button *ngIf="rightIcon" class="right-button" (click)="onRightClick()" aria-label="Right action">
            <img [src]="rightIcon" [alt]="rightIconAlt || 'Action'">
            <span class="visually-hidden">{{ rightIconAlt || 'Action' }}</span>
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</div>
