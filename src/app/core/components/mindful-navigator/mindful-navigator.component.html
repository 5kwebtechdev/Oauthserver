<div class="navigator-root">
  <div class="navigator-inner">
    <div class="left-group">
      <button class="back-button" (click)="goBack()" aria-label="Go back" [class.cancel]="backIcon === 'cancel'">
        <ng-container *ngIf="backIcon !== 'cancel'; else imgIcon">
          <!-- Use the inline SVG back arrow for all non-cancel backIcon values -->
          <svg xmlns="http://www.w3.org/2000/svg" class="back-svg" width="24" height="24" viewBox="0 0 48 48"
            fill="none" aria-hidden="true">
            <path
              d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 24V25H36V24V23H12V24Z"
              fill="#282527" />
          </svg>
        </ng-container>
        <ng-template #imgIcon>
          <!-- Render inline 'cancel' SVG when backIcon is 'cancel', otherwise use the provided image src -->
          <ng-container *ngIf="backIcon === 'cancel'; else imageFallback">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none"
              aria-hidden="true">
              <path d="M1 1.5L12.3137 12.8137" stroke="#282527" stroke-width="2" stroke-linecap="round" />
              <path d="M1 12.5L12.3137 1.18629" stroke="#282527" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="visually-hidden">{{ backIconAlt }}</span>
          </ng-container>
          <ng-template #imageFallback>
            <img [src]="backIconSrc" [alt]="backIconAlt">
            <span class="visually-hidden">{{ backIconAlt }}</span>
          </ng-template>
        </ng-template>
      </button>
      <div class="navigator-heading-wrap">
        <h1 class="navigator-heading">{{ heading }}</h1>

        <!-- optional subtext row: renders when `showSubtext` is true or `subtext` is provided -->
        <div class="navigator-subtext-row" *ngIf="showSubtext || subtext">
          <div class="navigator-subtext">
            <span class="navigator-subtext-text">{{ subtext }}</span>
            <span class="navigator-subtext-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="9" height="6" viewBox="0 0 9 6" fill="none">
                <path d="M0.752053 0H8.18955C8.8583 0 9.19268 0.809375 8.7208 1.28125L5.00205 5C4.7083 5.29375 4.2333 5.29375 3.94268 5L0.220803 1.28125C-0.251072 0.809375 0.0833026 0 0.752053 0Z" fill="#90214D"/>
              </svg>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="right-group">
      <div class="right-actions">
        <!-- allow explicit projected content for slot="end" (e.g., <mindful-button slot="end">) -->
        <ng-content select="[slot='end']"></ng-content>

        <ng-container *ngIf="rightActions && rightActions.length; else fallbackActions">
          <ng-container *ngFor="let action of rightActions; let i = index">
            <!-- Edit action: prefer action.src when provided, otherwise render inline edit SVG -->
            <div *ngIf="action.type === 'edit'" class="right-edit-layout" (click)="onActionClick(i, action)"
              role="button" aria-label="Edit">
              <div class="eclipse">
                <ng-container *ngIf="action.src; else defaultEditSvg">
                  <img [src]="action.src" [alt]="action.alt || 'Edit'" />
                </ng-container>
                <ng-template #defaultEditSvg>
                  <!-- Inline Edit SVG (default) -->
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
                    aria-hidden="true">
                    <path
                      d="M2 16H3.425L13.2 6.225L11.775 4.8L2 14.575V16ZM0 18V13.75L13.2 0.575C13.4 0.391667 13.6208 0.25 13.8625 0.15C14.1042 0.05 14.3583 0 14.625 0C14.8917 0 15.15 0.05 15.4 0.15C15.65 0.25 15.8667 0.4 16.05 0.6L17.425 2C17.625 2.18333 17.7708 2.4 17.8625 2.65C17.9542 2.9 18 3.15 18 3.4C18 3.66667 17.9542 3.92083 17.8625 4.1625C17.7708 4.40417 17.625 4.625 17.425 4.825L4.25 18H0ZM12.475 5.525L11.775 4.8L13.2 6.225L12.475 5.525Z"
                      fill="#282527" />
                  </svg>
                </ng-template>
              </div>
            </div>

            <!-- delete action handled via generic 'icon' type to avoid strict template type checks -->
            <!-- Generic icon action. If it's a delete (alt contains 'delete') render inside the eclipse wrapper
                 so the icon has the same circular background as edit/heart actions. Otherwise render as a button. -->
            <ng-container *ngIf="action.type === 'icon'">
              <ng-container *ngIf="(action.alt || '').toLowerCase().indexOf('delete') !== -1; else normalIcon">
                <div class="right-edit-layout" (click)="onActionClick(i, action)" role="button"
                  [attr.aria-label]="action.alt || 'Delete'">
                  <div class="eclipse">
                    <ng-container *ngIf="action.src; else defaultDeleteInline">
                      <img [src]="action.src" [alt]="action.alt || 'Delete'" />
                    </ng-container>
                    <ng-template #defaultDeleteInline>
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 16 18" fill="none"
                        aria-hidden="true">
                        <path
                          d="M3 18C2.45 18 1.97917 17.8042 1.5875 17.4125C1.19583 17.0208 1 16.55 1 16V3H0V1H5V0H11V1H16V3H15V16C15 16.55 14.8042 17.0208 14.4125 17.4125C14.0208 17.8042 13.55 18 13 18H3ZM13 3H3V16H13V3ZM5 14H7V5H5V14ZM9 14H11V5H9V14Z"
                          fill="#1C1B1F" />
                      </svg>
                    </ng-template>
                  </div>
                </div>
              </ng-container>
              <ng-template #normalIcon>
                <button class="right-button" (click)="onActionClick(i, action)"
                  [attr.aria-label]="action.alt || 'Action'">
                  <ng-container *ngIf="action.src; else noSrcIcon">
                    <img [src]="action.src" [alt]="action.alt || 'Action'">
                  </ng-container>
                  <ng-template #noSrcIcon>
                    <!-- small generic dot icon as fallback -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
                      aria-hidden="true">
                      <circle cx="9" cy="9" r="2" fill="#282527" />
                    </svg>
                  </ng-template>
                </button>
              </ng-template>
            </ng-container>

            <!-- icon with count (e.g., heart/favorite) rendered inside eclipse with badge -->
            <div *ngIf="action.type === 'iconWithCount' || action.type === 'heart'"
              class="right-edit-layout icon-with-count" (click)="onActionClick(i, action)" role="button"
              [attr.aria-label]="action.alt || 'Action with count'">
              <div class="eclipse">
                <!-- allow either inline svg data URL or image src -->
                <ng-container *ngIf="action.src?.startsWith('data:image') || action.src?.endsWith('.svg'); else imgSrc">
                  <img [src]="action.src" [alt]="action.alt || 'Action'" />
                </ng-container>
                <ng-template #imgSrc>
                  <img [src]="action.src" [alt]="action.alt || 'Action'" />
                </ng-template>
              </div>
            </div>
          </ng-container>
        </ng-container>


        <ng-template #fallbackActions>
          <div *ngIf="rightType === 'edit'" class="right-edit-layout" (click)="onRightClick()" role="button"
            aria-label="Edit">
            <div class="eclipse">
              <img src="/assets/app-assets/edit-icon.svg" alt="Edit" />
            </div>
          </div>

          <button *ngIf="rightIcon2" class="right-button right-button-2" (click)="onRight2Click()"
            aria-label="Right action 2">
            <img [src]="rightIcon2" [alt]="rightIcon2Alt || 'Action 2'">
            <span class="visually-hidden">{{ rightIcon2Alt || 'Action 2' }}</span>
          </button>

          <button *ngIf="rightIcon" class="right-button" (click)="onRightClick()" aria-label="Right action">
            <img [src]="rightIcon" [alt]="rightIconAlt || 'Action'">
            <span class="visually-hidden">{{ rightIconAlt || 'Action' }}</span>
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</div>
