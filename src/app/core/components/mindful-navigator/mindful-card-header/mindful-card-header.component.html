<header class="mindful-card-header" [class.no-back]="!showBackArrow">
  <button *ngIf="showBackArrow" class="back-arrow-button" (click)="onBackClick()" aria-label="Go back">
    <svg xmlns="http://www.w3.org/2000/svg" class="back-arrow-svg" width="24" height="24" viewBox="0 0 48 48"
      fill="none" aria-hidden="true">
      <path
      d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 24V25H36V24V23H12V24Z"
      fill="#282527" />
    </svg>
  </button>
  <div class="main-card">
  <div class="mindful-card-header__left">
    <h3 class="mindful-card-header__title">{{ title }}</h3>
    <div class="mindful-card-header__tagline">
      <ng-container *ngIf="subtitleLeft">
        <span class="tag">{{ subtitleLeft }}</span>
      </ng-container>

      <ng-container *ngIf="subtitleMiddle">
        <!-- Render dot only if there was a previous subtitle to separate from -->
        <span *ngIf="subtitleLeft" class="dot"></span>
        <span class="tag">{{ subtitleMiddle }}</span>
      </ng-container>

      <ng-container *ngIf="subtitleRight">
        <!-- For right subtitle, show dot if either left or middle exists -->
        <span *ngIf="subtitleLeft || subtitleMiddle" class="dot"></span>
        <span class="tag">{{ subtitleRight }}</span>
      </ng-container>
    </div>
    </div>
    <div class="mindful-card-header__right">
      <div class="mindful-card-header__actions">
        <ng-content select="[mindful-header-actions]"></ng-content>
    
        <ng-content></ng-content>
    
      </div>
      </div>
    </div>
</header>
