<ion-content>
    <main class="my-order-container">
        <mindful-navigator heading="My Orders" backIcon="arrowSvg" (back)="goBack()">
        </mindful-navigator>
       <div class="orders-container d-flex flex-column gap-3">
            <div class="search-n-filter d-flex align-center justify-content-between gap-3">
            <div class="search-bar">
                <span class="search-icon" aria-hidden="true">
                    <img src="assets/icons/search-icon.svg" alt="" aria-hidden="true">
                </span>
                <input type="text" placeholder="Search your orders" />
            </div>

            <button class="orders-filter-button" aria-label="Filter orders" role="button" (click)="openFilterScreen()">
                <img src="assets/icons/filter-icon.svg" alt="" aria-hidden="true">
                <p>Filter</p>
            </button>

            </div>
            <div class="orders-section">
                <h2>{{ resultsText }}</h2>

                <div *ngIf="filteredOrders.length === 0" class="no-order-empty-state">
                    <empty-state
                        [imageSrc]="'assets/Images-Transparent/Cart-Blank.png'"
                        [imageAlt]="'No orders found'"
                        [leadText]="'No orders match that search'"
                        [subText]="'Try searching by Order ID, Item Name, or School Name to find what you\'re looking for.'"
                        [buttonText]="''">
                    </empty-state>
                </div>

                <div *ngIf="filteredOrders.length > 0" class="order-card-list d-flex flex-column gap-4 mt-3">
                    <div *ngFor="let order of filteredOrders" class="order-card">
                        <div class="order-delivery-date w-100">
                            <h2 [style.color]="getStatusColor(order.status)">{{ order.deliveryDate }}</h2>
                        </div>
                        <div class="order-item d-flex align-center gap-2 w-100">
                            <div class="product-image">
                            <img [src]="order.imageSrc" alt="Order Item Image">
                            </div>
                            <div class="item-info w-100">
                                <h2>{{ truncateText(order.productName, 48) }}</h2>
                                <p class="product-subtitle">{{ order.subtitle }}</p>
                                <p class="school-name">{{ order.schoolName }}</p>
                                <p *ngIf="order.status === 'returned-exchanged' || order.status === 'cancelled'" class="order-status" [style.color]="getSubStatusColor(order.subStatus)">{{ order.subStatus }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
       </div>
    </main>

    <!-- Filter Screen -->
    <div class="order-filter-screen" [class.visible]="isFilterScreenVisible">
        <div class="nav-head">
            <mindful-navigator heading="All Filters" backIcon="arrowSvg" (back)="goBack()">
        </mindful-navigator>
        </div>
        <div class="filter-content">
            <div class="status-filter d-flex flex-column gap-3">
                <h2>Status</h2>
                <div class="status-options d-flex flex-column gap-4">
                    <label>
                        <input type="checkbox" name="status" value="on-the-way" [checked]="selectedStatus.includes('on-the-way')" (change)="onStatusChange($event, 'on-the-way')" />
                        On the way
                    </label>
                    <label>
                        <input type="checkbox" name="status" value="delivered" [checked]="selectedStatus.includes('delivered')" (change)="onStatusChange($event, 'delivered')" />
                        Delivered
                    </label>
                    <label>
                        <input type="checkbox" name="status" value="cancelled" [checked]="selectedStatus.includes('cancelled')" (change)="onStatusChange($event, 'cancelled')" />
                        Cancelled
                    </label>
                     <label>
                        <input type="checkbox" name="status" value="returned-exchanged" [checked]="selectedStatus.includes('returned-exchanged')" (change)="onStatusChange($event, 'returned-exchanged')" />
                        Returned / Exchanged
                    </label>
                </div>
            </div>
            <div class="divider"></div>
            <div class="time-filter d-flex flex-column gap-3">
                <h2>Time</h2>
                <div class="time-options d-flex flex-column gap-4">
                    <label>
                        <input type="radio" name="time" value="last-30-days" [checked]="selectedTime === 'last-30-days'" (change)="onTimeChange('last-30-days')" />
                        Last 30 days
                    </label>
                    <label>
                        <input type="radio" name="time" value="last-3-months" [checked]="selectedTime === 'last-3-months'" (change)="onTimeChange('last-3-months')" />
                        Last 3 months
                    </label>
                    <label>
                        <input type="radio" name="time" value="last-6-months" [checked]="selectedTime === 'last-6-months'" (change)="onTimeChange('last-6-months')" />
                        Last 6 months
                    </label>
                     <label>
                        <input type="radio" name="time" value="older" [checked]="selectedTime === 'older'" (change)="onTimeChange('older')" />
                        Older
                    </label>     
                
                </div>  
            </div>            
        </div>
        <div class="filter-actions" style="padding:16px;">
            <mindful-button type="magenta" size="large" [text]="'Apply (Showing ' + filteredOrders.length + ' results)'" (click)="applyFilters()"></mindful-button>
        </div>
    </div>
</ion-content>
