<ion-content class="product-store-page">
    <main class="school-store-main">
        <header class="store-header">
            <div class="store-toolbar">
                <div class="store-toolbar__title-group">
                    <button type="button" class="store-icon-button store-back-button" aria-label="Go back"
                        (click)="goBack()">
                        <img src="assets/figma/product-store/back.svg" alt="" aria-hidden="true">
                    </button>
                    <button type="button" class="store-title-button"
                        [attr.aria-label]="selectedAddress ? 'Open delivery address options' : selectedCategoryLabel"
                        (click)="openAddressPopup()">
                        {{ selectedCategoryLabel }}
                    </button>
                </div>

                <nav class="store-toolbar__actions" aria-label="Store actions">
                    <button type="button" class="store-icon-button store-action-button" aria-label="Open cart"
                        (click)="openCart()">
                        <img src="assets/figma/product-store/cart.svg" alt="" aria-hidden="true">
                        <span *ngIf="cartCount > 0" class="store-action-count">{{ cartCount }}</span>
                    </button>
                    <button type="button" class="store-icon-button store-action-button" aria-label="Open orders"
                        (click)="openOrders()">
                        <img src="assets/figma/product-store/orders.svg" alt="" aria-hidden="true">
                        <span *ngIf="packageCount > 0" class="store-action-count">{{ packageCount }}</span>
                    </button>
                </nav>
            </div>

            <nav *ngIf="primarySubCategoryLevel as primaryLevel" class="primary-category-tabs"
                aria-label="Product categories">
                <button *ngFor="let category of primaryLevel.options" type="button"
                    [class.primary-category-tab--selected]="primaryLevel.selected === category.id"
                    [attr.aria-pressed]="primaryLevel.selected === category.id"
                    class="primary-category-tab" (click)="selectSubCategoryAt(0, category)">
                    {{ category.label }}
                </button>
            </nav>
        </header>

        <div class="product-store-content">
            <div class="school-info-bar" *ngIf="selectedCategoryRequiresSchoolClass && (schoolName || className)">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="school-info-text">
                    <span *ngIf="schoolName">{{ schoolName }}</span>
                    <span class="school-info-sep" *ngIf="schoolName && className"> · </span>
                    <span *ngIf="className">Class {{ className }}</span>
                </span>
                <button class="school-info-change" (click)="changeSchool()">Change</button>
            </div>

            <div class="store-catalog-layout">
                <aside *ngIf="railSubCategoryLevel as railLevel" class="subcategory-rail"
                    aria-label="Product types">
                    <button *ngFor="let category of railLevel.options" type="button" class="rail-category"
                        [class.rail-category--selected]="railLevel.selected === category.id"
                        [attr.aria-pressed]="railLevel.selected === category.id"
                        (click)="selectSubCategoryAt(1, category)">
                        <span class="rail-category__visual"
                            [class.rail-category__visual--all]="category.id === allSubCategoryId">
                            <img *ngIf="category.imageUrl" [src]="category.imageUrl" [alt]="category.label">
                            <span *ngIf="category.id === allSubCategoryId" aria-hidden="true">All</span>
                        </span>
                        <span>{{ category.label }}</span>
                    </button>
                </aside>

                <section class="product-pane" aria-label="Products">
                    <div class="product-filter-pills">
                        <button type="button" class="product-filter-pill" (click)="openFilters('brand')">
                            <span>Brand</span>
                            <img src="assets/figma/product-store/chevron.svg" alt="" aria-hidden="true">
                        </button>
                        <button type="button" class="product-filter-pill" (click)="openFilters('pageCount')">
                            <span>Page Count</span>
                            <img src="assets/figma/product-store/chevron.svg" alt="" aria-hidden="true">
                        </button>
                    </div>

                    <div class="product-list-wrap">
                        <div *ngIf="productsLoading || (!productsRequestCompleted && !productsError)"
                            class="product-list-card">
                            <div class="product-card product-card--skel" *ngFor="let s of [1,2,3,4]">
                                <div class="skel-img"></div>
                                <div class="product-info">
                                    <div class="skel-line skel-line--title"></div>
                                    <div class="skel-line skel-line--sub"></div>
                                    <div class="skel-line skel-line--price"></div>
                                </div>
                            </div>
                        </div>

                        <ng-container *ngIf="productsRequestCompleted && !productsLoading">
                            <ng-container *ngIf="!productsError; else productsErrorState">
                                <ng-container *ngIf="visibleProducts && visibleProducts.length; else emptyState">
                                    <div class="product-list-card">
                                        <article class="product-card" *ngFor="let p of visibleProducts"
                                            [class.product-card--disabled]="p.outOfStock"
                                            (click)="!p.outOfStock && openProduct(p)">
                                            <div class="product-image-wrap">
                                                <img [src]="p.img" [alt]="p.title">
                                                <h3 class="product-badge" *ngIf="getBadge(p) as badge">{{ badge }}</h3>
                                                <div class="oos-overlay" *ngIf="p.outOfStock">
                                                    <div class="oos-text">Out of stock</div>
                                                    <superme-button type="magenta" text="Notify"
                                                        (click)="notifyMe(p); $event.stopPropagation()"></superme-button>
                                                </div>
                                            </div>

                                            <div class="product-info">
                                                <div class="product-copy">
                                                    <h3 class="product-tag" *ngIf="p.tag">{{ p.tag }}</h3>
                                                    <h3 class="product-title">{{ p.title }}</h3>
                                                    <h3 class="product-subtitle" *ngIf="p.subtitle">{{ p.subtitle }}</h3>
                                                </div>
                                                <div class="product-card__footer">
                                                    <div class="product-prices">
                                                        <div class="price-discount">{{ p.price }}</div>
                                                        <div class="price-mrp" *ngIf="p.mrp">{{ p.mrp }}</div>
                                                    </div>

                                                    <superme-button *ngIf="isTextbooksSelected"
                                                        [type]="addedToBagIds.has(p.id) ? 'green' : 'magenta'"
                                                        [text]="addingToBagIds.has(p.id) ? 'Adding…' : addedToBagIds.has(p.id) ? '✓ Added' : 'Add To Bag'"
                                                        [disabled]="addingToBagIds.has(p.id)"
                                                        (click)="addToBag(p); $event.stopPropagation()">
                                                    </superme-button>
                                                </div>
                                            </div>
                                        </article>
                                    </div>
                                </ng-container>

                                <ng-template #emptyState>
                                    <empty-state [imageSrc]="'assets/School-assets/empty-product-list.png'"
                                        [imageAlt]="'No products'" [leadText]="'Nothing Here... Yet!'"
                                        [buttonText]="'View all Products'" [buttonType]="'magenta'"
                                        (buttonClick)="resetSubCategories()">
                                    </empty-state>
                                </ng-template>
                            </ng-container>

                            <ng-template #productsErrorState>
                                <empty-state [imageSrc]="'assets/School-assets/empty-product-list.png'"
                                    [imageAlt]="'Unable to load products'" [leadText]="'Unable to load products'"
                                    [buttonText]="'Retry'" [buttonType]="'magenta'"
                                    (buttonClick)="retryProducts()">
                                </empty-state>
                            </ng-template>
                        </ng-container>
                    </div>
                </section>
            </div>
        </div>

        <div *ngIf="showFilters" class="filter-sheet-backdrop" (click)="closeFilters()">
            <section class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title"
                (click)="$event.stopPropagation()">
                <header class="filter-sheet__header">
                    <h2 id="filter-sheet-title">Filters</h2>
                    <button type="button" aria-label="Close filters" (click)="closeFilters()">
                        <img src="assets/figma/product-store/close.svg" alt="" aria-hidden="true">
                    </button>
                </header>

                <div class="filter-sheet__body">
                    <nav class="filter-sheet__tabs" aria-label="Filter types">
                        <button type="button" [class.filter-sheet__tab--active]="activeFilter === 'brand'"
                            (click)="setActiveFilter('brand')">Brand</button>
                        <button type="button" [class.filter-sheet__tab--active]="activeFilter === 'pageCount'"
                            (click)="setActiveFilter('pageCount')">Page Count</button>
                    </nav>

                    <div class="filter-sheet__options">
                        <button *ngFor="let option of activeFilterOptions" type="button" class="filter-option"
                            role="checkbox" [attr.aria-checked]="isDraftFilterSelected(option)"
                            (click)="toggleDraftFilter(option)">
                            <span>{{ option }}</span>
                            <i [class.filter-option__checkbox--checked]="isDraftFilterSelected(option)"
                                aria-hidden="true">✓</i>
                        </button>
                        <p *ngIf="activeFilterOptions.length === 0" class="filter-options-empty">
                            No options available
                        </p>
                    </div>
                </div>

                <footer class="filter-sheet__footer">
                    <button type="button" class="filter-clear-button"
                        [disabled]="draftBrands.size === 0 && draftPageCounts.size === 0"
                        (click)="clearFilterDraft()">Clear all</button>
                    <button type="button" class="filter-apply-button" [disabled]="draftFilterResultCount === 0"
                        (click)="applyFilters()">Show {{ draftFilterResultCount }} products</button>
                </footer>
            </section>
        </div>

        <!-- Bottom fixed address popup -->
        <div class="address-popup" [class.open]="showAddressPopup" role="dialog" aria-modal="true"
            aria-label="Address options" (click)="closeAddressPopup()">
            <div class="address-popup-inner" (click)="$event.stopPropagation()">
                <button class="popup-close" aria-label="Close" (click)="closeAddressPopup()">✕</button>

                <!-- Loading state -->
                <div *ngIf="addressesLoading" class="addr-popup-loading">
                    <div class="addr-popup-spinner"></div>
                    <span>Loading addresses…</span>
                </div>

                <!-- Empty state -->
                <div *ngIf="!addressesLoading && addresses.length === 0" class="addr-popup-empty">
                    <p>No addresses saved.</p>
                </div>

                <!-- Address list -->
                <div *ngFor="let a of addresses" class="address-item" [class.selected]="selectedAddress?.id === a.id">
                    <div class="addr-main" role="button" tabindex="0"
                         (click)="selectAddress(a)" (keyup.enter)="selectAddress(a)">
                        <div class="addr-radio" [class.addr-radio--active]="a.isDefault">
                            <div class="addr-radio-dot"></div>
                        </div>
                        <div class="address-text" [innerHTML]="formatAddressHtml(a)"></div>
                    </div>
                    <div class="address-item-actions">
                        <button class="addr-action-btn addr-edit-btn" aria-label="Edit address"
                                (click)="editAddress(a)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </button>
                        <button class="addr-action-btn addr-delete-btn" aria-label="Delete address"
                                [disabled]="deletingAddressId === a.id"
                                (click)="deleteAddress(a)">
                            <svg *ngIf="deletingAddressId !== a.id" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                <path d="M10 11v6"/><path d="M14 11v6"/>
                                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                            </svg>
                            <svg *ngIf="deletingAddressId === a.id" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                 stroke-linecap="round" stroke-linejoin="round" class="addr-spin">
                                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="add-address" (click)="openAddressInput()">+ Add Address</button>
            </div>
        </div>

    </main>
</ion-content>
