<ion-content>
    <main class="school-store-main">

        <div class="navigator-wrap">
            <superme-navigator #navigator
                heading="Student-Store"
                [subtext]="navigatorSubtext"
                [showSubtext]="true"
                (back)="goBack()"
                [rightActions]="[{ type: 'cart', count: cartCount, alt: 'My cart' }, { type: 'package', count: packageCount, alt: 'Packages' }]"
                (rightActionClick)="onNavigatorAction($event)">
            </superme-navigator>

            <button class="subtext-trigger" aria-label="Open address popup" (click)="openAddressPopup()"></button>
        </div>

        <div class="product-store-content">
            <!-- Category and Subcategory sliders-->
            <div class="main-category">
                <div class="category-slider-wrap w-100">
                    <swiper-container #categorySlider class="category-swiper" slides-per-view="auto" space-between="24"
                        free-mode="true" free-mode-momentum="true" grab-cursor="true">
                        <swiper-slide class="category-slide" *ngFor="let c of categories; let i = index">
                            <div role="tab" class="category-item" [class.selected]="selectedCategory === c.id"
                                (click)="selectCategory(c)" tabindex="0"
                                [attr.aria-selected]="selectedCategory === c.id">
                                <span class="category-text" [class.selected-text]="selectedCategory === c.id">{{ c.label
                                    }}</span>
                            </div>
                        </swiper-slide>
                    </swiper-container>
                </div>
            </div>
            <!-- Subcategory Slider -->
            <div class="sub-category">
                <div class="category-slider-wrap w-100">
                    <swiper-container #subCategorySlider class="subcategory-swiper" slides-per-view="auto"
                        space-between="12" free-mode="true" free-mode-momentum="true" grab-cursor="true">
                        <swiper-slide class="subcategory-slide" *ngFor="let s of subCategories; let j = index">
                            <div role="tab" class="tab" [class.tab--selected]="selectedSubCategory === s.id"
                                (click)="selectSubCategory(s)" tabindex="0"
                                [attr.aria-selected]="selectedSubCategory === s.id">
                                <span class="tab-text">{{ s.label }}</span>
                            </div>
                        </swiper-slide>
                    </swiper-container>
                </div>
            </div>
            <!-- Product List -->
            <div class="product-list-wrap">
                <ng-container *ngIf="visibleProducts && visibleProducts.length; else emptyState">
                    <div class="product-list-card">
                        <div class="product-card" *ngFor="let p of visibleProducts"
                            (click)="!p.outOfStock && openProduct(p)">
                            <div class="product-image-wrap">
                                <img [src]="p.img" [alt]="p.title">
                                <h3 class="product-badge" *ngIf="getBadge(p) as badge">{{ badge }}</h3>
                                <!-- Out of stock overlay -->
                                <div class="oos-overlay" *ngIf="p.outOfStock">
                                    <div class="oos-text">Out of stock</div>
                                    <superme-button type="magenta" text="Notify" (click)="notifyMe(p)"></superme-button>
                                </div>
                            </div>

                            <div class="product-info">
                                <h3 class="product-tag"
                                    *ngIf="p.tag && !isTextbooksSelected">{{
                                    p.tag }}</h3>

                                <h3 class="product-title">{{ p.title }}</h3>
                                <h3 class="product-subtitle" *ngIf="p.subtitle">{{ p.subtitle }}</h3>
                                <div class="d-flex align-items-center justify-content-between w-100">
                                    <div class="product-prices">
                                        <div class="price-discount">{{ p.price }}</div>
                                        <div class="price-mrp">{{ p.mrp }}</div>
                                    </div>

                                    <superme-button
                                        *ngIf="isTextbooksSelected"
                                        type="magenta" text="Add To Bag"
                                        (click)="addToBag(p); $event.stopPropagation()"></superme-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>

                <ng-template #emptyState>
                    <empty-state
                        [imageSrc]="'assets/School-assets/empty-product-list.png'"
                        [imageAlt]="'No products'"
                        [leadText]="'Nothing Here... Yet!'"
                        [buttonText]="'View all Products'"
                        [buttonType]="'magenta'"
                        (buttonClick)="selectSubCategory({ id: 'all', label: 'All' })">
                    </empty-state>
                </ng-template>
            </div>
        </div>

        <!-- Bottom fixed address popup -->
        <div class="address-popup" [class.open]="showAddressPopup" role="dialog" aria-modal="true"
            aria-label="Address options" (click)="closeAddressPopup()">
            <div class="address-popup-inner" (click)="$event.stopPropagation()">
                <button class="popup-close" aria-label="Close" (click)="closeAddressPopup()">✕</button>

                <!-- Loading state -->
                <div *ngIf="addressesLoading" class="addr-popup-loading">
                    <div class="addr-popup-spinner"></div>
                    <span>Loading addresses…</span>
                </div>

                <!-- Empty state -->
                <div *ngIf="!addressesLoading && addresses.length === 0" class="addr-popup-empty">
                    <p>No addresses saved.</p>
                </div>

                <!-- Address list -->
                <div *ngFor="let a of addresses" class="address-item" [class.selected]="selectedAddress?.id === a.id">
                    <div class="addr-main" role="button" tabindex="0"
                         (click)="selectAddress(a)" (keyup.enter)="selectAddress(a)">
                        <div class="addr-radio" [class.addr-radio--active]="a.isDefault">
                            <div class="addr-radio-dot"></div>
                        </div>
                        <div class="address-text" [innerHTML]="formatAddressHtml(a)"></div>
                    </div>
                    <div class="address-item-actions">
                        <button class="addr-action-btn addr-edit-btn" aria-label="Edit address"
                                (click)="editAddress(a)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </button>
                        <button class="addr-action-btn addr-delete-btn" aria-label="Delete address"
                                [disabled]="deletingAddressId === a.id"
                                (click)="deleteAddress(a)">
                            <svg *ngIf="deletingAddressId !== a.id" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                <path d="M10 11v6"/><path d="M14 11v6"/>
                                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                            </svg>
                            <svg *ngIf="deletingAddressId === a.id" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                 stroke-linecap="round" stroke-linejoin="round" class="addr-spin">
                                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="add-address" (click)="openAddressInput()">+ Add Address</button>
            </div>
        </div>

    </main>

    <!-- Floating Top button -->
    <button *ngIf="visibleProducts && visibleProducts.length" class="top-button" aria-label="Scroll to top"
        (click)="scrollToTop()">
        <svg xmlns="http://www.w3.org/2000/svg" width="8" height="13" viewBox="0 0 8 13" fill="none">
            <path
                d="M4.03568 0.146447C3.84042 -0.0488155 3.52384 -0.0488155 3.32858 0.146447L0.146595 3.32843C-0.0486672 3.52369 -0.0486672 3.84027 0.146595 4.03553C0.341857 4.2308 0.65844 4.2308 0.853702 4.03553L3.68213 1.20711L6.51056 4.03553C6.70582 4.2308 7.0224 4.2308 7.21766 4.03553C7.41293 3.84027 7.41293 3.52369 7.21766 3.32843L4.03568 0.146447ZM3.18213 12.5C3.18213 12.7761 3.40599 13 3.68213 13C3.95827 13 4.18213 12.7761 4.18213 12.5H3.68213H3.18213ZM3.68213 0.5H3.18213L3.18213 12.5H3.68213H4.18213L4.18213 0.5L3.68213 0.5Z"
                fill="#282527" />
        </svg>
        <span class="top-text">Top</span>
    </button>

</ion-content>
