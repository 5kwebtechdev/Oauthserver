<ion-content>
    <main class="school-store-main">
        <div class="navigator-wrap">
            <superme-navigator
                #navigator
                heading="Student-Store"
                [subtext]="navigatorSubtext"
                [showSubtext]="true"
                (back)="goBack()"
                [rightActions]="[{ type: 'cart', count: cartCount, alt: 'My cart' }, { type: 'package', count: packageCount, alt: 'Packages' }]"
                (rightActionClick)="onNavigatorAction($event)">
            </superme-navigator>

        </div>

        <div class="school-store-content">

            <!-- Ad banner — loads STUDENT_STORE screen ads from API -->
            <div class="store-ad-wrap">
                <ad-banner screen="STUDENT_STORE"></ad-banner>
            </div>

            <!-- Categories loading state -->
            <div *ngIf="categoriesLoading" class="cat-loading">
                <div class="cat-spinner"></div>
                <span class="cat-loading-text">Loading categories…</span>
            </div>

            <!-- Categories error state -->
            <div *ngIf="!categoriesLoading && categoriesError" class="cat-error">
                <span class="cat-error-text">Failed to load categories</span>
                <button class="cat-retry" (click)="loadCategories()">Retry</button>
            </div>

            <!-- Dynamic category grid from API -->
            <div *ngIf="!categoriesLoading && !categoriesError && storeCategories.length" class="store-cards">
                <div class="store-card" role="button" tabindex="0"
                    *ngFor="let cat of storeCategories"
                    (click)="openCategory(cat)"
                    (keyup.enter)="openCategory(cat)"
                    [attr.aria-label]="cat.displayName">
                    <h3>{{ cat.displayName }}</h3>
                    <img [src]="cat.imageUrl" [alt]="cat.displayName"
                         onerror="this.style.display='none'">
                </div>
            </div>
            <div class="footer-exchange" role="contentinfo" aria-label="Store footer features">
                <div class="footer-item">
                    <img src="assets/School-assets/School Partner.png" alt="Official School Partner" />
                    <div class="footer-text">Official School Partner</div>
                </div>

                <div class="footer-item">
                    <img src="assets/School-assets/Easy Exchange.png" alt="Easy Exchange" />
                    <div class="footer-text">Easy Exchange</div>
                </div>

                <div class="footer-item">
                    <img src="assets/School-assets/Secure Payment.png" alt="Secure Payment" />
                    <div class="footer-text">Secure Payment</div>
                </div>
            </div>
        </div>
        <!-- Bottom fixed address popup -->
        <div class="address-popup" [class.open]="showAddressPopup" role="dialog" aria-modal="true" aria-label="Address options">
            <div class="address-popup-inner">
                <button class="popup-close" aria-label="Close" (click)="closeAddressPopup()">✕</button>
                <div *ngIf="addressesLoading" class="address-status">Loading addresses...</div>
                <div *ngIf="!addressesLoading && addressesError" class="address-status address-status--error">
                    <span>Unable to load addresses.</span>
                    <button type="button" (click)="loadAddresses()">Retry</button>
                </div>
                <div *ngIf="!addressesLoading && !addressesError && !addresses.length" class="address-status">
                    No saved address found.
                </div>

                <div class="address-item" *ngFor="let address of addresses"
                    (click)="selectAddress(address)"
                    [class.selected]="selectedAddress?.id === address.id"
                    [class.updating]="updatingDefaultAddressId === address.id"
                    role="button" tabindex="0" (keyup.enter)="selectAddress(address)">
                    <div class="address-text" [innerHTML]="formatAddressHtml(address)"></div>
                </div>

                <button class="add-address" (click)="openAddressInput()">+ Add Address</button>
            </div>
        </div>
    </main>
    <app-footer></app-footer>
</ion-content>
