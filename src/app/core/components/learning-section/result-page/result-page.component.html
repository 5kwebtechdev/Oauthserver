<ion-content>
  <superme-navigator heading="" backIcon="cancel" (back)="onCancel()">
  </superme-navigator>
  <div class="result-container">
    <div class="pet-container">
      <superme-pet [name]="'Buddy'" [pet]="'panda'" [mood]="getPetMood()" [age]="2" [sizePreset]="142">
      </superme-pet>
      <h2>{{ celebrationText || 'Great Work!' }}</h2>

      <div class="congrats-img">
        <img class="confetti left" src="assets/Images-Transparent/congrats.png" alt="confetti left"
          *ngIf="isExcellentScore()" />
        <div class="result-wrap" [ngStyle]="{'border-color': getScoreColor()}">
          <span class="question-count" [ngStyle]="{'color': getScoreColor()}">{{ correctAnswers }}/{{ totalQuestions
            }}</span>
        </div>
        <img class="confetti right" src="assets/Images-Transparent/congrats.png" alt="confetti right"
          *ngIf="isExcellentScore()" />
      </div>
    </div>

    <div class="reward-u-got">
      <div class="reward-item">
        <span class="plus">+</span>
        <img src="assets/Icons-Neutral/Icons-Coins.png" alt="Coins" class="reward-icon" />
        <span class="reward-count">{{ coinsEarned }}</span>
      </div>
      <div class="reward-item">
        <span class="plus">+</span>
        <img src="assets/Icons-Neutral/Icon-Trophy.png" alt="Trophy" class="reward-icon" />
        <span class="reward-count">{{ trophiesEarned }}</span>
      </div>
    </div>

    <!-- Overall Feedback -->
    <!-- <div class="feedback-section" *ngIf="overallFeedback">
      <p class="feedback-text">{{ overallFeedback }}</p>
    </div> -->

    <!-- First Completion Message -->
    <!-- <div class="first-completion-badge" *ngIf="firstCompletion">
      <p class="first-completion-text">🎉 First time completing this challenge!</p>
    </div> -->

    <!-- Badges Section -->
    <div class="badges-section" *ngIf="badges.length > 0">
      <div class="badge-grid w-100 d-flex">
        <div *ngFor="let badge of badges" class="badge-card w-100">
          <div class="badge-content">
            <div class="badge-info">
              <p class="progress-text">{{ badge.progress }}/{{ badge.target }}</p>
              <div class="badge-visual">
                <div class="badge-icon-container">
                  <img [src]="getBadgeIconUrl(badge)" [alt]="badge.title || badge.name" class="badge-icon"
                       (error)="onBadgeImageError($event, badge)" />
                </div>
                <superme-completion [completionPercentage]="getBadgeCompletionPercent(badge)"
                  [borderColor]="getScoreColor()" [innerText]="''" [belowText]="''">
                </superme-completion>
              </div>
            </div>
            <p class="badge-name">{{ badge.title || badge.name }}</p>
            <p class="badge-level-text">{{ badge.levelText || badge.level }}</p>
            <p class="badge-description">{{ badge.description }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="continue-button">
      <superme-button type="green" size="full" text="Continue" (click)="onContinue()"></superme-button>
    </div>

  </div>
</ion-content>
