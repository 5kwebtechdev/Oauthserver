<ion-content>
  <superme-navigator [heading]="challenge?.name || 'Quiz Result'" [centerHeading]="true" backIcon="cancel" (back)="onCancel()">
  </superme-navigator>
  <div class="result-container">
    <app-score-status [score]="scorePercentage" [correctAnswers]="correctAnswers"
      [totalQuestions]="totalQuestions"></app-score-status>

    <div class="reward-u-got" aria-label="Quiz reward and completion time">
      <div class="reward-item">
        <img [src]="rewardCoinIcon" alt="Coins" class="reward-icon" />
        <span class="reward-count">+{{ coinsEarned }}</span>
      </div>
      <span class="reward-divider" aria-hidden="true"></span>
      <div class="reward-item">
        <svg class="reward-clock" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 6v6l4 3" /></svg>
        <time class="reward-time">{{ getFormattedTime() }}</time>
      </div>
    </div>

    <!-- Overall Feedback -->
    <!-- <div class="feedback-section" *ngIf="overallFeedback">
      <p class="feedback-text">{{ overallFeedback }}</p>
    </div> -->

    <!-- First Completion Message -->
    <!-- <div class="first-completion-badge" *ngIf="firstCompletion">
      <p class="first-completion-text">🎉 First time completing this challenge!</p>
    </div> -->

    <section class="badges-section" *ngIf="badgeCards.length" aria-label="Your Badge Progress">
      <h2 class="badge-section-title">Your Badge Progress</h2>
      <div class="badge-grid">
        <article *ngFor="let badge of badgeCards" class="badge-card">
          <span class="badge-tier" *ngIf="badge.levelLabel">{{ badge.levelLabel }}</span>
          <app-badge-art [art]="badge.art" [src]="badge.icon" [label]="badge.name"></app-badge-art>
          <div class="badge-copy">
            <h3 class="badge-name">{{ badge.name }}</h3>
            <p class="badge-description">{{ badge.cardDescription }}</p>
            <div class="badge-progress" *ngIf="badge.percent !== null; else progressUnavailable">
              <span class="badge-progress-track" role="progressbar" [attr.aria-label]="badge.name + ' progress'"
                aria-valuemin="0" [attr.aria-valuemax]="badge.target" [attr.aria-valuenow]="badge.progress">
                <span [style.width.%]="badge.percent"></span>
              </span>
              <span class="badge-progress-value">{{ badge.progress }}/{{ badge.target }}</span>
            </div>
            <ng-template #progressUnavailable><span class="progress-unavailable">Progress unavailable</span></ng-template>
          </div>
        </article>
      </div>
    </section>

  </div>
</ion-content>
<ion-footer class="result-footer">
  <div class="continue-button">
    <superme-button type="green" size="full" text="Continue" (click)="onContinue()"></superme-button>
  </div>
</ion-footer>
