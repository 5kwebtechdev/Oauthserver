<ion-content #content fullscreen class="quiz-question-content" [class.quiz-question-content--web]="isWebBrowser">
    <ng-container *ngIf="currentQuestion as question">
        <div class="quiz-question-page">
            <header class="quiz-header">
                <button class="quiz-close-button" type="button" aria-label="Leave quiz" (click)="onCancel()">
                    <img src="assets/figma/quiz-question/asset-3.svg" alt="" aria-hidden="true" />
                </button>

                <h1 [title]="quizTitle">{{ quizTitle }}</h1>
                <button class="quiz-share-button" type="button" aria-label="Share quiz" (click)="shareQuiz()">
                    <img src="assets/figma/learning-details/share.svg" alt="" aria-hidden="true" />
                </button>
            </header>

            <section class="quiz-status-card" aria-label="Quiz progress">
                <div class="quiz-status-item">
                    <img class="quiz-status-icon" src="assets/figma/quiz-question/asset-5.svg" alt="" aria-hidden="true" />
                    <div>
                        <span class="quiz-status-label">Time Left</span>
                        <strong>{{ timerDisplay }}</strong>
                    </div>
                </div>

                <span class="quiz-status-divider" aria-hidden="true"></span>

                <div class="quiz-status-item">
                    <div>
                        <span class="quiz-status-label">Question</span>
                        <strong>{{ questionPositionLabel }}</strong>
                    </div>
                </div>
            </section>

            <main class="quiz-content">
                <figure *ngIf="question.image" class="quiz-question-media">
                    <img [src]="question.image" [alt]="questionImageAlt" loading="eager" />
                </figure>

                <section *ngIf="question.text" class="quiz-question-copy">
                    <h2>{{ question.text }}</h2>
                    <p>Select the most appropriate option</p>
                </section>

                <section class="quiz-options" aria-label="Answer options">
                    <ng-container *ngIf="question.type !== 'true-false' && question.type !== 'visual'">
                        <button
                            *ngFor="let option of question.options; let index = index"
                            class="quiz-option"
                            type="button"
                            [disabled]="answerChecked"
                            [class.is-selected]="!answerChecked && selectedOption === option"
                            [class.is-correct]="answerChecked && option === correctAnswer"
                            [class.is-incorrect]="answerChecked && selectedOption === option && option !== correctAnswer"
                            [attr.aria-pressed]="selectedOption === option"
                            (click)="selectAnswer(option)">
                            <span class="quiz-option-letter">{{ getOptionLabel(index) }}</span>
                            <span class="quiz-option-text">{{ option }}</span>
                        </button>
                    </ng-container>

                    <ng-container *ngIf="question.type === 'true-false'">
                        <button
                            *ngFor="let option of trueFalseOptions; let index = index"
                            class="quiz-option"
                            type="button"
                            [disabled]="answerChecked"
                            [class.is-selected]="!answerChecked && selectedOption === option"
                            [class.is-correct]="answerChecked && option === correctAnswer"
                            [class.is-incorrect]="answerChecked && selectedOption === option && option !== correctAnswer"
                            [attr.aria-pressed]="selectedOption === option"
                            (click)="selectAnswer(option)">
                            <span class="quiz-option-letter">{{ getOptionLabel(index) }}</span>
                            <span class="quiz-option-text">{{ option }}</span>
                        </button>
                    </ng-container>

                    <ng-container *ngIf="question.type === 'visual'">
                        <button
                            *ngFor="let option of question.visualOptions; let index = index"
                            class="quiz-visual-option"
                            type="button"
                            [disabled]="answerChecked"
                            [class.is-selected]="!answerChecked && selectedVisualOptionId === option.id"
                            [class.is-correct]="answerChecked && isVisualOptionCorrect(option)"
                            [class.is-incorrect]="answerChecked && selectedVisualOptionId === option.id && !isVisualOptionCorrect(option)"
                            [attr.aria-pressed]="selectedVisualOptionId === option.id"
                            (click)="selectAnswer(option.answerValue, option.id)">
                            <span class="quiz-option-letter">{{ getOptionLabel(index) }}</span>
                            <img *ngIf="option.imageUrl" [src]="option.imageUrl" [alt]="option.altText" loading="eager" />
                            <span *ngIf="option.label" class="quiz-visual-option-text">{{ option.label }}</span>
                        </button>
                    </ng-container>
                </section>

                <p *ngIf="hintErrorText" class="quiz-hint-message quiz-hint-message--error" role="alert">
                    {{ hintErrorText }}
                </p>
                <p *ngIf="showHint && currentHintText" class="quiz-hint-message" aria-live="polite">
                    {{ currentHintText }}
                </p>

                <button
                    class="quiz-hint-card"
                    type="button"
                    [disabled]="isHintLoading || hintLimitReached || totalCoins < coinsPerHint"
                    [attr.aria-pressed]="showHint"
                    (click)="toggleHint()">
                    <img class="quiz-hint-illustration" src="assets/figma/quiz-question/raw-1.webp" alt="" aria-hidden="true" />
                    <span class="quiz-hint-copy">
                        <strong>{{ isHintLoading ? 'Getting your hint...' : 'Need a hint?' }}</strong>
                        <span>Get a helpful clue to answer this question</span>
                    </span>
                    <span class="quiz-hint-meta">
                        <span class="quiz-hint-cost">
                            <img src="assets/figma/quiz-question/raw-5.webp" alt="" aria-hidden="true" />
                            {{ coinsPerHint }}
                        </span>
                        <span>{{ hintLimitReached ? 'Hint limit reached' : 'Hints left: ' + (maxHints - hintsUsed) + '/' + maxHints }}</span>
                    </span>
                </button>

                <button
                    class="quiz-check-button"
                    type="button"
                    [disabled]="!selectedAnswer || answerChecked"
                    (click)="onCheck()">
                    Check
                </button>
            </main>
        </div>
    </ng-container>

    <div *ngIf="!currentQuestion" class="quiz-loading-state" role="status" aria-live="polite">
        Loading quiz…
    </div>

    <div *ngIf="showPopup" class="popup-overlay" (click)="onNext()">
        <div class="popup-content" (click)="$event.stopPropagation()" [ngStyle]="{'background': popupBackgroundColor}">
            <div class="popup-label" [ngStyle]="{'color': popupTextColor}">{{ popupTitle }}</div>
            <div *ngIf="popupMessage" class="popup-text" [ngStyle]="{'color': popupTextColor}">{{ popupMessage }}</div>
            <superme-button *ngIf="nextButtonType === 'green'" type="green" size="full" [text]="nextButtonText" (click)="onNext()"></superme-button>
            <superme-button *ngIf="nextButtonType === 'bronze'" type="bronze" size="full" [text]="nextButtonText" (click)="onNext()"></superme-button>
        </div>
    </div>
</ion-content>

<app-superme-popup
    *ngIf="showLeaveChallengePopup"
    [config]="leaveChallengePopupConfig"
    [isVisible]="showLeaveChallengePopup"
    (closeAction)="showLeaveChallengePopup = false"
    (backdropClick)="showLeaveChallengePopup = false">
</app-superme-popup>

<app-superme-popup
    *ngIf="showContentTimeExhaustPopup"
    [config]="contentTimeExhaustPopupConfig"
    [isVisible]="showContentTimeExhaustPopup"
    (closeAction)="showContentTimeExhaustPopup = false"
    (backdropClick)="showContentTimeExhaustPopup = false">
</app-superme-popup>
