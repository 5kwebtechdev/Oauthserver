<div class="card-root">
    <div class="media">
        <app-img
            [src]="item.image"
            fallback="/assets/icons/Flux_Dev_a_surreal_and_vibrant_cinematic_photo_of_A_minimal_ye_3%201.jpg"
            [alt]="item.title"
            objectFit="cover">
        </app-img>
        <div class="difficulty" *ngIf="item.difficulty" [attr.data-label]="item.difficulty">
            <img [src]="difficultyImageSrc" [alt]="item.difficulty" />
        </div>
    </div>

    <div class="slide-body d-flex flex-column ">
        <div class="head">
            <div>
                <h3>{{ item.title }}</h3>
            </div>
              <!-- Prefer backend category (QUIZ/PUZZLE) mapped to lowercase for badge type,
                  fallback to subType or type if not present -->
              <superme-badge [type]="item.category ? (item.category.toLowerCase()) : (item.subType || item.type)"></superme-badge>

        </div>


        <p class="desc">{{ item.description }}</p>

        <div class="meta-row">
            <div class="meta-left">
                <span class="coins"><img src="assets/icons/child-home-coin-figma.png" alt="coins"
                        style="width:24px;height:auto;" /> {{ item.coins || 0 }}</span>
                <span class="trophy"><img src="assets/icons/child-home-trophy-figma.png" alt="trophy"
                        style="width:24px;height:auto;" /> {{ item.trophy || 0 }}</span>
            </div>
            <span class="time-duration" *ngIf="item.timeDuration">
                <img src="assets/figma/child-home/learning-schedule.svg" alt="" aria-hidden="true">
                {{ item.timeDuration }}
            </span>
            <superme-button [type]="'pink-small'" [text]="item.buttonText || 'Start Challenge'" (click)="onCardClick()"></superme-button>
        </div>
    </div>
</div>
