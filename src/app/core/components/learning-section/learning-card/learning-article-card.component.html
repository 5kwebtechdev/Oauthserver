<div class="card-root" role="button" tabindex="0" [attr.aria-label]="'Open ' + item.title"
    (click)="onCardClick()" (keydown.enter)="onCardClick()" (keydown.space)="$event.preventDefault(); onCardClick()">
    <div class="media">
        <app-img [src]="item.image" [alt]="item.title" objectFit="contain"></app-img>
    </div>

    <div class="article-body">
        <!-- Tags shown above title -->
        <div *ngIf="item.tags?.length" class="tags-row">
            <ng-container *ngFor="let tag of item.tags">
                <span class="tag">{{ tag }}</span>
            </ng-container>
        </div>

        <!-- tags are rendered above title -->

        <div class="d-flex justify-content-between align-items-center w-100 head">
            <h3>{{ item.title }}</h3>
            <span class="coins"><img src="assets/icons/superme-coin.webp" alt="coins" /> {{ item.coins || 0 }}</span>
        </div>

        <div class="meta-row">
            <p class="desc">{{ item.description }}</p>

            <superme-button class="text-nowrap" [type]="'pink-small'" [text]="item.buttonText || 'Read in 5 min'"
                (click)="onCardAction($event)"></superme-button>
        </div>
    </div>
</div>
