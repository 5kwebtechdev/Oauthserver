<div class="card-root">
    <div class="media">
        <img [src]="item.image" [alt]="item.title" />
    </div>

    <div class="article-body">
        <mindful-badge type="puzzle" text="Academic Performance"></mindful-badge>

        <div class="d-flex justify-content-between align-items-center w-100">
            <h3>{{ item.title }}</h3>
            <span class="coins"><img src="/assets/Icons-Neutral/Icons-Coins.png" alt="coins"
                    style="width:24px;height:auto;" /> {{ item.coins || 0 }}</span>
        </div>

        <div class="meta-row">
            <p class="desc">{{ item.description }}</p>

            <mindful-button class="text-nowrap" [type]="'pink'" [text]="'Read in 5 min'"
                (click)="onCardClick()"></mindful-button>
        </div>
    </div>
</div>
