<ion-content class="notes-fullscreen">

  <mindful-card-header [title]="'Quick Notes. Big Ideas'" [showBackArrow]="true"
    (backClick)="close()"></mindful-card-header>

  <div class="empty-notes-container">
    <div class="empty-notes-content">
      <img class="notes-blank-image" src="/assets/Images-Transparent/Image-Notes-Blank.png" alt="Blank Notes">
      <div class="empty-notes-text">
        <h2>No Notes Yet?</h2>
        <p>Write what’s on your mind. Notes help you save ideas, feelings, and cool moments.</p>
      </div>
    </div>
    <mindful-button type="magenta" large text="Write your first note" style="width: 100%; display: block;"
      (click)="goToNewNote()"></mindful-button>
  </div>

  <!--notes-->
  <div class="note-container">
    <div class="sort-row">
      <details class="sort-dropdown" role="listbox">
        <summary class="sort-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="sort-label">Date Created</span>
          <!-- dropdown arrow SVG -->
          <span class="sort-arrow" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <mask id="mask0_1346_5113" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="16"
                height="16">
                <rect y="16" width="16" height="16" rx="0.5" transform="rotate(-90 0 16)" fill="#F3F8F8" />
              </mask>
              <g mask="url(#mask0_1346_5113)">
                <path
                  d="M11.6464 6.31295C11.8417 6.50821 11.8417 6.8248 11.6464 7.02006L8.35355 10.313C8.15829 10.5082 7.84171 10.5082 7.64645 10.313L4.35355 7.02006C4.15829 6.82479 4.15829 6.50821 4.35355 6.31295L4.57978 6.08672C4.77504 5.89146 5.09162 5.89146 5.28689 6.08672L7.64645 8.44628C7.84171 8.64155 8.15829 8.64155 8.35355 8.44628L10.7131 6.08672C10.9084 5.89146 11.225 5.89146 11.4202 6.08672L11.6464 6.31295Z"
                  fill="#282527" />
              </g>
            </svg>
          </span>
        </summary>

        <div class="sort-options" role="presentation">
          <button class="sort-option selected" role="option">
            <span>Date Created</span>
            <span class="option-tick" aria-hidden="true">
              <!-- tick SVG -->
              <svg xmlns="http://www.w3.org/2000/svg" width="8" height="7" viewBox="0 0 8 7" fill="none">
                <path
                  d="M3.02022 6.57962C2.82496 6.77488 2.50838 6.77488 2.31311 6.57962L0.353554 4.62006C0.158292 4.4248 0.158291 4.10821 0.353553 3.91295L0.57978 3.68672C0.775042 3.49146 1.09162 3.49146 1.28689 3.68672L2.31311 4.71295C2.50838 4.90821 2.82496 4.90821 3.02022 4.71295L6.71311 1.02006C6.90838 0.824796 7.22496 0.824795 7.42022 1.02006L7.64645 1.24628C7.84171 1.44155 7.84171 1.75813 7.64645 1.95339L3.02022 6.57962Z"
                  fill="#1C1B1F" />
              </svg>
            </span>
          </button>

          <button class="sort-option" role="option">Date Modified</button>
          <button class="sort-option" role="option">A-Z</button>
          <button class="sort-option" role="option">Z-A</button>
        </div>
      </details>
    </div>

    <!-- Notes List -->
    <ng-container *ngIf="notes && notes.length; else noNotes">
      <div class="note-card" *ngFor="let note of notes; let i = index; trackBy: trackByIndex">
        <ng-container *ngIf="isList(note.text); else plainText">
          <ul class="note-text">
            <li *ngFor="let item of getList(note)">{{ item }}</li>
          </ul>
        </ng-container>
        <ng-template #plainText>
          <p class="note-text">{{ note.text }}</p>
        </ng-template>

        <div class="note-footer">
          <div>
            <h3>{{ note.title }}</h3>
            <span class="date">{{ formatDate(note.createdAt) }}</span>
          </div>
          <span class="tag" [ngClass]="primaryTagClass(note)">{{ primaryTag(note) }}</span>
        </div>
      </div>
    </ng-container>
    <!--Note Empty State-->
    <ng-template #noNotes>
      <div class="note-empty">No notes yet. Tap + to add your first note.</div>
    </ng-template>

    <!-- Floating Add Button -->
    <mindful-button type="magenta" small text="+" (click)="goToNewNote()"
      style="position: fixed; bottom: 20px; right: 20px;"></mindful-button>

  </div>

</ion-content>
