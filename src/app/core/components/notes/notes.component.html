<ion-content class="ion-padding">
  <ng-container [ngSwitch]="page">
    <div *ngSwitchCase="'empty'" class="notes-empty">
      <!-- Header area (back + title) -->
      <div class="empty-header">
        <button class="back-btn" aria-label="Back" (click)="close()">
          <img src="/assets/app-assets/Back-common-icon.svg" alt="Back" class="back-icon">
        </button>
        <div class="empty-title">Quick Notes. Big Ideas</div>
      </div>

      <div class="notes-epmty-message">
        <!-- Illustration from assets -->
        <div class="empty-illustration">
          <img src="/assets/app-assets/empty-notes-page.svg" alt="No notes illustration">
        </div>

        <!-- Primary messages -->
        <h3 class="empty-heading">No Notes Yet?</h3>
        <p class="empty-sub">Write what’s on your mind. Notes help you save ideas, feelings, and cool moments.</p>

  <!-- Action button -->
  <mindful-button type="magenta" fullWidth="true" text="Write your first notes" (click)="go('input')"></mindful-button>
      </div>
    </div>

    <div *ngSwitchCase="'home'" class="notes-home">
      <notes-home></notes-home>
    </div>
 <!--Notes New-->
    <div *ngSwitchCase="'input'" class="notes-input">
      <!-- Title row (back + title input) -->
      <div class="input-header">
        <button class="back-btn" aria-label="Back" (click)="go('empty')">
          <img src="/assets/app-assets/Back-common-icon.svg" alt="Back" class="back-icon">
        </button>
        <div class="title-input">
          <!-- show editable input when title is not collapsed; otherwise show truncated title -->
          <ion-input *ngIf="!titleCollapsed" placeholder="Title" [(ngModel)]="noteTitle"></ion-input>
          <h2 *ngIf="titleCollapsed" class="collapsed-title">{{ truncatedTitle }}</h2>
        </div>
      </div>

      <!-- Tag row (replaced by mindful-tags component) -->
      <div class="input-tags">
        <label class="tag-label">Tag</label>
        <button class="add-new-tag" (click)="tagsRef.openAdd()">Add new +</button>
        <mindful-tags #tagsRef
          [options]="tagOptions"
          (edit)="onTagEdit($event)"
          (delete)="onTagDelete($event)"
          (add)="onTagAdd($event)"
          (selectedKeysChange)="onSelectedKeysChange($event)"
        ></mindful-tags>
      </div>

      <!-- Large notes input area -->
      <div class="notes-textarea">
        <ion-textarea autoGrow rows="6" [(ngModel)]="noteText" placeholder="Notes here...." (click)="onNotesClick()"></ion-textarea>
      </div>

      <!-- Bottom toolbar with simple formatting icons could be added here -->
      <div class="input-actions">
        <mindful-button type="magenta" text="Save" (click)="save()"></mindful-button>
      </div>
    </div>

    <div *ngSwitchCase="'save'" class="notes-save">
      <h3>Saved</h3>
      <p>{{ noteText }}</p>
      <mindful-button type="lavendar" text="Back to Notes" (click)="go('home')"></mindful-button>
    </div>
  </ng-container>
</ion-content>
