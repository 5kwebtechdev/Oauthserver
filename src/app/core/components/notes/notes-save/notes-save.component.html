<ion-content>
<superme-navigator 
  [heading]="title" 
  [rightActions]="[
    { type: 'icon', src: 'assets/icons/delete.svg', alt: 'Delete' },
    { type: 'icon', src: 'assets/icons/share.svg', alt: 'Share' }
  ]"
  (back)="onBack()"
  (rightActionClick)="onNavigatorAction($event)">
</superme-navigator>
<div class="note-view">
  <!--note content-->
  <div class="note-content" [innerHTML]="contentHtml"></div>

    <!-- Debug: show raw payload for troubleshooting (remove in production) -->
    <pre class="note-raw">{{content}}</pre>

  <!-- Use the shared SupermePopup component for confirmation -->
  <app-superme-popup [isVisible]="showSupermePopup" [config]="{
      heading: 'Are you sure you want to delete this note?',
      subtitle: '',
      primaryCTA: { text: 'Delete', type: 'secondary', buttonStyle: 'bronze', buttonMedium: true },
      secondaryCTA: { text: 'Cancel', type: 'secondary', buttonStyle: 'bronze-transparent', buttonMedium: true },
      showCloseButton: false,
      backdrop: true
    }" (primaryAction)="confirmDelete()" (secondaryAction)="confirmCancel()"
    (backdropClick)="confirmCancel()"></app-superme-popup>
</div>
</ion-content>
