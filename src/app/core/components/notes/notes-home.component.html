<ion-content class="notes-home-page ion-padding">
  <!-- Header area (back + title) -->
      <div class="empty-header">
        <button class="back-btn" aria-label="Back" (click)="close()">
          <img src="/assets/app-assets/Back-common-icon.svg" alt="Back" class="back-icon">
        </button>
        <h2 class="empty-title">Quick Notes. Big Ideas</h2>
      </div>
        <!-- Dropdown button area (placed after header) -->
  
  <!-- List of notes -->
  <div class="notes-list">
    <div *ngFor="let n of notes" class="note-card">
      <div class="note-preview">{{ n.text }}</div>
      <div class="note-meta">
        <div>
          <div class="note-title">{{ n.title }}</div>
          <div class="note-date">{{ n.createdAt | date:'MMM d, y' }}</div>
        </div>
        <div class="note-tags">
          <mindful-badge *ngFor="let t of n.tags" [text]="t" type="task" large="true"></mindful-badge>
        </div>
      </div>
    </div>
  </div>
</ion-content>
