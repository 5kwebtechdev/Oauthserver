<div class="note-container">

    <!-- Header -->
    <div class="header">
      <button class="back-arrow" aria-label="Back">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-hidden="false">
          <path d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 25H36V23H12V25Z" fill="#282527"/>
        </svg>
      </button>
      <h1>Quick Notes. Big Ideas</h1>
    </div>

    <div class="sort-row">
      <button class="sort-btn">Date Created ▼</button>
    </div>

    <!-- Notes List -->
    <ng-container *ngIf="notes && notes.length; else noNotes">
      <div class="note-card" *ngFor="let note of notes; let i = index; trackBy: trackByIndex">
        <ng-container *ngIf="isList(note.text); else plainText">
          <ul class="note-text">
            <li *ngFor="let item of getList(note)">{{ item }}</li>
          </ul>
        </ng-container>
        <ng-template #plainText>
          <p class="note-text">{{ note.text }}</p>
        </ng-template>

        <div class="note-footer">
          <div>
            <h3>{{ note.title }}</h3>
            <span class="date">{{ formatDate(note.createdAt) }}</span>
          </div>
          <span class="tag" [ngClass]="primaryTagClass(note)">{{ primaryTag(note) }}</span>
        </div>
      </div>
    </ng-container>

    <ng-template #noNotes>
      <div class="note-empty">No notes yet. Tap + to add your first note.</div>
    </ng-template>

  <!-- Floating Add Button -->
  <a class="add-btn" [routerLink]="['/notes/new']" aria-label="Create new note">+</a>

</div>
