  <div class="header">
    <button class="back-arrow" (click)="goBack()" aria-label="Back">
      <!-- simple left arrow -->
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path
          d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V24V25ZM12 24V25H36V24V23H12V24Z"
          fill="#282527" />
      </svg>
    </button>
    <input class="title-input" placeholder="Title"
      [value]="displayValue"
      (input)="handleTitleInput($event)"
      (focus)="onTitleFocus()"
      (blur)="onTitleBlur()"
      [attr.title]="title || 'Title'"
      aria-label="Note title" />
    <button type="button" *ngIf="isDraft" class="delete-draft-icon" (click)="deleteDraft()" aria-label="Delete draft">
      <div class="eclipse">
        <img src="/assets/icons/delete.svg" alt="Delete" />
      </div>
    </button>
    <div class="title-limit-tooltip" *ngIf="showLimitTooltip">Maximum 48 characters allowed</div>
  </div>
<div class="note-new-container">

  <!-- Header -->

  <!-- Tag Section -->
  <mindful-tags variant="gray" [singleSelection]="true" [maxTags]="10"
    (selectedKeysChange)="onSelectedKeysChange($event)"></mindful-tags>

  <!-- Notes Section -->
  <div class="notes-section">
    <textarea placeholder="Notes here...." rows="8" [(ngModel)]="text" (ngModelChange)="saveDraft()"></textarea>
  </div>

  <footer class="notes-new__footer">
    <mindful-button type="magenta" text="Save" full [disabled]="!canSave" (click)="save()"></mindful-button>
  </footer>

</div>
