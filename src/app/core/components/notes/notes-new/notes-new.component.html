<div class="d-flex">
<mindful-navigator></mindful-navigator>

    <div class="header">
      <input class="title-input" placeholder="Title"
        [value]="displayValue"
        (input)="handleTitleInput($event)"
        (focus)="onTitleFocus()"
        (blur)="onTitleBlur()"
        [attr.title]="title || 'Title'"
        aria-label="Note title" />
      <button type="button" *ngIf="isDraft" class="delete-draft-icon" (click)="deleteDraft()" aria-label="Delete draft">
        <div class="eclipse">
          <img src="/assets/icons/delete.svg" alt="Delete" />
        </div>
      </button>
      <div class="title-limit-tooltip" *ngIf="showLimitTooltip">Maximum 24 characters allowed</div>
    </div>
</div>
  <div class="note-new-container">

  <!-- Header -->

  <!-- Tag Section -->
  <mindful-tags variant="gray" [singleSelection]="true" [maxTags]="10"
    (selectedKeysChange)="onSelectedKeysChange($event)"></mindful-tags>

  <!-- Notes Section -->
  <div class="notes-section">
    <textarea placeholder="Notes here...." rows="8" [(ngModel)]="text" (ngModelChange)="saveDraft()"></textarea>
  </div>

  <footer class="notes-new__footer">
    <mindful-button type="magenta" text="Save" full [disabled]="!canSave" (click)="save()"></mindful-button>
  </footer>

</div>
