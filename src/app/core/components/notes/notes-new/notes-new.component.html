<div class="notes-new-page">
  <header class="notes-new__topbar">
    <superme-navigator class="notes-new__nav" (back)="goBack()"></superme-navigator>

    <div class="header">
      <input class="title-input" placeholder="Enter title"
        [value]="displayValue"
        (input)="handleTitleInput($event)"
        (focus)="onTitleFocus()"
        (blur)="onTitleBlur()"
        [attr.title]="title || 'Enter title'"
        aria-label="Note title" />
      <button type="button" *ngIf="isDraft || editing" class="delete-draft-icon" (click)="onDelete()" aria-label="Delete draft">
        <div class="eclipse">
          <img src="assets/icons/delete.svg" alt="Delete" />
        </div>
      </button>
    </div>
  </header>

  <main class="note-new-container">

  <!-- Tag Section -->
  <div class="notes-tags-shell">
    <superme-tags variant="gray" [singleSelection]="true" [maxTags]="50"
      [options]="tagOptions"
      [selectedKeys]="selectedTagKeys"
      [useDefaultOptions]="false"
      [persistCustomTags]="false"
      [serverManaged]="true"
      [allowEdit]="true"
      [allowDelete]="true"
      (selectedKeysChange)="onSelectedKeysChange($event)"
      (add)="onTagAdd($event)"
      (edit)="onTagEdit($event)"
      (delete)="onTagDelete($event)"></superme-tags>
  </div>
  <div class="tag-state-message" *ngIf="tagsLoading">Loading tags...</div>
  <div class="tag-state-message tag-state-message--error" *ngIf="!tagsLoading && tagError">{{ tagError }}</div>

  <!-- Notes Section -->
  <div class="notes-section">
    <textarea class="notes-textarea" placeholder="Notes here...." [value]="text" (input)="text = ($any($event.target).value); saveDraft()"></textarea>
  </div>
  </main>

  <footer class="notes-new__footer">
    <superme-button type="magenta" text="Save" full [disabled]="loading || tagsLoading" (click)="save()"></superme-button>
  </footer>

  <!-- Confirmation popup for deletion when editing an existing note -->
  <app-superme-popup [isVisible]="showSupermePopup" [config]="{
      heading: 'Are you sure you want to delete this note?',
      subtitle: '',
      primaryCTA: { text: 'Delete', type: 'secondary', buttonStyle: 'bronze', buttonMedium: true },
      secondaryCTA: { text: 'Cancel', type: 'secondary', buttonStyle: 'bronze-transparent', buttonMedium: true },
      showCloseButton: false,
      backdrop: true
    }" (primaryAction)="confirmDelete()" (secondaryAction)="confirmCancel()" (backdropClick)="confirmCancel()"></app-superme-popup>

</div>
