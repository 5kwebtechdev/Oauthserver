<div class="tutor-list-root">
  <div class="tutor-list" role="list">
    <ng-container *ngIf="tutors && tutors.length > 0">
      <article class="tutors-section__card" role="listitem" *ngFor="let t of tutors">
        <div class="thumbnail">
          <div class="avatar" [ngStyle]="{'background-image': 'url(' + (t.avatar || '/assets/images/Avatar.png') + ')'}"
            aria-hidden="true"></div>
        </div>

        <div class="content">
          <div class="head">
            <div class="name-block">
              <p class="name">{{ t.name || 'Mr. Sharma' }}</p>
            </div>
            
            <div class="stats" aria-hidden="true">
              <img class="icon heart-icon" src="/assets/Icons-Neutral/Icon-Tutor-Like.png" alt="Likes"
              aria-hidden="true" />
              <span class="meta">{{ t.rating || 400 }} | {{ t.experience || '3-5 years Exp' }}</span>
            </div>
          </div>
          
          <div class="cta-row">
            <div class="tutor-role-detail d-grid">
            <p class="role">{{ t.description || 'Math & Science Wizard' }}</p>
            <label>Class 8, 10, 11</label>
            <div class="time">
              <img class="icon time-icon" src="/assets/Icons-Neutral/Icon-Tutor-Timings.png" alt="Timings"
                aria-hidden="true" />
              <span>Mon,Wed,Fri - 5:00PM-7:00PM</span>
            </div>

            </div>
            <div class="info d-flex justify-content-between align-items-end">
                <div class="fees d-flex align-items-baseline gap-1">
                 <p>₹ 800</p>
                <span>/per hour</span>
    </div>
                
                <mindful-button type="columbian-blue" medium [text]="'View Profile'" (click)="onViewProfile(t)"
                [attr.aria-label]="'View profile of ' + (t.name || 'Mr. Sharma')"></mindful-button>
            </div>
          </div>
        </div>
      </article>
    </ng-container>
  </div>
</div>
