<div class="tutor-homepage">
  <!--tutor home page header-->
  <div class="tutor-header">
    <!-- Heading and Button -->
    <div class="header-top">
  <h2>Your Guides to Greatness!</h2>
  <button class="refer-btn" (click)="openReferModal()">Refer a Tutor</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" placeholder="Looking for a math hero?">
      <span class="mic">🎤</span>
    </div>

    <!-- Panda Message -->
    <div class="panda-box">
      
      <div class="panda-text">
        Sniffed out the best tutors just for you, <br>
        ready to fetch your favorite?
      </div>
      <img src="/assets/app-assets/Panda Sitting Tired.svg" alt="Panda" class="panda-img">
    </div>
  </div>
  <!--Tutor filter and Sort Button-->
  <div class="controls-row">
    <button class="filter-btn" (click)="openAllFilters()">
      <span class="filter-icon">☰</span>
      <span class="filter-text">All Filters</span>
    </button>

    <div class="sort-wrapper" (click)="$event.stopPropagation()">
      <button class="sort-btn" (click)="toggleSortMenu()" [attr.aria-expanded]="isSortOpen"> 
        <span>{{ currentSortLabel }} ▾</span>
      </button>

      <ul class="sort-menu" *ngIf="isSortOpen" role="menu" aria-label="Sort options">
        <li class="sort-item" role="menuitem" [class.active]="currentSort === 'alphabets'" (click)="selectSort('alphabets')">Alphabets <span *ngIf="currentSort === 'alphabets'">✓</span></li>
        <li class="sort-item" role="menuitem" [class.active]="currentSort === 'mostLiked'" (click)="selectSort('mostLiked')">Most Liked <span *ngIf="currentSort === 'mostLiked'">✓</span></li>
        <li class="sort-item" role="menuitem" [class.active]="currentSort === 'experience'" (click)="selectSort('experience')">Experience <span *ngIf="currentSort === 'experience'">✓</span></li>
        <li class="sort-item" role="menuitem" [class.active]="currentSort === 'recent'" (click)="selectSort('recent')">Recently added <span *ngIf="currentSort === 'recent'">✓</span></li>
      </ul>
    </div>
  </div>

<!--tutor list-->
<div class="tutor-list-section">
  <div class="title-tutor-list">Top picks, trusted by many</div>
  <tutor-list [tutors]="tutors" (viewProfile)="onViewProfile($event)"></tutor-list>
  </div>

  <!--view all button-->
  <div class="view-all-container">
    <button class="view-all-btn" (click)="viewAllTutors()">View All</button>
  </div>

  <!-- Refer a Tutor Modal -->
  <div class="modal-backdrop" *ngIf="isReferModalOpen" (click)="closeReferModal()" aria-hidden="true"></div>

  <aside id="referModal" class="refer-modal" role="dialog" aria-modal="true" aria-labelledby="referModalTitle" *ngIf="isReferModalOpen">
    <header class="modal-header">
      <h4 id="referModalTitle">Refer a Tutor</h4>
      <button class="modal-close" (click)="closeReferModal()" aria-label="Close">✕</button>
    </header>

    <div class="modal-body">
      <p class="modal-sub">Know a tutor who should be here? Share our form so they can join</p>

      <div class="modal-actions">
        <button class="action-btn copy" (click)="copyLink()">📎 Copy Link</button>
        <button class="action-btn whatsapp" (click)="shareWhatsapp()">🟢 Share through Whatsapp</button>
      </div>
    </div>
  </aside>
</div>
