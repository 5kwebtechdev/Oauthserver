<div class="filters-page">

    <!-- Top Bar -->
    <div class="top-bar">
  <span class="back-arrow" (click)="close()">←</span>

      <button class="apply-btn">Apply filters</button>
    </div>

    <!-- Content Section -->
    <div class="content">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-item active">
          <img src="/assets/app-assets/Tutor-all-filters-subjects-icon.svg" alt="Subjects">
          <span>Subjects</span>
        </div>
        <div class="sidebar-item">
          <img src="/assets/app-assets/Tutor-all-filters-hobbies-icon.svg" alt="Hobbies">
          <span>Hobbies</span>
        </div>
        <div class="sidebar-item">
          <img src="/assets/app-assets/Tutor-all-filters-sports-icon.svg" alt="Sports">
          <span>Sports</span>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <div class="dropdowns">
          <select>
            <option>In-Person</option>
            <option>Online</option>
          </select>
          <select>
            <option>First</option>
            <option>Second</option>
            <option>Third</option>
            <option>Fourth</option>
            <option>Fifth</option>
            <option>Sixth</option>
            <option>Seventh</option>
            <option>Eighth</option>
            <option>Ninth</option>
            <option>Tenth</option>
            <option>Eleventh</option>
            <option>Twelfth</option>
          </select>
          <select>
            <option>Nearby</option>
            <option>All</option>
            <option>Chennai</option>
            <option>Mumbai</option>
            <option>Delhi</option>
            <option>Bangalore</option>
            <option>Kolkata</option>
            <option>Hyderabad</option>
          </select>
        </div>

        <ul class="filter-list">
          <li><label><input type="checkbox"> Mathematics</label></li>
          <li><label><input type="checkbox"> Science</label></li>
          <li><label><input type="checkbox"> English</label></li>
          <li><label><input type="checkbox"> Computer Science</label></li>
          <li><label><input type="checkbox"> Social Studies</label></li>
          <li><label><input type="checkbox"> Hindi</label></li>
          <li><label><input type="checkbox"> Environmental Studies</label></li>
          <li><label><input type="checkbox"> Regional Language</label></li>
          <li><label><input type="checkbox"> General Knowledge</label></li>
          <li><label><input type="checkbox"> Art & Craft</label></li>
        </ul>
      </div>
