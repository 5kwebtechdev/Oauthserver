<ion-content fullscreen>

  <div class="filters-page">

    <!--navigator header-->
    <mindful-navigator [heading]="'All Filters'" (back)="close()">
    </mindful-navigator>

      <!-- Content Section -->
    <div class="content">
      <!-- Topbar slider -->
      <div class="topbar-slider">
        <div class="swiper" #categoriesSwiper>
          <div class="swiper-wrapper">
            <div class="swiper-slide" *ngFor="let c of categories">
              <div class="topbar-slider-item" [class.active]="selectedCategory === c.key" (click)="selectCategory(c.key)">
                <img [src]="c.icon" [alt]="c.label">
                <span>{{ c.label }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
       <div class="filter-section d-flex gap-3">
         <div class="sidebar-filters">
           <span *ngFor="let g of sidebarGroups" (click)="selectSidebar(g.label)" [class.selected]="selectedSidebar === g.label">{{ g.label }}</span>
        </div>
      <div class="sub-filters-section w-full">
        <div class="sub-filter-list">
          <div class="sub-filter-item" *ngFor="let s of selectedSubFilters">
            <span class="sub-filter-label">{{ s }}</span>
            <input
              type="checkbox"
              class="sub-filter-checkbox"
              [checked]="selectedSubFilterSet.has(s)"
              (change)="onToggleSubFilter(s, ($any($event.target)).checked)"
            />
          </div>
        </div>

       </div>
      </div>
    </div>

        <div class="footer-actions d-flex justify-content-between align-items-center">
          <mindful-button type="columbian-blue-transparent" text="Clear all" (click)="clearAll()"></mindful-button>
          <mindful-button type="columbian-blue" text="Show result"></mindful-button>
        </div>
    </div>

</ion-content>
