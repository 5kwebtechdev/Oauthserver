<ion-content fullscreen>

  <div class="filters-page">

    <!--navigator header-->
    <mindful-navigator [heading]="'All Filters'" (back)="close()">
    </mindful-navigator>

      <!-- Content Section -->
    <div class="content">
      <!-- Topbar slider -->
      <div class="topbar-slider">
        <div class="swiper" #categoriesSwiper>
          <div class="swiper-wrapper">
            <div class="swiper-slide" *ngFor="let c of categories">
              <div class="topbar-slider-item" [class.active]="selectedCategory === c.key" (click)="selectCategory(c.key)">
                <img [src]="c.icon" [alt]="c.label">
                <span>{{ c.label }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="filter-section d-flex gap-3">
           <div class="sidebar-filters">
          <span>Skill</span>
          <span>Level / Proficiency</span>
          <span>Age Group</span>
          <span>Tutor Type</span>
          <span>Mode</span>
           <span>Location</span>
          </div>
      <div class="sub-filters-section w-full">
        <ion-list lines="none">
          <ion-item class="sub-filter-items">
            <ion-label>Nearby (5 km radius)</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-label>Chennai</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-label>Bangalore</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-label>Mumbai</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-label>Hyderabad</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-label>Delhi</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
          <ion-item>
            <ion-label>Kolkata</ion-label>
            <ion-checkbox slot="end"></ion-checkbox>
          </ion-item>
        </ion-list>

    </div>
      </div>
    </div>
  </div>

</ion-content>
