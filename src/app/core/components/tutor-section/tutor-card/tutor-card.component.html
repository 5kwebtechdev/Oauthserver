<section class="tutors-section d-flex flex-column gap-4">
  <superme-card-header [title]="'Your Guides to Greatness!'" [subtitleLeft]="'Pick tutor'" [subtitleMiddle]="'Learn'"
    [subtitleRight]="'Level up'">
    <superme-view-all superme-header-actions [routerLink]="['/authed','tutors']" (clicked)="onViewAll()"
      class="tutors-section__view-all">
    </superme-view-all>
  </superme-card-header>


  <div class="tutors-section__list" role="list">
    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading tutors...</p>
    </div>

    <!-- Tutor list -->
    <tutor-list *ngIf="!isLoading" [tutors]="tutors" (viewProfile)="onViewProfile($event)"></tutor-list>
  </div>
</section>
