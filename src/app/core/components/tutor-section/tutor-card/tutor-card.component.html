<section class="eduhub-section" aria-labelledby="eduhub-title">
  <header class="eduhub-header">
    <div>
      <h3 id="eduhub-title">EduHub</h3>
      <p>Tutors • Academies • And more near you</p>
    </div>
    <div class="eduhub-listings" *ngIf="!isLoading">
      <strong>{{ listingCount }}</strong>
      <span>Listings</span>
    </div>
  </header>

  <nav class="eduhub-categories" aria-label="Education categories">
    <button *ngFor="let category of categories; let first = first"
      type="button"
      class="eduhub-category"
      [class.active]="first"
      (click)="navigateCategory(category.route)">
      <span class="eduhub-category__image">
        <img [src]="category.image" [alt]="category.label">
      </span>
      <span>{{ category.label }}</span>
    </button>
  </nav>

  <div class="eduhub-loading" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="eduhub-tutors" *ngIf="!isLoading && tutors.length">
    <article class="eduhub-tutor" *ngFor="let tutor of tutors" (click)="onViewProfile(tutor)"
      role="button" tabindex="0" (keyup.enter)="onViewProfile(tutor)">
      <img class="eduhub-tutor__avatar" [src]="tutor.avatar" [alt]="tutor.name">
      <div class="eduhub-tutor__body">
        <div class="eduhub-tutor__headline">
          <strong>{{ tutor.name }}</strong>
          <span class="eduhub-tutor__likes" *ngIf="tutor.champsLiked !== undefined">
            <img src="assets/figma/child-home/eduhub-heart.png" alt="" aria-hidden="true">
            {{ tutor.champsLiked }}
            <ng-container *ngIf="tutor.experience"> | {{ tutor.experience }}</ng-container>
          </span>
        </div>
        <p>{{ tutor.description }}</p>
        <small *ngIf="tutor.location">{{ tutor.location }}</small>
        <small class="eduhub-tutor__time" *ngIf="tutor.startTime || tutor.endTime">
          <img src="assets/figma/child-home/eduhub-time.png" alt="" aria-hidden="true">
          {{ tutor.startTime }}<ng-container *ngIf="tutor.startTime && tutor.endTime">–</ng-container>{{ tutor.endTime }}
        </small>
        <div class="eduhub-tutor__footer">
          <span *ngIf="tutor.hourlyRate">₹ {{ tutor.hourlyRate }} / hour</span>
          <button type="button" (click)="onViewProfile(tutor); $event.stopPropagation()">View Profile</button>
        </div>
      </div>
    </article>
  </div>

  <p class="eduhub-empty" *ngIf="!isLoading && !tutors.length">No listings available right now.</p>

  <button class="eduhub-view-all" type="button" (click)="onViewAll()">View all categories</button>
</section>
