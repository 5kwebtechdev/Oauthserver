<ion-content fullscreen>
  <div class="tutor-profile-container">
    <!-- mindful navigator -->
    <mindful-navigator heading="Tutor profile" backIcon="arrowSvg" (back)="close()" [rightActions]="navActions"
      (rightActionClick)="handleNavAction($event)"></mindful-navigator>

    <div class="hero">
      <div class="avatar"
        [ngStyle]="{'background-image': 'url(' + (tutor?.avatar || '/assets/images/Avatar.png') + ')'}">
      </div>
      <h2 class="name">{{ tutor?.name || 'Mr. Sharma' }}</h2>
      <!-- <p class="role">{{ tutor?.description || 'Math & Science Wizard' }}</p> -->

      <div class="subjects">
        <span class="pill" *ngFor="let s of (tutor?.subjects || ['Maths','Science','English'])">{{ s }}</span>
      </div>

      <div class="meta-row">
        <div class="meta">
          <img src="/assets/Icons-Neutral/Icon-Tutor-Like.png" alt="likes" />
          <span>{{ tutor?.rating || (navActions[0]?.count || 0) }} champs liked</span>
        </div>
        <div class="meta">
          <img src="/assets/Icons-Neutral/Icon-Tutor-Experience.png" alt="experience" />
          <span>{{ tutor?.experience || '8yrs+ Experience' }}</span>
        </div>
      </div>

      <div class="card">
        <div class="card-intro">
          <h3>Futuristic Academy</h3>
          <p>Andheri east, Mumbai</p>
        </div>
        <div class="level">
          <p class="level-text">Level 5, 6, 7</p>
          <p class="level-subtext"><span class="dot">.</span> In person</p>
        </div>
        <div class="time-fees">
          <div class="item"><img src="/assets/Icons-Neutral/Icon-Tutor-Timings.png" alt="time" /> 5pm-8pm</div>
          <div class="item"><img src="/assets/Icons-Neutral/Icon-Tutor-Fees.png" alt="fees" /> ₹800/ subject</div>
        </div>
      </div>
    </div>

    <div class="faq-section">
      <!-- Replace static FAQ list with reusable ProfileFacts component -->
      <profile-facts [faqs]="tutorFaqs"></profile-facts>
    </div>
  </div>
</ion-content>
