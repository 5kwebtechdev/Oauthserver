<div class="network-issue-root" *ngIf="visible$ | async">
  <div class="network-card">
    <img src="assets/Images-Transparent/server-issue.png" alt="Server issue" />
    <h2>Oof! Something went wrong</h2>
    <p>Our servers are taking a quick nap. Please check your internet or try again in a few minutes.</p>
    <div class="retry-wrap">
      <superme-button type="green" full [text]="'Retry'" (click)="retry()"></superme-button>
    </div>
  </div>
</div>
