<!-- ── Full-screen offline overlay ── -->
<div class="offline-overlay" [class.offline-overlay--visible]="isOffline" aria-live="assertive" role="alert">
  <div class="offline-card">

    <!-- Wifi-off icon -->
    <div class="wifi-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="19" r="1.5" fill="#E1527C"/>
        <path d="M5.5 12.5C7.4 10.9 9.6 10 12 10c.9 0 1.8.1 2.6.4" stroke="#E1527C" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M2 9C5 6.4 8.3 5 12 5c1.3 0 2.6.2 3.8.5" stroke="#E1527C" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 15.5c.9-.6 1.9-.9 3-.9s2.1.3 3 .9" stroke="#E1527C" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="3" y1="3" x2="21" y2="21" stroke="#E1527C" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>

    <img src="assets/Images-Transparent/server-issue.webp" alt="No internet connection" class="offline-img" />

    <h2 class="offline-title">No Internet Connection</h2>
    <p class="offline-body">
      Looks like you're offline. Check your<br/>
      Wi‑Fi or mobile data and try again.
    </p>

    <button class="retry-btn" (click)="retry()" [disabled]="isRetrying" [class.retry-btn--checking]="isRetrying">
      <span *ngIf="!isRetrying">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="margin-right:6px;vertical-align:middle;">
          <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Try Again
      </span>
      <span *ngIf="isRetrying" class="checking-text">
        <span class="dot-pulse">Checking</span>
      </span>
    </button>
  </div>
</div>

<!-- ── Reconnected banner ── -->
<div class="reconnected-banner" [class.reconnected-banner--visible]="showReconnectedBanner" aria-live="polite" role="status">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span>Back online! Refreshing your data…</span>
</div>
