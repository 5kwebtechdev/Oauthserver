<div *ngIf="type" class="button {{type}}" [ngClass]="{'medium': medium , 'large': large, 'disabled': disabled}" [attr.role]="'button'" [attr.tabindex]="disabled ? -1 : 0">
  <ng-container *ngIf="icon; else textOnly">
    <img class="btn-icon" [src]="icon" alt=""/>
    <p>{{text}}</p>
  </ng-container>
  <ng-template #textOnly>
    <p>{{text}}</p>
  </ng-template>
</div>
<ng-container *ngIf="!type">
  <p style="color: red; font-weight: bold; font-size:16px">
    Button Style Not defined
  </p>
</ng-container>
