<section class="qa-section" aria-labelledby="qa-heading">
  <h3 class="qa-title" id="qa-heading">Quick Access</h3>

  <a *ngIf="journalAvailable === true" class="qa-hero-card" role="button" tabindex="0"
    [class.is-checking]="checkingJournalAvailability"
    (click)="openJournal($event)" (keydown.enter)="openJournal($event)"
    [attr.aria-busy]="checkingJournalAvailability">
    <img class="qa-hero-icon" src="assets/figma/child-home/quick-journal.png" alt="" aria-hidden="true">
    <span class="qa-hero-copy">
      <span class="qa-hero-kicker">Your Journal</span>
      <span class="qa-hero-title">How was your day?</span>
      <span class="qa-hero-subtitle">Write your thoughts, track your mood,<br>and celebrate little wins</span>
    </span>
    <span class="qa-write-btn">Write Now</span>
  </a>

  <div class="qa-shortcuts" [class.qa-shortcuts--with-journal]="journalAvailable === false">
    <a class="qa-shortcut-card qa-shortcut-notes" [routerLink]="['/authed/notes']">
      <img src="assets/figma/child-home/quick-notes.png" alt="" class="qa-shortcut-icon">
      <span class="qa-shortcut-label">Notes</span>
    </a>
    <a class="qa-shortcut-card qa-shortcut-calendar" [routerLink]="['/authed/activity-calendar']">
      <img src="assets/figma/child-home/quick-calendar.png" alt="" class="qa-shortcut-icon">
      <span class="qa-shortcut-label">Calendar</span>
    </a>
    <a *ngIf="journalAvailable === false" class="qa-shortcut-card qa-shortcut-journal"
      [routerLink]="['/authed/journal-output']">
      <img src="assets/figma/child-home/quick-journal.png" alt="" class="qa-shortcut-icon">
      <span class="qa-shortcut-label">Journal</span>
    </a>
  </div>
</section>
