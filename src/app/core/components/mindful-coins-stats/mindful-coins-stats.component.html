<div class="stats-row" role="list" aria-label="User stats">
  <div class="stats-inner">
    <div class="stat-col" role="listitem" aria-label="Coins">
      <img [src]="coinsIcon" alt="Coins" class="stat-icon">
      <div class="stat-value">{{ userCoins | number }}</div>
      <span class="stat-label visually-hidden">Coins</span>
    </div>
    <span class="stat-divider-vertical" aria-hidden="true"></span>

    <div class="stat-col" role="listitem" aria-label="Streaks">
      <img [src]="streaksIcon" alt="Streaks" class="stat-icon">
      <div class="stat-value">{{ userStreaks }}</div>
      <span class="stat-label visually-hidden">Streaks</span>
    </div>
    <span class="stat-divider-vertical" aria-hidden="true"></span>

    <div class="stat-col" role="listitem" aria-label="Days">
      <img [src]="daysIcon" alt="Days" class="stat-icon">
      <div class="stat-value">{{ userDays }}</div>
      <span class="stat-label visually-hidden">Days</span>
    </div>
    <span class="stat-divider-vertical" aria-hidden="true"></span>

    <div class="stat-col" role="listitem" aria-label="Badges">
      <img [src]="badgesIcon" alt="Badges" class="stat-icon">
      <div class="stat-value">{{ userBadges }}</div>
      <span class="stat-label visually-hidden">Badges</span>
    </div>
  </div>
</div>
