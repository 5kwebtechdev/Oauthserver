<ion-content>
    <superme-card-header
        [showBackArrow]="true"
        [title]="'Spend Your Coins!'"
        [subtitleLeft]="'Earn coins'"
        [subtitleMiddle]="'Pick your prize'"
        [subtitleRight]="'Flaunt your style'"
        (backClick)="onBack()">
    </superme-card-header>

    <div class="coin-purchases-page">
        <div class="coin-balance">
            <h1>Your Coin Balance</h1>
            <div class="balance-display d-flex align-items-center gap-2">
             <img src="assets/Navigation/figma-logged-in/coin.png" alt="SuperMe coin" class="coin-icon">
                <span class="coin-value">{{ coinTotal}}</span>
            </div>
        </div>
        <div class="coming-soon coming-soon--mobile">
            <empty-state imageSrc="/assets/Images-Transparent/Redeem Coins-Blank.png"
                     imageAlt="Redeem coins blank"
                     leadText="Your treasure vault is loading"
                     subText="You've been crushing it and stacking coins. Soon, you'll see pets and accessories to spend them on. Keep building your balance, the store opens soon."
                     buttonText="">
            </empty-state>
        </div>

        <section class="vault-preview" aria-labelledby="vault-preview-title">
            <span class="vault-sparkle vault-sparkle--one" aria-hidden="true"></span>
            <span class="vault-sparkle vault-sparkle--two" aria-hidden="true"></span>
            <span class="vault-sparkle vault-sparkle--three" aria-hidden="true"></span>
            <div class="vault-art" aria-hidden="true">
                <span class="vault-glow"></span>
                <img src="assets/Images-Transparent/Redeem Coins-Blank.png" alt="">
            </div>
            <div class="vault-copy">
                <span class="coming-soon-pill">Rewards are coming soon</span>
                <h2 id="vault-preview-title">Your treasure vault is loading</h2>
                <p>You've been crushing it and stacking coins. Soon, you'll see pets and accessories to spend them on. Keep building your balance—the store opens soon.</p>
                <div class="vault-tip">
                    <img src="assets/Navigation/figma-logged-in/coin.png" alt="" aria-hidden="true">
                    <span>Keep earning coins while we prepare your rewards!</span>
                </div>
            </div>
        </section>
    </div>
</ion-content>
