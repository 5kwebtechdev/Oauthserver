<!-- List Mode -->
<!-- Shared header used by both list and recent modes -->
<ng-template #dayHeader>
  <mindful-card-header title="Today at a Glance" subtitleMiddle="Check tasks • Finish habits • Crush it">
    <img src="/assets/Icons-Neutral/Icon-Time Management.png" alt="View All" class="day-at-glance__view-all"
      (click)="openTimeline()" style="cursor:pointer;" />
  </mindful-card-header>
</ng-template>
<div *ngIf="mode === 'list'" class="d-flex flex-column gap-2">
  <div class="day-at-glance-container">
    <ng-container *ngTemplateOutlet="dayHeader"></ng-container>

    <!-- Tab Navigation: show unless there are no items overall, or the selected tab's items are all done, or everything is completed -->
    <div class="container w-full" *ngIf="!((!hasHabits && !hasTasks) || (currentActive === 'habits' && habitAllDoneComputed) || (currentActive === 'tasks' && taskAllDoneComputed) || (isAllCompleted || isAllCompletedComputed))">
      <div class="row toggler"
        [ngClass]="{ 'habits-active': currentActive === 'habits', 'tasks-active': currentActive === 'tasks' }">
        <div class="col-4" (click)="switchTab('all')" [ngClass]="currentActive === 'all' ? 'active' : ''">All</div>
        <div class="col-4" (click)="switchTab('habits')" [ngClass]="currentActive === 'habits' ? 'active' : ''">Habits
        </div>
        <div class="col-4" (click)="switchTab('tasks')" [ngClass]="currentActive === 'tasks' ? 'active' : ''">Tasks
        </div>
      </div>
    </div>

    <!-- Empty State (uses shared EmptyStateComponent) -->
    <!-- Task-specific: all tasks completed/skipped -->
    <empty-state *ngIf="isEmpty && currentActive === 'tasks' && taskAllDoneComputed"
      leadText="All tasks done!"
      subText="Your tasks can be reviewed in the main habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>

    <!-- Task-specific: no tasks at all -->
    <empty-state *ngIf="isEmpty && currentActive === 'tasks' && !taskAllDoneComputed"
      leadText="No tasks lined up for today"
      subText="No tasks are scheduled for today. Add one to start building your streak and earn coins."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: all habits completed/skipped -->
    <empty-state *ngIf="isEmpty && currentActive === 'habits' && habitAllDoneComputed"
      leadText="All habits done!"
      subText="Your habits can be reviewed in the main habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>

    <!-- Habit-specific: no habits at all -->
    <empty-state *ngIf="isEmpty && currentActive === 'habits' && !habitAllDoneComputed"
      leadText="No habit lined up for today"
      subText="No habits are scheduled for today. Add one to start building your streak and earn coins."
      buttonText="">
    </empty-state>

    <!-- Generic blank empty state when nothing exists at all -->
    <empty-state *ngIf="isEmpty && !hasHabits && !hasTasks"
      imageSrc="/assets/Images-Transparent/Image-Home-Blank.png"
      imageAlt="Empty day illustration"
      leadText="Nothing added yet!"
      subText="Add tasks and habits to see them appear here."
      buttonText="">
    </empty-state>

    <!-- Completed State: show when all items are completed -->
    <empty-state *ngIf="isEmpty && (isAllCompleted || isAllCompletedComputed)"
      imageSrc="/assets/Images-Transparent/Image-Home-Completed.png"
      imageAlt="Completed illustration"
      leadText="Great progress today!"
      subText="Your tasks and habits can be reviewed in the main tasks and habits screen. You can even mark them done from there."
      buttonText="">
    </empty-state>
  </div>

  <!-- Habit Items -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="(currentActive === 'habits' || currentActive === 'all') && hasHabits">
    <habit-card *ngFor="let habitItem of habits.slice(0, maxItemsToShow)" [habit]="habitItem"
      [startTime]="habitItem.startTimeStamp" [endTime]="habitItem.endTimeStamp"
      [inProgress]="isHabitInProgress(habitItem)" mode="single">
    </habit-card>
  </div>

  <!-- Task Items -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="(currentActive === 'tasks' || currentActive === 'all') && hasTasks">
    <habit-card *ngFor="let taskItem of tasks.slice(0, maxItemsToShow)" [habit]="taskItem"
      [startTime]="taskItem.startTimeStamp || 0" [endTime]="taskItem.endTimeStamp || 0" [inProgress]="false"
      mode="single">
    </habit-card>
  </div>

  <!-- CTA Buttons -->
  <div class="add-button-container empty-add-btn" [class.mt-4]="!isEmpty" *ngIf="isEmpty">
    <mindful-button type="magenta" large style="display:block; width:100%" text="Add New"
      (click)="openHabitInput()"></mindful-button>
  </div>
  <div class="add-button-container" [class.mt-4]="!isEmpty" *ngIf="!isEmpty">
    <button class="text-view-all" [routerLink]="['/authed/habit-page']">View All</button>
    <mindful-view-all [text]="'Add New +'" (clicked)="openHabitInput()" [hideIcon]="true"></mindful-view-all>
  </div>
</div>

      buttonText="">

  </div>

  <!-- Recent Habit Items -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="(currentActive === 'habits' || currentActive === 'all') && hasHabits">
    <habit-card *ngFor="let habitItem of filteredRecentHabits" [habit]="habitItem"
      [startTime]="habitItem.startTimeStamp" [endTime]="habitItem.endTimeStamp"
      [inProgress]="isHabitInProgress(habitItem)" mode="single">
    </habit-card>
  </div>

  <!-- Recent Task Items -->
  <div class="d-flex flex-column container w-full" style="padding: 0; gap: 16px"
    *ngIf="(currentActive === 'tasks' || currentActive === 'all') && hasTasks">
    <habit-card *ngFor="let taskItem of filteredRecentTasks" [habit]="taskItem"
      [startTime]="taskItem.startTimeStamp || 0" [endTime]="taskItem.endTimeStamp || 0" [inProgress]="false"
      mode="single">
    </habit-card>
  </div>

  <!-- CTA Buttons -->
  <div class="add-button-container d-flex gap-2" [class.mt-4]="!isEmpty" *ngIf="isEmpty">
    <mindful-button type="magenta-transparent" medium style="display:block; width:100%" text="View all"
      (click)="openHabitPage()"></mindful-button>
    <mindful-button type="magenta" medium style="display:block; width:100%" text="Add New"

  <div class="add-button-container" [class.mt-4]="!isEmpty" *ngIf="!isEmpty">
    <button class="text-view-all" [routerLink]="['/authed/habit-page']">View All</button>
    <mindful-view-all [text]="'Add New +'" (clicked)="openHabitInput()" [hideIcon]="true"></mindful-view-all>
  </div>
</div>

<!-- habit-task-card -->
<div *ngIf="mode === 'single'" class="container w-full h-full p-0">
  <div class="habit-wrapper"
    [ngClass]="{'expanded': expanded, 'isRunningLate': isRunningLate,'missedTime': missedTime, 'task': habit?.type === 'tasks'}">
    <div class="habit-header-container clickable" (tap)="toggle()" long-press [delay]="1500" (press)="onLongPress()">
      <div class="container w-full p-0">
        <div class="d-flex justify-content-between">
          <h3 class="habit-title">{{habit?.title || 'Habit'}}</h3>
          <div class="d-flex gap-1 align-items-center">

            <img *ngIf="getRoutine() === 'MORNING'" class="morning-sun"
              src="/assets/Icons-Neutral/Icon-Routine-Morning.png" alt="" height="24" width="24">
            <img *ngIf="getRoutine() === 'EVENING'" class="morning-sun"
              src="/assets/Icons-Neutral/Icon-Routine-Evening.png" alt="" height="24" width="24">
            <img *ngIf="getRoutine() === 'NIGHT'" class="morning-sun" src="/assets/Icons-Neutral/Icon-Routine-Night.png"
              alt="" height="24" width="24">
            <div class="badge">
              {{getTagOrRoutine()}}
            </div>
            <!-- Indicator that this is expandable -->
            <!-- <div class="expand-indicator" [ngClass]="{'rotated': expanded}">
                <span>+</span>
              </div> -->
          </div>

        </div>
        <div class="habit-timing-container d-flex align-items-center">
          <h4 [ngClass]="habit?.type === 'tasks' ? 'task-timing' : 'habit-timing'">
            {{ formatTimeString(habit?.startTime) || getFormattedTime(startTime) }} - {{
            formatTimeString(habit?.endTime) || getFormattedTime(endTime) }}
            <img *ngIf="showLocalTimer && !isParent" src="/assets/Icons-Neutral/Icon Clock.png" alt="Timer" class="timer-icon"
              (click)="openTimer()" style="cursor: pointer;" />
            <div *ngIf="showLocalTimer && !isParent" class="bubble">Start focus timer</div>
          </h4>
        </div>
      </div>
    </div>
    <!-- Expandable content wrapper with animation -->
    <div class="habit-expandable-content" [ngClass]="{'expanded': expanded}">
      <div class="habit-footer-progress-box" *ngIf="getStatus() === 'ongoing'">
        <div class="habit-footer-progress" #percentageWrapper [style.width.%]="percentageCompleted"></div>
      </div>
      <div class="habit-footer-container">
        <div class="container w-full justify-content-between d-flex p-0 align-items-center">
          <div class=" d-flex reward-section">
            <div class="single-point-container d-flex p-0 align-items-center">
              <img class="score p-r-0" src="assets/Icons-Neutral/Icon-Streak.png" alt="">
              <p class="score p-l-0">{{getStreak()}}</p>
            </div>
            <div class="single-point-container">
              <img class="score" src="assets/Icons-Neutral/Icons-Coins.png" alt="" style="width:24px;height:auto;">
              <p class="score p-l-0">{{getCoinReward()}}</p>
            </div>
          </div>
          <div class="d-flex footer-cta">
            <!-- Let's Go Button: Visible when status is PENDING, hidden when ONGOING, COMPLETED, or SKIPPED -->
            <mindful-button *ngIf="isLetsGoVisible() && !isParent"
              [type]="habit?.type === 'tasks' ? 'orange' : 'lavendar'" small text="Let`s Go" (click)="openStartPopup()"
              [disabled]="!isLetsGoEnabled()"></mindful-button>
            
            <!-- Abort Button: Visible only when status is ONGOING -->
            <mindful-button *ngIf="isAbortVisible() && habit?.type === 'tasks' && !isParent" type="orange-transparent" small
              text="Abort" (click)="openAbortPopup()"></mindful-button>
            <mindful-button *ngIf="isAbortVisible() && habit?.type !== 'tasks' && !isParent" type="lavendar-transparent" small
              text="Abort" (click)="openAbortPopup()"></mindful-button>
            
            <!-- Done Button: visible/disabled per new rules -->
            <mindful-button *ngIf="isDoneVisible() && !isParent" type="green" small text="Done?"
              (click)="openCompletePopup()" [disabled]="!isDoneEnabled()"></mindful-button>
            
            <!-- Completion Message: Show when status is COMPLETED -->
            <!-- <div class="d-flex gap-2" *ngIf="getStatus() === 'completed'">
              <div class="bubble">You did it</div>
              <mindful-pet pet="panda" mood="tired" [size]="44"></mindful-pet>
            </div> -->

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

  [showLetButton]="true" cancelButtonText="Discard" confirmButtonText="Start Now" (confirm)="onStartHabit()">
</app-mindful-popup-alert> -->

<app-mindful-popup [config]="startPopupConfig" [isVisible]="showStartPopup"
  (primaryAction)="handlePopupPrimary()" (secondaryAction)="handlePopupSecondary()"
  (closeAction)="closeStartPopup()" (backdropClick)="closeStartPopup()"></app-mindful-popup>

<app-mindful-popup [config]="completePopupConfig" [isVisible]="showCompletePopup"
  (primaryAction)="handleCompletePrimary()" (secondaryAction)="handleCompleteSecondary()"
  (closeAction)="closeCompletePopup()" (backdropClick)="closeCompletePopup()"></app-mindful-popup>

<app-mindful-popup [config]="abortPopupConfig" [isVisible]="showAbortPopup"
  (primaryAction)="handleAbortPrimary()" (secondaryAction)="handleAbortSecondary()"
  (closeAction)="closeAbortPopup()" (backdropClick)="closeAbortPopup()"></app-mindful-popup>
