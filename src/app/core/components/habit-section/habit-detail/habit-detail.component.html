<ion-content class="habit-detail-page" fullscreen>
    <mindful-navigator heading="" backIcon="arrowSvg" (rightIconClick)="onEdit()">
        <div slot="end">
            <button class="right-custom-edit" aria-label="Edit" (click)="onEdit()" type="button"
                style="background:none;border:0;padding:0;display:flex;align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
                    aria-hidden="true">
                    <path
                        d="M2 16H3.425L13.2 6.225L11.775 4.8L2 14.575V16ZM0 18V13.75L13.2 0.575C13.4 0.391667 13.6208 0.25 13.8625 0.15C14.1042 0.05 14.3583 0 14.625 0C14.8917 0 15.15 0.05 15.4 0.15C15.65 0.25 15.8667 0.4 16.05 0.6L17.425 2C17.625 2.18333 17.7708 2.4 17.8625 2.65C17.9542 2.9 18 3.15 18 3.4C18 3.66667 17.9542 3.92083 17.8625 4.1625C17.7708 4.40417 17.625 4.625 17.425 4.825L4.25 18H0ZM12.475 5.525L11.775 4.8L13.2 6.225L12.475 5.525Z"
                        fill="#282527" />
                </svg>
            </button>
        </div>
    </mindful-navigator>

    <div class="detail-container">
        <div class="detail-header">
            <div class="detail-right">
                <h2>{{ habit?.title }}</h2>
                <div class="detailpriority">

                </div>
            </div>
            <div class="detail-left">
                <div class="detail-routine-icon">

                </div>
                <div class="detail-tag">

                </div>
            </div>
        </div>
        <div class="detail-datepicker">
        </div>
        <div class="detail-date-created">
        </div>
        <div class="repeat-days">
            <div class="repeat-head">
                <img src="assets/app-assets/search_activity.svg" alt="repeat icon" class="repeat-icon" />
                <p>Repeats</p>
            </div>
            <div class="repeat-weekday">days
            </div>
        </div>
        <div class="detail-message">
            <div class="bubble-speech">
                <app-speech-bubble [arrowSide]="'right'" [arrowOffset]="'50%'"
                    [message]="'Your pops says \u201CRemember, every step counts! This task is all about learning and growing. \u2028\u2028You\'ve got this!\u201D'"></app-speech-bubble>
            </div>
            <div class="detail-pet">
                <mindful-pet></mindful-pet>
            </div>
        </div>
        <div class="detail-cta">
            <mindful-button type="orange" medium text="Let's Go"></mindful-button>
            <mindful-button type="green" medium text="Done?"></mindful-button>
        </div>

        <!-- decorative divider: replaced span with SVG for gradient stroke -->
        <svg class="divider-svg" xmlns="http://www.w3.org/2000/svg" width="298" height="2" viewBox="0 0 298 2"
            fill="none" aria-hidden="true">
            <path d="M1 1H297" stroke="url(#paint0_linear_4508_49608)" stroke-width="2" stroke-linecap="round" />
            <defs>
                <linearGradient id="paint0_linear_4508_49608" x1="1" y1="1.5" x2="297" y2="1.5"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="white" />
                    <stop offset="0.5" stop-color="#7E787D" />
                    <stop offset="1" stop-color="white" />
                </linearGradient>
            </defs>
        </svg>


        <mindful-coins-stats [slot1]="'streak'" [slot2]="'coins'" [slot3]="'total-streaks'" [slot4]="'success'"
            [userDays]="0" [userCoins]="habit?.coinReward ?? 0" [totalStreaks]="0"
            [successPercentage]="0"></mindful-coins-stats>

        <div class="detail-progress-header">
            <h2>Almost There! Your Milestone Awaits</h2>
        </div>

        <div class="detail-progess-status">
            <div class="total-progress">
                <div class="progres-count">4/7</div>
                <div class="progress-stat">
                    <div class="progress-circle-wrapper">
                        <mindful-completion [completionPercentage]="57" [borderColor]="'#4CAF50'" [innerText]="''"
                            [belowText]="''">
                        </mindful-completion>
                        <img src="assets/Icons-Neutral/Icon-Badge-StreakKeeper.png" alt="Streak Keeper"
                            class="progress-badge-icon" />
                    </div>
                    <p class="progress-name">Streak Keeper</p>
                </div>
            </div>
            <div class="total-progress">
                <div class="progres-count">250/500</div>
                <div class="progress-stat">
                    <div class="progress-circle-wrapper">
                        <mindful-completion [completionPercentage]="50" [borderColor]="'#4CAF50'" [innerText]="''"
                            [belowText]="''">
                        </mindful-completion>
                        <img src="assets/Icons-Neutral/Icon-Badge-CoinCollector.png" alt="Coin Collector"
                            class="progress-badge-icon" />
                    </div>
                    <p class="progress-name">Coin Collector</p>
                </div>
            </div>
            <div class="total-progress">
                <div class="progres-count">10/50</div>
                <div class="progress-stat">
                    <div class="progress-circle-wrapper">
                        <mindful-completion [completionPercentage]="20" [borderColor]="'#F5A623'" [innerText]="''"
                            [belowText]="''">
                        </mindful-completion>
                        <img src="assets/Icons-Neutral/Icon-Badges-TaskTerminator.png" alt="Task Terminator"
                            class="progress-badge-icon" />
                    </div>
                    <p class="progress-name">Task Terminator</p>
                </div>
            </div>
            <div class="total-progress">
                <div class="progres-count">60/100</div>
                <div class="progress-stat">
                    <div class="progress-circle-wrapper">
                        <mindful-completion [completionPercentage]="60" [borderColor]="'#F5A623'" [innerText]="''"
                            [belowText]="''">
                        </mindful-completion>
                        <img src="assets/Icons-Neutral/Icon-Badge-HabitMaster.png" alt="Habit Master"
                            class="progress-badge-icon" />
                    </div>
                    <p class="progress-name">Habit Master</p>
                </div>
            </div>
        </div>

        <div class="your-journey-header">
            <h2>Your Journey in Days</h2>
        </div>

        <div class="detail-calendar">
            <mindful-calendar [showMoodToggle]="false"></mindful-calendar>
        </div>

        <div class="completion-days">
            <div class="completedays-header">
                <p>Completed</p>
                <!-- <days-completed [daysCompleted]="15"> -->
            </div>
            <div class="skipped-days">
                <p>Skipped</p>
            </div>
        </div>
    </div>
</ion-content>
