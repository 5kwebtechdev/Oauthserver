<ion-content fullscreen>
  <!-- <div class="habit-input-header"> -->
    <mindful-navigator heading="Create. Commit. Grow." backIcon="cancel">
      <div right-actions class="header-toggle" aria-label="Private toggle">
        <label class="header-toggle-label">Private</label>
        <div class="toggle-right">
          <ion-toggle [(ngModel)]="isPrivate"></ion-toggle>
        </div>
      </div>
    </mindful-navigator>
    <div class="habit-input-root" [ngClass]="currentActive">
    <!-- </div> -->


    <div class="container w-full">
      <div class="row toggler">
        <div class="col-4" (click)="currentActive = 'habits'" [ngClass]="currentActive === 'habits' ? 'active' : ''">
          Habits</div>
        <div class="col-4" (click)="currentActive = 'tasks'" [ngClass]="currentActive === 'tasks' ? 'active' : ''">Tasks
        </div>
        <div class="col-4" (click)="currentActive = 'timetable'"
          [ngClass]="currentActive === 'timetable' ? 'active' : ''">Time Table</div>
      </div>
    </div>

    <div *ngIf="currentActive === 'habits'" class="form-card">

      <div class="title-input">
        <div class="mindful-input-group">
          <input [(ngModel)]="title" placeholder="Habit Title" />
        </div>
        <div class="add-new-row">
          <mindful-tags [options]="routineTags" [singleSelection]="false" [size]="'small'"
            (selectedKeysChange)="onTagsChange($event)" (add)="onTagAdd($event)" (edit)="onTagEdit($event)" (delete)="onTagDelete($event)">
          </mindful-tags>
          <!-- <mindful-selectors size="small" [options]="routineTags">
          </mindful-selectors>
          <div class="add-wrapper" #addEl>
            <mindful-badge class="add-new" text="Add new +" type="habit-input" (click)="openAdd(addEl)"></mindful-badge>
          </div> -->


        </div>
      </div>

      <div class="routine-section">
        <label>Routine</label>
        <mindful-selectors [options]="routineOptions" componentType="badge" [singleSelection]="true">
        </mindful-selectors>
      </div>


      <div class="date-time-selection">
        <div class="date-time-selection">
          <div class="section days-row">
            <div class="days-top">
              <div class="everyday-label">
                <img src="assets/app-assets/search_activity.svg" alt="search activity" class="everyday-icon" />
                <label>Everyday</label>
              </div>
              <div class="toggle-right">
                <ion-toggle [(ngModel)]="everyday" (ionChange)="onEverydayChange($event)"></ion-toggle>
              </div>
            </div>
            <div class="days">
              <button *ngFor="let d of weekdays" class="day" (click)="toggleDay(d)"
                [class.selected]="selectedDays.has(d)">
                {{d}}
              </button>
            </div>
          </div>

          <div class="start-end-row">
            <div>
              <label>Start Date</label>
              <div class="mindful-input-group">
                <mindful-datepicker type="date" [(ngModel)]="startDate"></mindful-datepicker>
              </div>
            </div>
            <div>
              <label>Time</label>
              <div class="mindful-input-group">
                <mindful-timepicker placeholder="" [(ngModel)]="startTime"></mindful-timepicker>
              </div>
            </div>
          </div>

          <div class="start-end-row">
            <div>
              <label>End Date</label>
              <div class="mindful-input-group">
                <mindful-datepicker type="date" [(ngModel)]="endDate"></mindful-datepicker>
              </div>
            </div>
            <div>
              <label>Time</label>
              <div class="mindful-input-group">
                <mindful-timepicker placeholder="" [(ngModel)]="endTime"></mindful-timepicker>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="priority-selection priority-selectors">
        <label>Priority</label>
        <div class="priority-row">
          <mindful-badge text="High" type="red" [disabled]="priority !== 'high'" [active]="priority === 'high'"
            (click)="selectPriority('high')"></mindful-badge>
          <mindful-badge text="Medium" type="yellow" [disabled]="priority !== 'medium'" [active]="priority === 'medium'"
            (click)="selectPriority('medium')"></mindful-badge>
          <mindful-badge text="Low" type="green" [disabled]="priority !== 'low'" [active]="priority === 'low'"
            (click)="selectPriority('low')"></mindful-badge>
        </div>
      </div>

      <div class="section notes">
        <label>Add Notes</label>
        <textarea [(ngModel)]="notes" maxlength="250" placeholder="Add Notes....."></textarea>
        <div class="char-count">Max 250 Characters</div>
      </div>

      <div class="submit-row">
        <mindful-button [type]="isFormComplete ? 'lavender-complete' : 'lavender-light'" text="Create Habit" large
          (click)="submit()">
        </mindful-button>
      </div>

    </div> <!-- /form-card -->

    <div *ngIf="currentActive === 'tasks'" class="form-card">
      <div class="title-input">
        <div class="mindful-input-group">
          <input [(ngModel)]="title" placeholder="Task Title" />
        </div>
        <div class="add-new-row">
          <mindful-tags [options]="routineTags" [singleSelection]="false" [size]="'small'"
            (selectedKeysChange)="onTagsChange($event)" (add)="onTagAdd($event)" (edit)="onTagEdit($event)" (delete)="onTagDelete($event)">
          </mindful-tags>
          <!-- <mindful-selectors size="small" [options]="routineTags">
          </mindful-selectors> -->
        </div>
      </div>

      <div class="routine-section">
        <label>Routine</label>
        <mindful-selectors [options]="routineOptions" componentType="badge" [singleSelection]="true">
        </mindful-selectors>
      </div>


      <div class="date-time-selection">
        <div class="section days-row">
          <div class="days-top">
            <div class="everyday-label">
              <img src="assets/app-assets/search_activity.svg" alt="search activity" class="everyday-icon" />
              <label>Everyday</label>
            </div>
            <div class="toggle-right">
              <ion-toggle [(ngModel)]="everyday"></ion-toggle>
            </div>
          </div>
          <div class="days">
            <button *ngFor="let d of weekdays" class="day" (click)="toggleDay(d)"
              [class.selected]="selectedDays.has(d)">
              {{d}}
            </button>
          </div>
        </div>

        <div class="start-end-row">
          <div>
            <label>Start Date</label>
            <div class="mindful-input-group">
              <mindful-datepicker type="date" [(ngModel)]="startDate"></mindful-datepicker>
            </div>
          </div>
          <div>
            <div class="mindful-input-group">
              <mindful-timepicker placeholder="Time" [(ngModel)]="startTime"></mindful-timepicker>
            </div>
          </div>
        </div>

        <div class="start-end-row">
          <div>
            <label>End Date</label>
            <div class="mindful-input-group">
              <mindful-datepicker type="date" [(ngModel)]="endDate"></mindful-datepicker>
            </div>
          </div>
          <div>
            <div class="mindful-input-group">
              <mindful-timepicker placeholder="Time" [(ngModel)]="endTime"></mindful-timepicker>
            </div>
          </div>
        </div>
      </div>


      <div class="priority-selection priority-selectors">
        <label>Priority</label>
        <div class="priority-row">
          <mindful-badge text="High" type="red" [disabled]="priority !== 'high'" [active]="priority === 'high'"
            (click)="selectPriority('high')"></mindful-badge>
          <mindful-badge text="Medium" type="yellow" [disabled]="priority !== 'medium'" [active]="priority === 'medium'"
            (click)="selectPriority('medium')"></mindful-badge>
          <mindful-badge text="Low" type="green" [disabled]="priority !== 'low'" [active]="priority === 'low'"
            (click)="selectPriority('low')"></mindful-badge>
        </div>
      </div>


      <div class="section notes">
        <label>Add Notes</label>
        <textarea [(ngModel)]="notes" maxlength="250" placeholder="Add Notes....."></textarea>
        <div class="char-count">Max 250 Characters</div>
      </div>

      <div class="submit-row">
        <mindful-button [type]="isFormComplete ? 'orange-dark' : 'orange-light'" text="Create Task" large (click)="submit()">
        </mindful-button>
      </div>
    </div>

    <div *ngIf="currentActive === 'timetable'" class="form-card">
      <div class="title-input">
        <div class="mindful-input-group">
          <input [(ngModel)]="title" placeholder="Time Table Title" />
        </div>
        <div class="add-new-row">
          <mindful-tags [options]="routineTags" [singleSelection]="false" [size]="'small'"
            (selectedKeysChange)="onTagsChange($event)" (add)="onTagAdd($event)" (edit)="onTagEdit($event)" (delete)="onTagDelete($event)">
          </mindful-tags>
          <!-- <mindful-selectors size="small" [options]="routineTags">
          </mindful-selectors> -->
        </div>
      </div>

      <div class="timetable-header">
        <h3>Add Your Perfect Schedule</h3>
        <div class="timetable-date-input">
          <div class="timetable-datepicker">
            <mindful-datepicker type="date" [(ngModel)]="startDate"></mindful-datepicker>
            <div class="timetable-chevron">
              <img src="assets/app-assets/Chevron-down-time-table-input-icon.svg" alt="open date picker" />
            </div>
          </div>
      </div>
      </div>

      <div class="timetable-list" style="padding:0 24px 16px 24px;">
        <!-- Dynamic Activity Rows -->
        <div class="timetable-row"
          style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;"
          *ngFor="let activity of activities; let i = index">
          <div class="timetable-activity" style="flex:1 1 60%;">
            <div class="mindful-input-group">
              <input [(ngModel)]="activity.name" placeholder="Activity Name" />
            </div>
          </div>
          <div class="timetable-time" style="flex:1 1 35%;display:flex;gap:12px;align-items:center;">
            <mindful-timepicker [(ngModel)]="activity.startTime" placeholder="Start"></mindful-timepicker>
            <span style="color:#999;">-</span>
            <mindful-timepicker [(ngModel)]="activity.endTime" placeholder="End"></mindful-timepicker>
          </div>
        </div>

        <div class="add-more" style="padding:8px 0;color:#6B656A;font-weight:600;cursor:pointer;"
          (click)="addActivity()">+ Add more</div>
      </div>



      <!-- Submit Button -->
      <div class="submit-row">
        <mindful-button type="green-light" text="Create Time Table" large (click)="submit()">
        </mindful-button>
      </div>
    </div>

  </div> <!-- /habit-input-root -->
</ion-content>
