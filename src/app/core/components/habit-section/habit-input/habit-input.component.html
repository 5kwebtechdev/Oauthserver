<ion-content fullscreen>
  <div class="habit-input-root" [ngClass]="currentActive">

    <!-- Header Section -->
    <div class="habit-input-header">
      <mindful-navigator heading="Create. Commit. Grow." backIcon="cancel"></mindful-navigator>
      <div class="header-toggle" aria-label="Private toggle">
  <label class="header-toggle-label">Private</label>
  <div class="toggle-right">
          <ion-toggle [(ngModel)]="isPrivate"></ion-toggle>
        </div>
      </div>
    </div>

    <!-- Tab Toggle Section -->
    <div class="container w-full">
      <div class="row toggler">
        <div class="col-4" (click)="currentActive = 'habits'" [ngClass]="currentActive === 'habits' ? 'active' : ''">Habits</div>
        <div class="col-4" (click)="currentActive = 'tasks'" [ngClass]="currentActive === 'tasks' ? 'active' : ''">Tasks</div>
        <div class="col-4" (click)="currentActive = 'timetable'" [ngClass]="currentActive === 'timetable' ? 'active' : ''">Time Table</div>
      </div>
    </div>

    <!-- Form Card Section for Habits -->
    <div *ngIf="currentActive === 'habits'" class="form-card">

      <!-- Title Input and Add Button -->
      <div class="title-input">
        <div class="mindful-input-group">
          <input [(ngModel)]="title" placeholder="Habit Title" />
        </div>
        <div class="add-new-row">
          <mindful-selectors [options]="routineTags" componentType="tags" [singleSelection]="false" size="medium" (selectedKeysChange)="onTagsChange($event)">
          </mindful-selectors>
        </div>
      </div>

      <!-- Routine Selector -->
      <div class="routine-section">
        <label>Routine</label>
        <mindful-selectors [options]="routineOptions" componentType="badge" [singleSelection]="true">
        </mindful-selectors>
      </div>


      <div class="date-time-selection">
  <div class="date-time-selection">
  <!-- Days of the Week Selector -->
  <div class="section days-row">
        <div class="days-top">
          <div class="everyday-label">
            <img src="assets/app-assets/search_activity.svg" alt="search activity" class="everyday-icon" />
            <label>Everyday</label>
          </div>
          <div class="toggle-right">
            <ion-toggle [(ngModel)]="everyday"></ion-toggle>
          </div>
        </div>
        <div class="days">
          <button *ngFor="let d of weekdays" class="day" (click)="toggleDay(d)" [class.selected]="selectedDays.has(d)">
            {{d}}
          </button>
        </div>
      </div>

      <!-- Start Date and Time -->
      <div class="start-end-row">
        <div>
          <label>Start Date</label>
          <div class="mindful-input-group">
            <mindful-datepicker type="date" [(ngModel)]="startDate"></mindful-datepicker>
          </div>
        </div>
        <div>
          <div class="mindful-input-group">
            <mindful-timepicker placeholder="Time" [(ngModel)]="startTime"></mindful-timepicker>
          </div>
        </div>
      </div>

  <!-- End Date and Time -->
  <div class="start-end-row">
        <div>
          <label>End Date</label>
          <div class="mindful-input-group">
            <mindful-datepicker type="date" [(ngModel)]="endDate"></mindful-datepicker>
          </div>
        </div>
        <div>
          <div class="mindful-input-group">
            <mindful-timepicker placeholder="Time" [(ngModel)]="endTime"></mindful-timepicker>
          </div>
        </div>
  </div>
  </div>
      </div>

      <!-- Priority Selection -->
      <div class="priority-selection">
        <label>Priority</label>
        <div class="priority-row">
          <mindful-badge text="High" type="red" (click)="selectPriority('high')"></mindful-badge>
          <mindful-badge text="Medium" type="yellow" (click)="selectPriority('medium')"></mindful-badge>
          <mindful-badge text="Low" type="green" (click)="selectPriority('low')"></mindful-badge>
        </div>
      </div>

      <!-- Notes Input -->
      <div class="section notes">
        <label>Add Notes</label>
        <textarea [(ngModel)]="notes" maxlength="250" placeholder="Add Notes....."></textarea>
        <div class="char-count">Max 250 Characters</div>
      </div>

      <!-- Submit Button -->
      <div class="submit-row">
        <mindful-button type="lavender-light" text="Create Habit" large (click)="submit()">
        </mindful-button>
      </div>

    </div> <!-- /form-card -->

    <!-- Form Card Section for Tasks -->
    <div *ngIf="currentActive === 'tasks'" class="form-card">
     <!-- Title Input and Add Button -->
      <div class="title-input">
        <div class="mindful-input-group">
          <input [(ngModel)]="title" placeholder="Task Title" />
        </div>
        <div class="add-new-row">
          <mindful-selectors [options]="routineTags" componentType="tags" [singleSelection]="false" size="medium" (selectedKeysChange)="onTagsChange($event)">
          </mindful-selectors>
        </div>
      </div>

      <!-- Routine Selector -->
      <div class="routine-section">
        <label>Routine</label>
        <mindful-selectors [options]="routineOptions" componentType="badge" [singleSelection]="true">
        </mindful-selectors>
      </div>


  <div class="date-time-selection">
  <!-- Days of the Week Selector -->
  <div class="section days-row">
        <div class="days-top">
          <div class="everyday-label">
            <img src="assets/app-assets/search_activity.svg" alt="search activity" class="everyday-icon" />
            <label>Everyday</label>
          </div>
          <div class="toggle-right">
            <ion-toggle [(ngModel)]="everyday"></ion-toggle>
          </div>
        </div>
        <div class="days">
          <button *ngFor="let d of weekdays" class="day" (click)="toggleDay(d)" [class.selected]="selectedDays.has(d)">
            {{d}}
          </button>
        </div>
      </div>

      <!-- Start Date and Time -->
      <div class="start-end-row">
        <div>
          <label>Start Date</label>
          <div class="mindful-input-group">
            <mindful-datepicker type="date" [(ngModel)]="startDate"></mindful-datepicker>
          </div>
        </div>
        <div>
          <div class="mindful-input-group">
            <mindful-timepicker placeholder="Time" [(ngModel)]="startTime"></mindful-timepicker>
          </div>
        </div>
      </div>

  <!-- End Date and Time -->
  <div class="start-end-row">
        <div>
          <label>End Date</label>
          <div class="mindful-input-group">
            <mindful-datepicker type="date" [(ngModel)]="endDate"></mindful-datepicker>
          </div>
        </div>
        <div>
          <div class="mindful-input-group">
            <mindful-timepicker placeholder="Time" [(ngModel)]="endTime"></mindful-timepicker>
          </div>
        </div>
  </div>
  </div>


      <!-- Priority Selection -->
      <div class="priority-selection">
        <label>Priority</label>
        <div class="priority-row">
          <mindful-badge text="High" type="red" (click)="selectPriority('high')"></mindful-badge>
          <mindful-badge text="Medium" type="yellow" (click)="selectPriority('medium')"></mindful-badge>
          <mindful-badge text="Low" type="green" (click)="selectPriority('low')"></mindful-badge>
        </div>
      </div>


      <!-- Notes Input -->
      <div class="section notes">
        <label>Add Notes</label>
        <textarea [(ngModel)]="notes" maxlength="250" placeholder="Add Notes....."></textarea>
        <div class="char-count">Max 250 Characters</div>
      </div>

      <!-- Submit Button -->
      <div class="submit-row">
        <mindful-button type="orange-light" text="Create Task" large (click)="submit()">
        </mindful-button>
      </div>
    </div>

    <!-- Form Card Section for Time Table -->
    <div *ngIf="currentActive === 'timetable'" class="form-card">
     <!-- Title Input and Add Button -->
      <div class="title-input">
        <div class="mindful-input-group">
          <input [(ngModel)]="title" placeholder="Time Table Title" />
        </div>
        <div class="add-new-row">
          <mindful-selectors [options]="routineTags" componentType="tags" [singleSelection]="false" size="medium" (selectedKeysChange)="onTagsChange($event)">
          </mindful-selectors>
        </div>
      </div>

      <!-- Time Table schedule layout (matches design) -->
      <div class="timetable-header" style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;">
        <h3 style="margin:0;font-weight:600;color:#6B656A">Add Your Perfect Schedule</h3>
        <div style="width:140px;text-align:right;">
          <mindful-datepicker type="date" [(ngModel)]="startDate"></mindful-datepicker>
        </div>
      </div>

      <div class="timetable-list" style="padding:0 24px 16px 24px;">
        <!-- Dynamic Activity Rows -->
        <div class="timetable-row" style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;" *ngFor="let activity of activities; let i = index">
          <div class="timetable-activity" style="flex:1 1 60%;">
            <div class="mindful-input-group">
              <input [(ngModel)]="activity.name" placeholder="Activity Name" />
            </div>
          </div>
          <div class="timetable-time" style="flex:1 1 35%;display:flex;gap:12px;align-items:center;">
            <mindful-timepicker [(ngModel)]="activity.startTime" placeholder="Start"></mindful-timepicker>
            <span style="color:#999;">-</span>
            <mindful-timepicker [(ngModel)]="activity.endTime" placeholder="End"></mindful-timepicker>
          </div>
        </div>

        <div class="add-more" style="padding:8px 0;color:#6B656A;font-weight:600;cursor:pointer;" (click)="addActivity()">+ Add more</div>
      </div>

   

      <!-- Submit Button -->
      <div class="submit-row">
        <mindful-button type="green-light" text="Create Time Table" large (click)="submit()">
        </mindful-button>
      </div>
    </div>

  </div> <!-- /habit-input-root -->
</ion-content>
