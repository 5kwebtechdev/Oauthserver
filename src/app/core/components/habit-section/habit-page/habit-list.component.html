<div class="habit-list-container">
    <div class="habit-list-item-container">
        <div class="habit-list-item">
            <div class="habit-item-header">
                <div class="habit-item-top">
                    <div class="habit-item-title">Reading</div>
                    <div class="habit-item-time">8.00-9.15</div>
                </div>

                <div class="habit-item-tag">
                    <div class="tag-icon">
                        <img src="assets/icons/sun.svg" alt="" />
                    </div>
                    <div class="tag-title-container">
                        <div class="tag-title">Fitness</div>
                    </div>
                </div>
            </div>


            <div class="habit-item-progress-bar">
                <div class="progress-wrapper">
                    <div class="progress" [style.width]=""></div>
                </div>
            </div>

            <div class="habit-itme-footer">
                <div class="footer-reward">
                    <div class="reward-streak">
                        <img class="streak-icon" src="assets/icons/fire-slash-ball.svg" alt="streak" />
                        <div class="streak-text">14</div>
                    </div>

                    <div class="reward-coins">
                        <img src="assets/Icons-Neutral/Icons-Coins.png" alt="coin" />
                        <div class="streak-text">200</div>
                    </div>


                </div>
                <div class="footer-cta">
                    <button class="cta-button">Done?</button>
                </div>
            </div>
        </div>
    </div>
    <div class="habit-list-item-container">
