<!-- Render a list of habit cards from the parent-provided `habits` array -->
<div class="container w-full" style="margin-top: 20px" *ngIf="showContent">
  <ng-container *ngIf="habits?.length; else emptyState">
    <habit-card *ngFor="let h of habits" [habit]="h" mode="single"></habit-card>
  </ng-container>

  <ng-template #emptyState>
    <div class="empty-list">
      <p>No items to show.</p>
    </div>
  </ng-template>
</div>

<!-- Single card mode can still be handled by the wrapper component by passing [mode]="'single'" and [habit] -->
