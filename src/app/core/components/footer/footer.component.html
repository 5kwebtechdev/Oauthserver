<nav class="footer-main" aria-label="Primary navigation" [class.keyboard-hidden]="isKeyboardOpen"
  [class.footer-main--parenting]="mode === 'parenting'">
  <img class="footer-background" src="assets/figma/child-home/footer/nav-background.png" alt="" aria-hidden="true">

  <a [href]="primaryLink" class="footer-item"
    [class.active]="isRouteActive(primaryLink)"
    (click)="navigateTab($event, primaryLink)">
    <span class="footer-icon footer-icon--learning" aria-hidden="true"></span>
    <span class="footer-text">{{ primaryLabel }}</span>
  </a>

  <a href="/authed/school-store" class="footer-item"
    [class.active]="isRouteActive('/authed/school-store')"
    (click)="navigateTab($event, '/authed/school-store')">
    <span class="footer-icon footer-icon--shop" aria-hidden="true"></span>
    <span class="footer-text">Shop</span>
  </a>

  <a class="home-button" role="link" aria-label="Open dashboard" [href]="getDashboardLink()"
    (click)="navigateToDashboard($event)">
    <img src="assets/figma/child-home/footer/nav-home-active.png" alt="" aria-hidden="true">
  </a>

  <a href="/authed/education" [class.active]="isEducationActive" class="footer-item"
    (click)="navigateTab($event, '/authed/education')">
    <span class="footer-icon footer-icon--eduhub" aria-hidden="true"></span>
    <span class="footer-text">EduHub</span>
  </a>

  <a href="/authed/analytics" class="footer-item"
    [class.active]="isRouteActive('/authed/analytics')"
    (click)="navigateTab($event, '/authed/analytics')">
    <span class="footer-icon footer-icon--insights" aria-hidden="true"></span>
    <span class="footer-text">Insights</span>
  </a>
</nav>
