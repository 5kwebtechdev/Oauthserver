<!--
  Pins while scrolling, along with the filter bar below. It sits over the scene at the top of the
  screen, and everything else here scrolls away behind it.
  sm-type-desktop: same type mode as the Figma frame (title-sm 24px, chips body-sm 15px).
-->
<nav class="th-nav sm-type-desktop">
  <button type="button" class="th-back" aria-label="Back" (click)="back.emit()">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path
        d="M36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V24V25ZM12 24V25H36V24V23H12V24ZM11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929Z"
      />
    </svg>
  </button>

  <div class="th-chips"><eduhub-city-selector></eduhub-city-selector></div>
  <button type="button" class="th-search" aria-label="Search PGs and hostels" (click)="search.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M19.6 21L13.3 14.7C12.8 15.1 12.225 15.4167 11.575 15.65C10.925 15.8833 10.2333 16 9.5 16C7.68333 16 6.14583 15.3708 4.8875 14.1125C3.62917 12.8542 3 11.3167 3 9.5C3 7.68333 3.62917 6.14583 4.8875 4.8875C6.14583 3.62917 7.68333 3 9.5 3C11.3167 3 12.8542 3.62917 14.1125 4.8875C15.3708 6.14583 16 7.68333 16 9.5C16 10.2333 15.8833 10.925 15.65 11.575C15.4167 12.225 15.1 12.8 14.7 13.3L21 19.6L19.6 21ZM9.5 14C10.75 14 11.8125 13.5625 12.6875 12.6875C13.5625 11.8125 14 10.75 14 9.5C14 8.25 13.5625 7.1875 12.6875 6.3125C11.8125 5.4375 10.75 5 9.5 5C8.25 5 7.1875 5.4375 6.3125 6.3125C5.4375 7.1875 5 8.25 5 9.5C5 10.75 5.4375 11.8125 6.3125 12.6875C7.1875 13.5625 8.25 14 9.5 14Z"
      />
    </svg>
  </button>
</nav>

<div class="th-top sm-type-desktop">
  <!-- Scenery, back to front. The sky is at "infinity" so it never parallaxes. -->
  <div class="th-scene" aria-hidden="true">
    @for (set of sceneSets(); track set.id) {
      <div
        class="th-set"
        [class.th-set--intro]="set.intro"
        [class.th-set--swap]="!set.intro"
        (animationend)="onSceneShown(set, $event)"
      >
        <img data-layer class="th-layer th-sky" [src]="layerUrl(set.scene, 'sky')" alt="" />
        <img data-layer class="th-layer th-skyline" [src]="layerUrl(set.scene, 'skyline')" alt="" />
        <img data-layer class="th-layer th-trees" [src]="layerUrl(set.scene, 'trees')" alt="" />
      </div>
    }
  </div>

  <div class="th-hero">
    <!-- The word flips between PG and Hostel; screen readers get the whole sentence once. -->
    <h1 class="th-title" aria-label="Finding the right PG or Hostel for you">
      <span class="th-line" aria-hidden="true"><span class="th-line-in">Finding the right</span></span>
      <span class="th-line" aria-hidden="true">
        <span class="th-line-in">
          <span class="th-accent">
            <span class="th-word th-word--pg">PG</span>
            <span class="th-word th-word--hostel">Hostel</span>
            <svg class="th-underline" viewBox="0 0 76.7392 7.40226" preserveAspectRatio="none" aria-hidden="true">
              <path
                d="M1.56136 3.44406C1.04195 3.55202 0.59036 3.86182 0.307082 4.3104C0.0237373 4.75869 -0.0680885 5.30902 0.0506594 5.83525C0.169407 6.36149 0.488672 6.81905 0.937074 7.10222C1.38554 7.38567 1.92641 7.47152 2.44185 7.34595C2.44185 7.34595 2.44185 7.34595 2.44185 7.34595C3.59026 7.06546 4.78685 6.80323 5.99607 6.55936C27.6429 2.71643 50.3048 1.12148 72.2173 4.09198C73.4428 4.29627 74.6514 4.52997 75.8211 4.79857C76.0117 4.84242 76.2135 4.80806 76.3816 4.70489C76.5497 4.60161 76.6704 4.43799 76.7174 4.24816C76.7645 4.05833 76.7343 3.8573 76.6339 3.68744C76.5335 3.51768 76.3712 3.393 76.1821 3.34268C74.9874 3.02494 73.7568 2.74415 72.5114 2.4938C50.2625 -1.26831 27.6431 -0.437015 5.29427 2.74844C4.03546 2.9591 2.78152 3.19012 1.56136 3.44406Z"
              />
            </svg>
          </span>
          for you
        </span>
      </span>
    </h1>

    <!-- The pet stays still; only the location pin (and its ping marks) moves. -->
    <div [class]="'th-pet th-pet--' + activePet()" aria-hidden="true">
      <div class="th-rig">
        <img data-layer class="th-part" [src]="petAssets() + '/body.webp'" alt="" />
        <img data-layer class="th-part th-pin-lines" [src]="petAssets() + '/pin-lines.webp'" alt="" />
        <img data-layer class="th-part th-pin" [src]="petAssets() + '/pin.webp'" alt="" />
      </div>
    </div>
  </div>
</div>

<app-hostel-design-refer class="th-refer" [assetBase]="assetBase()" (refer)="refer.emit()" />
<ng-content></ng-content>
<app-hostel-filters class="th-filters" [filterState]="filterState()" (filtersChange)="filtersChange.emit($event)" />
