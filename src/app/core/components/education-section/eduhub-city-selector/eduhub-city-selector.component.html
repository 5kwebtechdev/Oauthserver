<ng-container *ngIf="!automaticOnly">
  <button type="button" class="location-chip" aria-label="Select country" (click)="openPicker('country')">
    <span aria-hidden="true">{{ allCountries ? '' : country.flag }}</span> {{ allCountries ? 'All' : country.shortName }}<span class="location-caret" aria-hidden="true"></span>
  </button>
  <button type="button" class="location-chip location-chip--city" aria-label="Select city" (click)="openPicker('city')">
    {{ isDetectingLocation ? 'Locating…' : (displayedCity || 'Select city') }}<span class="location-caret" aria-hidden="true"></span>
  </button>
  <app-location-sheet style="display: contents" [title]="pickerTitle" [options]="pickerOptions" [selected]="pickerSelected" (pick)="pickLocation($event)"></app-location-sheet>
  <span class="sr-only" role="status" aria-live="polite">{{ locationMessage }}</span>
</ng-container>
