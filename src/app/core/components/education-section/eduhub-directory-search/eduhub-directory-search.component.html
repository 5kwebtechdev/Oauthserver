<dialog #sheet class="ts-screen" [attr.aria-label]="'Search ' + label" (cancel)="cancel($event)">
  <div class="ts-panel">
    <form class="ts-head" role="search" (submit)="submit(query, $event)">
      <button type="button" class="ts-back" aria-label="Close search" (click)="dismiss()">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V24V25ZM12 24V25H36V24V23H12V24ZM11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929Z" />
        </svg>
      </button>
      <div class="ts-field"><input #field type="search" enterkeyhint="search" autocomplete="off" [attr.aria-label]="'Search ' + label" [placeholder]="'Search ' + label" [value]="query" (input)="type(field.value)"><button *ngIf="query" type="button" class="ts-clear" aria-label="Clear search" (click)="type('')">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
          </button></div>
      <button class="ts-submit" type="submit">Search</button>
    </form>
    <div class="ts-body">
      <div *ngIf="open && filters" class="ts-filters" aria-label="Search filters">
        <ng-container [ngTemplateOutlet]="filters"></ng-container>
      </div>
      <ng-container *ngIf="submitted !== null; else discovery">
        <p *ngIf="!busy" class="ts-count" aria-live="polite">{{ resultCount }} results<span *ngIf="submitted"> for “{{ submitted }}”</span><span *ngIf="locationLabel"> · {{ locationLabel }}</span></p>
        <div class="ts-results"><ng-container [ngTemplateOutlet]="results"></ng-container></div>
      </ng-container>
      <ng-template #discovery>
        <ul *ngIf="query.trim(); else history" class="ts-suggestions" aria-label="Search suggestions">
          <li><button type="button" class="ts-suggestion" (click)="submit(query)"><span class="ts-suggestion-title">Search for “{{ query.trim() }}”</span></button></li>
          <li *ngFor="let term of suggestions"><button type="button" class="ts-suggestion" (click)="submit(term)"><span class="ts-suggestion-title">{{ term }}</span></button></li>
        </ul>
        <ng-template #history>
          <section *ngIf="recents.length" class="ts-section"><div class="ts-section-head"><h3>Recent searches</h3><button class="ts-link" type="button" (click)="clearRecents()">Clear</button></div><div class="ts-chips"><button *ngFor="let term of recents" class="ts-chip" type="button" (click)="submit(term)">{{ term }}</button></div></section>
          <section *ngIf="popular.length" class="ts-section"><div class="ts-section-head"><h3>Popular searches</h3></div><div class="ts-chips"><button *ngFor="let term of popular" class="ts-chip" type="button" (click)="submit(term)">{{ term }}</button></div></section>
        </ng-template>
      </ng-template>
    </div>
  </div>
</dialog>
