<article class="education-listing" [class.education-listing--home]="homePreview">
<button type="button" class="education-listing__profile" (click)="viewDetails.emit()" [attr.aria-label]="'Open '+item.name">
<span class="education-listing__photo"><span *ngIf="stationeryFallback || bookstoreFallback || sportsShopFallback" class="stationery-badge" [class.bookstore-badge]="bookstoreFallback" [class.sports-shop-badge]="sportsShopFallback"><img [src]="storeBadgeAsset" alt=""><span>{{stationeryInitials}}</span></span><app-profile-image *ngIf="!stationeryFallback && !bookstoreFallback && !sportsShopFallback" [fallbackCategory]="category+' '+(item.entityType || '')" [src]="item.image" [name]="item.name"></app-profile-image></span>
<span class="education-listing__body"><span class="education-listing__name"><strong>{{item.name}}</strong><span *ngIf="item.verified" class="education-listing__verified"><img src="assets/figma/eduhub-cards/verified.png" alt="Verified"></span></span><span class="education-listing__field"><span class="education-listing__icon"><span><img src="assets/figma/eduhub-cards/location.svg" alt=""></span></span><span class="education-listing__field-text"><span class="education-listing__label">Address</span><span class="education-listing__value education-listing__value--wrap">{{item.unlocked ? (item.fullAddress || 'Address unavailable') : 'Details locked'}}</span><span *ngIf="!item.unlocked" class="education-listing__helper">Unlock with {{item.unlockCost}} coins to view the full address</span></span></span></span></button>
<div class="education-listing__buttons"><button type="button" class="education-listing__directions" [disabled]="!item.unlocked" (click)="directions.emit()">Get Directions</button><button type="button" (click)="contact.emit()"><ng-container *ngIf="item.unlocked; else unlock">Contact</ng-container><ng-template #unlock>Unlock <img src="assets/icons/superme-coin.webp" alt="coins"> {{item.unlockCost}}</ng-template></button></div>
</article>
