<article class="education-listing" [class.education-listing--home]="homePreview">
<button type="button" class="education-listing__profile" (click)="viewDetails.emit(item)" [attr.aria-label]="'View '+getDisplayName(item)">
<span class="education-listing__photo education-listing__photo--tall"><app-profile-image fallbackCategory="event" [src]="getImage(item)" [name]="getDisplayName(item)"></app-profile-image></span>
<span class="education-listing__body"><span class="education-listing__name"><strong>{{getDisplayName(item)}}</strong><span *ngIf="item.verified" class="education-listing__verified"><img src="assets/figma/eduhub-cards/verified.png" alt="Verified"></span></span><span class="education-listing__fields"><span class="education-listing__field"><span class="education-listing__icon"><span><img src="assets/figma/eduhub-cards/calendar.svg" alt=""></span></span><span class="education-listing__field-text"><span class="education-listing__label">Date &amp; Time</span><span class="education-listing__value">{{getEventMeta(item) || 'Date to be announced'}}</span></span></span><span class="education-listing__field education-listing__field--secondary education-listing__field--venue"><span class="education-listing__icon"><span><img src="assets/figma/eduhub-cards/location-amber.svg" alt=""></span></span><span class="education-listing__field-text"><span class="education-listing__label">Venue</span><span class="education-listing__value" [class.education-listing__value--venue]="item.unlocked">{{item.unlocked ? (item.exactLocation || item.address || item.venue || getLocation(item) || 'Venue unavailable') : 'Details locked'}}</span><span *ngIf="!item.unlocked" class="education-listing__helper">Click to unlock the venue</span></span></span></span></span></button>
<div class="education-listing__footer"><button class="education-listing__fee" type="button" (click)="viewDetails.emit(item)">{{getFeeLabel(item)}}</button>
<button class="education-listing__like" type="button" [disabled]="likeInProgress" [attr.aria-pressed]="isFavourite(item)" aria-label="Favourite event" (click)="toggleFavourite(item)"><span><img src="assets/figma/eduhub-cards/heart.svg" alt=""></span>{{item.champsLiked || 0}}</button>
<button class="education-listing__share" type="button" aria-label="Share event" (click)="shareItem(item)"><img src="assets/figma/parent-eduhub-inner/share.svg" alt=""></button></div></article>
