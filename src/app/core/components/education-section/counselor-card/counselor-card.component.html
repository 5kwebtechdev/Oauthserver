<article class="education-listing" [class.education-listing--home]="homePreview">
  <button type="button" class="education-listing__profile"
    [attr.aria-label]="(guest ? 'Log in to view ' : 'View profile for ') + getName(counselor)"
    (click)="viewProfile.emit(counselor)">
    <span class="education-listing__photo" [class.education-listing__photo--counselor]="!education && counselor.entityType !== 'ACADEMY'">
      <app-profile-image [fallbackCategory]="counselor.entityType === 'ACADEMY' ? 'academy' : (education ? 'tutor' : 'counselor')"
        [src]="getProfileImage(counselor)" [name]="getName(counselor)" [alt]="getName(counselor) + ' profile image'">
      </app-profile-image>
    </span>
    <span class="education-listing__body">
      <span class="education-listing__name">
        <strong [title]="getName(counselor)">{{ getName(counselor) }}</strong>
        <span *ngIf="isVerified(counselor)" class="education-listing__verified">
          <img src="assets/figma/eduhub-cards/verified.png" alt="Verified">
        </span>
      </span>
      <span *ngIf="!guest" class="education-listing__fields">
        <span *ngFor="let row of educationRows; let index = index"
          class="education-listing__field" [class.education-listing__field--secondary]="index === 1"
          [class.education-listing__field--exam]="row.icon === 'exams'">
          <span class="education-listing__icon"><span><img [src]="'assets/figma/eduhub-cards/' + row.icon + '.svg'" alt=""></span></span>
          <span class="education-listing__field-text">
            <span class="education-listing__label">{{ row.label }}</span>
            <span class="education-listing__value" [title]="row.value">{{ row.value }}</span>
          </span>
        </span>
      </span>
      <span *ngIf="guest" class="education-listing__guest">Log in to view more details</span>
    </span>
  </button>
  <div *ngIf="!guest" class="education-listing__footer">
    <button type="button" class="education-listing__fee" (click)="viewProfile.emit(counselor)" [title]="getFee(counselor)">{{ getFee(counselor) }}</button>
    <span class="education-listing__mode" [title]="getAvailability(counselor)">
      <img src="assets/figma/eduhub-cards/mode.svg" alt="">{{ getAvailability(counselor) || 'Not specified' }}
    </span>
    <span *ngIf="homePreview" class="education-listing__like" [attr.aria-label]="(likeCount | number) + ' likes'">
      <span><img src="assets/figma/eduhub-cards/heart.svg" alt=""></span>{{ likeCount | number }}
    </span>
    <button *ngIf="!homePreview" type="button" class="education-listing__like" [class.is-liked]="isLiked(counselor)"
      [disabled]="isLikePending(counselor)" [attr.aria-pressed]="isLiked(counselor)"
      [attr.aria-label]="(isLiked(counselor) ? 'Unlike ' : 'Like ') + getName(counselor)"
      (click)="toggleLike($event, counselor)">
      <span><img src="assets/figma/eduhub-cards/heart.svg" alt=""></span>{{ likeCount | number }}
    </button>
    <button *ngIf="!education && !homePreview" type="button" class="education-listing__share" aria-label="Share counselor" (click)="shareCounselor(counselor)"><img src="assets/figma/parent-eduhub-inner/share.svg" alt=""></button>
  </div>
  <button *ngIf="guest" type="button" class="education-listing__login" (click)="viewProfile.emit(counselor)">Log in</button>
</article>
