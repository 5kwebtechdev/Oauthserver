<ion-content>
    <div class="education-main-page-container ">
        <mindful-navigator heading="Education & Essentials" backIcon="arrowSvg" (back)="goBack()"></mindful-navigator>
        <div>
            <swiper-container #swiperEl class="edu-swiper" [slides-per-view]="1" [loop]="true"
                [autoplay]="{ delay: 3000, disableOnInteraction: false }">
                <swiper-slide *ngFor="let i of [0,1,2,3]">
                    <div class="edu-banner-image"></div>
                </swiper-slide>
            </swiper-container>

            <!-- custom pager: match LearningSection pager style and placement -->
            <div class="edu-pagination" aria-hidden="true">
                <button type="button" class="edu-dot" *ngFor="let n of [0,1,2,3]; let idx = index"
                    [class.active]="currentSlide === idx" (click)="goToSlide(idx)"></button>
            </div>
        </div>

        <div class="edu-item-cards">
            <h1></h1>
        </div>
    </div>
</ion-content>
