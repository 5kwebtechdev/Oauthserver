<ion-content style="--padding-top: var(--sat)">
    <div class="education-main-page-container">
        <h1 class="edu-heading">Education & Essentials</h1>
        <div>
            <swiper-container #swiperEl class="edu-swiper" [slides-per-view]="1" [loop]="true"
                [autoplay]="{ delay: 3000, disableOnInteraction: false }">
                <swiper-slide *ngFor="let i of [0,1,2,3]">
                    <div class="edu-banner-image"></div>
                </swiper-slide>
            </swiper-container>

            <!-- custom pager: match LearningSection pager style and placement -->
            <div class="edu-pagination" aria-hidden="true">
                <button type="button" class="edu-dot" *ngFor="let n of [0,1,2,3]; let idx = index"
                    [class.active]="currentSlide === idx" (click)="goToSlide(idx)"></button>
            </div>
        </div>
        <div class="edu-item-list">
            <a class="edu-item-cards" routerLink="/authed/tutors">
                <h1>Find Tutors</h1>
                <app-img src="assets/Images-Transparent/Find-Tutors.png" alt="Find Tutors" objectFit="contain"></app-img>
            </a>
            <a class="edu-item-cards" aria-label="Academies">
                <h1>Academies</h1>
                <span>COMING SOON</span>
                <app-img src="assets/Images-Transparent/Academies.png" alt="Academies" objectFit="contain"></app-img>
            </a>
            <a class="edu-item-cards">
                <h1>Book Stores</h1>
                <span>COMING SOON</span>
                <app-img src="assets/Images-Transparent/Book-store.png" alt="Book Stores" objectFit="contain"></app-img>
            </a>
            <a class="edu-item-cards">
                <h1>Stationery Store</h1>
                <span>COMING SOON</span>
                <app-img src="assets/Images-Transparent/Stationery.png" alt="Stationery Store" objectFit="contain"></app-img>
            </a>
        </div>
    </div>
    <app-footer></app-footer>
</ion-content>
