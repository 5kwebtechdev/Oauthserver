<ion-content style="--padding-top: var(--sat)">
    <div class="education-main-page-container">
        <h1 class="edu-heading">Education & Essentials</h1>
        <!-- Ad banner — loads EDUHUB screen ads from API -->
        <div class="edu-ad-wrap">
            <ad-banner [screen]="eduAdScreen"></ad-banner>
        </div>
        <div class="edu-item-list">
            <a class="edu-item-cards" routerLink="/authed/tutors">
                <h1>Find a Tutor</h1>
                <app-img src="assets/Images-Transparent/Find-Tutors.png" alt="Find a Tutor" objectFit="contain"></app-img>
            </a>
            <a class="edu-item-cards" routerLink="/authed/academies">
                <h1>Find Academies</h1>
                <app-img src="assets/Images-Transparent/Academies.png" alt="Find Academies" objectFit="contain"></app-img>
            </a>
</div>
    </div>
    <app-footer></app-footer>
</ion-content>
