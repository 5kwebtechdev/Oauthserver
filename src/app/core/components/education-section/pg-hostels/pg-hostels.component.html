<ion-content class="page">
  <main>
    <app-hostel-header (back)="back()" (search)="toggleSearch()" (refer)="referForListing()" [filterState]="designFilters" (filtersChange)="onDesignFilters($event)">

    </app-hostel-header>
<ng-template #directoryResults>
    <section class="results" aria-live="polite">
      <p class="state" *ngIf="loading">Loading PG / Hostels…</p>
      <div class="state" *ngIf="!loading && error"><p>{{ error }}</p><button type="button" (click)="load()">Try again</button></div>
      <p class="state" *ngIf="!loading && !error && !items.length">No PG / Hostels match these filters. Try changing the city or clearing a filter.</p>
      <div class="cards" *ngIf="!loading && !error && items.length"><app-pg-hostel-card *ngFor="let item of items; trackBy: trackItem" [item]="item" (viewDetails)="openDetails($event)"></app-pg-hostel-card></div>
      <div class="pages" *ngIf="!loading && !error && totalPages > 1"><button type="button" [disabled]="page === 0" (click)="changePage(page - 1)">Previous</button><span>Page {{ page + 1 }} of {{ totalPages }}</span><button type="button" [disabled]="page + 1 >= totalPages" (click)="changePage(page + 1)">Next</button></div>
    </section>
</ng-template>
<ng-container *ngIf="!searchOpen" [ngTemplateOutlet]="directoryResults"></ng-container>
  </main>
<ng-template #directoryFilters>
  <app-hostel-filters [filterState]="designFilters" (filtersChange)="onDesignFilters($event)"></app-hostel-filters>
</ng-template>
<app-eduhub-directory-search [filters]="directoryFilters" [locationLabel]="searchLocationLabel" [busy]="loading" [open]="searchOpen" [label]="'PG / Hostels'" [terms]="directorySearchTerms" [resultCount]="total" [results]="directoryResults" (searched)="runDirectorySearch($event)" (dismissed)="searchOpen && toggleSearch()"></app-eduhub-directory-search>
</ion-content>

<div class="sheet-backdrop" *ngIf="sheetOpen" (click)="closeFilters()"></div>
<section class="filter-sheet" *ngIf="sheetOpen" role="dialog" aria-modal="true" aria-labelledby="pg-filters-title">
  <div class="sheet-header"><h2 id="pg-filters-title">Filters</h2><button type="button" aria-label="Close filters" (click)="closeFilters()"><img [src]="asset + 'filter-close.svg'" alt=""></button></div>
  <div class="sheet-body">
    <nav class="filter-categories" aria-label="Filter categories"><button *ngFor="let category of categories" type="button" [class.active]="activeCategory === category.key" (click)="activeCategory = category.key"><img [src]="asset + category.icon" alt=""><span>{{ category.label }}</span></button></nav>
    <div class="filter-options"><label *ngFor="let option of options[activeCategory]"><span>{{ option }}</span><input type="checkbox" [checked]="isSelected(option)" (change)="toggleOption(option)"></label></div>
  </div>
  <div class="sheet-actions"><button type="button" class="clear" (click)="clearFilters()">Clear all</button><button type="button" class="show" (click)="applyFilters()">Show results</button></div>
</section>
