<div class="mindful-selectors">
  <h3 *ngIf="label" class="label">{{ label }}</h3>
  <div class="badges-container">
    <ng-container *ngIf="componentType === 'badge'">
      <mindful-badge
        *ngFor="let option of options"
        [text]="option.value"
        [type]="option.type"
        [large]="size === 'large'"
        [medium]="size === 'medium'"
        [inactive]="!selectedKeys.includes(option.key)"
        (click)="toggleSelection(option.key)"
        [circle]="circle"
      >
      </mindful-badge>
    </ng-container>
    <ng-container *ngIf="componentType === 'button'">
      <mindful-button
        *ngFor="let option of options"
        [text]="option.value"
        [type]="selectedKeys.includes(option.key) ? option.type : option.type +'-transparent'"
        [large]="size === 'large'"
        [medium]="size === 'medium'"
        (click)="toggleSelection(option.key)">
      </mindful-button>
    </ng-container>
  </div>
</div>
