<header class="web-header" [class.web-header--parent]="isParent" role="banner">
  <div class="web-header__inner">
    <div class="web-header__left">
      <a
        class="web-header__brand"
        [routerLink]="dashboardLink"
        aria-label="SuperMe App home"
      >
        <img class="web-header__logo" [src]="logoSrc" alt="SuperMeApp" />
      </a>

      <nav class="web-header__nav" aria-label="Primary navigation">
        <ng-container *ngFor="let item of navItems; let index = index">
          <div
            class="web-header__nav-item"
            [class.web-header__nav-item--direct]="!item.children"
            [class.open]="openMenu === item.label"
            (mouseenter)="item.children && openMenuOn(item.label)"
            (mouseleave)="item.children && closeMenu()"
          >
            <a
              *ngIf="!item.children"
              class="web-header__nav-link"
              [class.active]="isNavActive(item)"
              [routerLink]="item.link"
            >
              {{ item.label }}
            </a>

            <button
              *ngIf="item.children"
              type="button"
              class="web-header__nav-link web-header__nav-link--toggle"
              [class.active]="isNavActive(item)"
              [attr.aria-expanded]="openMenu === item.label"
              (click)="toggleMenu(item.label, $event)"
            >
              <span>{{ item.label }}</span>
              <img
                class="web-header__chevron"
                [class.open]="openMenu === item.label"
                [src]="chevronSrc"
                alt=""
                aria-hidden="true"
              />
            </button>

            <div
              *ngIf="item.children && openMenu === item.label"
              class="web-header__dropdown"
              role="menu"
              (click)="$event.stopPropagation()"
            >
              <a
                *ngFor="let child of item.children"
                class="web-header__dropdown-link"
                role="menuitem"
                [routerLink]="child.link"
                (click)="closeMenu()"
              >
                {{ child.label }}
              </a>
            </div>
          </div>
        </ng-container>
      </nav>
    </div>

    <div class="web-header__actions">
      <button
        type="button"
        class="web-header__icon-button"
        aria-label="Open notifications"
        (click)="goToNotifications()"
      >
        <img [src]="notificationSrc" alt="" />
      </button>

      <button
        type="button"
        class="web-header__coin-button"
        aria-label="View coins"
        (click)="goToCoins()"
      >
        <img [src]="coinSrc" alt="" />
        <span>{{ coins | number }}</span>
      </button>

      <a
        class="web-header__profile"
        routerLink="/authed/user-profile"
        aria-label="Open profile"
      >
        <span class="web-header__avatar">
          <app-img
            *ngIf="userAvatarUrl; else avatarInitial"
            [src]="userAvatarUrl"
            [alt]="avatarImageName ? avatarImageName : userName + ' avatar'"
            [circle]="true"
            objectFit="cover"
          >
          </app-img>
          <ng-template #avatarInitial>
            <span class="web-header__avatar-initial" aria-hidden="true">{{
              userInitial
            }}</span>
          </ng-template>
        </span>
        <span class="web-header__profile-name">{{
          userName || (isParent ? "Parent" : "User")
        }}</span>
      </a>
    </div>
  </div>
</header>
