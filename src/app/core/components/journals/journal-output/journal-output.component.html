<ion-content fullscreen>
  <div class="journal-output-container">
    <div class="journal-output-header">
      <div class="journal-output-header-row">
        <mindful-navigator class="output-back-navigator" heading=""></mindful-navigator>

        <div class="month-navigator" role="group" aria-label="Month navigator">
          <button class="month-prev" type="button" aria-label="Previous month" (click)="prevMonth()">‹</button>
          <div class="month-label">{{ monthLabel }}</div>
          <button class="month-next" type="button" aria-label="Next month" (click)="nextMonth()">›</button>
        </div>
      </div>
    </div>

    <div *ngIf="!filteredEntries || filteredEntries.length === 0" class="empty">
      <!-- <p>No journal entries yet. Try adding one!</p> -->
      <div class="journal-empty__body">
        <img class="journal-empty__illustration" src="/assets/Images-Transparent/Image-Journal-Blank.png"
          alt="Panda with kids illustration">

        <div class="journal-empty__texts">
          <p class="lead">We are waiting to hear about your day!</p>
          <p class="sub">Post your journal to keep your story alive</p>
        </div>

        <mindful-button class="journal-empty__post" type="magenta" large text="Post now"
          style="display:block; width:100%" (click)="openJournalInput()" aria-label="Post now"></mindful-button>
      </div>
    </div>
    <!-- All post note cards -->
    <div class="entries" *ngIf="filteredEntries && filteredEntries.length">
      <div *ngFor="let entry of filteredEntries; trackBy: trackById" class="post-card">
        <div class="post-header">
          <div class="post-date">{{ formatHeaderDate(entry.date) }}</div>
          <div class="post-time">{{ formatTime(entry.date) }}</div>
        </div>

        <div class="post-body">
          <div class="emoji">{{ getEmoji(entry) }}</div>
          <div class="post-content">
            <div class="post-mood">{{ entry.mood || 'Mood' }}</div>

            <div class="post-tags">
              <ng-container *ngFor="let tag of joinTags(entry.tags); let i = index">
                <span class="tag">{{ tag }}</span>
              </ng-container>
            </div>

            <div class="post-text">
              {{ entry.text }}
            </div>

            <div class="post-images" *ngIf="entry.images && entry.images.length">
              <img [src]="entry.images[0]" alt="attachment" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<!-- Floating Post Button (small, magenta) -->
<mindful-button *ngIf="filteredEntries && filteredEntries.length > 0" type="magenta" text="+" large
  class="journal-floating-post" (click)="openJournalInput()"></mindful-button>
