<div class="post-card">
  <div class="post-header">
    <div class="post-date">{{ formatHeaderDate(entry.date) }}</div>
    <div class="post-time">{{ formatTime(entry.date) }}</div>
  </div>

  <div class="post-body" [class.center-emoji]="!hasDetails(entry)">
    <div class="emoji">
      <ng-container *ngIf="getEmotion(entry) as em; else emojiFallback">
        <img class="emotion-thumb" [src]="em.image" [alt]="em.label" (error)="$any($event.target).style.display='none'" />
      </ng-container>
      <ng-template #emojiFallback>
        {{ entry.emoji }}
      </ng-template>
    </div>
    <div class="post-content">
      <div class="post-mood">{{ entry.mood || 'Mood' }}</div>

      <div class="post-tags" *ngIf="getFilteredTags(entry).length > 0">
        <ng-container *ngFor="let tag of getFilteredTags(entry); let i = index">
          <ng-container *ngIf="tag && tag.indexOf(': ') > -1; else plainTag">
            <span class="tag"><span class="tag-title">{{ tag.split(': ')[0] }}:</span><span class="tag-text">{{ tag.split(': ')[1] }}</span></span>
          </ng-container>
          <ng-template #plainTag>
            <span class="tag">{{ tag }}</span>
          </ng-template>
        </ng-container>
      </div>

      <div class="post-text" *ngIf="entry.text && entry.text.trim().length">
        {{ entry.text }}
      </div>

      <div class="post-images d-flex gap-2" *ngIf="entry.images && entry.images.length">
        <ng-container *ngFor="let img of entry.images; let i = index">
          <img class="post-image-thumb" [src]="img" [alt]="'attachment ' + (i + 1)" (click)="openImageViewer(img)" role="button" tabindex="0" />
        </ng-container>
      </div>
      
    </div>
  </div>
</div>

<!-- Image viewer overlay -->
<div class="image-viewer-backdrop" *ngIf="viewerOpen" (click)="closeImageViewer()">
  <button class="image-viewer-close" (click)="closeImageViewer()" aria-label="Close image viewer">
    <img src="/assets/icons/cancel-cross.svg" alt="Close image viewer">
  </button>
  <div class="image-viewer-content" (click)="$event.stopPropagation()">
    <img [src]="viewerSrc" alt="attachment preview" />
  </div>
</div>
