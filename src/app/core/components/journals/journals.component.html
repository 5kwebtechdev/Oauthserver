<section class="journal-empty">
	<mindful-card-header [title]="'Your Journal, Your Journey'" [subtitleLeft]="'Track moods'" [subtitleMiddle]="'Save'"
		[subtitleRight]="'Feel Better'">
		<mindful-view-all mindful-header-actions [routerLink]="['/authed/journal-output']"
			class="journal-empty__view-all">
		</mindful-view-all>
	</mindful-card-header>

	<div *ngIf="latestEntry as entry; else emptyBody" class="post-card">
		<div class="post-header">
			<div class="post-date">{{ formatDate(entry.date) }}</div>
			<div class="post-time">{{ formatTime(entry.time) }}</div>
		</div>

		<div class="post-body">
			<div class="emoji">{{ getEmoji(entry) }}</div>
			<div class="post-content">
				<div class="post-mood">{{ getMoodLabel(entry.mood) }}</div>

				<div class="post-tags">
					<ng-container *ngFor="let tag of joinTags(entry.tags); let i = index">
						<span class="tag">{{ tag }}</span>
					</ng-container>
				</div>

				<div class="post-text">
					{{ entry.title }}
				</div>

				<div class="post-images" *ngIf="entry.images && entry.images.length">
					<img [src]="entry.images[0]" alt="attachment" />
				</div>
			</div>
		</div>
	</div>

	<ng-template #emptyBody>
		<div class="journal-empty__body">
			<img class="journal-empty__illustration" src="/assets/Images-Transparent/Image-Journal-Blank.png"
				alt="Panda with kids illustration">

			<div class="journal-empty__texts">
				<p class="lead">We are waiting to hear about your day!</p>
				<p class="sub">Post your journal to keep your story alive</p>
			</div>

			<mindful-button class="journal-empty__post" type="magenta" large text="Post now"
				style="display:block; width:100%" (click)="onCreateNewEntry()" aria-label="Post now"></mindful-button>
		</div>
	</ng-template>

</section>
