<section class="journal-empty">
	<mindful-card-header
		[title]="'Your Journal, Your Journey'"
		[subtitleLeft]="'Track moods'"
		[subtitleMiddle]="'Save'"
		[subtitleRight]="'Feel Better'">
		<mindful-view-all mindful-header-actions
			[routerLink]="'/journal-output'"
			class="journal-empty__view-all">
		</mindful-view-all>
	</mindful-card-header>

	<div class="journal-empty__body">
		<img class="journal-empty__illustration" src="/assets/app-assets/Journal-study.svg" alt="Panda with kids illustration">

		<div class="journal-empty__texts">
			<p class="lead">We are waiting to hear about your day!</p>
			<p class="sub">Post your journal to keep your story alive</p>
		</div>

		<button class="journal-empty__post" (click)="onCreateNewEntry()" aria-label="Post now">
			<span class="journal-empty__post-text">Post now</span>
		</button>
	</div>
</section>
