<ion-content>
  <mindful-card-header [title]="'Your Journal, Your Journey'" [subtitleLeft]="'Track moods'" [subtitleMiddle]="'Save'"
    [subtitleRight]="'Feel Better'" [showBackArrow]="true" (backClick)="goBack()">
  </mindful-card-header>


<div class="journal-input-container">
    <div class="timeline">

      <!-- Dynamic sections -->
      <div class="section" *ngFor="let section of sections; trackBy: trackBySection">
        <h2 [class.section-title-error]="
            section.key === 'emotions' && emotionError
          ">
          {{ section.title }}
        </h2>

        <div class="options">
          <div class="option" tabindex="0" role="button" *ngFor="let option of section.options; let i = index"
            [attr.aria-pressed]="isSelected(section.key, i)" (click)="selectOption(section.key, i)"
            (keydown.enter)="selectOption(section.key, i)" [class.selected]="isSelected(section.key, i)">
            <div class="j-img">
              <img [src]="option.image" [alt]="option.label" />
            </div>

            <span>{{ option.label }}</span>

            <span class="check" *ngIf="isSelected(section.key, i)">
              ✔
            </span>
          </div>
        </div>
      </div>

      <!-- Notes Section -->
      <div class="section">
        <h2>A Quick Note</h2>

        <div class="note-area">
          <textarea placeholder="Your notes goes here..." [(ngModel)]="text" name="journalNotes" maxlength="160"
            (input)="onNotesInput()" (input)="autoExpandTextarea($event)"></textarea>
        </div>

        <div class="char-counter">
          {{ notesCharCount }}/{{ noteMaxLength }}
        </div>
      </div>

      <!-- Pin a Moment -->
      <div class="section">
        <h2>Pin a Moment</h2>

        <!-- Uploaded Images -->
        <div class="image-upload-section d-flex align-items-center gap-2">

          <div *ngFor="let img of uploadedImages; let i = index" class="image-slot">
            <div class="image-preview-container">
              <img [src]="img.previewUrl" alt="Uploaded image" class="image-preview" />

              <button class="remove-image-btn" (click)="removeImage(i)" type="button">
                ✕
              </button>
            </div>
          </div>

          <!-- Add more (max 3 images) — always show one + button -->
          <button *ngIf="uploadedImages.length > 0 && uploadedImages.length < 3"
            class="upload-slot-btn" (click)="triggerFileInput(uploadedImages.length)" type="button">
            +
          </button>
        </div>

        <!-- Error -->
        <div class="image-error" *ngIf="imageUploadError">
          {{ imageUploadError }}
        </div>

        <!-- Empty State -->
        <div *ngIf="uploadedImages.length === 0">
          <label class="pin-moment" for="journalFileInput" role="button" tabindex="0"
            (keydown.enter)="triggerNativeFilePicker()">
            <div class="pin-inner">
              <img class="pin-icon" src="assets/icons/attachment-small.svg" alt="Attach" width="18" height="18" />
              <span class="pin-text">Choose item here</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- Emotion Error -->
    <div *ngIf="emotionError" class="field-error">
      {{ emotionError }}
    </div>

    <!-- Post Button -->
    <div class="post-button-container" (click)="onPostAttempt($event)">
      <mindful-button type="magenta" size="full" text="Post" [disabled]="!isPostEnabled">
      </mindful-button>
    </div>
  </div>

  <!-- Hidden file input -->
  <input #fileInput id="journalFileInput" type="file" accept="image/*" (change)="onFileSelected($event)"
    style="display: none" />
</ion-content>
