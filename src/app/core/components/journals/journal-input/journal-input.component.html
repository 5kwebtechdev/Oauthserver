<ion-content>
  <mindful-card-header [title]="'Your Journal, Your Journey'" [subtitleLeft]="'Track moods'" [subtitleMiddle]="'Save'"
    [subtitleRight]="'Feel Better'" [showBackArrow]="true" (backClick)="goBack()">
  </mindful-card-header>
  <div class="journal-input-container">

    <!-- Journal input container -->
    <div class="journal-input-container">
      <div class="timeline">
        <!-- Dynamic sections -->
        <div class="section" *ngFor="let section of sections; trackBy: trackBySection">
          <h2>{{section.title}}</h2>
          <div class="options">
            <div class="option" tabindex="0" role="button" [attr.aria-pressed]="isSelected(section.key, i)"
              (click)="selectOption(section.key, i)" (keydown.enter)="selectOption(section.key, i)"
              [class.selected]="isSelected(section.key, i)" *ngFor="let option of section.options; let i = index">
              <img [src]="option.image" [alt]="option.label">
              <span>{{option.label}}</span>
              <span class="check" *ngIf="isSelected(section.key, i)">
                <svg xmlns="http://www.w3.org/2000/svg" width="8" height="6" viewBox="0 0 8 6" fill="none">
                  <path
                    d="M3.01245 5.66893C2.8191 5.85406 2.51424 5.85406 2.32088 5.66893L0.377205 3.80796C0.171586 3.61109 0.171586 3.28252 0.377205 3.08565L0.587547 2.88426C0.780903 2.69914 1.08576 2.69914 1.27912 2.88426L2.32088 3.88169C2.51424 4.06682 2.8191 4.06682 3.01245 3.88169L6.72088 0.331072C6.91424 0.145944 7.2191 0.145943 7.41245 0.331072L7.62279 0.532463C7.82841 0.729332 7.82841 1.0579 7.62279 1.25477L3.01245 5.66893Z"
                    fill="white" />
                </svg>
              </span>
            </div>
          </div>
        </div>



        <!--Notes Section-->
        <div class="section">
          <h2>A Quick Note</h2>
          <div class="note-area">
            <textarea placeholder="Your notes goes here..." rows="4" [(ngModel)]="text" name="journalNotes"></textarea>
          </div>
        </div>

        <!--pin moment-->
        <div class="section">
          <h2>Pin a Moment</h2>

          <!-- Image Preview Area -->
          <div class="image-preview-container" *ngIf="imagePreviewUrl">
            <div class="image-preview-wrapper">
              <img [src]="imagePreviewUrl" alt="Selected image preview" class="image-preview" />
              <button class="remove-image-btn" (click)="removeImage()" type="button" aria-label="Remove image">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            <!-- Upload Progress -->
            <div class="upload-progress" *ngIf="isUploading">
              <div class="progress-bar">
                <div class="progress-fill" [style.width.%]="uploadProgress"></div>
              </div>
              <span class="progress-text">Uploading: {{ uploadProgress }}%</span>
            </div>

            <!-- Upload Success -->
            <div class="upload-success" *ngIf="uploadedImageUrl && !isUploading">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>Image ready</span>
            </div>
          </div>

          <!-- Pin Moment Button (only show if no image selected) -->
          <div class="pin-moment" *ngIf="!imagePreviewUrl" role="button" tabindex="0" aria-label="Choose item to pin"
            (click)="openAttachPopup()" (keydown.enter)="openAttachPopup()">
            <div class="pin-inner">
              <span class="pin-icon" aria-hidden="true">📎</span>
              <span class="pin-text">Choose item here</span>
            </div>
          </div>
        </div>
      </div>



    </div>
    <div class="post-button-container">
      <mindful-button type="magenta" text="Post" large class="mindful-button-full" (click)="submit()"></mindful-button>
    </div>
  </div>

  <div class="attach-popup-backdrop" *ngIf="showAttachPopup" role="dialog" aria-modal="true"
    aria-label="Attachment permission dialog">
    <div class="attach-popup" role="document">
      <div class="attach-icon">📁</div>
      <div class="attach-title">Allow Mindful Buddy to access photos, media, and files on your device?</div>
      <div class="attach-actions">
        <button class="attach-allow" (click)="onAllowAttach()">Allow</button>
        <button class="attach-deny" (click)="onDenyAttach()">Deny</button>
      </div>
    </div>
  </div>
  <!-- hidden file input triggered after user allows attach -->
  <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
</ion-content>
