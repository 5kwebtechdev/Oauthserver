<ion-content>
  <mindful-card-header [title]="'Your Journal, Your Journey'" [subtitleLeft]="'Track moods'" [subtitleMiddle]="'Save'"
    [subtitleRight]="'Feel Better'" [showBackArrow]="true" (backClick)="goBack()">
  </mindful-card-header>
  <div class="journal-input-container">

    <!-- Journal input container -->
    <div class="journal-input-container">
      <div class="timeline">
        <!-- Dynamic sections -->
        <div class="section" *ngFor="let section of sections; trackBy: trackBySection">
          <h2 [class.section-title-error]="section.key === 'emotions' && emotionError">{{section.title}}</h2>
          <div class="options">
            <div class="option" tabindex="0" role="button" [attr.aria-pressed]="isSelected(section.key, i)"
              (click)="selectOption(section.key, i)" (keydown.enter)="selectOption(section.key, i)"
              [class.selected]="isSelected(section.key, i)" *ngFor="let option of section.options; let i = index">
             <div class="j-img"> <img [src]="option.image" [alt]="option.label"></div>
              <span>{{option.label}}</span>
              <span class="check" *ngIf="isSelected(section.key, i)">
                <svg xmlns="http://www.w3.org/2000/svg" width="8" height="6" viewBox="0 0 8 6" fill="none">
                  <path
                    d="M3.01245 5.66893C2.8191 5.85406 2.51424 5.85406 2.32088 5.66893L0.377205 3.80796C0.171586 3.61109 0.171586 3.28252 0.377205 3.08565L0.587547 2.88426C0.780903 2.69914 1.08576 2.69914 1.27912 2.88426L2.32088 3.88169C2.51424 4.06682 2.8191 4.06682 3.01245 3.88169L6.72088 0.331072C6.91424 0.145944 7.2191 0.145943 7.41245 0.331072L7.62279 0.532463C7.82841 0.729332 7.82841 1.0579 7.62279 1.25477L3.01245 5.66893Z"
                    fill="white" />
                </svg>
              </span>
            </div>
          </div>
        </div>



        <!--Notes Section-->
        <div class="section" style="margin-bottom: 0;">
          <h2>A Quick Note</h2>
          <div class="note-area">
            <textarea placeholder="Your notes goes here..." [(ngModel)]="text" name="journalNotes" maxlength="160" (input)="onNotesInput()" (input)="autoExpandTextarea($event)"></textarea>
          </div>
          <div class="char-counter">{{ notesCharCount }}/{{ noteMaxLength }}</div>
        </div>

        <!--pin moment-->
        <div class="section">
          <h2>Pin a Momenttest5</h2>

          <!-- Image Upload Section (max 3 slots) -->
          <div class="image-upload-section d-flex align-items-center gap-2">
            <!-- Uploaded image slots -->
            <div *ngFor="let img of uploadedImages; let i = index" class="image-slot">
              <div class="image-preview-container">
                <img [src]="img.previewUrl" alt="Uploaded image" class="image-preview" />
                <button class="remove-image-btn" (click)="removeImage(i)" type="button" aria-label="Remove image">
                  <svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" viewBox="0 0 4 4" fill="none">
                    <path d="M2 2.42586L0.509506 3.91635C0.453739 3.97212 0.382763 4 0.296578 4C0.210393 4 0.139417 3.97212 0.0836502 3.91635C0.0278834 3.86058 0 3.78961 0 3.70342C0 3.61724 0.0278834 3.54626 0.0836502 3.49049L1.57414 2L0.0836502 0.509506C0.0278834 0.453739 0 0.382763 0 0.296578C0 0.210393 0.0278834 0.139417 0.0836502 0.0836502C0.139417 0.0278834 0.210393 0 0.296578 0C0.382763 0 0.453739 0.0278834 0.509506 0.0836502L2 1.57414L3.49049 0.0836502C3.54626 0.0278834 3.61724 0 3.70342 0C3.78961 0 3.86058 0.0278834 3.91635 0.0836502C3.97212 0.139417 4 0.210393 4 0.296578C4 0.382763 3.97212 0.453739 3.91635 0.509506L2.42586 2L3.91635 3.49049C3.97212 3.54626 4 3.61724 4 3.70342C4 3.78961 3.97212 3.86058 3.91635 3.91635C3.86058 3.97212 3.78961 4 3.70342 4C3.61724 4 3.54626 3.97212 3.49049 3.91635L2 2.42586Z" fill="#282527"/>
                  </svg>
                </button>
                <!-- Upload progress -->
                <div *ngIf="img.uploading" class="upload-progress-overlay">
                  <div class="progress-bar">
                    <div class="progress-fill" [style.width.%]="img.progress"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Empty upload slots (shown when at least 1 image is uploaded) -->
            <div *ngIf="uploadedImages.length > 0; else emptyPinSection" class="d-flex gap-2">
              <button *ngFor="let slot of getEmptySlotArray()" class="upload-slot-btn" (click)="triggerFileInput(uploadedImages.length + slot)" type="button" aria-label="Add more images">
                <img src="assets/icons/plus-icon.svg" alt="Add" width="16" height="16" />
              </button>
            </div>
          </div>

          <!-- Progress message -->
          <div *ngIf="isAnyImageUploading()" class="upload-status">
            Uploading images...
          </div>

          <!-- Upload Progress (visible during uploads) -->
          <div class="upload-progress" *ngIf="isAnyImageUploading()">
            <div class="progress-bar">
              <div class="progress-fill" [style.width.%]="getAverageProgress()"></div>
            </div>
            <span class="progress-text">{{ getAverageProgress() }}%</span>
          </div>

          <!-- Image upload error (invalid format / size) -->
          <div class="image-error" *ngIf="imageUploadError">{{ imageUploadError }}</div>

          

          <!-- Pin Moment Button (only show when no images uploaded) -->
          <ng-template #emptyPinSection>
            <label class="pin-moment" for="journalFileInput" role="button" tabindex="0" aria-label="Choose item to pin"
              (keydown.enter)="triggerNativeFilePicker()">
              <div class="pin-inner">
                <img class="pin-icon" src="assets/icons/attachment-small.svg" alt="Attach" aria-hidden="true" width="18" height="18" />
                <span class="pin-text">Choose item here</span>
              </div>
            </label>
          </ng-template>
        </div>
      </div>



      <div *ngIf="emotionError" class="field-error">{{ emotionError }}</div>
      
      <div class="post-button-container" (click)="onPostAttempt($event)">
        <mindful-button type="magenta" size="full" text="Post" [disabled]="!isPostEnabled"></mindful-button>
      </div>
    </div>
  </div>

  <!-- Hidden file input - triggers native device permission dialog automatically -->
  <input #fileInput id="journalFileInput" type="file" accept="image/*" (change)="onFileSelected($event)" style="display:none" />
</ion-content>
