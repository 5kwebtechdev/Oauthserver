<div class="superme-calendar" [class.calendar-main-style]="useCalendarMainStyle"
  [class.activity-detail-style]="useActivityDetailStyle">
  <div class="calendar-header">
    <!-- Navigation with arrows for activity-calendar, month picker for other uses -->
    <div *ngIf="useArrowNavigation" class="month-navigation">
      <button class="nav-arrow nav-arrow-previous" type="button" aria-label="Previous month" (click)="previousMonth()">
        <img *ngIf="useActivityDetailStyle" class="detail-nav-icon"
          [src]="'assets/app-assets/activity-detail/calendar-prev-' + activityDetailTheme + '.svg'" alt="" />
        <ion-icon *ngIf="!useActivityDetailStyle" name="chevron-back-outline"></ion-icon>
      </button>
      <span class="month-text">{{ currentMonth | date: 'MMMM yyyy' }}</span>
      <button class="nav-arrow nav-arrow-next" type="button" aria-label="Next month" (click)="nextMonth()">
        <img *ngIf="useActivityDetailStyle" class="detail-nav-icon"
          [src]="'assets/app-assets/activity-detail/calendar-next-' + activityDetailTheme + '.svg'" alt="" />
        <ion-icon *ngIf="!useActivityDetailStyle" name="chevron-forward-outline"></ion-icon>
      </button>
    </div>

    <div *ngIf="!useArrowNavigation" class="month-year" (click)="toggleMonthPicker()" role="button" tabindex="0">
      <span class="month-text">{{ currentMonth | date: 'MMMM yyyy' }}</span>
      <img class="chev" src="assets/app-assets/Chevron-down-time-table-input-icon.svg" alt="toggle" />
    </div>

    <div class="toggle-mood-buttons" *ngIf="showMoodToggle">
      <label class="mood-label">MOOD</label>
      <superme-toggle [checked]="moodOn" (checkedChange)="onMoodChange($event)"></superme-toggle>
    </div>

    <div class="month-picker" *ngIf="showMonthPicker && !useArrowNavigation">
      <div class="months">
        <button *ngFor="let m of months; let i = index" (click)="pickMonth(i)">{{ m }}</button>
      </div>
      <div class="years">
        <button *ngFor="let y of years" (click)="pickYear(y)">{{ y }}</button>
      </div>
    </div>
  </div>
  <div class="calendar-grid" [style.gridAutoRows.px]="(moodOn && useCalendarMainStyle) ? 46 : 35">
    <div class="day" *ngFor="let d of ['Sun','Mon','Tue','Wed','Thur','Fri','Sat']">{{ d }}</div>

    <button *ngFor="let date of getVisibleMonthDays()" [class.isStartDate]="isStartOfRange(date)"
      [class.isEndDate]="isEndOfRange(date)" [class.currentMonth]="isDateinCurrentMonth(date)"
      [class.selected]="allowDateSelection && (isSameDay(date, startDate) || isSameDay(date, endDate))" [class.in-range]="allowDateSelection && isInRange(date)"
      [class.mood-active]="moodOn && useCalendarMainStyle" [class.mood-inactive]="!moodOn && useCalendarMainStyle"
      [class.status-completed-day]="!showMoodToggle && getStatusForDate(date) === 'COMPLETED'"
      [class.status-skipped-day]="!showMoodToggle && getStatusForDate(date) === 'SKIPPED'"
      [class.status-pending-day]="!showMoodToggle && getStatusForDate(date) === 'PENDING'"
      [class.today]="isToday(date)"
      (click)="handleDateClick(date)">
      <p>{{ date.getDate() }}</p>

      <!-- Mood emoji shown under the date when mood toggle is ON and mood data exists -->
      <img *ngIf="moodOn && showMoodToggle && hasMoodData(date)" class="mood-emoji" [src]="getMoodEmoji(date)"
        alt="mood" />

      <!-- Activity dots shown when mood toggle is OFF -->
      <div *ngIf="!moodOn && showMoodToggle && hasActivities(date)" class="activity-dots">
        <svg *ngIf="getActivitiesForDate(date).timetable" xmlns="http://www.w3.org/2000/svg" width="4" height="4"
          viewBox="0 0 4 4" fill="none">
          <circle cx="2" cy="2" r="2" fill="#89B3B6" />
        </svg>
        <svg *ngIf="getActivitiesForDate(date).task" xmlns="http://www.w3.org/2000/svg" width="4" height="4"
          viewBox="0 0 4 4" fill="none">
          <circle cx="2" cy="2" r="2" fill="#F6AC72" />
        </svg>
        <svg *ngIf="getActivitiesForDate(date).habit" xmlns="http://www.w3.org/2000/svg" width="4" height="4"
          viewBox="0 0 4 4" fill="none">
          <circle cx="2" cy="2" r="2" fill="#8B8DCB" />
        </svg>
      </div>

      <!-- Status dot for habit detail calendar (shown when no mood toggle) -->
      <div *ngIf="!showMoodToggle && hasStatusData(date)" class="status-dot"
        [class.status-completed]="getStatusForDate(date) === 'COMPLETED'"
        [class.status-skipped]="getStatusForDate(date) === 'SKIPPED'"
        [class.status-pending]="getStatusForDate(date) === 'PENDING' && !isFutureScheduledStatus(date)"
        [class.status-future]="isFutureScheduledStatus(date)">
        <img *ngIf="useActivityDetailStyle && getStatusForDate(date) !== 'PENDING'" aria-hidden="true" alt=""
          [src]="'assets/app-assets/activity-detail/' + (getStatusForDate(date) === 'COMPLETED' ? 'check-' : 'close-') + activityDetailTheme + '.svg'" />
      </div>
    </button>
  </div>

</div>
