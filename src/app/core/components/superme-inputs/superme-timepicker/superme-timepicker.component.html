<div class="superme-timepicker-wrapper">
  <input type="text" [attr.placeholder]="placeholder" [value]="hasValue ? timeString : ''" [disabled]="disabled"
    (click)="openPopup()" class="time-display-input" readonly />

  <div class="overlay" #overlay *ngIf="showPopup" (click)="$event.stopPropagation()">
    <div class="popup wheel-popup" #popup>
      <h2 class="wheel-title">Set {{ label }}</h2>
      <p class="wheel-subtitle">Scroll to pick your time</p>

      <div class="wheel-columns">
        <div class="wheel-col">
          <span class="wheel-col-label">HOUR</span>
          <div class="wheel-viewport">
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-scroll" #hourWheel role="listbox" aria-label="Hour"
              (scroll)="onWheelScroll('hour', hourWheel)"
              (wheel)="onWheelInput('hour', $event, hourWheel)"
              (pointerdown)="onWheelPointerDown('hour', $event, hourWheel)"
              (pointermove)="onWheelPointerMove('hour', $event, hourWheel)"
              (pointerup)="onWheelPointerEnd('hour', $event, hourWheel)"
              (pointercancel)="onWheelPointerEnd('hour', $event, hourWheel)"
              (lostpointercapture)="onWheelPointerEnd('hour', $event, hourWheel)">
              <div class="wheel-spacer" aria-hidden="true"></div>
              <div class="wheel-item" *ngFor="let h of hoursList; let i = index" role="option"
                [attr.data-wheel-index]="i"
                [attr.aria-selected]="h === selectedHour" [class.selected]="h === selectedHour"
                (click)="selectWheelValue('hour', i, hourWheel, $event)">{{ h }}</div>
              <div class="wheel-spacer" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <span class="wheel-colon">:</span>

        <div class="wheel-col">
          <span class="wheel-col-label">MINUTE</span>
          <div class="wheel-viewport">
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-scroll" #minuteWheel role="listbox" aria-label="Minute"
              (scroll)="onWheelScroll('minute', minuteWheel)"
              (wheel)="onWheelInput('minute', $event, minuteWheel)"
              (pointerdown)="onWheelPointerDown('minute', $event, minuteWheel)"
              (pointermove)="onWheelPointerMove('minute', $event, minuteWheel)"
              (pointerup)="onWheelPointerEnd('minute', $event, minuteWheel)"
              (pointercancel)="onWheelPointerEnd('minute', $event, minuteWheel)"
              (lostpointercapture)="onWheelPointerEnd('minute', $event, minuteWheel)">
              <div class="wheel-spacer" aria-hidden="true"></div>
              <div class="wheel-item" *ngFor="let m of minutesList; let i = index" role="option"
                [attr.data-wheel-index]="i"
                [attr.aria-selected]="m === selectedMinute" [class.selected]="m === selectedMinute"
                (click)="selectWheelValue('minute', i, minuteWheel, $event)">{{
                m.toString().padStart(2, '0') }}</div>
              <div class="wheel-spacer" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <span class="wheel-colon">:</span>

        <div class="wheel-col">
          <span class="wheel-col-label">PERIOD</span>
          <div class="wheel-viewport">
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-scroll" #periodWheel role="listbox" aria-label="Period"
              (scroll)="onWheelScroll('period', periodWheel)"
              (wheel)="onWheelInput('period', $event, periodWheel)"
              (pointerdown)="onWheelPointerDown('period', $event, periodWheel)"
              (pointermove)="onWheelPointerMove('period', $event, periodWheel)"
              (pointerup)="onWheelPointerEnd('period', $event, periodWheel)"
              (pointercancel)="onWheelPointerEnd('period', $event, periodWheel)"
              (lostpointercapture)="onWheelPointerEnd('period', $event, periodWheel)">
              <div class="wheel-spacer" aria-hidden="true"></div>
              <div class="wheel-item" *ngFor="let p of periodsList; let i = index" role="option"
                [attr.data-wheel-index]="i"
                [attr.aria-selected]="p === ampm" [class.selected]="p === ampm"
                (click)="selectWheelValue('period', i, periodWheel, $event)">{{ p }}</div>
              <div class="wheel-spacer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="wheel-durations" *ngIf="quickDurations && quickDurations.length">
        <button type="button" class="duration-pill" *ngFor="let d of quickDurations"
          [class.selected]="selectedDurationMinutes === d"
          (click)="$event.stopPropagation(); selectDuration(d)">{{ formatDuration(d) }}</button>
      </div>

      <div class="wheel-footer">
        <button type="button" class="wheel-cancel" (click)="$event.stopPropagation(); cancel()">Cancel</button>
        <button type="button" class="wheel-done" (click)="$event.stopPropagation(); confirm()">Done</button>
      </div>
    </div>
  </div>
</div>
