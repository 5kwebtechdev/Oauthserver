<div class="superme-timepicker-wrapper">
  <input type="text" [attr.placeholder]="placeholder" [value]="hasValue ? timeString : ''" [disabled]="disabled"
    (click)="openPopup()" class="time-display-input" readonly />

  <div class="overlay" *ngIf="showPopup">
    <div class="popup wheel-popup" #popup>
      <h2 class="wheel-title">Set {{ label }}</h2>
      <p class="wheel-subtitle">Scroll to pick your time</p>

      <div class="wheel-columns">
        <div class="wheel-col">
          <span class="wheel-col-label">HOUR</span>
          <div class="wheel-viewport">
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-scroll" #hourWheel (scroll)="onWheelScroll('hour', hourWheel)">
              <div class="wheel-spacer" aria-hidden="true"></div>
              <div class="wheel-item" *ngFor="let h of hoursList" [class.selected]="h === selectedHour">{{ h }}</div>
              <div class="wheel-spacer" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <span class="wheel-colon">:</span>

        <div class="wheel-col">
          <span class="wheel-col-label">MINUTE</span>
          <div class="wheel-viewport">
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-scroll" #minuteWheel (scroll)="onWheelScroll('minute', minuteWheel)">
              <div class="wheel-spacer" aria-hidden="true"></div>
              <div class="wheel-item" *ngFor="let m of minutesList" [class.selected]="m === selectedMinute">{{
                m.toString().padStart(2, '0') }}</div>
              <div class="wheel-spacer" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <span class="wheel-colon">:</span>

        <div class="wheel-col">
          <span class="wheel-col-label">PERIOD</span>
          <div class="wheel-viewport">
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-scroll" #periodWheel (scroll)="onWheelScroll('period', periodWheel)">
              <div class="wheel-spacer" aria-hidden="true"></div>
              <div class="wheel-item" *ngFor="let p of periodsList" [class.selected]="p === ampm">{{ p }}</div>
              <div class="wheel-spacer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="wheel-durations" *ngIf="quickDurations && quickDurations.length">
        <button type="button" class="duration-pill" *ngFor="let d of quickDurations"
          [class.selected]="selectedDurationMinutes === d"
          (click)="$event.stopPropagation(); selectDuration(d)">{{ formatDuration(d) }}</button>
      </div>

      <div class="wheel-footer">
        <button type="button" class="wheel-cancel" (click)="$event.stopPropagation(); cancel()">Cancel</button>
        <button type="button" class="wheel-done" (click)="$event.stopPropagation(); confirm()">Done</button>
      </div>
    </div>
  </div>
</div>
