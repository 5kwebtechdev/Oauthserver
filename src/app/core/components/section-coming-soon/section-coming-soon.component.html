<section
  class="coming-soon"
  [class.coming-soon--compact]="compact"
  role="status"
  [attr.aria-label]="sectionName + ' content coming soon'">
  <div class="coming-soon__visual" aria-hidden="true">
    <img
      class="coming-soon__image"
      src="assets/figma/empty-state/coming-soon-family.webp"
      alt="" />
  </div>

  <div class="coming-soon__copy">
    <h2 class="coming-soon__title">
      Something<br />
      <span>awesome</span> is brewing!
    </h2>
    <p class="coming-soon__message">
      We’re crafting a better experience for you in this section and can’t wait to show it to you.
    </p>
  </div>
</section>
