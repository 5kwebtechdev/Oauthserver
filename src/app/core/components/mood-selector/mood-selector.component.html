<div class="mood-card" [class.mood-card--saved]="!isParent && !showMoodPicker"
  [class.mood-card--picker]="!isParent && showMoodPicker" role="group" aria-label="Mood selector">
  <ng-container *ngIf="isParent">
    <div class="mood-card-preview">
      <img [src]="popupPreviewSrc" [alt]="popupPreviewLabel" />
    </div>
    <p class="mood-card-subtitle">
      You're in a <strong>{{ activeLabel | uppercase }}</strong> space right now!
    </p>
  </ng-container>

  <ng-container *ngIf="!isParent && !showMoodPicker">
    <div class="saved-mood" aria-live="polite">
      <div class="saved-mood-avatar">
        <img [src]="displayAssetSrc" [alt]="activeLabel" />
        <button type="button" class="saved-mood-edit" aria-label="Change your mood" (click)="editMood()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
          </svg>
        </button>
      </div>
      <p class="saved-mood-message">
        You’re in a <strong>{{ activeLabel | uppercase }}</strong> space right now!
      </p>
    </div>
  </ng-container>

  <ng-container *ngIf="!isParent && showMoodPicker">
    <div class="mood-card-grid" aria-label="Choose your mood">
      <button
        *ngFor="let p of popupOptions; trackBy: trackByMood"
        type="button"
        class="mood-option"
        [class.selected]="isMoodSelected(p)"
        [attr.aria-pressed]="isMoodSelected(p)"
        (click)="choosePopup(p.src)">
        <span class="mood-option-avatar">
          <span class="mood-option-art" [ngClass]="'mood-option-art--' + p.art">
            <img [src]="p.src" [alt]="p.label" />
          </span>
        </span>
        <span *ngIf="isMoodSelected(p)" class="mood-option-selected-mark" aria-hidden="true">✓</span>
        <span class="mood-option-label">{{ p.label }}</span>
      </button>
    </div>

    <span *ngIf="blockedTooltipVisible" class="blocked-tooltip" role="status">
      You can only input your mood twice a day
    </span>

    <div class="mood-picker-actions">
      <button type="button" class="mood-card-cta" [disabled]="!popupSelection" (click)="setVibe()">Set the Vibe</button>
      <span class="mood-set-count">{{ moodSetsLabel }}</span>
      <button type="button" class="mood-limit-info" aria-label="Mood setting limit information" [attr.aria-expanded]="limitInfoVisible" (click)="toggleLimitInfo()">i</button>
    </div>
    <p *ngIf="limitInfoVisible" class="mood-limit-message" role="status">You can set your mood up to twice each day.</p>
  </ng-container>
</div>
