<div class="mood-card" role="group" aria-label="Mood selector">

  <div class="mood-card-header">
    <span class="mood-card-title">Today’s Mood</span>
  </div>

  <!-- Read-only parent view: show today's current mood -->
  <ng-container *ngIf="isParent">
    <div class="mood-card-preview">
      <img [src]="popupPreviewSrc" [alt]="popupPreviewLabel" />
    </div>
    <p class="mood-card-subtitle">
      You're in a calm <strong>{{ activeLabel | uppercase }}</strong> space right now !
    </p>
  </ng-container>

  <ng-container *ngIf="!isParent">
    <div class="mood-card-grid" aria-label="Choose your mood">
      <button *ngFor="let p of popupOptions" type="button" class="mood-option" (click)="choosePopup(p.src)"
        [class.selected]="popupSelection === p.src">
        <span class="mood-option-avatar">
          <img [src]="p.src" [alt]="p.label" />
        </span>
        <span class="mood-option-label">{{ p.label }}</span>
      </button>
    </div>

    <span *ngIf="blockedTooltipVisible" class="blocked-tooltip" role="status">
      You can only input your mood twice a day
    </span>

    <button type="button" class="mood-card-cta" [disabled]="!popupSelection" (click)="setVibe()">
      Set the Vibe
    </button>
  </ng-container>

</div>
