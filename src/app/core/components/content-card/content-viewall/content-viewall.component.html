<!-- Header: Today's Challenge -->
<div class="content-viewall-screen">
  <div class="cv-header">
    <button class="back-btn" (click)="goBack()" aria-label="Back">
      <!-- back icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M11.2929 23.2929C10.9024 23.6834 10.9024 24.3166 11.2929 24.7071L17.6569 31.0711C18.0474 31.4616 18.6805 31.4616 19.0711 31.0711C19.4616 30.6805 19.4616 30.0474 19.0711 29.6569L13.4142 24L19.0711 18.3431C19.4616 17.9526 19.4616 17.3195 19.0711 16.9289C18.6805 16.5384 18.0474 16.5384 17.6569 16.9289L11.2929 23.2929ZM36 25C36.5523 25 37 24.5523 37 24C37 23.4477 36.5523 23 36 23V25ZM12 24V25H36V24V23H12V24Z" fill="#282527"/>
      </svg>
    </button>

    <!-- header text block -->
    <div class="header-text">
      <div class="header-title">Today's Challenge Awaits!</div>

      <div class="header-chips">
        <span class="chip">Do task</span>
        <svg class ="dot" xmlns="http://www.w3.org/2000/svg" width="5" height="4" viewBox="0 0 5 4" fill="none">
  <circle cx="2.5" cy="2" r="2" fill="#282527"/>
</svg>
        <span class="chip">Earn trophies</span>
        <svg class = "dot" xmlns="http://www.w3.org/2000/svg" width="5" height="4" viewBox="0 0 5 4" fill="none">
  <circle cx="2.5" cy="2" r="2" fill="#282527"/>
</svg>
        <span class="chip">Grow daily</span>
      </div>
    </div>
  </div>
  <!-- challenges list -->

    <div class="challenge-card" *ngFor="let d of list">
      <div class="challenge-media">
        <img [src]="d.image" [alt]="d.title + ' cover'" />
      </div>

      <div class="challenge-info">
        <div class="challenge-header">
          <h3 class="challenge-title">{{ d.title }}</h3>
          <div class="difficulty" aria-hidden="true">{{ d.difficulty }}</div>
        </div>

        <div class="challenge-desc">{{ d.description }}</div>

        <div class="challenge-footer">
          <div class="rewards">
            <div class="currency-reward">
              <img src="/assets/app-assets/Currency-icon.svg" alt="points" />
              <span class="count">{{ d.rewards?.points }}</span>
            </div>
            <div class="currency-reward">
              <img src="/assets/app-assets/Trophies-icon.svg" alt="trophies" />
              <span class="count">{{ d.rewards?.trophies }}</span>
            </div>
          </div>

          <button class="time-cta" (click)="onPlay(d)">{{ d.durationLabel }}</button>
        </div>
      </div>
    </div>
</div>
