<div class="content-main">
  <div class="card">
    <div class="card-bg" role="img" aria-label="Content background"></div>

    <div class="card-content">
      <h3 class="card-title">Challenge Your Mind: Play, Solve, Win!</h3>
    </div>

    <div class="search-row">
      <div class="search-input">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" placeholder="Looking for a puzzle?" aria-label="Search" />
      </div>
    </div>

    <div class="cheer">
      <div class="cheer-text">I’m cheering for you! Let’s get things done!</div>
      <img src="/assets/app-assets/Digital-pet-panda.svg" alt="panda" class="cheer-img" />
    </div>
  </div>

  <!-- Categories -->
  <div class="categories">
    <div class="for-you-label">
      <a class="category for-you" href="/for-you" target="_blank" rel="noopener noreferrer">
        <div class="icon" aria-hidden="true"></div>
        <div class="label">For You</div>
      </a>
    </div>

    <div class="sep" aria-hidden="true"></div>

    <a class="category puzzles" href="/puzzles" target="_blank" rel="noopener noreferrer">
      <div class="icon" aria-hidden="true"></div>
      <div class="label">Puzzles</div>
    </a>

    <div class="sep" aria-hidden="true"></div>

    <a class="category quizzes" href="/quizzes" target="_blank" rel="noopener noreferrer">
      <div class="icon" aria-hidden="true"></div>
      <div class="label">Quizzes</div>
    </a>

    <div class="sep" aria-hidden="true"></div>

    <a class="category articles" href="/articles" target="_blank" rel="noopener noreferrer">
      <div class="icon" aria-hidden="true"></div>
      <div class="label">Articles</div>
    </a>
  </div>

  <!--Content Filter-->
  <div class="content-filter">
    <nav class="pill-tabs" role="tablist" aria-label="Content filters">
      <button class="pill active" role="tab" aria-selected="true">Recently added</button>
      <button class="pill" role="tab" aria-selected="false">Trending</button>
      <button class="pill" role="tab" aria-selected="false">Not done by you</button>
    </nav>
  </div>

  <!-- Puzzle cards grid -->
  <div class="puzzle-cards">
    <article class="puzzle-card" *ngFor="let d of (data?.length ? data : puzzles)">
      <div class="puzzle-media">
        <img [src]="d.image" [alt]="d.title + ' cover'" />
      </div>

      <div class="puzzle-info">
        <div class="puzzle-header">
          <h3 class="puzzle-title">{{ d.title }}</h3>
          <div class="difficulty" aria-hidden="true">{{ d.difficulty }}</div>
        </div>

        <p class="puzzle-desc">{{ d.description }}</p>

        <div class="puzzle-footer">
          <div class="rewards">
            <div class="reward">
              <img src="/assets/app-assets/Currency-icon.svg" alt="points" />
              <span class="count">{{ d.rewards?.points }}</span>
            </div>
            <div class="reward">
              <img src="/assets/app-assets/Trophies-icon.svg" alt="trophies" />
              <span class="count">{{ d.rewards?.trophies }}</span>
            </div>
          </div>

          <button class="cta" (click)="onPlay(d)">{{ d.durationLabel }}</button>
        </div>
      </div>
    </article>
  </div>
</div>
