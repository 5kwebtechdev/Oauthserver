<div class="quiz-page">
  <div class="quiz-header">
    <div class="nav-left">
      <img src="/assets/images/Close.png" class="close-icon" />
      <div class="title">Title</div>
    </div>
      <div class="timer">
        <img src="/assets/images/timer.png" class="timer-icon" />
        <div class="timer-value">05:00</div>
      </div>
  </div>

  <div class="question-count">Questions 01 of 05</div>

  <div class="progress-row">
    <div class="progress-bar">
      <div class="progress">
        <svg xmlns="http://www.w3.org/2000/svg" width="361" height="6" viewBox="0 0 361 6" fill="none">
          <path opacity="0.2" d="M3 3L358 3" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
<!--Question Area-->
  <div class="question-area">
    <img src="/assets/images/question-image.png" alt="question-image" class="cheer-img" />
    <div class="speech-bubble">{{ question }}</div>
  </div>

  <div class="prompt">Tap the correct answer</div>

  <div class="answers">
    <div *ngFor="let a of answers" class="answer-row">
      <mindful-button type="lavendar-transparent" large [text]="a.text" (click)="onSelect(a.id)"></mindful-button>
    </div>
  </div>

  <div class="hint-row">
    <div class="hint-left">
      <div class="stuck">Stuck?</div>
      <div class="hint-sub">Need a hint for 20 coins?</div>
    </div>
    <div class="hint-right">
      <div class="hint-btn">
        <mindful-button type="lavendar" text="Hint" (click)="onHint()"></mindful-button>
      </div>
      <div class="hints-left">2/2 remaining</div>
    </div>
  </div>

  <div class="next-cta">
    <mindful-button type="green" text="Next Question" large (click)="onNext()"></mindful-button>
  </div>
</div>
