<div class="content-main">
  <div class="card">
    <div class="card-bg" role="img" aria-label="Content background"></div>

    <div class="card-content">
      <h3 class="card-title">Challenge Your Mind: Play, Solve, Win!</h3>
    </div>

    <div class="search-row">
      <div class="search-input">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" placeholder="Looking for an article?" aria-label="Search" />
      </div>
    </div>

    <div class="cheer">
      <div class="cheer-text">I’m cheering for you! Let’s get things done!</div>
      <img src="/assets/app-assets/Digital-pet-panda.svg" alt="panda" class="cheer-img" />
    </div>
  </div>

  <div class="categories">
    <div class="for-you-label">
      <a class="category for-you" href="/for-you" target="_blank" rel="noopener noreferrer">
        <div class="icon" aria-hidden="true"></div>
        <div class="label">For You</div>
      </a>
    </div>

    <div class="sep" aria-hidden="true"></div>

    <a class="category puzzles" href="/puzzles" target="_blank" rel="noopener noreferrer">
      <div class="icon" aria-hidden="true"></div>
      <div class="label">Puzzles</div>
    </a>

    <div class="sep" aria-hidden="true"></div>

    <a class="category quizzes" href="/quizzes" target="_blank" rel="noopener noreferrer">
      <div class="icon" aria-hidden="true"></div>
      <div class="label">Quizzes</div>
    </a>

    <div class="sep" aria-hidden="true"></div>

    <a class="category articles" href="/articles" target="_blank" rel="noopener noreferrer">
      <div class="icon" aria-hidden="true"></div>
      <div class="label">Articles</div>
    </a>
  </div>

  <div class="content-filter">
    <nav class="pill-tabs" role="tablist" aria-label="Content filters">
      <button class="pill active" role="tab" aria-selected="true">Recently added</button>
      <button class="pill" role="tab" aria-selected="false">Trending</button>
      <button class="pill" role="tab" aria-selected="false">Not read by you</button>
    </nav>
  </div>

  <div class="puzzle-cards">
    <article class="puzzle-card article-style" *ngFor="let d of (data?.length ? data : articles)">
      <img class="article-hero" [src]="d.image" [alt]="d.title + ' cover'" />

      <div class="article-content">
        <div class="article-pill">{{ d.category || 'Academic Performance' }}</div>
       <div class="article-title">{{ d.title }}</div>
            

          <div class="desc-time">
            <div class="article-summary">{{ d.description }}</div>
            <button class="read-cta" (click)="onOpen(d)">{{ d.durationLabel }}</button>
          </div>
      </div>
    </article>
  </div>
</div>
