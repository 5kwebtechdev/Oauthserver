<div class="superme-tags">
  <div class="tags-row">
    <div class="tags-slider" #tagsSlider role="list">
      <div class="tag-wrapper" #tagEl *ngFor="let option of options">
        <superme-badge class="tag" *ngIf="option" [text]="option.value || ''" [type]="getBadgeType(option)"
          [large]="size === 'large'" [medium]="size === 'medium'"
          [showDelete]="canDeleteTag(option.key)"
          (click)="toggleSelection(option.key)"
          (deleteClick)="openDeleteConfirm(option.key)"
          long-press [delay]="1500" (press)="openTagMenu(option.key, tagEl)" (tap)="closeTagMenu()">
        </superme-badge>
      </div>
    </div>

    <div class="tags-add-inline" *ngIf="allowAdd">
      <div class="add-wrapper" #addEl>
        <superme-badge class="add-new" [ngClass]="{disabled: options.length >= maxTags}" text="Add new +" [type]="variant + '-selected'"
          (click)="openAdd(addEl)"></superme-badge>
      </div>
    </div>
  </div>

  <div *ngIf="showLimitError" class="field-error top-margin" role="alert">{{ limitErrorMessage }}</div>

  <!-- Popover for edit/delete -->
  <div class="tag-popover-fixed" *ngIf="activeTagKey && popoverPosition"
    [ngStyle]="{ left: (popoverPosition.left) + 'px', top: (popoverPosition.top) + 'px' }">
    <div class="tag-popover-inner" (click)="$event.stopPropagation()">
      <button class="pop-btn edit" *ngIf="canEditTag(activeTagKey)" (click)="onEdit(activeTagKey, $event)" aria-label="Edit">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path
            d="M2 16H3.425L13.2 6.225L11.775 4.8L2 14.575V16ZM0 18V13.75L13.2 0.575C13.4 0.391667 13.6208 0.25 13.8625 0.15C14.1042 0.05 14.3583 0 14.625 0C14.8917 0 15.15 0.05 15.4 0.15C15.65 0.25 15.8667 0.4 16.05 0.6L17.425 2C17.625 2.18333 17.7708 2.4 17.8625 2.65C17.9542 2.9 18 3.15 18 3.4C18 3.66667 17.9542 3.92083 17.8625 4.1625C17.7708 4.40417 17.625 4.625 17.425 4.825L4.25 18H0ZM12.475 5.525L11.775 4.8L13.2 6.225L12.475 5.525Z"
            fill="#282527" />
        </svg>
      </button>
      <!-- Open delete confirmation popup instead of deleting immediately -->
      <button class="pop-btn delete" *ngIf="canDeleteTag(activeTagKey)" (click)="openDeleteConfirm(activeTagKey)" aria-label="Delete">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 16 18" fill="none">
          <path
            d="M3 18C2.45 18 1.97917 17.8042 1.5875 17.4125C1.19583 17.0208 1 16.55 1 16V3H0V1H5V0H11V1H16V3H15V16C15 16.55 14.8042 17.0208 14.4125 17.4125C14.0208 17.8042 13.55 18 13 18H3ZM13 3H3V16H13V3ZM5 14H7V5H5V14ZM9 14H11V5H9V14Z"
            fill="#282527" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Delete confirmation popup -->
  <app-superme-popup [isVisible]="showDeleteConfirm" [config]="deleteConfirmConfig" (primaryAction)="confirmDelete()"
    (secondaryAction)="cancelConfirmDelete()" (closeAction)="cancelConfirmDelete()"
    (backdropClick)="cancelConfirmDelete()">
  </app-superme-popup>

  <!-- Unified Edit/Add popup -->
  <div class="tag-input-fixed" *ngIf="showInputPopup && (inputPresentation === 'bottom-sheet' || inputPopupPosition)"
    [class.tag-input-fixed--sheet]="inputPresentation === 'bottom-sheet'" (click)="cancelInputPopup()">
    <section *ngIf="inputPresentation === 'bottom-sheet'; else anchoredInput" class="tag-input-sheet"
      role="dialog" aria-modal="true" aria-labelledby="new-category-title" (click)="$event.stopPropagation()">
      <div class="tag-input-sheet__handle" aria-hidden="true"></div>
      <header class="tag-input-sheet__header">
        <h2 id="new-category-title">{{ isEditMode ? 'Edit Category' : 'New Category' }}</h2>
        <p>Name your new category</p>
      </header>

      <label class="tag-input-sheet__field">
        <span class="tag-input-sheet__edit-icon" aria-hidden="true">
          <img src="assets/icons/edit.svg" alt="">
        </span>
        <input class="custom-tag-input__field" type="text" maxlength="10" [(ngModel)]="inputValue"
          [placeholder]="isEditMode ? 'Edit tag' : 'eg: Mindfulness, Finance, Sport'"
          (keydown.enter)="saveInputPopup()" #tagInput />
      </label>
      <span class="tag-input-sheet__count" aria-live="polite">{{ inputValue.length }}/10</span>

      <button type="button" class="tag-input-sheet__submit" [disabled]="!inputValue.trim()"
        (click)="saveInputPopup()">{{ isEditMode ? 'Save Category' : 'Add Category' }}</button>
    </section>

    <ng-template #anchoredInput>
    <div class="tag-input-inner" (click)="$event.stopPropagation()"
      [ngStyle]="{ left: (inputPopupPosition?.left) + 'px', top: (inputPopupPosition?.top) + 'px' }">
      <div class="custom-tag-input">
        <input class="custom-tag-input__field" type="text" maxlength="10" [(ngModel)]="inputValue" 
          [placeholder]="isEditMode ? 'Edit tag' : 'Type the name here'"
          (keydown.enter)="saveInputPopup()" #tagInput />
      </div>
      <superme-button type="plum" [text]="isEditMode ? 'Save' : 'Add'" (click)="saveInputPopup()"></superme-button>
    </div>
    </ng-template>
  </div>
</div>
