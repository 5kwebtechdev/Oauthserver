<ion-content>
  <div class="container">
    <mindful-navigator backIcon="arrowSvg" (back)="goBack()"></mindful-navigator>


    <div *ngIf="!isLoadingCourse && !loadError && course">
      <img [src]="course?.image || 'header-img.png'" alt="{{ course?.title }} Illustration">
      <h3>{{ course?.title }}</h3>
      <p class="subtitle">{{ course?.lessons }} lessons • {{ course?.duration }}</p>
      <p class="desc">{{ course?.description }}</p>
    </div>
  </div>

  <div class="lesson" *ngFor="let lesson of lessons; let i = index">
    <div class="lesson-thumb">
      <img [src]="lesson.image" [alt]="lesson.title" />
    </div>
    <div class="lesson-info">
      <h3>{{ lesson.title }}</h3>
      <p>{{ lesson.desc }}</p>
      <span class="time">{{ lesson.time }}
        <span class="dot">•</span>
        <img class="coin-icon" src="/assets/Icons-Neutral/Icons-Coins.png" alt="coins" />
        <span class="coin-value">{{ lesson.coins || 0 }}</span>
      </span>

      <mindful-button *ngIf="i === 0" [type]="'magenta'" small (click)="onStartLesson(i)"
        [text]="'Start Lesson'"></mindful-button>
    </div>
  </div>

</ion-content>
