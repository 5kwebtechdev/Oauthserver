<div class="lesson-container">

  <!-- Scrollable area: header + body content -->
  <div class="lesson-scroll">

    <!-- Header -->
    <div class="header" *ngIf="lesson">
      <superme-navigator backIcon="arrowSvg" (back)="close()"></superme-navigator>
      <img [src]="convertGoogleDriveUrl(lesson.thumbnailUrl)" alt="Lesson" class="lesson-img"
        (error)="onImageError($event)">
      <h1>{{ lesson.order }}. {{ lesson.title }}</h1>
      <p class="time">{{ lesson.videoUrl ? 'Video' : 'Text-based' }} • {{ lesson.duration }} min</p>
      <p class="desc">{{ lesson.description }}</p>
    </div>

    <div class="content" [innerHTML]="lesson?.content"></div>

  </div>

  <!-- Sticky footer — always visible above the system navigation bar -->
  <div class="footer-cta d-flex w-100 gap-2" *ngIf="lesson && !wasCompletedOnLoad && (!doneClicked || !isLastLesson)">
    <superme-button *ngIf="!doneClicked"
      [type]="'green'" [text]="'Done'" (click)="onDoneClick()"></superme-button>
    <superme-button *ngIf="doneClicked && !isLastLesson"
      [type]="'magenta'" [text]="'Go to Lesson ' + nextLessonOrder" (click)="goToNext()">
    </superme-button>
  </div>

</div>
