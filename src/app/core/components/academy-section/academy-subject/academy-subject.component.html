<ion-content>
  <div class="as-page">
    <!-- Header -->
    <div class="as-header">
      <button class="as-back" (click)="goBack()" aria-label="Go back">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="#282527"/>
        </svg>
      </button>
      <div class="as-header__text">
        <h1 class="as-title">{{ categoryTitle }}</h1>
        <p class="as-subtitle" *ngIf="categorySubtitle">{{ categorySubtitle }}</p>
      </div>
    </div>

    <!-- Loading -->
    <div class="as-state" *ngIf="isLoading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Empty -->
    <div class="as-state" *ngIf="!isLoading && lessons.length === 0">
      <p>No courses available in this category.</p>
    </div>

    <!-- Course List -->
    <div class="as-list" *ngIf="!isLoading && lessons.length">
      <div class="as-course" *ngFor="let l of lessons; let i = index"
           (click)="openCourseByTitle(l.title)"
           [style.animation-delay]="(i * 60) + 'ms'">
        <div class="as-course__thumb">
          <img [src]="l.thumb" [alt]="l.title" (error)="onCourseImageError($event, l)">
        </div>
        <div class="as-course__body">
          <h3 class="as-course__title">{{ l.title }}</h3>
          <p class="as-course__meta">{{ l.meta }}</p>
          <div class="as-course__bottom">
            <div class="as-course__coins">
              <img [src]="l.coinIcon" alt="coins">
              <span>{{ l.coins }} coins</span>
            </div>
            <span *ngIf="l.assignedByParent" class="as-assigned-by-parent">Assigned by Parent</span>
            <span class="as-badge" [ngClass]="l.badge.toLowerCase()">{{ l.badge }}</span>
          </div>
        </div>
        <svg class="as-course__chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="#C0B8BC"/>
        </svg>
      </div>
    </div>
  </div>
</ion-content>
