<section class="academy" aria-labelledby="skills-quest-title">
  <header class="academy__header">
    <div class="academy__heading">
      <div class="academy__title-row">
        <img src="assets/figma/child-home/skills-header.webp" alt="" aria-hidden="true">
        <h3 id="skills-quest-title">Your Skills Quest</h3>
      </div>
      <p>Real lessons <span></span> Life ready <span></span> Future strong</p>
    </div>
  </header>

  <button type="button" class="academy__feature academy__feature--articles" (click)="openArticles()">
    <img class="academy__feature-icon" src="assets/figma/child-home/article-latest.webp" alt="" aria-hidden="true">
    <span class="academy__feature-copy">
      <strong>Articles</strong>
      <small>Expand your knowledge</small>
      <em>{{ articleCount }} {{ articleCount === 1 ? 'article' : 'articles' }}</em>
    </span>
    <img class="academy__feature-arrow" src="assets/figma/child-home/skills-arrow.svg" alt="" aria-hidden="true">
  </button>

  <div class="academy__masterclass">
    <button type="button" class="academy__feature academy__feature--masterclass" (click)="onViewAll()">
      <img class="academy__feature-icon" src="assets/figma/child-home/masterclass-latest.webp" alt="" aria-hidden="true">
      <span class="academy__feature-copy">
        <strong>MasterClass</strong>
        <small>Learn from the best</small>
        <em>{{ masterClassCount }} {{ masterClassCount === 1 ? 'course' : 'courses' }}</em>
      </span>
      <img class="academy__feature-arrow" src="assets/figma/child-home/skills-arrow.svg" alt="" aria-hidden="true">
    </button>

    <div class="academy__loading" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <div class="academy__progress-cards" *ngIf="!loading && state === 1 && courses.length">
      <button type="button" class="academy__progress-card" *ngFor="let course of courses"
        (click)="onStartCourse(course)">
        <span class="academy__course-head">
          <img *ngIf="getCourseImage(course) as courseImage" [src]="courseImage" [alt]="course.courseName"
            (error)="onImageError($event)">
          <span>
            <small>{{ course.category || 'MasterClass' }}</small>
            <strong>{{ course.courseName }}</strong>
          </span>
        </span>
        <span class="academy__progress-label">
          <em>Lessons completed: {{ course.completedLessons || 0 }}/{{ course.noOfLessons || 0 }}</em>
          <small>{{ getCourseProgress(course) }}%</small>
        </span>
        <span class="academy__progress-track">
          <span [style.width.%]="getCourseProgress(course)"></span>
        </span>
      </button>
    </div>

    <div class="academy__progress-cards" *ngIf="!loading && state === 2 && lessons.length">
      <button type="button" class="academy__progress-card" *ngFor="let lesson of lessons"
        (click)="onLessonCta(lesson)">
        <span class="academy__course-head">
          <img *ngIf="getLessonImage(lesson) as lessonImage" [src]="lessonImage" [alt]="lesson.lessonTitle"
            (error)="onImageError($event)">
          <span>
            <small>{{ lesson.courseName || 'MasterClass' }}</small>
            <strong>{{ lesson.lessonTitle }}</strong>
          </span>
        </span>
        <span class="academy__progress-label">
          <em>{{ lesson.ctaLabel || lesson.lessonStatus || 'Ready to continue' }}</em>
          <small>{{ getLessonProgress(lesson) === null ? '—' : getLessonProgress(lesson) + '%' }}</small>
        </span>
        <span class="academy__progress-track">
          <span [style.width.%]="getLessonProgress(lesson) ?? 0"></span>
        </span>
      </button>
    </div>

    <p class="academy__empty" *ngIf="!loading && state === 3">
      You’ve completed all courses! Amazing work!
    </p>

    <p class="academy__empty"
      *ngIf="!loading && state !== 3 && !courses.length && !lessons.length">
      No courses available right now.
    </p>
  </div>
</section>
