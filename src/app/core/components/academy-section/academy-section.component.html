<section class="academy">
  <mindful-card-header [title]="'Begin Your Life Skills Quest!'" [subtitleLeft]="'Real lessons'"
    [subtitleMiddle]="'Life ready'" [subtitleRight]="'Future strong'">
    <mindful-view-all mindful-header-actions class="see-all" (clicked)="onViewAll()">
    </mindful-view-all>
  </mindful-card-header>

  <div class="academy__cards">
    <!-- prevent-clicks="false" stops Swiper from eating tap events on Android WebView -->
    <swiper-container class="academy-swiper" [slides-per-view]="'auto'" [space-between]="10" [pagination]="false"
      [scrollbar]="false" [centeredSlides]="false" [freeMode]="true"
      prevent-clicks="false" prevent-clicks-propagation="false">
      <swiper-slide class="academy-slide" *ngFor="let c of courses" (click)="onStart(c)">
        <article class="academy__card">
          <div class="academy__content">
            <div class="academy-main-title">
              <img class="academy__img" [src]="c.image" alt="{{c.title}}">
              <div class="title-time-level">
                <div class="title-n-time">
                  <h4 class="title">{{c.title}}</h4>
                  <div class="meta">{{c.lessons}} {{c.lessons === 1 ? 'lesson' : 'lessons'}} • {{c.duration}}</div>
                </div>
                <span class="level">{{c.level}}</span>
              </div>
            </div>
            <p class="desc">{{c.description}}</p>
            <div class="card-footer">
              <mindful-button class="start" type="pink-small" size="medium" text="Start Course"></mindful-button>
            </div>
          </div>
        </article>
      </swiper-slide>
    </swiper-container>
  </div>
</section>
