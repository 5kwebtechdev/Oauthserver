<ion-content [fullscreen]="true">
  <div class="main-container">
    <!-- Header -->
    <mindful-card-header [title]="'Welcome to Your Life Skills Quest!'" [subtitleLeft]="'Real lessons'"
      [subtitleMiddle]="'Life ready'" [subtitleRight]="'Future strong'" [showBackArrow]="true"
      (backClick)="onBackClick()">
    </mindful-card-header>

    <!-- Panda Section -->
    <div class="panda-section">
      <img src="/assets/Images-Transparent/Image-Academy-Cat1.png" alt="Panda" class="panda-img">
      <div class="speech-bubble">
        These lessons are like superpowers for your real world!
      </div>
    </div>

    <!-- Question -->
    <div class="question">
      Where do you want to grow today?
    </div>

    <!-- Cards Section -->
    <div class="cards">
      <div class="card yellow" (click)="openManagingMoney()">
        <img src="/assets/Images-Transparent/Image-Academy-Cat1.png" alt="Managing Money" (click)="openManagingMoney()">
        <p>Managing<br>Money</p>
      </div>
      <div class="card purple">
        <img src="/assets/Images-Transparent/Image-Academy-Cat2.png" alt="Communication">
        <p>Communication</p>
      </div>
      <div class="card pink">
        <img src="/assets/Images-Transparent/Image-Academy-Cat3.png" alt="Meditation">
        <p>Meditation</p>
      </div>
      <div class="card green">
        <img src="/assets/Images-Transparent/Image-Academy-Cat4.png" alt="Cultural Values">
        <p>Cultural<br>Values</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
      Tap a card to learn real-life stuff!
    </div>
  </div>
</ion-content>
<footer></footer>
