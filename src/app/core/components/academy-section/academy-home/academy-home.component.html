<ion-content [fullscreen]="true" style="--padding-top: var(--sat); --padding-bottom: env(safe-area-inset-bottom, 0px)">
  <div class="main-container">
    <!-- Header -->
    <superme-card-header [title]="'Welcome to Your Life Skills Quest!'" [subtitleLeft]="'Real lessons'"
      [subtitleMiddle]="'Life ready'" [subtitleRight]="'Future strong'" [showBackArrow]="true"
      (backClick)="onBackClick()">
    </superme-card-header>

    <!-- Panda Section -->
    <div class="panda-section">
      <superme-pet pet="panda"></superme-pet>
      <app-speech-bubble message="These lessons are like superpowers for your real world!"></app-speech-bubble>
    </div>

    <div class="question">
      Where do you want to grow today?
    </div>

    <div class="academy-home-state" *ngIf="isLoadingCategories">
      Loading categories...
    </div>

    <div class="subject-cards" *ngIf="!isLoadingCategories && categoryCards.length">
      <div *ngFor="let card of categoryCards" class="card" [ngClass]="card.color" role="button" tabindex="0"
        (click)="openSubject(card)" (keyup.enter)="openSubject(card)" (keyup.space)="openSubject(card)">
        <app-img [src]="card.thumbnail" [fallback]="card.image" [alt]="card.title" objectFit="contain"></app-img>
        <p>{{ card.title }}</p>
      </div>
    </div>

    <div class="academy-home-state" *ngIf="!isLoadingCategories && !categoryCards.length">
      {{ categoryError || 'No active categories available right now.' }}
    </div>

    <!-- Footer -->
    <div class="footer-note">
      Tap a card to learn real-life stuff!
    </div>
  </div>
</ion-content>
<footer></footer>
