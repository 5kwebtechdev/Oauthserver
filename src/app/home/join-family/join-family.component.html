<ion-content class="bg-mindful-secondary">
  <div class="mindful-page-container">
    <h2 class="mindful-header">
      <i (click)="goBack()" class="fa-solid fa-arrow-left back-icon"></i>
      Join Your Family
    </h2>

    <div class="mindful-step-indicator">
      <p class="mindful-step-indicator__step">Step 3 of 4</p>
      <h3 class="mindful-step-indicator__title">Enter your family code or scan the QR</h3>
      <div class="mindful-step-indicator__progress">
        <div class="mindful-step-indicator__progress-fill" style="width: 75%;"></div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mindful-input-group">
        <div class="input-container">
          <ion-input formControlName="code" placeholder="Enter code" type="text" inputmode="numeric"
            [attr.maxlength]="8"></ion-input>
          <button type="button" class="qr-icon" (click)="openScanner()" (touchstart)="openScanner()"
            aria-label="Scan QR">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M0 8V0H8V8H0ZM2 6H6V2H2V6ZM0 18V10H8V18H0ZM2 16H6V12H2V16ZM10 8V0H18V8H10ZM12 6H16V2H12V6ZM16 18V16H18V18H16ZM10 12V10H12V12H10ZM12 14V12H14V14H12ZM10 16V14H12V16H10ZM12 18V16H14V18H12ZM14 16V14H16V16H14ZM14 12V10H16V12H14ZM16 14V12H18V14H16Z" fill="#B87D62"/>
            </svg>
          </button>
        </div>
        
        <div class="error-message" *ngIf="(submitted && f.code.errors) || (f.code.touched && f.code.invalid)">
          <small *ngIf="f.code.errors?.required">Code is required.</small>
          <small *ngIf="f.code.errors?.pattern">Code must be 8 digits</small>
        </div>

        <p class="note-text"><strong>Note:</strong> Double-check the code before entering</p>
      </div>

      <mindful-button type="orange-onboard" [text]="isLoading ? 'Joining...' : 'Join Family'"
        [disabled]="form.invalid || isLoading">
      </mindful-button>
    </form>
    <profile-facts [faqs]="codeEntryFaqs"></profile-facts>

  </div>
</ion-content>
