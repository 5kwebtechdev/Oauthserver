<ion-content>
  <div class="join-family">
    <div class="header-row">
      <i (click)="goBack()" class="fa-solid fa-arrow-left" style="margin-right: 10px; font-size: 21px"></i>
      <h2 class="title">Join Your Family</h2>
    </div>

    <div class="progress">
      <div class="progress-top">Step 3 of 4</div>
      <div class="progress-title">Enter your family code or scan the QR</div>
      <div class="line-outer" aria-hidden="true">
        <div class="line-inner"></div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="card">
        <ion-input formControlName="code" placeholder="Enter code" type="text" inputmode="numeric" [attr.maxlength]="8"></ion-input>
        <button type="button" class="qr-icon" (click)="scanCode()" aria-label="Scan QR">▦</button>
      </div>

      <div class="validation" *ngIf="(submitted && f.code.errors) || (f.code.touched && f.code.invalid)">
        <small class="invalid-msg" *ngIf="f.code.errors?.required">Code is required.</small>
        <small class="invalid-msg" *ngIf="f.code.errors?.pattern">Code must be 8 digits</small>
      </div>

      <p class="note"><strong>Note:</strong> Double-check the code before entering</p>

  <button class="join" type="submit" [disabled]="form.invalid">Join Family</button>
    </form>

    <h3 class="faq-title">FAQ's</h3>

    <details class="faq">
      <summary>What if I don't have the family code or QR yet?</summary>
      <p>Ask your parent to create a family and share the code with you.</p>
    </details>

  </div>
</ion-content>
