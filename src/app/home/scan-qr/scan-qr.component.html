<ion-content [fullscreen]="true" class="scanner-content">
  <div class="qr-scanner" [class.scanner-active]="isScanning">
    <!-- Header -->
    <div class="header">
      <button class="close-btn" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 18 18" fill="none">
          <path
            d="M1.89652 16.9394C1.70126 17.1347 1.38468 17.1347 1.18942 16.9394L0.146522 15.8965C-0.0487404 15.7013 -0.04874 15.3847 0.146522 15.1894L6.43942 8.89652C6.63468 8.70126 6.63468 8.38468 6.43942 8.18941L0.146522 1.89652C-0.0487406 1.70126 -0.04874 1.38468 0.146522 1.18942L1.18942 0.146522C1.38468 -0.0487404 1.70126 -0.04874 1.89652 0.146522L8.18942 6.43942C8.38468 6.63468 8.70126 6.63468 8.89652 6.43942L15.1894 0.146522C15.3847 -0.0487406 15.7013 -0.04874 15.8965 0.146522L16.9394 1.18942C17.1347 1.38468 17.1347 1.70126 16.9394 1.89652L10.6465 8.18942C10.4513 8.38468 10.4513 8.70126 10.6465 8.89652L16.9394 15.1894C17.1347 15.3847 17.1347 15.7013 16.9394 15.8965L15.8965 16.9394C15.7013 17.1347 15.3847 17.1347 15.1894 16.9394L8.89652 10.6465C8.70126 10.4513 8.38468 10.4513 8.18941 10.6465L1.89652 16.9394Z"
            fill="#282527" />
        </svg>
      </button>

      <div class="header-actions">
        <button class="flashlight-btn" (click)="toggleFlashlight()" [class.active]="isFlashlightOn" [disabled]="!isScanning">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 27" fill="none">
            <path
              d="M2.66667 26.6667V12L0 8V0H16V8L13.3333 12V26.6667H2.66667ZM8 18C7.44444 18 6.97222 17.8056 6.58333 17.4167C6.19444 17.0278 6 16.5556 6 16C6 15.4444 6.19444 14.9722 6.58333 14.5833C6.97222 14.1944 7.44444 14 8 14C8.55556 14 9.02778 14.1944 9.41667 14.5833C9.80556 14.9722 10 15.4444 10 16C10 16.5556 9.80556 17.0278 9.41667 17.4167C9.02778 17.8056 8.55556 18 8 18ZM2.66667 4H13.3333V2.66667H2.66667V4ZM13.3333 6.66667H2.66667V7.2L5.33333 11.2V24H10.6667V11.2L13.3333 7.2V6.66667Z"
              fill="#282527" />
          </svg>
        </button>
      </div>
    </div>

    <!-- QR Scanner Viewport -->
    <div class="scanner-viewport">
      <div class="scanner-frame">
        <!-- Scanner Frame Corners SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="245" height="249" viewBox="0 0 245 249" fill="none">
          <path
            d="M0 7.78125C0 5.71753 0.806639 3.73834 2.24246 2.27908C3.67829 0.819808 5.62569 0 7.65625 0L53.5938 0C55.6243 0 57.5717 0.819808 59.0075 2.27908C60.4434 3.73834 61.25 5.71753 61.25 7.78125C61.25 9.84497 60.4434 11.8242 59.0075 13.2834C57.5717 14.7427 55.6243 15.5625 53.5938 15.5625H15.3125V54.4688C15.3125 56.5325 14.5059 58.5117 13.07 59.9709C11.6342 61.4302 9.68681 62.25 7.65625 62.25C5.62569 62.25 3.67829 61.4302 2.24246 59.9709C0.806639 58.5117 0 56.5325 0 54.4688V7.78125ZM183.75 7.78125C183.75 5.71753 184.557 3.73834 185.992 2.27908C187.428 0.819808 189.376 0 191.406 0L237.344 0C239.374 0 241.322 0.819808 242.758 2.27908C244.193 3.73834 245 5.71753 245 7.78125V54.4688C245 56.5325 244.193 58.5117 242.758 59.9709C241.322 61.4302 239.374 62.25 237.344 62.25C235.313 62.25 233.366 61.4302 231.93 59.9709C230.494 58.5117 229.688 56.5325 229.688 54.4688V15.5625H191.406C189.376 15.5625 187.428 14.7427 185.992 13.2834C184.557 11.8242 183.75 9.84497 183.75 7.78125ZM7.65625 186.75C9.68681 186.75 11.6342 187.57 13.07 189.029C14.5059 190.488 15.3125 192.468 15.3125 194.531V233.438H53.5938C55.6243 233.438 57.5717 234.257 59.0075 235.717C60.4434 237.176 61.25 239.155 61.25 241.219C61.25 243.282 60.4434 245.262 59.0075 246.721C57.5717 248.180 55.6243 249 53.5938 249H7.65625C5.62569 249 3.67829 248.18 2.24246 246.721C0.806639 245.262 0 243.282 0 241.219V194.531C0 192.468 0.806639 190.488 2.24246 189.029C3.67829 187.57 5.62569 186.75 7.65625 186.75ZM237.344 186.75C239.374 186.75 241.322 187.57 242.758 189.029C244.193 190.488 245 192.468 245 194.531V241.219C245 243.282 244.193 245.262 242.758 246.721C241.322 248.18 239.374 249 237.344 249H191.406C189.376 249 187.428 248.18 185.992 246.721C184.557 245.262 183.75 243.282 183.75 241.219C183.75 239.155 184.557 237.176 185.992 235.717C187.428 234.257 189.376 233.438 191.406 233.438H229.688V194.531C229.688 192.468 230.494 190.488 231.93 189.029C233.366 187.57 235.313 186.75 237.344 186.75Z"
            fill="#FFFFFF" />
        </svg>
        <p class="scanner-text" *ngIf="isScanning">Point camera at QR code</p>
        <p class="scanner-text" *ngIf="!isScanning && scannerSupported">Starting camera...</p>
        <p class="scanner-text" *ngIf="!isScanning && !scannerSupported">Scanner not supported on this device</p>
      </div>
    </div>

    <!-- Upload from Gallery Button -->
    <button class="upload-gallery-btn" (click)="openGallery()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path
          d="M4.66667 8H11.3333L9.03333 5L7.5 7L6.46667 5.66667L4.66667 8ZM4 10.6667C3.63333 10.6667 3.31944 10.5361 3.05833 10.275C2.79722 10.0139 2.66667 9.7 2.66667 9.33333V1.33333C2.66667 0.966667 2.79722 0.652778 3.05833 0.391667C3.31944 0.130556 3.63333 0 4 0H12C12.3667 0 12.6806 0.130556 12.9417 0.391667C13.2028 0.652778 13.3333 0.966667 13.3333 1.33333V9.33333C13.3333 9.7 13.2028 10.0139 12.9417 10.275C12.6806 10.5361 12.3667 10.6667 12 10.6667H4ZM4 9.33333H12V1.33333H4V9.33333ZM1.33333 13.3333C0.966667 13.3333 0.652778 13.2028 0.391667 12.9417C0.130556 12.6806 0 12.3667 0 12V2.66667H1.33333V12H10.6667V13.3333H1.33333Z"
          fill="#282527" />
      </svg> <span>Upload from gallery</span>
    </button>

    <!-- Divider Section -->
    <div class="divider-section">
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>

      <div class="manual-entry">
        <p class="error-text">
          Facing errors?<br>
          Try entering the code instead.
        </p>
        <button class="enter-code-btn" (click)="enterCode()">
          Enter code
        </button>
      </div>
    </div>
  </div>
</ion-content>
