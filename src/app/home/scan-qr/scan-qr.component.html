<ion-content [fullscreen]="true">
  <div class="qr-scanner">
    <!-- Header -->
    <div class="header">
      <button class="close-btn" (click)="close()">
        <img src="assets/icons/close.svg" alt="Close">
      </button>
      <div class="header-actions">
        <button class="flashlight-btn">
          <img src="assets/icons/flashlight_on.png" alt="Flashlight">
        </button>
      </div>
    </div>

    <!-- QR Scanner Viewport -->
    <div class="scanner-viewport">
      <div class="scanner-frame">
        <!-- Scanner SVG Icon -->
        <img src="assets/icons/scanner.svg" alt="QR Scanner" class="scanner-icon">
      </div>
    </div>

    <!-- Upload from Gallery Button -->
    <button class="upload-gallery-btn">
      <img src="assets/icons/filter.svg" alt="Gallery" class="gallery-icon">
      <span>Upload from gallery</span>
    </button>

    <!-- Divider Section -->
    <div class="divider-section">
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>
      
      <div class="manual-entry">
        <p class="error-text">
          Facing errors?<br>
          Try entering the code instead.
        </p>
        <button class="enter-code-btn" (click)="enterCode()">
          Enter code
        </button>
      </div>
    </div>
  </div>
</ion-content>
