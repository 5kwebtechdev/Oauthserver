<div *ngIf="!isAuthenticated" class="carousel-wrapper" (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)">
  <div class="carousel-track" [style.transform]="'translateX(-' + currentSlide * 100 + 'vw)'">
    <div class="carousel-slide" [style.background-image]="slide.background" *ngFor="let slide of slides">
      <!-- Image wrapper: only styled on tablet via CSS so mobile layout remains unchanged -->
      <div class="image-container">
        <img [src]="slide.image" alt="Slide Image" class="slide-image" />
      </div>

      <div class="text-content">
        <h2 [style.color]="slide.color">{{ slide.title }}</h2>
        <ul>
          <li *ngFor="let line of slide.subtitle">{{ line }}</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="carousel-footer">
    <div class="dots">
      <span *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide"
        (click)="setSlide(i)"></span>
    </div>
    <button class="next-btn" [style.background-color]="slides[currentSlide].next_color"
      [style.color]="slides[currentSlide].color" (click)="nextSlide()">→</button>
  </div>
</div>

<div *ngIf="isTablet" class="carousel-footer tablet-footer">
  <div class="dots">
    <span *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide" (click)="setSlide(i)"></span>
  </div>
  <button class="next-btn" [style.background-color]="slides[currentSlide].next_color"
    [style.color]="slides[currentSlide].color" (click)="nextSlide()">→</button>
</div>
