<div *ngIf="!isAuthenticated" class="carousel-wrapper"
  [style.background]="slides[currentSlide].background"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)">

  <!-- Images stacked — only the active one is visible -->
  <div class="image-container">
    <img *ngFor="let slide of slides; let i = index"
         [src]="slide.image"
         [class.active]="i === currentSlide"
         class="slide-image"
         alt="Slide Image" />
  </div>

  <!-- Text section: same gradient as slide -->
  <div class="text-content" [style.background]="slides[currentSlide].background">
    <div class="text-body-wrapper">
      <div *ngFor="let slide of slides; let i = index"
           class="text-body"
           [class.active]="i === currentSlide">
        <h2 [style.color]="slide.color">{{ slide.title }}</h2>
        <ul>
          <li *ngFor="let line of slide.subtitle">{{ line }}</li>
        </ul>
      </div>
    </div>

    <div class="carousel-footer">
      <div class="dots">
        <span *ngFor="let s of slides; let i = index"
              [class.active]="i === currentSlide"
              (click)="setSlide(i)"></span>
      </div>
      <button class="next-btn"
              [style.background-color]="slides[currentSlide].next_color"
              [style.color]="slides[currentSlide].color"
              (click)="nextSlide()"
              aria-label="Next slide">
        <ion-icon name="arrow-forward" aria-hidden="true"></ion-icon>
      </button>
    </div>
  </div>
</div>
