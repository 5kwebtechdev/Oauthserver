spring:
  datasource:
    url: jdbc:h2:mem:resourceserver_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  resource-server:
    jwt:
      public-key-path: src/test/resources/test-keys/public_key.pem
    expected-issuer: http://localhost:9000
    expected-audience: pkce-resource-server
    cors:
      allowed-origins: http://localhost:4200
