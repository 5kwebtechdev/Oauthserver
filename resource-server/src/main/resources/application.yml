server:
  port: 9090

spring:
  application:
    name: resource-server
  datasource:
    # Dev-convenience defaults so this runs with zero setup - override via env vars
    # for anything beyond local dev, and never commit real prod credentials here.
    url: ${DB_PRIMARY_URL:jdbc:mysql://187.127.142.16:3306/}pkce_resource?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_PRIMARY_USERNAME:root}
    password: ${DB_PRIMARY_PASSWORD:Root@1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  resource-server:
    jwt:
      # Local copy of auth-server's public key (see BE/resource-server/keys/, gitignored,
      # and ARCHITECTURE.md's key-rotation runbook) - this service verifies signatures
      # against its own copy rather than fetching auth-server's /oauth2/jwks at runtime.
      public-key-path: ${RESOURCE_SERVER_JWT_PUBLIC_KEY_PATH:/home/mohit/TestPKCE/PKCE_BE_FE_B14/PKCE_BE_FE/BE/auth-server/keys/public_key_20261003153613.pem}
    expected-issuer: ${AUTH_SERVER_ISSUER:http://localhost:9000}
    expected-audience: ${RESOURCE_SERVER_AUDIENCE:pkce-resource-server}
    cors:
      allowed-origins: ${FE_ORIGIN:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO


