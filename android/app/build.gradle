apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.appdistribution'

def envOrProp = { String name ->
    return project.findProperty(name)?.toString() ?: System.getenv(name)
}

// These files are legacy design exports with no application references. Keep
// them out of an Android package even if an older Capacitor sync left a stale
// copy in android/app/src/main/assets/public.
def unusedWebAssetNames = [
    'superme-planner-habit.png',
    'superme-planner-tab.png',
    'superme-planner-task.png',
    'Time-table.svg',
    'tab-calendar.png',
    'tab-task.png',
    'tab-habit.png',
    'Image-Onboarding3.jpg',
    'Background-Home.png',
    'Image-Onboarding1.jpg',
    'Image-Onboarding-Pet2.png',
    'Image-Onboading-Pet.png',
    'comeback-star-icon.png',
    'habit-master-icon.png',
    'first-big-win-icon.png'
]

android {
    namespace = "io.ionic.starter"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Match the package name in android/app/gocogle-services.json
        applicationId = "com.superme.app"
        minSdk = 26
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 65
        versionName = "0.1.33"
        manifestPlaceholders = [    
            deeplinkHost: envOrProp('DEEPLINK_HOST') ?: 'supermeapp.com',
            deeplinkScheme: envOrProp('DEEPLINK_SCHEME') ?: 'superme'
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:' +
                unusedWebAssetNames.join(':')
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile = file(project['MYAPP_UPLOAD_STORE_FILE'])
                storePassword = project['MYAPP_UPLOAD_STORE_PASSWORD']
                keyAlias = project['MYAPP_UPLOAD_KEY_ALIAS']
                keyPassword = project['MYAPP_UPLOAD_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

// Fail release builds before they can produce an unsigned/unusable artifact.
def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        def signingKeys = [
            'MYAPP_UPLOAD_STORE_FILE',
            'MYAPP_UPLOAD_STORE_PASSWORD',
            'MYAPP_UPLOAD_KEY_ALIAS',
            'MYAPP_UPLOAD_KEY_PASSWORD'
        ]
        def missingKeys = signingKeys.findAll { !project.findProperty(it)?.toString()?.trim() }
        if (missingKeys) {
            throw new GradleException("Release signing is incomplete: missing ${missingKeys.join(', ')}")
        }
        if (!file(project['MYAPP_UPLOAD_STORE_FILE']).isFile()) {
            throw new GradleException('Release upload keystore is missing at the configured MYAPP_UPLOAD_STORE_FILE path')
        }
    }
}
tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach {
    dependsOn validateReleaseSigning
}

// Production OAuth discovery runs from the bundled WebView origin. A normal
// Capacitor sync without the production flag restores localhost, which SSO
// intentionally rejects. Catch that mismatch before packaging a Play release.
def validateReleaseWebAuth = tasks.register('validateReleaseWebAuth') {
    doLast {
        def configFile = file('src/main/assets/capacitor.config.json')
        def publicDir = file('src/main/assets/public')
        if (!configFile.isFile() || !new File(publicDir, 'index.html').isFile()) {
            throw new GradleException('Web assets missing. Build the frontend and sync Android before release.')
        }
        def productionAuth = fileTree(publicDir).matching { include '*.js' }.files.any {
            it.getText('UTF-8').contains('https://sso.supermeapp.com')
        }
        if (productionAuth) {
            def config = new groovy.json.JsonSlurper().parse(configFile)
            if (config.server?.hostname != 'app.supermeapp.com' || config.server?.androidScheme != 'https' || config.server?.url) {
                throw new GradleException('Production OAuth origin mismatch. Run SUPERME_ANDROID_PRODUCTION=true npx cap sync android before building the release.')
            }
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn validateReleaseWebAuth
}

// The Android copy hook preserves image URLs through a generated lossless-media
// index. Fail before packaging if an alias is malformed, missing or corrupted.
def validateBundledMedia = tasks.register('validateBundledMedia') {
    doLast {
        def publicDir = file('src/main/assets/public')
        def manifestFile = new File(publicDir, '_superme-media.json')
        def mediaDir = new File(publicDir, '_superme-media')
        if (!manifestFile.isFile()) {
            if (mediaDir.isDirectory() && mediaDir.list().length > 0) {
                throw new GradleException('Optimized media has no URL index. Run cap copy android again.')
            }
            return
        }
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        if (manifest.version != 1 || !(manifest.entries instanceof Map)) {
            throw new GradleException('Invalid optimized media index')
        }
        def checked = [] as Set
        manifest.entries.each { original, entry ->
            if (!original.startsWith('/assets/') || original.contains('..') || original.contains('\\') ||
                !(entry.asset ==~ /public\/_superme-media\/[a-f0-9]{64}\.(webp|png|jpg|jpeg)/) ||
                !(entry.mime in ['image/webp', 'image/png', 'image/jpeg'])) {
                throw new GradleException('Invalid optimized media alias')
            }
            if (checked.add(entry.asset)) {
                def target = file('src/main/assets/' + entry.asset)
                if (!target.isFile()) throw new GradleException('Missing optimized media: ' + entry.asset)
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
                if (!target.name.startsWith(digest + '.')) throw new GradleException('Optimized media checksum mismatch')
            }
        }
        logger.lifecycle('Verified ' + manifest.entries.size() + ' local image aliases and ' + checked.size() + ' media objects')
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn validateBundledMedia }

// Release bundles are uploaded manually to Google Play. Avoid making the
// local build depend on a Crashlytics network upload; the mapping file remains
// available in the build outputs for separate upload when needed.
tasks.configureEach {
    if (name.startsWith('uploadCrashlyticsMappingFile')) {
        enabled = false
    }
}

firebaseAppDistributionDefault {
    artifactType = envOrProp('FIREBASE_APP_DISTRIBUTION_ARTIFACT_TYPE') ?: 'APK'

    def appIdValue = envOrProp('FIREBASE_APP_ID')
    if (appIdValue) appId = appIdValue

    def testersValue = envOrProp('FIREBASE_TESTERS')
    if (testersValue) testers = testersValue

    def groupsValue = envOrProp('FIREBASE_GROUPS')
    if (groupsValue) groups = groupsValue

    def releaseNotesValue = envOrProp('FIREBASE_RELEASE_NOTES')
    if (releaseNotesValue) releaseNotes = releaseNotesValue

    def releaseNotesFileValue = envOrProp('FIREBASE_RELEASE_NOTES_FILE')
    if (releaseNotesFileValue) releaseNotesFile = releaseNotesFileValue

    def credentialsValue = envOrProp('FIREBASE_SERVICE_CREDENTIALS_FILE')
    if (credentialsValue) serviceCredentialsFile = credentialsValue
}

// Module-level repositories are intentionally omitted. Repositories are
// declared in `settings.gradle` via dependencyResolutionManagement to comply
// with Gradle 8's `FAIL_ON_PROJECT_REPOS` policy.

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    constraints {
        implementation('androidx.camera:camera-core:1.4.0') {
            because 'CameraX 1.4.0 ships 16 KB-compatible native libraries required by Google Play'
        }
        implementation('androidx.camera:camera-camera2:1.4.0') {
            because 'Keep CameraX modules aligned on the same 16 KB-compatible release'
        }
        implementation('androidx.camera:camera-lifecycle:1.4.0') {
            because 'Keep CameraX modules aligned on the same 16 KB-compatible release'
        }
        implementation('androidx.camera:camera-view:1.4.0') {
            because 'Keep CameraX modules aligned on the same 16 KB-compatible release'
        }
    }
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Firebase (uses google-services.json for auto-config)
    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-messaging'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // Official Google Play API used to compare the installed build with the
    // newest build available to this user on the Play Store.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
