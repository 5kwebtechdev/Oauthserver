// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Do NOT declare repositories here. `dependencyResolutionManagement` in
// `settings.gradle` is authoritative (repositoriesMode = FAIL_ON_PROJECT_REPOS).
// This file should avoid adding project-level repositories to comply with Gradle 8.

// Configure Java & Kotlin compilation targets for Android subprojects without
// adding repositories. Using `subprojects` keeps this configuration centralized.
subprojects {
    afterEvaluate { proj ->
        def androidExt = proj.extensions.findByName('android')
        if (androidExt != null) {
            androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_21
            androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_21
        }

        proj.tasks.withType(JavaCompile).configureEach {
            it.sourceCompatibility = '21'
            it.targetCompatibility = '21'
        }

        try {
            def kotlinCompileClass = Class.forName('org.jetbrains.kotlin.gradle.tasks.KotlinCompile')
            proj.tasks.withType(kotlinCompileClass).configureEach {
                it.kotlinOptions.jvmTarget = '21'
            }
        } catch (ClassNotFoundException e) {
            // Kotlin plugin not applied to this project yet; skip configuring Kotlin tasks
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
