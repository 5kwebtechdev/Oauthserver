// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://repo1.maven.org/maven2/' }
    }
}

// Centralize local flatDir repositories here to avoid repeated flatDir declarations
// in subprojects (reduces Gradle flatDir warnings). Also configure Java/Kotlin
// compatibility across subprojects so Java 21 features compile in CI and locally.
allprojects {
    repositories {
        // local jars used by some Capacitor plugins
        flatDir {
            dirs "$rootDir/capacitor-cordova-android-plugins/src/main/libs"
            dirs "$rootDir/app/libs"
        }
    }

    // Configure Java & Kotlin compilation targets for Android subprojects
    afterEvaluate { proj ->
        def androidExt = proj.extensions.findByName('android')
        if (androidExt != null) {
            androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_21
            androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_21
        }

        proj.tasks.withType(JavaCompile).configureEach {
            it.sourceCompatibility = '21'
            it.targetCompatibility = '21'
        }

        // Configure Kotlin JVM target when Kotlin plugin is applied; setting here
        // avoids needing to repeat in each module and reduces Kotlin-plugin warnings.
        proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            it.kotlinOptions.jvmTarget = '21'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
