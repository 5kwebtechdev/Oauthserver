server {
    listen 4046;
    server_name _;
    root /var/www/superme-apk-fe-ci/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # Serve the vendored marketing-site snapshot at the dev hostname root.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    # Keep the dev hostname out of search results and do not expose the production sitemap.
    location = /sitemap.xml { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Keep OAuth routes under /app; use absolute URLs because TLS terminates in devapk.conf.
    location = /home { return 302 https://devapk.supermeapp.com/app/home$is_args$args; }
    location = /home/ { return 302 https://devapk.supermeapp.com/app/home$is_args$args; }
    location = /callback { return 302 https://devapk.supermeapp.com/app/callback$is_args$args; }
    location ~ ^/(?:auth/)?login/?$ { return 302 https://devapk.supermeapp.com/app/login$is_args$args; }
    location ~ ^/(?:auth/)?(?:signup|sign-up)/?$ { return 302 https://devapk.supermeapp.com/app/signup$is_args$args; }
    location = /auth { return 302 https://devapk.supermeapp.com/app/login; }
    location = /auth/ { return 302 https://devapk.supermeapp.com/app/login; }
    # The auth server's "Forgot password?" link (APK_DEV_FE_FORGOT_PASSWORD_URL) points here -
    # same pattern as /login and /signup above, just missed when those were first added.
    location = /forgot-password { return 302 https://devapk.supermeapp.com/app/forgot-password$is_args$args; }
    location = /forgot-password/ { return 302 https://devapk.supermeapp.com/app/forgot-password$is_args$args; }

    location = /app { try_files /app/index.html =404; }
    location /app/ { try_files $uri $uri/ /app/index.html; }
    location = /app/index.html { add_header Cache-Control "no-store" always; }
    location = /app/firebase-messaging-sw.js { add_header Cache-Control "no-store" always; }

    location ~* ^/app/.+\.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
