server {
    listen 4046;
    server_name _;
    root /var/www/superme-apk-fe-ci/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # Marketing landing page: reused from the live production site (same already-running
    # service on 127.0.0.1:4200), not a copy. Host is forced to supermeapp.com so that
    # upstream sees exactly the request shape it normally gets - this dev host never changes
    # its behavior. sub_filter rewrites just the links that must stay on this dev deployment
    # (not go to prod) as they pass through; nothing on the production side is touched.
    location = / {
        proxy_pass http://127.0.0.1:4200/;
        proxy_http_version 1.1;
        proxy_set_header Host supermeapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_cache_bypass 1;
        sub_filter 'https://supermeapp.com/app' 'https://devapk.supermeapp.com/app';
        sub_filter_once off;
        sub_filter_types text/html;
    }

    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /firebase-messaging-sw.js { add_header Cache-Control "no-store" always; }

    # The Angular app itself - same redirect pattern production uses (see supermeapp's own
    # nginx config): the app's own redirect_uri/callback logic is origin-relative ("/callback"),
    # so these routes land at the app's own root-relative paths and get bounced into /app/.
    # Absolute target (not relative, unlike prod's single-layer config): this server block
    # sits behind another reverse-proxy layer (devapk.conf, 443 -> this port), so a relative
    # redirect would otherwise leak this internal host:port/scheme into the Location header.
    location = /home { return 302 https://devapk.supermeapp.com/app/home$is_args$args; }
    location = /home/ { return 302 https://devapk.supermeapp.com/app/home$is_args$args; }
    location = /callback { return 302 https://devapk.supermeapp.com/app/callback$is_args$args; }
    location ~ ^/(?:auth/)?login/?$ { return 302 https://devapk.supermeapp.com/app/login$is_args$args; }
    location ~ ^/(?:auth/)?(?:signup|sign-up)/?$ { return 302 https://devapk.supermeapp.com/app/signup$is_args$args; }
    location = /auth { return 302 https://devapk.supermeapp.com/app/login; }
    location = /auth/ { return 302 https://devapk.supermeapp.com/app/login; }

    location = /app { try_files /app/index.html =404; }
    location /app/ { try_files $uri $uri/ /app/index.html; }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
    }
}
