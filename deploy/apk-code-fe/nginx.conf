server {
    listen 4046;
    server_name _;
    root /var/www/superme-apk-fe-ci/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    # The Angular app itself - same redirect pattern production uses (see supermeapp's own
    # nginx config): the app's own redirect_uri/callback logic is origin-relative ("/callback"),
    # so these routes land at the app's own root-relative paths and get bounced into /app/.
    # Absolute target (not relative, unlike prod's single-layer config): this server block
    # sits behind another reverse-proxy layer (devapk.conf, 443 -> this port), so a relative
    # redirect would otherwise leak this internal host:port/scheme into the Location header.
    # Exact/regex locations always win over the catch-all proxy below regardless of order,
    # so these keep taking priority no matter where they sit in the file.
    location = /home { return 302 https://devapk.supermeapp.com/app/home$is_args$args; }
    location = /home/ { return 302 https://devapk.supermeapp.com/app/home$is_args$args; }
    location = /callback { return 302 https://devapk.supermeapp.com/app/callback$is_args$args; }
    location ~ ^/(?:auth/)?login/?$ { return 302 https://devapk.supermeapp.com/app/login$is_args$args; }
    location ~ ^/(?:auth/)?(?:signup|sign-up)/?$ { return 302 https://devapk.supermeapp.com/app/signup$is_args$args; }
    location = /auth { return 302 https://devapk.supermeapp.com/app/login; }
    location = /auth/ { return 302 https://devapk.supermeapp.com/app/login; }

    location = /app { try_files /app/index.html =404; }
    location /app/ { try_files $uri $uri/ /app/index.html; }
    location = /app/index.html { add_header Cache-Control "no-store" always; }
    location = /app/firebase-messaging-sw.js { add_header Cache-Control "no-store" always; }

    location ~* ^/app/.+\.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    # Marketing landing page: reused from the live production site (same already-running
    # service on 127.0.0.1:4200), not a copy. Catch-all, because the landing page itself
    # serves many top-level paths (assets, JS chunks, favicons, manifest, /about, /blogs,
    # etc), not just "/" - anything not matched above (i.e. not /app/ and not one of the
    # app routes) falls through here. Host is forced to supermeapp.com so that upstream
    # sees exactly the request shape it normally gets - this dev host never changes its
    # behavior. sub_filter rewrites just the links that must stay on this dev deployment
    # (not go to prod) as they pass through; nothing on the production side is touched.
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host supermeapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_cache_bypass 1;
        sub_filter 'https://supermeapp.com/app' 'https://devapk.supermeapp.com/app';
        # The landing page is prod's own live Angular bundle, unmodified - we only rewrite
        # the HTML text above. Once the browser hydrates that bundle, its own click handling
        # (registered on document.body, bubble phase) can take over a login/signup click and
        # route it using whatever is baked into ITS build, regardless of what href the HTML
        # shows - a hydration-timing race, not something fixable by rewriting text alone.
        # This inline script registers a capture-phase listener on `document` before any of
        # the landing page's own (deferred) scripts even load. Per the DOM spec, capture
        # fires top-down before the target/bubble phases, so this ALWAYS wins the race,
        # deterministically - not "usually". It only touches anchors whose href already
        # points at this dev app (set correctly by the rewrite above) and simply forces the
        # real browser navigation Angular would otherwise intercept; every other click on the
        # landing page is left alone for Angular's own handling.
        sub_filter '<head>' '<head><script>(function(){document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;var href=a.getAttribute("href")||"";if(href.indexOf("devapk.supermeapp.com/app/")===-1)return;e.preventDefault();e.stopImmediatePropagation();window.location.assign(href);},true);})();</script>';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
