server {
    server_name sso.supermeapp.com;

    location / {
        proxy_pass http://127.0.0.1:9001;
        # Correct the hosted login's signup destination without altering OAuth clients.
        proxy_set_header Accept-Encoding "";
        sub_filter 'href="https://supermeapp.com/" class="signup-link"' 'href="https://supermeapp.com/app/signup" class="signup-link"';
        sub_filter_once off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sso.supermeapp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sso.supermeapp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sso.supermeapp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name sso.supermeapp.com;
    listen 80;
    return 404; # managed by Certbot


}
