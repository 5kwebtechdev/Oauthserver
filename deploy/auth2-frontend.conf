pid /run/auth2-frontend/nginx.pid;
error_log /var/log/auth2-frontend/error.log;
worker_processes auto;
user www-data;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/auth2-frontend/access.log;
    sendfile on;
    server {
        listen 4203;
        server_name 187.127.142.16;
        root /var/www/auth2-frontend/current;
        index index.html;
        location = /healthz {
            default_type text/plain;
            return 200 "auth2-frontend\n";
        }
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
        location = /silent-refresh.html {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            try_files $uri =404;
            expires 1h;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
