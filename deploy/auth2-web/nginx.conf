server {
    listen 4204;
    server_name _;
    root /var/www/superme-auth2/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /firebase-messaging-sw.js { add_header Cache-Control "no-store" always; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
    }
}
